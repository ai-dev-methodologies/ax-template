# spec-trio-template.yaml — api-gateway-relay
#
# Pre-filled Spec Trio fragments to copy into your project's specs/ directory
# when implementing the api-gateway-relay recipe.
#
# Instructions:
#   1. Copy this file to your project as specs/api-gateway-relay-l0.yaml
#   2. Replace all <PLACEHOLDER> values with project-specific values
#   3. Extend the items array with domain-specific requirements
#   4. Ensure business_invariants from RECIPE.md are reflected as spec items
#
# This fragment composes the following L4 Spec Trios (reference, do not copy):
#   - specs/crud-security.yaml
#   - specs/audit-log-l0.yaml
#   - specs/scheduled-task-l0.yaml
#   - specs/webhook-l0.yaml (R9 SP45 NET-NEW — TD-2026-05-22-025)
#   - specs/auth-asvs-l1.yaml
#   - specs/ratelimit-l0.yaml (cross-cutting — no L4 directory; R10 framing)

schema_version: 1
scope: "<YOUR_PROJECT>-api-gateway-relay"
stack: "Spring Boot 3.2.x + React + Caffeine cache (rate-limit) + HMAC-SHA256 (Mac SPI) + ShedLock (or DB row + SELECT ... FOR UPDATE, never SKIP LOCKED — P2-48, for circuit-reconcile)"
standard: "OWASP ASVS V4 + RFC 7807 + RFC 2104 (HMAC) + OWASP ASVS V13.2.6 (webhook payload authenticity) + RFC 6585 §4 (HTTP 429 / Retry-After)"
applied_recipes:
  - api-gateway-relay
compatible_with_catalog_version: "v1.8.0-api-gateway-relay"

items:
  # ─── API-GATEWAY-RELAY-INV-001: signed outbound + audit-logged relay ──────
  - id: "API-GATEWAY-RELAY-INV-001"
    chapter: "WEBHOOK_AUDIT"
    requirement: >
      Every relayed request to a backend service MUST be signed via webhook
      L4's HMAC-SHA256 over <timestamp>.<body> AND MUST emit an audit-log row
      carrying operator + relay_target_endpoint + delivery_id.
    test_method: "RestAssured integration test + WireMock for outbound capture"
    verification_type: "positive"
    applicable: true
    spec_ref: "specs/webhook-l0.yaml#WEBHOOK-SIGN-001"
    notes: >
      Test: POST /api/gateway/<route> → assert captured outbound POST has valid
      X-Webhook-Signature for the per-route signing-secret + X-Webhook-Timestamp
      + X-Webhook-Delivery-Id headers AND assert audit_logs has matching row
      with action="api_gateway_relay.request.relayed" + operator_id +
      relay_target_endpoint + delivery_id.
      Implementation: RelayController.forward() resolves route, signs body via
      HmacSigner.sign(secret, timestamp + "." + body), POSTs to upstream,
      records WebhookDelivery row, emits @Audited("api_gateway_relay.request.relayed").

  # ─── API-GATEWAY-RELAY-INV-002: gateway-level access control + denial ────
  - id: "API-GATEWAY-RELAY-INV-002"
    chapter: "AUTH"
    requirement: >
      Relay authorization MUST check token validity AND scope BEFORE forwarding
      to upstream; on auth failure the request MUST be rejected AND the
      rejection MUST be captured as an audit-log row with denial reason.
    test_method: "RestAssured integration test"
    verification_type: "both"
    applicable: true
    spec_ref: "specs/auth-asvs-l1.yaml#ASVS-V4.1.1"
    notes: >
      Test (positive): valid token with correct scope → relay forwards.
      Test (negative): expired token → 401; missing required scope → 403;
      assert audit_logs has row with action="api_gateway_relay.request.denied"
      + reason ∈ {token_expired, scope_insufficient}.
      Implementation: GatewayAuthFilter (OncePerRequestFilter) placed BEFORE
      the relay controller; short-circuits with audit-logged denial reason on
      failure (AUDIT-RECORD-002 immutability).

  # ─── API-GATEWAY-RELAY-INV-003: per-route rate-limit (cross-cutting) ─────
  - id: "API-GATEWAY-RELAY-INV-003"
    chapter: "RATELIMIT"
    requirement: >
      Per-route rate-limiting MUST be enforced before relay; over-limit
      requests MUST be rejected with HTTP 429 carrying a Retry-After header
      per RFC 6585 §4 AND counted via observability counter.
    test_method: "RestAssured integration test"
    verification_type: "both"
    applicable: true
    spec_ref: "specs/ratelimit-l0.yaml#RATELIMIT-1"
    notes: >
      Cross-cutting spec binding (R10-novel framing) — ratelimit-l0.yaml is a
      4-item spec WITHOUT a templates/L4/ratelimit/ directory. R10 treats
      rate-limiting as a CROSS-CUTTING CONCERN enforced inside auth + webhook +
      crud filters; bound via spec_ref ONLY. The recipe_spec_referential_integrity_guard.sh
      resolves spec_ref against file existence + ID presence only (NOT L4
      directory presence) — guard-compatible without materializing a new L4
      directory.
      Anchored to TWO ratelimit spec items:
      - RATELIMIT-1 — HTTP 429 rejection beyond max-per-window
      - RATELIMIT-2 — Retry-After header per RFC 6585 §4
      Test (positive): Nth request within window → 200; window-reset → 200.
      Test (negative): (N+1)th request within window → 429 with Retry-After
      header AND recipe.api_gateway_relay.relay_rate_limit_rejected_total
      counter increments.
      Implementation: RateLimitFilter (Caffeine LoadingCache keyed by
      <route_id, client_id>) placed AFTER auth filter (so client-key is
      resolved first); over-limit → 429 + Retry-After = window_millis / 1000.

  # ─── API-GATEWAY-RELAY-INV-004: circuit breaker + scheduled reconcile ────
  - id: "API-GATEWAY-RELAY-INV-004"
    chapter: "CIRCUIT_BREAKER"
    requirement: >
      Per-upstream-endpoint circuit breaker MUST auto-open on 90% failure rate
      over rolling 50 attempts; half-open / closed state reconciliation MUST
      run via scheduled-task lock primitive — no double-reconcile on multi-node
      deployment.
    test_method: "RestAssured integration test + WireMock failure injection"
    verification_type: "both"
    applicable: true
    spec_ref: "specs/webhook-l0.yaml#WEBHOOK-CIRCUIT-001"
    notes: >
      Anchored to TWO spec items:
      - WEBHOOK-CIRCUIT-001 — 90% rolling 50-attempt failure rate auto-opens
      - SCHED-LOCK-001 — distributed lock on circuit-reconcile cron
      Test (positive): WireMock returns 503 for 45/50 attempts → circuit OPEN
      transition + audit-log row + endpoint.active=false; circuit-reconcile
      probe succeeds → half-open → closed.
      Test (negative): simulate concurrent multi-node circuit-reconcile trigger
      → only the lock holder transitions; other nodes skip.
      Implementation: CircuitBreakerPolicy.evaluate(endpointId) after every
      terminal WebhookDelivery transition; CircuitBreakerReconcileTask cron
      wraps the scan loop in
      LockingPolicy.tryAcquire("api-gateway-relay-circuit-reconcile", node-id).

  # ─── API-GATEWAY-RELAY-INV-005: route config CRUD + audit + idempotency ──
  - id: "API-GATEWAY-RELAY-INV-005"
    chapter: "CRUD_AUDIT"
    requirement: >
      Route registration + config mutations (URL, method, target,
      signing-secret) MUST follow CRUD validation rules AND MUST emit audit
      rows carrying before/after diff. Mutations MUST be idempotent via
      X-Idempotency-Key (rule_ref).
    test_method: "RestAssured integration test"
    verification_type: "both"
    applicable: true
    spec_ref: "specs/crud-security.yaml#CRUD-VAL-1"
    rule_ref: "practices/rules/idempotency-key-on-mutations.md"
    notes: >
      INV-005 binds THREE anchors (clears the ≥1-anchor floor with 2x buffer
      per M4 wording):
      - spec_ref: specs/crud-security.yaml#CRUD-VAL-1 (validation)
      - spec_ref: specs/audit-log-l0.yaml#AUDIT-RECORD-002 (immutable before/after)
      - rule_ref: practices/rules/idempotency-key-on-mutations.md (idempotency)
      INV-005 disambiguation (deliberate framing — disambiguated from R7
      community / R9 internal-it co-shipped-rule escape hatch): all anchors
      EXIST in the catalog today, so the recipe uses the preferred
      (spec_ref + rule_ref) path. NO co-shipped-rule + invariant_test
      invocation needed this cycle.
      Test (positive): POST /api/admin/routes with X-Idempotency-Key=uuid →
      201; replay same key → 200 (idempotent return) + assert audit_logs has
      row with action="api_gateway_relay.route.config.changed" + before=null
      + after={new route config}.
      Test (negative): malformed URL pattern → 400 (CRUD-VAL-1); missing
      idempotency-key on mutation → 400 (idempotency-key-on-mutations.md).
      Implementation: RouteRegistrationService.create() / .update() wrapped
      with @Audited("api_gateway_relay.route.config.changed"); Spring Validator
      bean enforces CRUD-VAL-1 (URL syntax, method enum, target scheme HTTPS).

business_observability_advisory:
  - metric: "recipe.api_gateway_relay.relay_request_total"
    type: counter
    note: "advisory; counted on every inbound relay accepted + signed + dispatched"
  - metric: "recipe.api_gateway_relay.relay_rate_limit_rejected_total"
    type: counter
    note: "advisory; counted when an inbound relay is rejected with HTTP 429 (over-limit)"
  - metric: "recipe.api_gateway_relay.circuit_breaker_open_total"
    type: counter
    note: "advisory; counted when a per-endpoint circuit transitions to OPEN"

