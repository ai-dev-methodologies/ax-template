openapi: 3.0.3
info:
  title: ax-template Feature Flags API
  description: |
    Feature flags domain REST contract. Covers public flag evaluation and
    admin CRUD for runtime-controlled feature toggles.
    Evaluation endpoint is public; admin endpoints require ROLE_ADMIN JWT.
  version: 0.1.0
servers:
  - url: /api/v1

paths:
  /feature-flags/{name}/active:
    get:
      operationId: isFeatureFlagActive
      summary: Check if a named feature flag is currently active
      tags: [feature-flags]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]{1,62}$'
      responses:
        '200':
          description: Flag evaluation result (active=false for unknown flags)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagActiveResponse'

  /admin/feature-flags:
    get:
      operationId: listFeatureFlags
      summary: List all feature flags (admin)
      tags: [feature-flags-admin]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of feature flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: createFeatureFlag
      summary: Create a new feature flag (admin)
      tags: [feature-flags-admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagRequest'
      responses:
        '201':
          description: Feature flag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/feature-flags/{name}:
    patch:
      operationId: updateFeatureFlag
      summary: Update a feature flag's enabled status or description (admin)
      tags: [feature-flags-admin]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagUpdateRequest'
      responses:
        '200':
          description: Feature flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteFeatureFlag
      summary: Delete a feature flag (admin)
      tags: [feature-flags-admin]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Feature flag deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    FeatureFlagRequest:
      type: object
      required: [name, enabled]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
          description: "Lowercase hyphen-separated flag name, 2–63 chars"
        enabled:
          type: boolean
        description:
          type: string
          maxLength: 500

    FeatureFlagUpdateRequest:
      type: object
      properties:
        enabled:
          type: boolean
        description:
          type: string
          maxLength: 500

    FeatureFlagResponse:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FeatureFlagPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagResponse'
        totalElements:
          type: integer
        page:
          type: integer
        size:
          type: integer

    FlagActiveResponse:
      type: object
      required: [active]
      properties:
        active:
          type: boolean

  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid JWT
    Forbidden:
      description: Insufficient role (ROLE_ADMIN required)
    NotFound:
      description: Feature flag not found
    Conflict:
      description: Flag name already exists

    ProblemDetail:
      description: RFC 7807 problem detail
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
