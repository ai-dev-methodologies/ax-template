openapi: 3.0.3
info:
  title: "ax-template Approval Workflow API"
  version: "0.1.0"
  description: >
    Multi-step ordered approval for internal business actions. The requester creates
    a DRAFT, submits it, and each step's designated approver acts in order. Single
    rejection cascades to REJECTED; final approval cascades to APPROVED.
servers:
  - url: /api
paths:
  /approvals:
    post:
      summary: "Create a DRAFT approval request"
      operationId: createApprovalRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApprovalRequest'
      responses:
        '201':
          description: Created — status=DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
    get:
      summary: "List the caller's own requests"
      operationId: listMyApprovalRequests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
        '401':
          description: Authentication required

  /approvals/inbox:
    get:
      summary: "List PENDING steps assigned to the caller across all SUBMITTED requests"
      operationId: listApprovalInbox
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInboxResponse'
        '401':
          description: Authentication required

  /approvals/{id}:
    get:
      summary: "Get a single request (visible if caller is requester or approver)"
      operationId: getApprovalRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResponse'
        '401':
          description: Authentication required
        '404':
          description: Not found OR not visible to caller

  /approvals/{id}/submit:
    post:
      summary: "Submit a DRAFT request — DRAFT → SUBMITTED"
      operationId: submitApprovalRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResponse'
        '404':
          description: Not found OR not owned by caller
        '409':
          description: Illegal state transition (request is not DRAFT)

  /approvals/{id}/cancel:
    post:
      summary: "Cancel a DRAFT or SUBMITTED request — requester only"
      operationId: cancelApprovalRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResponse'
        '404':
          description: Not found OR not owned by caller
        '409':
          description: Illegal state transition (request already terminal)

  /approvals/{id}/steps/{stepId}/approve:
    post:
      summary: "Approve a step — designated approver only"
      operationId: approveStep
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepActionRequest'
      responses:
        '200':
          description: Step approved (and possibly cascaded the request to APPROVED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResponse'
        '403':
          description: Caller is not the designated approver for this step
        '404':
          description: Not found
        '409':
          description: Step out of order, step already terminal, or request terminal

  /approvals/{id}/steps/{stepId}/reject:
    post:
      summary: "Reject a step — designated approver only (cascades request to REJECTED)"
      operationId: rejectStep
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepActionRequest'
      responses:
        '200':
          description: Step rejected; request now REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResponse'
        '403':
          description: Caller is not the designated approver for this step
        '404':
          description: Not found
        '409':
          description: Step out of order, step already terminal, or request terminal

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateApprovalRequest:
      type: object
      required: [type, approverUserIds]
      properties:
        type:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 128
        payload:
          type: object
          additionalProperties: true
        approverUserIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string

    StepActionRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 1024

    ApprovalStepResponse:
      type: object
      required: [id, orderIndex, approverUserId, status]
      properties:
        id:
          type: string
          format: uuid
        orderIndex:
          type: integer
        approverUserId:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        actedByUserId:
          type: string
          nullable: true
        actedAt:
          type: string
          format: date-time
          nullable: true
        comment:
          type: string
          nullable: true

    ApprovalRequestResponse:
      type: object
      required: [id, requesterUserId, type, status, steps, createdAt]
      properties:
        id:
          type: string
          format: uuid
        requesterUserId:
          type: string
        type:
          type: string
        title:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED]
        payload:
          type: object
          additionalProperties: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStepResponse'
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    ApprovalListResponse:
      type: object
      required: [items, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequestResponse'
        totalElements:
          type: integer

    ApprovalInboxEntry:
      type: object
      required: [requestId, stepId, type, status, requesterUserId, createdAt]
      properties:
        requestId:
          type: string
          format: uuid
        stepId:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING]
        requesterUserId:
          type: string
        createdAt:
          type: string
          format: date-time

    ApprovalInboxResponse:
      type: object
      required: [items, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalInboxEntry'
        totalElements:
          type: integer

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        timestamp:
          type: string
          format: date-time
