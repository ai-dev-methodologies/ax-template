openapi: 3.0.3
info:
  title: ax-template Auth API
  description: Static auth contract derived from auth manifest policy. Covers signup, login, refresh, explicit linking, and minimal UI state. Does not include user profile or role management endpoints.
  version: 0.1.0
servers:
  - url: /api
paths:
  /auth/email/signup:
    post:
      operationId: emailSignup
      summary: Sign up with email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '201':
          description: User created. May be in an unverified state based on policy.
          content:
            application/json:
              schema:
                type: object
                required: [userId, verificationRequired]
                properties:
                  userId:
                    type: string
                    format: uuid
                  verificationRequired:
                    type: boolean
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Provider disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDisabledError'

  /auth/email/login:
    post:
      operationId: emailLogin
      summary: Login with email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful. Access token returned, refresh token set via HttpOnly cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCredentialsError'
        '403':
          description: Unverified user or provider disabled
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UnverifiedUserError'
                  - $ref: '#/components/schemas/ProviderDisabledError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /auth/email/resend-verification:
    post:
      operationId: emailResendVerification
      summary: Resend email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification email sent
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /auth/email/verify-email:
    post:
      operationId: emailVerify
      summary: Verify email token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiredTokenError'

  /auth/refresh:
    post:
      operationId: tokenRefresh
      summary: Refresh access token
      description: Expects refresh token in HttpOnly cookie. Handles refresh token rotation and races.
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          headers:
            Set-Cookie:
              description: New HttpOnly refresh token cookie
              schema:
                type: string
        '401':
          description: Refresh denied or session invalid (e.g., token reused outside grace window)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshDeniedError'

  /auth/logout:
    post:
      operationId: logout
      summary: Logout current session
      description: Clears HttpOnly refresh cookie and revokes session.
      responses:
        '200':
          description: Logged out successfully
          headers:
            Set-Cookie:
              description: Cleared refresh token cookie
              schema:
                type: string

  /auth/me:
    get:
      operationId: getAuthState
      summary: Get minimal auth UI state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Minimal auth state for UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '401':
          description: Unauthorized

  /auth/email/password-reset-request:
    post:
      operationId: emailPasswordResetRequest
      summary: Request password reset email
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (same response regardless of email existence)

  /auth/email/password-reset:
    post:
      operationId: emailPasswordReset
      summary: Reset password using token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token

  /auth/email/password-change:
    post:
      operationId: emailPasswordChange
      summary: Change password (authenticated)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '200':
          description: Password changed successfully
        '401':
          description: Invalid current password

  /auth/oauth/{provider}/authorize:
    get:
      operationId: oauthAuthorize
      summary: Redirect to OAuth provider authorization page
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, naver, kakao]
      responses:
        '302':
          description: Redirect to OAuth provider

  /auth/oauth/{provider}/callback:
    get:
      operationId: oauthCallback
      summary: Handle OAuth provider callback
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, naver, kakao]
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OAuth login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                  expiresIn:
                    type: integer
                  isNewUser:
                    type: boolean

  /auth/oauth/link:
    post:
      operationId: oauthLink
      summary: Link OAuth provider to existing account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, code, state]
              properties:
                provider:
                  type: string
                  enum: [google, naver, kakao]
                code:
                  type: string
                state:
                  type: string
      responses:
        '200':
          description: Provider linked successfully
        '409':
          description: Provider already linked to another account

  /auth/oauth/unlink/{provider}:
    delete:
      operationId: oauthUnlink
      summary: Unlink OAuth provider from account
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, naver, kakao]
      responses:
        '204':
          description: Provider unlinked
        '400':
          description: Cannot unlink last auth method

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRole:
      type: string
      enum: [admin, manager, member]

    VerificationState:
      type: string
      enum: [verified, unverified, expired]

    ProviderLink:
      type: object
      required: [provider, connectedAt]
      properties:
        provider:
          type: string
          enum: [email]
        connectedAt:
          type: string
          format: date-time
        providerUserId:
          type: string
          description: External provider user identifier

    AuthState:
      type: object
      required: [userId, email, roles, verificationState, providerLinks]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        verificationState:
          $ref: '#/components/schemas/VerificationState'
        providerLinks:
          type: array
          items:
            $ref: '#/components/schemas/ProviderLink'

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: "Human-readable error message. For authentication errors, always returns generic message to prevent account enumeration."
          example: "Invalid credentials"
        code:
          type: string
          description: "Machine-readable error code"
          example: "INVALID_CREDENTIALS"
        timestamp:
          type: string
          format: date-time

    ValidationErrorResponse:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: "Validation failed"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "password"
              message:
                type: string
                example: "must be at least 12 characters"

    ProviderDisabledError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            provider:
              type: string

    RateLimitError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            retryAfter:
              type: integer
              description: Seconds to wait before retrying

    InvalidCredentialsError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'

    UnverifiedUserError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            email:
              type: string

    ExpiredTokenError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'

    RefreshDeniedError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'

    RefreshResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
