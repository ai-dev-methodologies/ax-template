# contracts/payment-ui.yaml
# UI Contract — payment domain, full_trio mode.
#
# All 5 backend operationIds from contracts/payment-openapi.yaml are covered.
# Every route's backend_operation_id resolves against the backend_contract_ref.
# static_source_ref is [] for all routes (full_trio: FORBIDDEN to be non-empty).
#
# Payment-specific UX policies:
#   - Idempotency key lifecycle: generated by IdempotencyKeyHandler, passed as
#     Idempotency-Key HTTP header with every createPayment mutation.
#   - Slow provider warning: SlowProviderWarning shown after 3 000 ms per PAYMENT-PROVIDER-007.
#   - Success/failure pages are idempotent: same orderId always renders same state.
#   - Amount encoding: integer minor units (e.g. 1000 for KRW 1000원).

domain: payment
backend_contract_ref: contracts/payment-openapi.yaml
routes:
  - path: /checkout
    method: POST
    backend_operation_id: createPayment
    static_source_ref: []
    params: {}
    query: {}
    states:
      loading: SlowProviderWarning (after 3000ms)
      error: FormErrorBanner
      empty: null
      success: null
    redirects:
      on_auth_required: /login
      on_success: /success/{orderId}
      on_failure: /failure/{orderId}
    payment_ux:
      idempotency: IdempotencyKeyHandler (render prop; key passed as Idempotency-Key header)
      slow_provider_threshold_ms: 3000
      amount_encoding: integer_minor_units
      replayed_key_state: already_processed_banner

  - path: /success/{orderId}
    method: GET
    backend_operation_id: getPayment
    static_source_ref: []
    params:
      orderId:
        type: string
        format: uuid
        description: "Payment order ID from createPayment response"
    query: {}
    states:
      loading: LoadingBoundary
      error: ErrorBanner
      empty: null
      success: null
    redirects:
      on_auth_required: /login
      on_success: null
    payment_ux:
      idempotent: true
      note: "Re-render produces same receipt state for same orderId (webhook-redirect safe)"

  - path: /failure/{orderId}
    method: GET
    backend_operation_id: getPayment
    static_source_ref: []
    params:
      orderId:
        type: string
        format: uuid
        description: "Payment order ID for the failed transaction"
    query: {}
    states:
      loading: LoadingBoundary
      error: ErrorBanner
      empty: null
      success: null
    redirects:
      on_auth_required: /login
      on_retry: /checkout
    payment_ux:
      idempotent: true
      retry_target: /checkout

  - path: /methods
    method: GET
    backend_operation_id: listPayments
    static_source_ref: []
    params: {}
    query:
      page:
        type: integer
        description: "Zero-based page index"
      size:
        type: integer
        description: "Items per page (max 50)"
    states:
      loading: LoadingBoundary
      error: ErrorBanner
      empty: EmptyState
      success: null
    redirects:
      on_auth_required: /login
      on_success: null

  - path: /methods/new
    method: GET
    backend_operation_id: createPayment
    static_source_ref: []
    params: {}
    query: {}
    states:
      loading: LoadingBoundary
      error: FormErrorBanner
      empty: null
      success: null
    redirects:
      on_auth_required: /login
      on_success: /checkout

  - path: /methods/{id}
    method: GET
    backend_operation_id: getPayment
    static_source_ref: []
    params:
      id:
        type: string
        format: uuid
        description: "Payment ID"
    query: {}
    states:
      loading: LoadingBoundary
      error: NotFoundBanner
      empty: null
      success: null
    redirects:
      on_auth_required: /login
      on_success: null

  - path: /refund/{orderId}
    method: POST
    backend_operation_id: refundPayment
    static_source_ref: []
    params:
      orderId:
        type: string
        format: uuid
        description: "Payment order ID to refund"
    query: {}
    states:
      loading: LoadingBoundary
      error: FormErrorBanner
      empty: null
      success: null
    redirects:
      on_auth_required: /login
      on_success: /methods/{orderId}
    payment_ux:
      authz: "Only the payment owner may request a refund (PAYMENT-AUTHZ-002)"
      amount_encoding: integer_minor_units
