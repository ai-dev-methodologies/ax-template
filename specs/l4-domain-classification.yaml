      - name: "email-outbox"
        recipe_orphan: true
        active_recipes: []

  future_add:
    description: >
      Schema-reserved L4 namespaces intentionally absent from disk. Forks
      that need one of these must (a) add templates/L4/<domain>/ on disk,
      (b) move the entry from future_add to selectable in this file, and
      (c) re-run l4_domain_enum_sync_guard.sh. The schema enum already
      authorises the name so no schema patch is required by the fork.
    items:
      # email-outbox promoted to selectable in R51 (see selectable tier above).
      - name: "i18n-policy"
        intended_use: "Locale + currency + RTL policy enforcement."
      - name: "identity-verification"
        intended_use: "KYC / document verification pipeline."
      - name: "multi-tenant"
        intended_use: "Row-level / schema-per-tenant isolation runtime (separate from the policy spec at specs/multi-tenant-l0.yaml)."
      - name: "ratelimit"
        intended_use: "API rate-limiting policy + counter store."
      - name: "realtime-policy"
        intended_use: "WebSocket / SSE channel auth + back-pressure policy."
