version: "1.0.0"
scope: "api-rate-limiting"
domain_mode: full_trio
stack: "Spring Boot 3.2.x + Caffeine cache"
standard: "RFC 6585 §4 (HTTP 429) + IETF draft-ietf-httpapi-ratelimit-headers"
items:
  - id: "RATELIMIT-1"
    chapter: "Rejection"
    requirement: "Requests beyond max-per-window are rejected with HTTP 429"
    test_method: "ratelimit_1_rejectsBeyondMaxPerWindow"
    verification_type: "api_test"
    applicable: true
    notes: "Send max+1 requests with same client key within window → first N succeed with 200, request N+1 → 429"
    policy_ref: "blueprints/ratelimit-manifest.yaml#policy.max_per_window"

  - id: "RATELIMIT-2"
    chapter: "Headers"
    requirement: "429 response includes Retry-After header per RFC 6585 §4"
    test_method: "ratelimit_2_retryAfterHeaderOn429"
    verification_type: "api_test"
    applicable: true
    notes: "Trigger 429 → response MUST include Retry-After header with a non-negative integer (delta-seconds)"

  - id: "RATELIMIT-3"
    chapter: "Isolation"
    requirement: "Each client key has an independent quota — one client's exhaustion does not affect another"
    test_method: "ratelimit_3_clientKeysIsolated"
    verification_type: "api_test"
    applicable: true
    notes: "Client A exhausts quota (gets 429). Client B with different X-API-Key still succeeds with 200"
    policy_ref: "blueprints/ratelimit-manifest.yaml#policy.key_strategy"

  - id: "RATELIMIT-4"
    chapter: "Window reset"
    requirement: "After the window expires, the quota is refreshed and requests succeed again"
    test_method: "ratelimit_4_quotaResetsAfterWindow"
    verification_type: "api_test"
    applicable: true
    notes: "Client exhausts quota (429). Wait > window_millis. Next request → 200"
    policy_ref: "blueprints/ratelimit-manifest.yaml#policy.window_millis"

  - id: "RATELIMIT-5"
    chapter: "Anonymous IP key + XFF anti-spoofing"
    requirement: "For UNAUTHENTICATED endpoints, the rate-limit key MUST be the client IP resolved via a configured trusted-proxy hop count: the Nth-from-right X-Forwarded-For entry, where N is the trust depth — never the leftmost, client-controlled entry. When the header is absent, blank, the depth is 0, or the depth exceeds the number of entries present, the key falls back to the request's own remote address (fail-closed — never guess a position that cannot be trusted). Because the trusted entry is always counted from the RIGHT of the header, any attacker-controlled entries prepended to the LEFT of it (spoofed extra hops) MUST NOT shift which entry is selected — the resolved key, and therefore the bucket, is identical regardless of how many extra entries precede the trusted one."
    test_method: "ratelimit_5_anonymousIpKeyWithTrustedProxyDepth"
    verification_type: "api_test"
    applicable: true
    notes: "Attacker varies the leftmost (spoofed) XFF entries while holding the trust-depth-Nth-from-right entry constant → same bucket, same 429 outcome once exhausted. Two requests with distinct trust-depth-Nth-from-right entries → independent buckets, both succeed within quota."
    policy_ref: "blueprints/ratelimit-manifest.yaml#policy.trusted_proxy_depth"
