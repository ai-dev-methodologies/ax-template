version: "0.1.0"
scope: "transactional-outbox-l0 — Transactional Outbox pattern (atomic local-DB persist of a domain change + its outbox row, then a relay reliably publishes to the broker at-least-once) for fork-receivers that must emit events/messages without dual-write loss. Cross-cutting catalog pattern, jurisdiction-agnostic."
stack: "Spring Boot 3.2.x + JPA (outbox table) + Debezium CDC OR a polling-publisher relay + RabbitMQ OR Apache Kafka (broker) + Micrometer metrics"
standard: "Transactional Outbox pattern (microservices.io / Chris Richardson) + Polling Publisher pattern (microservices.io) + Debezium Outbox Event Router (CDC relay) + at-least-once delivery semantics + Amazon SQS Developer Guide (dead-letter queue model) + AWS Architecture Blog (exponential backoff and jitter) + RFC 9457 (Problem Details for HTTP APIs)"
domain_mode: backend_only   # P2-22: cross-cutting backend concern, no UI surface (no frontend Trio / contract / blueprint / L4); governed by spec_item_verification_binding_guard, not a full Trio
introduced_at: "R115 phase α — generic cross-cutting (memory feedback_prefer_generic_catalog). P11 standards + P9 distributed-system lens. R115 P12 TBD."

# transactional-outbox is the RELIABLE-EMIT primitive: it closes the
# dual-write gap where a service commits a domain change but then crashes
# before publishing the corresponding event (or publishes then fails to
# commit). OPT-IN: recipes that must emit events/messages whose delivery
# MUST NOT be lost relative to the committed state change SHOULD adopt.
# Composition note: composes idempotency-l0 (OUTBOX-IDEMPOTENT-001 reuses
# the stable message-id / dedup contract so at-least-once consumers stay
# safe) and job-queue-l0 (OUTBOX-FAILURE-001 reuses the backoff + DLQ
# semantics for relay failures); distinct from job-queue-l0 (on-demand work
# dispatch, not atomic emit) and webhook-l0 (external HTTP delivery, not the
# internal commit-then-publish bridge). report-export-l0 / email-outbox-l0 /
# notification-l0 are concrete consumers that emit via this outbox.

# ── Priority order for fork-receivers (P4 박지영 lens) ──
# Adopt in order; earlier items are foundational. WRITE + RELAY are the
# keystone — without an atomic write and a relay, idempotency/ordering/
# cleanup/failure are undefined.
#   1. OUTBOX-WRITE-001        — atomic domain-change + outbox row (no dual-write)
#   2. OUTBOX-RELAY-001        — polling OR CDC relay publishes + marks sent (at-least-once)
#   3. OUTBOX-IDEMPOTENT-001   — stable message id → consumer dedup (composes idempotency-l0)
#   4. OUTBOX-ORDERING-001     — per-aggregate ordering preserved
#   5. OUTBOX-CLEANUP-001      — sent rows purged/archived on a retention window
#   6. OUTBOX-FAILURE-001      — relay retry + backoff + poison handling (composes job-queue DLQ)
#   7. OUTBOX-OBSERVABILITY-001 — 3 metrics

# ── RECIPE.md frontmatter example (P5 이상호 lens) ──
#   ---
#   recipe: generic-transactional-outbox
#   outbox_relay_mode: cdc                     # OR polling
#   outbox_poll_interval_ms: 1000              # polling mode only
#   outbox_relay_batch_size: 100
#   outbox_message_id_format: uuid-v4          # RFC 4122; stable per outbox row
#   outbox_per_aggregate_ordering: true
#   outbox_retention_window_hours: 168         # 7d before purge/archive
#   outbox_relay_max_attempts: 5               # before poison routing
#   outbox_relay_base_delay_ms: 1000
#   ---
# High-throughput verticals SHOULD set relay_mode=cdc (Debezium, no poll
# lag); low-volume single-node MAY use polling. Ordering-sensitive streams
# MUST keep per_aggregate_ordering=true.

# ── F8 standards pin (P11 황태완 lens) ──
# Defaults pinned: outbox row + domain change written in ONE local DB
# transaction (no 2PC, no dual-write), relay = polling-publisher OR
# Debezium CDC, delivery = at-least-once (so consumers MUST dedup on a
# stable message id), failure = exponential backoff + jitter then poison
# routing. 13-wave standards-pin streak (R93~R115).

items:
  - id: "OUTBOX-WRITE-001"
    chapter: "Atomic domain change + outbox row (no dual-write)"
    requirement: "When a producer command mutates domain state AND must emit a corresponding message, the domain-entity write and the outbox-row insert MUST occur in the SAME local database transaction (one @Transactional unit) so they commit or roll back together — direct publish to the broker inside the request path is forbidden because a crash between commit and publish (or publish before commit) loses or phantoms the message (the dual-write problem). Each outbox row MUST persist {message_id, aggregate_type, aggregate_id, payload, created_at, status=PENDING}. A command that fails validation → 400 (the domain write does not commit, so no outbox row exists). 2PC across DB + broker is explicitly NOT used."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Implementation: persist the entity and the outbox row via the same JPA
      EntityManager transaction; never call the broker from the request
      thread. Anchored to microservices.io Transactional Outbox pattern
      (https://microservices.io/patterns/data/transactional-outbox.html).
      Quote anchor (microservices.io Transactional Outbox, Solution): "The
      solution is for the service that sends the message to first store the
      message in the database as part of the transaction that updates the
      business entities."

  - id: "OUTBOX-RELAY-001"
    chapter: "Relay publishes unsent rows + marks sent (at-least-once)"
    verification:
      mechanism: rule
      ref: transactional-outbox-no-dual-write
    requirement: "A separate message relay MUST move PENDING outbox rows to the broker: either a polling publisher that periodically reads unsent rows (status=PENDING, ordered, batch size `outbox_relay_batch_size`) and publishes them, OR a CDC relay (Debezium Outbox Event Router) tailing the outbox table's transaction log. After a successful broker publish the relay MUST mark the row SENT (or delete it) so it is not republished. Delivery is at-least-once: if the relay crashes after publishing but before marking SENT, the row WILL be republished on the next pass — duplicates are expected and handled downstream by OUTBOX-IDEMPOTENT-001. The relay MUST NOT mark a row SENT before the broker acknowledges the publish."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Implementation: a @Scheduled poller selecting PENDING rows FOR UPDATE
      SKIP LOCKED then publishing + status=SENT, OR a Debezium connector with
      the Outbox Event Router SMT routing by aggregate_type. Anchored to
      microservices.io Polling Publisher pattern
      (https://microservices.io/patterns/data/polling-publisher.html)
      + Debezium Outbox Event Router
      (https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html).
      Quote anchor (microservices.io Polling Publisher, Solution): "Publish
      messages by polling the database's outbox table."
      Reference: Debezium Outbox Event Router — captures inserts on the
      outbox table and routes them to broker topics by aggregate type
      (see source; CDC mechanism paraphrased, not quoted verbatim).

  - id: "OUTBOX-IDEMPOTENT-001"
    chapter: "Stable message id → consumer dedup (composes idempotency-l0)"
    verification:
      mechanism: rule
      ref: transactional-outbox-no-dual-write
    requirement: "Every outbox row MUST carry a stable, immutable `message_id` (RFC 4122 UUID, `outbox_message_id_format`) assigned at WRITE time and never regenerated on relay/redelivery, so a consumer that has already processed that `message_id` can dedup a redelivered copy (composes idempotency-l0: the message_id is the consumer-side idempotency key). Because OUTBOX-RELAY-001 is at-least-once, the publish path MUST NOT assume exactly-once and consumers MUST be idempotent — a consumer re-receiving a known `message_id` MUST treat it as a no-op (same observable effect as a single delivery). The `message_id` MUST also be carried as a message header/property so the consumer can dedup without parsing the payload."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Implementation: generate UUID v4 at insert; emit it as the broker
      message id header; consumers keep a processed-id set / unique
      constraint (reuse idempotency-l0 CACHE + DEDUP contract). Anchored to
      microservices.io Transactional Outbox pattern
      (https://microservices.io/patterns/data/transactional-outbox.html) —
      at-least-once relay implies consumer-side dedup.
      Reference: idempotency-l0 IDEMPOTENT contract (in-catalog) provides the
      stable-key dedup mechanism reused here (see source).

  - id: "OUTBOX-ORDERING-001"
    chapter: "Per-aggregate ordering preserved"
    verification:
      mechanism: rule
      ref: transactional-outbox-no-dual-write
    requirement: "Messages for the same aggregate (same `aggregate_id`) MUST be published in the order they were committed — relay dispatch within an aggregate is ordered by the monotonic outbox sequence (auto-increment id) or `created_at` so an earlier state change is never published after a later one for that aggregate. Recipe declares `outbox_per_aggregate_ordering` (default true). Global cross-aggregate ordering is NOT promised (different aggregates MAY interleave); the contract is per-aggregate FIFO only. A polling relay MUST therefore order its scan by (aggregate_id, sequence) and MUST NOT parallelize publishes for the same aggregate_id; a CDC relay inherits log order and MUST partition the broker by a key derived from aggregate_id so a single aggregate's events land on one ordered partition."
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Implementation: outbox PK is a monotonic sequence; relay orders by it;
      Kafka partition key = aggregate_id keeps per-aggregate order. Anchored
      to microservices.io Transactional Outbox pattern, Forces
      (https://microservices.io/patterns/data/transactional-outbox.html).
      Quote anchor (microservices.io Transactional Outbox, Forces): "Messages
      must be sent to the message broker in the order they were sent by the
      service."

  - id: "OUTBOX-CLEANUP-001"
    chapter: "Sent rows purged/archived on a retention window"
    verification:
      mechanism: rule
      ref: transactional-outbox-no-dual-write
    requirement: "SENT outbox rows MUST NOT accumulate unbounded — they MUST be purged or archived once they are confirmed published and older than `outbox_retention_window_hours` (default 168h / 7d), so the hot outbox table stays small and relay scans stay fast. A retention sweeper (scheduled) MUST only remove rows in status=SENT (never PENDING / never a row that has not been confirmed published), and MAY copy them to an archive table before delete when audit retention is required. PENDING rows MUST NEVER be purged by the cleanup path (that would silently drop an unpublished message). The cleanup window is recipe-configurable and the trade-off (shorter = leaner table, longer = more replay/audit runway) is documented in RECIPE.md."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Implementation: a @Scheduled DELETE WHERE status='SENT' AND
      sent_at < now() - retention, optionally INSERT INTO archive first;
      partial index on status keeps PENDING scans cheap. Anchored to
      microservices.io Transactional Outbox pattern, Resulting context
      (https://microservices.io/patterns/data/transactional-outbox.html) —
      the outbox table is operational, not a permanent log.
      Reference: microservices.io Transactional Outbox — published rows are
      transient and require pruning (see source; retention is the catalog's
      added operational constraint, paraphrased — the Resulting context
      section does not state pruning verbatim, hence no quote anchor here).

  - id: "OUTBOX-FAILURE-001"
    chapter: "Relay retry + backoff + poison-message handling (composes job-queue DLQ)"
    verification:
      mechanism: rule
      ref: transactional-outbox-no-dual-write
    requirement: "When the relay's broker publish fails, the row MUST stay PENDING (not lost) and be retried by the next relay pass with exponential backoff plus jitter — the per-attempt delay MUST be `random_between(0, min(max_delay, base * 2^N))` (full jitter, never a fixed multiplier) tracked via an `attempt` count on the row, with `outbox_relay_max_attempts` (default 5) and `outbox_relay_base_delay_ms` (default 1000). On exhausting max attempts the row MUST be routed to a dead-letter / poison state (status=DEAD) rather than blocking the relay head-of-line or being silently dropped — an admin-only endpoint (GET /api/admin/outbox/dead-letter, @PreAuthorize ROLE_ADMIN, 403 for non-admin) lists poison rows and a replay endpoint (POST /api/admin/outbox/dead-letter/{message_id}/replay) resets it to PENDING returning 202 ACCEPTED; replaying a `message_id` not in DEAD state → 404 OUTBOX_NOT_IN_DEAD_LETTER. A single poison row MUST NOT stall delivery of healthy rows."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Implementation: reuse job-queue-l0 RETRY + DLQ semantics for the relay;
      on publish failure increment attempt + compute next visible-after, on
      cap set status=DEAD; skip DEAD/backed-off rows in the relay scan so
      they do not block. Anchored to AWS Architecture Blog, Exponential
      Backoff And Jitter
      (https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/)
      + Amazon SQS Developer Guide, Dead-letter queues
      (https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html)
      + RFC 9457 (https://www.rfc-editor.org/rfc/rfc9457) for the 404 body.
      The AWS Full Jitter formula is presented on the source page as an image
      figure, not prose, so it is not quoted verbatim here.
      Quote anchor (Amazon SQS Developer Guide, Dead-letter queues): "Amazon
      SQS supports dead-letter queues (DLQs), which source queues can target
      for messages that are not processed successfully."

  - id: "OUTBOX-OBSERVABILITY-001"
    chapter: "관측 (3 canonical metrics)"
    verification:
      mechanism: rule
      ref: domain-metrics-bounded-cardinality
    requirement: "Transactional-outbox implementations MUST expose exactly 3 canonical Micrometer metrics with bounded-cardinality labels: (1) `outbox_pending_depth{aggregate_type}` — a gauge of currently-unpublished (PENDING) rows, surfacing relay backlog; (2) `outbox_relay_lag_seconds{aggregate_type}` — a gauge/timer of the age of the oldest PENDING row (commit-to-publish lag); (3) `outbox_publish_failure_total{aggregate_type, reason}` — a counter of failed publishes, reason from a small recipe-enumerated set (broker_unavailable, serialization_error, poison). The `aggregate_type` label MUST be a bounded, recipe-enumerated value, NEVER a per-row message_id, aggregate_id, payload field, user_id, tenant_id, or any unbounded/PII value. SLO/alert wiring (e.g., alert on outbox_relay_lag_seconds high or outbox_pending_depth growing) is a fork-receiver concern."
    test_method: "Micrometer registry assertion"
    verification_type: "positive"
    applicable: true
    notes: >
      Three metrics map 1:1 to the three outbox health questions — backlog
      (pending_depth), freshness/lag (relay_lag_seconds), and emit failure
      (publish_failure_total). Anchored to Micrometer Concepts
      (https://docs.micrometer.io/micrometer/reference/concepts.html).
      Reference: Micrometer Concepts — Gauge / Timer / Counter meter types
      and tag-cardinality guidance (see source; the bounded-cardinality rule
      is paraphrased, not quoted verbatim).
