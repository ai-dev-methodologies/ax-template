# specs/data-subject-rights-frontend-l0.yaml
# Page Compliance Spec — data-subject-rights domain, full_trio mode.
#
# Every item's backend_operation_id resolves to
# contracts/data-subject-rights-openapi.yaml.
# Every item's backend_spec_ref resolves to an id in
# specs/data-subject-rights-l0.yaml.
# static_source_ref is [] for all items (full_trio: FORBIDDEN to be non-empty).
#
# Coverage: all 8 backend operationIds (dsrOpenAccess / dsrRectify / dsrErasure /
# dsrPortability / dsrRestrict / dsrLiftRestriction / dsrGetRequest /
# dsrExtendRequest) are referenced — 100% operationId coverage.

domain: data-subject-rights
domain_mode: full_trio
backend_spec_ref: specs/data-subject-rights-l0.yaml
frontend_required: true

items:
  - id: DSR-FE-001
    verification:
      mechanism: rule
      ref: dsr-frontend-pages-bind-dsr-contract
    requirement: "Privacy dashboard lists the subject's DSR requests with status + SLA due date by tracking each request via the dsrGetRequest endpoint"
    backend_operation_id: dsrGetRequest
    backend_spec_ref: DSR-SLA-001
    static_source_ref: []
    test_method: "data-subject-rights/composition.spec.ts"
    verification_type: e2e_test
    policy_ref: "blueprints/data-subject-rights-ui-manifest.yaml#a11y"
    coverage_threshold: 1.0
    backend_only_marker: false

  - id: DSR-FE-002
    requirement: "Access page submits a subject-access request via dsrOpenAccess and renders the returned export bundle download handle"
    backend_operation_id: dsrOpenAccess
