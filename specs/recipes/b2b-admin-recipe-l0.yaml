# specs/recipes/b2b-admin-recipe-l0.yaml — Recipe-level spec (SP39)
schema_version: 1
pattern: b2b-admin
display_name: "B2B Admin (Multi-tenant Ops + Analytics + Audit + Impersonation + R29–R36 admin surface)"
compatible_with_catalog_version: "v1.3.0-business-patterns"
last_verified_at: "2026-05-22"

# R39 (2026-05-23): R29–R36 domains absorbed via backend-only L4 stubs
# (templates/L4/<domain>/README.md with tenant_model declaration; full
# Next.js tree deferred). recipe_spec_referential_integrity_guard satisfied
# by README presence. Each domain ships its own ./gradlew test{Domain}
# GREEN verdict and integrates via MULTI-TENANT-INTEGRATION-001..005 in
# RECIPE.md.
enabled_l4_domains:
  - audit-log
  - auth
  - crud
  - feature-flags
  - search
  - api-key
  - approval-workflow
  - session-management
  - activity-feed
  - comment-thread
  - tag-categorization
  - favorites-bookmarks

l2_blocks_used:
  - bulk-actions-bar
  - bulk-export
  - column-picker
  - column-reorder
  - data-table
  - feature-flag-toggle
  - feature-gate
  - filter-bar
  - impersonation-banner
  - kpi-card
  - saved-filters
  - saved-view
  - search-palette
  - time-series-chart

l3_pages_used:
  - admin-overview-page
  - audit-log-page
  - dashboard-page
  - detail-page
  - list-page
  - settings-overview

business_invariants:
  - id: B2BADMIN-INV-001
    statement: "Impersonation events always emit audit-log row with impersonator_id, impersonated_id, started_at, ended_at"
    spec_ref: "specs/audit-log-l0.yaml#AUDIT-RECORD-001"
  - id: B2BADMIN-INV-002
    statement: "Tenant-scoped feature-flag changes are immutable history (no destructive delete)"
    spec_ref: "specs/feature-flags-l0.yaml#FF-CRUD-003"
  - id: B2BADMIN-INV-003
    statement: "KPI aggregation respects tenant boundary (no cross-tenant leakage)"
    # Iter-1 (2026-05-20): re-anchored from auth-asvs-l1.yaml#ASVS-V4.2.1 (per-user IDOR,
    # NOT tenant boundary) to multi-tenant-l0.yaml. RECIPE.md (line 84) was re-anchored
    # in R16 but this machine-readable sibling slipped through — closes P2 4th-visit NC4.
    # Primary anchor pinned to ISOLATION-001 for guard parsing; additional required
    # anchors enumerated in additional_spec_refs (advisory list — guard reads primary).
    spec_ref: "specs/multi-tenant-l0.yaml#MULTI-TENANT-ISOLATION-001"
    additional_spec_refs:
      - "specs/multi-tenant-l0.yaml#MULTI-TENANT-ISOLATION-003"
      - "specs/multi-tenant-l0.yaml#MULTI-TENANT-PROPAGATION-001"

business_observability_advisory:
  - metric: "recipe.b2b_admin.impersonation_total"
    type: counter
    note: "advisory; no emitter test enforced this PRD"
  - metric: "b2b_admin.tenant.active_total"
    type: gauge
    note: "advisory; no emitter test enforced this PRD"
  - metric: "b2b_admin.feature_flag.change_total"
    type: counter
    note: "advisory; no emitter test enforced this PRD"

override_allowed:
  # Inline override block — no separate RECIPE_DEVIATION.md
  # enabled_l4_domains:
  #   skip: ["search"]
  #   rationale: "Single-tenant deployment; no cross-tenant search needed."
  #   citation: "<internal ticket / PR url>"

