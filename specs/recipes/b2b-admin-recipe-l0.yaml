business_invariants:
  - id: B2BADMIN-INV-001
    statement: "Impersonation events always emit audit-log row with impersonator_id, impersonated_id, started_at, ended_at"
    spec_ref: "specs/audit-log-l0.yaml#AUDIT-RECORD-001"
  - id: B2BADMIN-INV-002
    statement: "Tenant-scoped feature-flag changes are immutable history (no destructive delete)"
    spec_ref: "specs/feature-flags-l0.yaml#FF-CRUD-003"
  - id: B2BADMIN-INV-003
    statement: "KPI aggregation respects tenant boundary (no cross-tenant leakage)"
    spec_ref: "specs/auth-asvs-l1.yaml#ASVS-V4.2.1"

business_observability_advisory:
