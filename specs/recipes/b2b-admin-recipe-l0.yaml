    source: "channel.io (채널코퍼레이션) — Korean B2B SaaS"
    url: "https://channel.io/ko"
    citation: "AI로 더 편해진 사내 메신저"
    quoted_at: "2026-05-18"
  - provenance_class: internal_design
    source: "Jira REST API v3 (Atlassian)"
    url: "https://developer.atlassian.com/cloud/jira/platform/rest/v3/"
    rationale: "Content truncated / 404 on 3 fetch attempts (2026-05-18). Downgraded to internal_design."
  - provenance_class: internal_design
    source: "토스ID (Toss Identity) — Korean enterprise identity"
    rationale: "No public API documentation URL. Pattern modeled from internal_design."
  - provenance_class: internal_design
    derives_from:
      - "SP34 impersonation-banner"
      - "SP17 audit-log"
      - "SP26 feature-flags"
      - "auth ASVS L1 spec"
    rationale: "Composition derives from existing L4 auth (ASVS), audit-log, feature-flags, and SP34 impersonation block."
