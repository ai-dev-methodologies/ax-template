    type: counter
    note: "advisory; no emitter test enforced this PRD; labeled by priority (P1/P2/P3/P4)"
  - metric: "recipe.internal-it.sla_breach_total"
    type: counter
    note: "advisory; counted when a ticket's age exceeds its SLA threshold"
  - metric: "recipe.internal-it.webhook_failed_permanent_total"
    type: counter
    note: "advisory; counted when an outbound ITSM webhook hits WEBHOOK-DEAD-LETTER-001"

