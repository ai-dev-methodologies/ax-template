business_invariants:
  - id: INTERNAL-IT-INV-001
    statement: "Ticket state transitions (open → in-progress → resolved → closed) emit audit-log row with operator + before/after"
    spec_ref: "specs/audit-log-l0.yaml#AUDIT-RECORD-001"

  - id: INTERNAL-IT-INV-002
    statement: "SLA breach reminder emission uses scheduled-task lock primitive (no double-send on multi-node) AND is idempotent on the breach-event idempotency key"
    spec_ref: "specs/scheduled-task-l0.yaml#SCHED-LOCK-001"

  - id: INTERNAL-IT-INV-003
    statement: "Outbound webhook to external ITSM (Jira / ServiceNow / PagerDuty / Slack-incoming) is signed with HMAC-SHA256 over <timestamp>.<body> AND retried with exponential backoff (30s base × 2 multiplier up to 5 attempts) until dead-letter"
    spec_ref: "specs/webhook-l0.yaml#WEBHOOK-SIGN-001"
    notes: |
      Anchored to TWO webhook spec items shipped in R9 SP45 (disk-verified at
      SP45b prep step against the newly landed specs/webhook-l0.yaml):
      - WEBHOOK-SIGN-001 — outbound HMAC-SHA256 signature over body
      - WEBHOOK-RETRY-001 — exponential backoff 30s × 2 up to 5 attempts
      Both are SP45-shipped (NET-NEW Spec Trio per TD-2026-05-22-025).
      The HMAC anchor reuses the same RFC 2104 + OWASP ASVS V13.2.6 anchor
      already cited by practices/rules/webhook-hmac-required.md and
      specs/spring-practices-l0.yaml#PRACTICES-INTEG-001 (receiver axis).
      Sender + receiver are distinct catalog axes sharing identical
      construction (see templates/DECISIONS.md TD-2026-05-22-025 HMAC bullet).

  - id: INTERNAL-IT-INV-004
    statement: "Assignee notifications (ticket-assigned, status-changed, SLA-near-breach) respect operator preferences + opt-out AND use at-least-once outbox delivery"
    spec_ref: "specs/notification-l0.yaml#NOTIF-PREF-001"

  - id: INTERNAL-IT-INV-005
    statement: "Per-endpoint webhook signing-secret stored encrypted-at-rest (KMS-managed AES-256 envelope) and never logged in plaintext"
    co-shipped-rule: "webhook-secret-encryption"
    invariant_test: "frontend/tests/recipes/internal-it-webhook-secret.spec.ts"
    notes: |
      Recipe-level invariant authored inline here per PRD §1.8 Principle 8 +
      §10 out-of-scope (NO new practices/rules/*.md file). The
      recipe_spec_referential_integrity_guard.sh additive branch (R7 SP41b
      community precedent) accepts (co-shipped-rule + invariant_test) as a
      valid anchor pair when the catalog has no existing rule.
      Implementation must: (a) generate the per-endpoint signing_secret via
      SecureRandom (256-bit) at WebhookEndpoint.create(); (b) wrap secret
      column in @Convert AttributeConverter that performs envelope encryption
      (KMS-managed AES-256) before persistence — the database row stores only
      the encrypted ciphertext, never the plaintext secret; (c) NEVER include
      the plaintext secret in log lines — log only the signing_secret_id or
      last-4 fingerprint.
      Promotion to a standalone practices/rules/security-secret-encryption-at-rest.md
      rule is **deferred indefinitely** per TD-2026-05-22-025 Follow-ups (M5
      framing) — remains recipe-level unless cross-domain need emerges.

  # INV-005 disambiguation — R7-community-style escape hatch (deliberate framing)
  # R8 lms-INV-005 / cms-INV-005 both bound to existing spec + existing rule
  # (idempotency-key-on-mutations.md) because the catalog already had a rule
  # covering bulk-enrollment / slug-uniqueness idempotency.
  # R9 internal-it-INV-005 is the R7-community-style catalog-novel case:
  # the catalog has NO existing rule covering per-endpoint signing-secret
  # encryption-at-rest. The choice between paths is determined by catalog
  # state at SP execution, not policy preference. See RECIPE.md INV-005
  # disambiguation paragraph for the full framing.

business_observability_advisory:
