business_invariants:
  - id: API-GATEWAY-RELAY-INV-001
    statement: "Every relayed request to a backend service is signed via webhook L4's HMAC-SHA256 over <timestamp>.<body> AND emits an audit-log row with operator + relay_target_endpoint + delivery_id"
    spec_ref: "specs/webhook-l0.yaml#WEBHOOK-SIGN-001"
    notes: |
      Anchored to TWO spec items (clears the ≥1-anchor floor per M4 wording):
      - WEBHOOK-SIGN-001 (R9 SP45-shipped) — outbound HMAC-SHA256 signature over <timestamp>.<body>
      - AUDIT-RECORD-001 — every state-changing op records audit row with operator
      The HMAC anchor reuses the same RFC 2104 + OWASP ASVS V13.2.6 anchor
      already cited by practices/rules/webhook-hmac-required.md (receiver
      axis). Sender + receiver are distinct catalog axes sharing identical
      construction — see templates/DECISIONS.md TD-2026-05-22-025 HMAC bullet.

  - id: API-GATEWAY-RELAY-INV-002
    statement: "Relay authorization checks token validity AND scope BEFORE forwarding to upstream; on auth failure the request is rejected with audit-logged denial reason"
    spec_ref: "specs/auth-asvs-l1.yaml#ASVS-V4.1.1"
    notes: |
      Anchored to TWO spec items:
      - ASVS-V4.1.1 — gateway-level access control enforcement
      - AUDIT-RECORD-002 — immutable audit row on denial reason
      GatewayAuthFilter (OncePerRequestFilter) placed BEFORE the relay
      controller; short-circuits with audit-logged denial reason on failure.

  - id: API-GATEWAY-RELAY-INV-003
    statement: "Per-route rate-limiting enforced before relay; over-limit requests rejected with HTTP 429 AND counted via observability counter"
    spec_ref: "specs/ratelimit-l0.yaml#RATELIMIT-1"
    notes: |
      Cross-cutting spec binding (R10-novel framing per PRD §4.1 +
      TD-2026-05-23-029): ratelimit-l0.yaml exists on disk as a 4-item spec
      WITHOUT a templates/L4/ratelimit/ directory. R10 treats rate-limiting
      as a CROSS-CUTTING CONCERN enforced INSIDE existing L4 boundaries
      (auth + webhook + crud filters); bound via spec_ref ONLY. The
      recipe_spec_referential_integrity_guard.sh resolves spec_ref against
      file existence + ID presence only (NOT L4 directory presence) —
      guard-compatible without materializing a new L4 directory (Codex iter 1
      guard audit confirmed at PRD signature).
      Anchored to TWO ratelimit spec items:
      - RATELIMIT-1 — HTTP 429 rejection beyond max-per-window
      - RATELIMIT-2 — Retry-After header per RFC 6585 §4
      This is deliberately DIFFERENT from spinning ratelimit as a new L4 —
      see Principle 7 + TD-2026-05-22-027 (c) two-consumer-signal gate.

  - id: API-GATEWAY-RELAY-INV-004
    statement: "Circuit breaker per upstream endpoint auto-opens on 90% failure rate over rolling 50 attempts; reconciliation of half-open / closed state runs via scheduled-task lock primitive (no double-reconcile on multi-node deployment)"
    spec_ref: "specs/webhook-l0.yaml#WEBHOOK-CIRCUIT-001"
    notes: |
      Anchored to TWO spec items:
      - WEBHOOK-CIRCUIT-001 (R9 SP45-shipped) — 90% rolling 50-attempt failure auto-opens
      - SCHED-LOCK-001 — distributed lock on circuit-reconcile cron
      CircuitBreakerPolicy.evaluate(endpointId) after every terminal
      WebhookDelivery transition; CircuitBreakerReconcileTask cron wraps the
      scan loop in LockingPolicy.tryAcquire("api-gateway-relay-circuit-reconcile", node-id).

  - id: API-GATEWAY-RELAY-INV-005
    statement: "Route registration + config mutations (URL, method, target, signing-secret) follow CRUD validation rules AND emit audit rows with before/after diff"
    spec_ref: "specs/crud-security.yaml#CRUD-VAL-1"
    rule_ref: "practices/rules/idempotency-key-on-mutations.md"
    notes: |
      INV-005 binds THREE anchors (clears the ≥1-anchor floor with 2x buffer
      per M4 wording):
      - spec_ref: specs/crud-security.yaml#CRUD-VAL-1 (validation)
      - spec_ref: specs/audit-log-l0.yaml#AUDIT-RECORD-002 (immutable before/after)
      - rule_ref: practices/rules/idempotency-key-on-mutations.md (idempotency)
      INV-005 DELIBERATE FRAMING (disambiguated from R7 community / R9
      internal-it co-shipped-rule escape hatch): all anchors EXIST in the
      catalog today, so this recipe uses the preferred (spec_ref + rule_ref)
      path. NO co-shipped-rule + invariant_test invocation needed this cycle
      (same path as R8 LMS-INV-005 / CMS-INV-005). The choice is determined
      by catalog state at SP execution, not policy preference.

business_observability_advisory:
  - metric: "recipe.api_gateway_relay.relay_request_total"
    type: counter
    note: "advisory; counted on every inbound relay accepted + signed + dispatched"
  - metric: "recipe.api_gateway_relay.relay_rate_limit_rejected_total"
    type: counter
    note: "advisory; counted when an inbound relay is rejected with HTTP 429 (over-limit)"
  - metric: "recipe.api_gateway_relay.circuit_breaker_open_total"
    type: counter
    note: "advisory; counted when a per-endpoint circuit transitions to OPEN"

