  - list-page
  - search-results-page

business_invariants:
  - id: MARKETPLACE-ESCROW-LIFECYCLE-001
    statement: "Escrow funds released only after buyer confirmation OR dispute-window expiry"
    spec_ref: "specs/payment-l0.yaml#PAYMENT-STATE-002"
  - id: MARKETPLACE-INV-001
    statement: "Escrow funds released only after buyer confirmation OR dispute-window expiry"
    spec_ref: "specs/payment-l0.yaml#PAYMENT-STATE-002"
  - id: MARKETPLACE-INV-002
    statement: "Listing search results exclude soft-deleted + moderator-hidden listings"
    spec_ref: "specs/search-l0.yaml#SEARCH-AUTHZ-001"
  - id: MARKETPLACE-INV-003
    statement: "KYC required before high-value listing creation (threshold via feature-flag)"
    spec_ref: "specs/feature-flags-l0.yaml#FF-AUTHZ-001"
    rule_ref: "practices/rules/no-rrn-collection-without-legal-basis.md"

business_observability_advisory:
  - metric: "recipe.marketplace.escrow_pending_total"
    type: gauge
    note: "advisory; no emitter test enforced this PRD"
  - metric: "marketplace.listing.created_total"
    type: counter
    note: "advisory; no emitter test enforced this PRD"
  - metric: "marketplace.dispute.opened_total"
    type: counter
    note: "advisory; no emitter test enforced this PRD"

