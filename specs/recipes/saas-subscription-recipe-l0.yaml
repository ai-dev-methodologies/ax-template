    citation: "자동결제는 정기 배송, 음악 스트리밍과 같은 구독형 서비스에서 사용할 수 있어요."
    quoted_at: "2026-05-18"
    fidelity_note: "iter 3 — URL corrected from /billing/overview (404) to /billing; verbatim snippet re-fetched from current page body."
