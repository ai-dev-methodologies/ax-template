  - billing
  - auth
  - feature-flags
  - notification
  - audit-log
l2_blocks_used:
  - pricing-table
  - plan-comparison
  - usage-meter
  - invoice-list
  - billing-history
  - feature-flag-toggle
  - feature-gate
  - kpi-card
l3_pages_used:
