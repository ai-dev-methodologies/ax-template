version: "0.1.0"
scope: "spring-practices-l0 — seed Java/Spring best-practice items projected by practices/rules/*.md"
stack: "Spring Boot 3.2.x / Java 21 / JPA / Spring Security 6"
items:
  - id: "PRACTICES-PERS-001"
    chapter: "Persistence / JPA"
    requirement: "Lazy associations must be fetched explicitly (JOIN FETCH or @EntityGraph) when iterated, to avoid N+1 query patterns."
    test_method: "practices_PERS_001_nPlusOnePrevented"
    verification_type: "integration_test"
    applicable: true
    notes: "Integration test asserts Hibernate Statistics.getQueryExecutionCount() == 1 (or a small constant) when iterating a parent collection. The naive lazy-iterate path is shown in the corresponding rule .md as the Incorrect example."
  - id: "PRACTICES-PERS-005"
    chapter: "Persistence / Soft Delete"
    requirement: "Soft-delete must be implemented via @SQLDelete (UPDATE … SET deleted_at = CURRENT_TIMESTAMP) and @Where(clause = 'deleted_at IS NULL'), not via a boolean deleted flag. Every @Entity that uses @SQLDelete must also carry @Where to auto-filter deleted rows from all JPQL queries."
    test_method: "practices_PERS_005_softDeletedRecordDisappearsFromList"
    verification_type: "integration_test"
    applicable: true
    notes: "RestAssured IT creates a record, soft-deletes via DELETE endpoint, then asserts it no longer appears in GET list (filtered by @Where). ArchUnit rule (BaseEntitySoftDeleteArchTest) asserts: (1) @SQLDelete → @Where co-presence; (2) no boolean 'deleted' field on @Entity classes."
  - id: "PRACTICES-TX-001"
    chapter: "Transaction Management"
    requirement: "Self-invocation of @Transactional methods through this.method() bypasses the proxy and does not start a transaction. Call across a separate bean to honor @Transactional."
    test_method: "practices_TX_001_selfInvocationBypassesTransactional"
    verification_type: "integration_test"
    applicable: true
    notes: "Integration test demonstrates: self-invocation does NOT propagate the transaction (e.g. dirty-checking / rollback fails); separate-bean invocation does. Asserts both behaviors so the rule remains testable."
  - id: "PRACTICES-VAL-001"
    chapter: "Validation / Input Binding"
    requirement: "Inbound HTTP payloads must bind to a DTO whose fields whitelist the user-controllable inputs. Protected entity fields (role, enabled, owner, internal IDs) must not be assignable via mass-assignment."
    test_method: "practices_VAL_001_massAssignmentBlocked"
    verification_type: "integration_test"
    applicable: true
    notes: "Integration test posts a request body containing extra protected fields and asserts (a) request still succeeds for whitelisted fields (b) protected fields keep their default/server-set values."
  - id: "PRACTICES-TEST-001"
    chapter: "Testing / Black-box HTTP"
    requirement: "Practice tests must be portable: use RestAssured against @LocalServerPort, not MockMvc tied to internal Spring infrastructure. Black-box HTTP shape lets the same test fixture run against any conforming implementation."
    test_method: "practices_TEST_001_restAssuredBlackBoxPattern"
    verification_type: "integration_test"
    applicable: true
    notes: "Test class uses RestAssured with @LocalServerPort and asserts the absence of MockMvc / WebMvcTest annotations within practice-tagged tests via a reflection/classpath probe."
  - id: "PRACTICES-OBS-001"
    chapter: "Observability / Structured Logging"
    requirement: "Log statements that record domain events must emit key-value pairs (SLF4J fluent API `addKeyValue` or Logback structured arguments) rather than concatenated strings. JSON appenders can then serialise the structured fields into searchable top-level columns; concatenated text strings cannot be indexed."
    test_method: "practices_OBS_001_loggerEmitsKeyValuePairs"
    verification_type: "unit_test"
    applicable: true
    notes: "Unit test attaches a ListAppender to the logger, exercises the fluent API, and asserts the captured ILoggingEvent has the expected KeyValuePair entries. The anti-pattern (string concatenation) is asserted to produce NO key-value pairs."
  - id: "PRACTICES-OBS-002"
    chapter: "Observability / MDC Trace Propagation"
    requirement: "Every request must populate MDC with a stable trace identifier (incoming X-Request-Id when present; UUID otherwise) before the handler runs, and clear it on exit. Without MDC propagation, log lines from concurrent requests interleave with no way to reconstruct a single request's trail."
    test_method: "practices_OBS_002_usesIncomingRequestIdHeader"
    verification_type: "unit_test"
    applicable: true
    notes: "Unit test invokes the filter with a mock chain and asserts MDC.get(trace_id) inside the chain equals the inbound header, and is null after the chain returns. A second test asserts a UUID is minted when the header is absent."
  - id: "PRACTICES-OBS-003"
    chapter: "Observability / No PII in Logs"
    requirement: "Log statements that may receive user-controllable input must redact PII (email, phone, SSN, and similar) at the boundary. Per OWASP Logging Cheat Sheet — application logs are routinely shipped to SIEMs, indexed, and retained; raw PII in logs is a compliance and breach-radius hazard."
    test_method: "practices_OBS_003_redactsEmailAddresses"
    verification_type: "unit_test"
    applicable: true
    notes: "Unit tests run a PiiRedactor over inputs containing email / phone / SSN and assert the originals are gone, the redacted markers are present, and clean strings pass through unchanged."
  - id: "PRACTICES-CORE-001"
    chapter: "Core / Dependency Injection"
    requirement: "Beans must use constructor injection with `final` fields. Field injection (`@Autowired` on a non-final field) is forbidden — it hides circular dependencies until runtime, blocks immutability, and forces reflection for non-Spring tests."
    test_method: "practices_CORE_001_constructorInjectedDependencyIsFinal"
    verification_type: "unit_test"
    applicable: true
    notes: "Reflection-based test asserts the correct fixture exposes a `final` field with a single-arg constructor whose parameter type matches; the anti-pattern fixture shows a non-final field."
  - id: "PRACTICES-CORE-002"
    chapter: "Core / AOP Proxy"
    requirement: "Beans whose methods carry AOP advice (e.g. `@Transactional`) must not be `final`, nor have `final` public methods. Spring's CGLIB proxy cannot subclass a final type, silently dropping the advice."
    test_method: "practices_CORE_002_nonFinalServiceIsCglibProxied"
    verification_type: "integration_test"
    applicable: true
    notes: "SpringBoot integration test wires the bean and asserts `AopUtils.isAopProxy(...)` is true and the class / public methods are not final."
  - id: "PRACTICES-ERR-001"
    chapter: "Error Handling / Controller Advice"
    requirement: "Domain exceptions must be translated to HTTP status by a centralised @ControllerAdvice / @RestControllerAdvice, not by per-controller try/catch. The advice provides a single, audited mapping for the application's exception taxonomy."
    test_method: "practices_ERR_001_controllerAdviceMapsIllegalArgumentTo400"
    verification_type: "integration_test"
    applicable: true
    notes: "Integration test calls two demo endpoints throwing IllegalArgumentException / NoSuchElementException and asserts the advice maps them to 400 / 404."
  - id: "PRACTICES-ERR-002"
    chapter: "Error Handling / RFC 7807 Problem Details"
    requirement: "Error responses must carry the RFC 7807 problem detail shape (type, title, status, detail) with `application/problem+json` content type. This is the IETF-standardised envelope for HTTP error bodies."
    test_method: "practices_ERR_002_responseHasAllRfc7807Fields"
    verification_type: "integration_test"
    applicable: true
    notes: "Integration test asserts the content-type header and JSON keys exactly match RFC 7807 §3.1. Spring's ProblemDetail emits them by default; the advice must not strip them."
  - id: "PRACTICES-ERR-003"
    chapter: "Error Handling / No Stack-Trace Leak"
    requirement: "Error response bodies must not contain stack-trace markers, exception class FQNs, or internal frame strings. Such leaks reveal implementation surface and have been a recurring source of security misconfiguration findings."
    test_method: "practices_ERR_003_responseBodyDoesNotContainStacktraceMarkers"
    verification_type: "integration_test"
    applicable: true
    notes: "Integration test asserts forbidden substrings ('java.lang.', 'Exception', tab-at marker, 'Caused by:', 'StackTrace') do not appear in any of the demo error responses."
  - id: "PRACTICES-CORE-003"
    chapter: "Core / Singleton State"
    requirement: "Singleton-scoped beans must not carry unsynchronized mutable instance state. Use atomic primitives, concurrent collections, or `@Scope(\"prototype\")` instead. The default singleton scope plus a plain `int` is a race-condition trap."
    test_method: "practices_CORE_003_atomicSingletonStateIsThreadSafe"
    verification_type: "integration_test"
    applicable: true
    notes: "Concurrent test runs 32 × 1000 increments; the atomic-backed bean is exact, the unsynchronized counterpart is bounded above by the expected total (lost updates expected on real hardware)."
  - id: "PRACTICES-INTEG-001"
    chapter: "Integration / Webhook Security"
    requirement: "Webhook receiver endpoints must verify the HMAC-SHA256 signature of every inbound request before processing the event. Missing or invalid signatures must be rejected with 401 Unauthorized. Verification must use constant-time comparison to prevent timing attacks."
    test_method: "practices_INTEG_001_webhookReceiverVerifiesHmacSignature"
    verification_type: "unit_test"
    applicable: true
    notes: "Fixture-based unit test asserts: pass fixture contains MessageDigest.isEqual; fail fixture without signature check is detected via AST pattern (controller @PostMapping without HMAC call). See failing_fixture_path / passing_fixture_path in rule."
  - id: "PRACTICES-INTEG-002"
    chapter: "Integration / Chunked Import"
    requirement: "CSV and Excel import operations that may receive more than 1000 rows must process data in chunks (batch size ≤ 1000 rows per transaction). Loading all rows into heap before persisting causes OutOfMemoryError at production scale and prevents partial-progress recovery."
    test_method: "practices_INTEG_002_csvImportUsesChunkedProcessing"
    verification_type: "unit_test"
    applicable: true
    notes: "Fixture-based unit test asserts: pass fixture declares CHUNK_SIZE constant and @Transactional on persistChunk; fail fixture using readAll() without chunking is detected. CsvImportChunkedIT (10k rows, no OOM) is the integration anchor."

  - id: "PRACTICES-ARCH-001"
    chapter: "Architecture / Recipe Composition"
    requirement: "When a business domain implements a pattern covered by a Business Pattern Recipe (saas-subscription, e-commerce, crm), the cross-L4 wiring MUST follow the Recipe's composition contract. Ad-hoc cross-importing L4 domain classes without an applied_recipe: declaration is prohibited. Rule body: practices/rules/prefer-recipe-composition-over-l4-cross-import.md."
    test_method: "practices_ARCH_001_recipeCompositionOverAdHocCrossImport"
    verification_type: "review"
    applicable: true
    notes: "Detected statically: if a Spring service in L4 domain A imports from L4 domain B AND C (multi-domain composition) without applied_recipe: in the domain README, ArchUnit flags the dependency pattern. Failing fixture in practices/evals/fixtures/prefer-recipe-composition-over-l4-cross-import/."

  - id: "PRACTICES-ARCH-002"
    chapter: "Architecture / Recipe Metadata"
    requirement: "Every L4 domain README that participates in a Business Pattern Recipe composition must declare applied_recipe: <pattern-name> in its frontmatter. Missing declaration breaks the recipe audit trail and prevents recipe_governance_guard.sh from verifying composition correctness. Rule body: practices/rules/business-domain-must-declare-applied-recipe.md."
    test_method: "practices_ARCH_002_l4DomainDeclaresAppliedRecipe"
    verification_type: "review"
    applicable: true
    notes: "Guard script scans templates/L4/*/README.md for applied_recipe: field when the domain is listed in any recipes/*/RECIPE.md enabled_l4_domains. Failing fixture in practices/evals/fixtures/business-domain-must-declare-applied-recipe/."

  - id: "PRACTICES-ARCH-003"
    chapter: "Architecture / Recipe Invariants"
    requirement: "Every business_invariants entry in a recipe spec YAML must carry either spec_ref: or rule_ref: pointing to an existing artifact (a specs/*.yaml file or a practices/rules/*.md file). Unresolvable references make invariants unenforceable and break the recipe's evidence chain. Rule body: practices/rules/recipe-invariants-must-resolve.md."
    test_method: "practices_ARCH_003_recipeInvariantsResolveToExistingArtifacts"
    verification_type: "review"
    applicable: true
    notes: "recipe_spec_referential_integrity_guard.sh (SP35) and recipe_governance_guard.sh (SP37) both walk business_invariants and resolve each spec_ref/rule_ref. Failing fixture in practices/evals/fixtures/recipe-invariants-must-resolve/."

  - id: "PRACTICES-ACTUATOR-001"
    chapter: "Observability / Actuator"
    requirement: "Expose /actuator/health/liveness and /actuator/health/readiness as separate Kubernetes probe endpoints. A single /health endpoint cannot distinguish a wedged pod from one still booting; the two probe shapes must be wired distinctly so the orchestrator can react correctly (restart-on-liveness-fail, hold-traffic-on-readiness-fail). Rule body: practices/rules/actuator-kubernetes-probes.md."
    test_method: "practices_ACTUATOR_001_livenessReadinessProbesExposed"
    verification_type: "review"
    applicable: true
    notes: "Review against application.yml: management.endpoint.health.probes.enabled=true + management.endpoint.health.group.liveness/readiness explicitly defined. Anchored to Spring Boot Reference §Actuator — Kubernetes Probes."

  - id: "PRACTICES-ACTUATOR-002"
    chapter: "Observability / Actuator"
    requirement: "management.endpoints.web.exposure.include MUST be an explicit allow-list, never '*' or any wildcard. Wildcard exposure ships env / beans / heapdump endpoints to production where they leak secrets, config drift, and JVM internals. Rule body: practices/rules/actuator-restrict-exposure.md."
    test_method: "practices_ACTUATOR_002_actuatorExposureIsExplicitAllowlist"
    verification_type: "review"
    applicable: true
    notes: "Review application.yml: management.endpoints.web.exposure.include is a comma-separated allow-list (typically 'health,info,prometheus'). Anchored to Spring Boot Reference §Actuator — Endpoint Exposure."

  - id: "PRACTICES-ACTUATOR-003"
    chapter: "Observability / Actuator"
    requirement: "Enable Spring Boot buildInfo() in the Gradle plugin block and surface the resulting properties via /actuator/info. Operators need a machine-readable answer to 'what version is running' for incident triage and rollback automation. Rule body: practices/rules/actuator-build-info.md."
    test_method: "practices_ACTUATOR_003_actuatorInfoSurfacesBuildInfo"
    verification_type: "review"
    applicable: true
    notes: "Review build.gradle.kts: springBoot { buildInfo() } block present. Verify GET /actuator/info returns build.version + build.time. Anchored to Spring Boot Reference §Info Endpoint."

  - id: "PRACTICES-API-001"
    chapter: "API / Pagination"
    requirement: "List endpoints MUST accept a Pageable parameter and clamp the page size at a documented ceiling (default 100). Unbounded list endpoints are a recurring latency + memory hazard at scale and a denial-of-service vector via large page-size requests. Rule body: practices/rules/api-pagination-pageable.md."
    test_method: "practices_API_001_listEndpointsClampPageable"
    verification_type: "integration_test"
    applicable: true
    notes: "Integration test asserts: (a) Pageable param accepted on list endpoints, (b) size > 100 is clamped to 100, (c) response carries Page metadata (totalElements / totalPages). Anchored to Spring Data — Pageable + R60 email-outbox F3 closure (Page metadata at controller boundary)."

  - id: "PRACTICES-API-002"
    chapter: "API / Response Boundaries"
    requirement: "Controllers MUST return DTO records, never JPA entity classes directly. Returning entities leaks association graphs, surfaces lazy fields at unpredictable times, and breaks the API contract on every entity edit (a column rename ripples to every client). Rule body: practices/rules/api-no-entity-leak.md."
    test_method: "practices_API_002_controllersReturnDtoNotEntity"
    verification_type: "review"
    applicable: true
    notes: "Review every @RestController method return type. No @Entity class appears as a return type or as a generic parameter (List<Entity>, ResponseEntity<Entity>, Page<Entity>). DTO records must be a separate package or inner class. Anchored to Spring MVC Reference + OWASP API3:2023 — Broken Object Property Level Authorization."

  - id: "PRACTICES-API-003"
    chapter: "API / Versioning"
    requirement: "Every public API URI MUST include a /v{N}/ segment (e.g., /api/v1/users). URI versioning is cache-friendly, proxy-friendly, and the most-deployed evolution strategy; header versioning and query-param versioning have well-known caching and tooling drawbacks. Rule body: practices/rules/api-versioning-uri-prefix.md."
    test_method: "practices_API_003_publicApiUriHasVersionPrefix"
    verification_type: "review"
    applicable: true
    notes: "Review @RequestMapping / @GetMapping / @PostMapping path values. Every public path matches ^/api/v[0-9]+/. Internal /actuator/** and /api/admin/** may be exempt with documented rationale. Anchored to Microsoft API Guidelines + Stripe API design literature."

  - id: "PRACTICES-ASYNC-001"
    chapter: "Async / Concurrency"
    requirement: "On JDK 21+, blocking-IO workloads (HTTP client calls, DB calls, file IO) MUST be scheduled on a virtual-thread-per-task executor (Executors.newVirtualThreadPerTaskExecutor()), not a fixed-size platform-thread pool. Virtual threads remove the headcount-limited platform-thread bottleneck. Rule body: practices/rules/async-virtual-thread-executor.md."
    test_method: "practices_ASYNC_001_blockingIoUsesVirtualThreadExecutor"
    verification_type: "review"
    applicable: true
    notes: "Review @Configuration classes wiring TaskExecutor / @Bean Executor / WebClient.Builder.clientConnector for virtual-thread executor usage. Anchored to JEP 444 — Virtual Threads + Spring 6.1 Reference §Virtual Threads."

  - id: "PRACTICES-ASYNC-002"
    chapter: "Async / Concurrency"
    requirement: "@Async methods MUST return CompletableFuture<T> (or void only when the caller has NO need to observe completion / failure). void @Async swallows exceptions inside the executor and removes the caller's ability to compose, await, or surface failure. Rule body: practices/rules/async-completablefuture-return-type.md."
    test_method: "practices_ASYNC_002_asyncMethodsReturnCompletableFuture"
    verification_type: "review"
    applicable: true
    notes: "Review every method annotated @Async. Return type is CompletableFuture<T> for any caller-observable result; void only for fire-and-forget with explicit comment justifying the choice. Anchored to Spring Framework Reference §Asynchronous Execution — Exception Management."

  - id: "PRACTICES-ASYNC-003"
    chapter: "Async / Scheduling"
    requirement: "Use @Scheduled(fixedDelay=...) for any task whose execution time is variable or proportional to workload. Reserve @Scheduled(fixedRate=...) for instant heartbeat tasks (publish-only, no I/O). fixedRate on slow tasks piles invocations and exhausts the scheduler pool. Rule body: practices/rules/async-scheduled-fixed-delay-vs-fixed-rate.md."
    test_method: "practices_ASYNC_003_scheduledUsesFixedDelayForVariableTasks"
    verification_type: "review"
    applicable: true
    notes: "Review @Scheduled annotations: tasks that include any DB / HTTP / file I/O use fixedDelay; only pure-CPU instant publishers use fixedRate, with comment rationale. Anchored to Spring Framework Reference §Scheduling — fixedDelay vs fixedRate."

  - id: "PRACTICES-BUILD-001"
    chapter: "Build / Dependency Management"
    requirement: "Apply the Spring Boot dependency-management plugin (io.spring.dependency-management) in build.gradle.kts to pin every starter / framework / driver version to the Spring Boot BOM. Hand-picked starter versions drift and produce class-version mismatches at runtime. Rule body: practices/rules/build-spring-boot-bom.md."
    test_method: "practices_BUILD_001_springBootDependencyManagementPluginApplied"
    verification_type: "review"
    applicable: true
    notes: "Review build.gradle.kts plugins block: id 'io.spring.dependency-management' version <version> present. No starter or core Spring dependency carries an explicit version() in the dependencies block. Anchored to Spring Boot Reference §Dependency Management."

  - id: "PRACTICES-BUILD-002"
    chapter: "Build / Dependency Management"
    requirement: "Production builds MUST NOT depend on -SNAPSHOT artifacts. SNAPSHOT versions mutate between resolutions; reproducibility, bisectability, and rollback all break. Local dev SNAPSHOT use is acceptable in a separate Gradle property toggle. Rule body: practices/rules/build-no-snapshot-dependencies.md."
    test_method: "practices_BUILD_002_noSnapshotDependenciesInProduction"
    verification_type: "review"
    applicable: true
    notes: "Review build.gradle.kts + every Gradle catalog: no version literal ending in '-SNAPSHOT' is in the production resolution path. CI gate (gradle dependencies) confirms. Anchored to Gradle Userguide §Maven Versions + reproducible-builds.org."

  - id: "PRACTICES-BUILD-003"
    chapter: "Build / Toolchain"
    requirement: "Declare an explicit Java toolchain (java { toolchain { languageVersion = JavaLanguageVersion.of(N) } }) in build.gradle.kts. Without it the build silently follows the developer's $PATH and produces class-file-version skew between CI and local. Rule body: practices/rules/build-java-toolchain-explicit.md."
    test_method: "practices_BUILD_003_javaToolchainExplicitlyDeclared"
    verification_type: "review"
    applicable: true
    notes: "Review build.gradle.kts java block: toolchain { languageVersion = JavaLanguageVersion.of(21) } (or current target). Anchored to Gradle Userguide §Toolchains for JVM Projects."

  - id: "PRACTICES-CACHE-001"
    chapter: "Caching"
    requirement: "@Cacheable annotations MUST declare value (cache name), key (SpEL key expression), and sync=true explicitly. Defaulted key on multi-arg methods is unstable (parameter-order-dependent hashing); without sync=true a cold key suffers N-way stampede on bursts. Rule body: practices/rules/cache-explicit-name-key-sync.md."
    test_method: "practices_CACHE_001_cacheableDeclaresValueKeySync"
    verification_type: "review"
    applicable: true
    notes: "Review every @Cacheable annotation: value, key, sync attributes all present. Stampede regression test exercises N-concurrent calls on a cold key. Anchored to Spring Framework Reference §Cache Abstraction."

  - id: "PRACTICES-CACHE-002"
    chapter: "Caching"
    requirement: "Caffeine cache configuration MUST declare explicit expireAfterWrite (or expireAfterAccess) and maximumSize. Without expireAfterWrite, sparse caches keep entries forever — stale data leaks across deploys and secret rotations; without maximumSize, memory pressure builds unbounded. Rule body: practices/rules/cache-caffeine-expiration.md."
    test_method: "practices_CACHE_002_caffeineHasExpirationAndMaxSize"
    verification_type: "review"
    applicable: true
    notes: "Review CaffeineCacheManager configuration or CacheBuilder usage: .expireAfterWrite(Duration) + .maximumSize(N) both explicit. Anchored to Caffeine Wiki §Eviction + Spring Boot Reference §Caffeine Cache."

  - id: "PRACTICES-CACHE-003"
    chapter: "Caching"
    requirement: "@Cacheable / @CachePut / @CacheEvict annotations are FORBIDDEN on @RestController classes and their methods. Controller-layer caching captures request-derived state (Authentication principal, locale, request headers) into the cache key implicitly, causing cross-user response leakage. Move caching to the @Service layer below. Rule body: practices/rules/cache-not-on-controllers.md."
    test_method: "practices_CACHE_003_cachingNotAnnotatedOnControllers"
    verification_type: "review"
    applicable: true
    notes: "Review every @RestController class: no @Cacheable, @CachePut, @CacheEvict on the class or any of its methods. Anchored to OWASP API1:2023 BOLA + Spring Framework Reference §Cache Abstraction — Best Practices."

  - id: "PRACTICES-DOGFOOD-LEDGER-001"
    chapter: "Architecture / Dogfood Ledger Discipline"
    requirement: "Every docs/dogfood-ledger/*.yaml entry whose classification is scope_deferral MUST contain an explicit expiry-trigger marker in its finding text (one of: 'expiry trigger:', 're-opens when/before', 'reopens when/before', 'defer until', 'deferred until', 'expires on', 'sunsets on', 'before the fork-receiver', 'before the first', 'before the cap'). A deferral without a recorded re-open condition becomes inadvertent permanent debt that the catalog cannot self-audit. Rule body: practices/rules/dogfood-finding-must-have-expiry-trigger.md."
    test_method: "practices_DOGFOOD_LEDGER_001_scopeDeferralHasExpiryTrigger"
    verification_type: "review"
    applicable: true
    notes: "dogfood_finding_expiry_trigger_guard.sh (R85b, 45th hard guard) parses every ledger yaml under docs/dogfood-ledger/, iterates findings with classification=scope_deferral, and checks the finding text for any approved marker phrase. real_bug and methodology_gap entries are exempt (closed-in-wave vs methodology-change paths). Anchored to Martin Fowler TechnicalDebtQuadrant (deliberate-prudent debt requires payoff reasoning) + NIST SP 800-53 RA-7 (risk-response acceptance requires recorded justification anchored to organizational risk tolerance)."

  - id: "PRACTICES-DOGFOOD-LEDGER-002"
    chapter: "Architecture / Dogfood Ledger Discipline"
    requirement: "Every docs/dogfood-ledger/*.yaml entry whose classification is real_bug MUST carry a closure_commit_sha field whose value is a valid git commit hash (7 to 40 hex chars) resolvable in the local repository. The closure commit is the SHA of the commit that introduced the fix referenced in the finding's 'Closure:' prose. Without the field a future maintainer reading the ledger cannot mechanically verify which git revision actually closed the finding. Rule body: practices/rules/dogfood-finding-real-bug-must-reference-closure-commit.md."
    test_method: "practices_DOGFOOD_LEDGER_002_realBugReferencesClosureCommit"
    verification_type: "review"
    applicable: true
    notes: "dogfood_finding_real_bug_closure_commit_guard.sh (R86b, 46th hard guard) parses every ledger yaml under docs/dogfood-ledger/, iterates findings with classification=real_bug, requires closure_commit_sha to be present, matching ^[0-9a-f]{7,40}$, and resolvable via `git cat-file -e <sha>^{commit}`. scope_deferral and methodology_gap entries are exempt. Anchored to Linux Kernel SubmittingPatches Fixes: trailer convention + GitHub's closing keywords for PR-issue linking."
