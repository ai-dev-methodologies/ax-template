    backend_spec_ref: PAYMENT-AUTHZ-001
    static_source_ref: []
    test_method: "payment/composition.spec.ts"
    verification_type: e2e_test
    policy_ref: "blueprints/payment-ui-manifest.yaml#a11y"
    coverage_threshold: 1.0
    backend_only_marker: false

