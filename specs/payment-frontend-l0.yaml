# specs/payment-frontend-l0.yaml
# Page Compliance Spec — payment domain, full_trio mode.
#
# Every item's backend_operation_id resolves to contracts/payment-openapi.yaml.
# Every item's backend_spec_ref resolves to an id in specs/payment-l0.yaml.
# static_source_ref is [] for all items (full_trio: FORBIDDEN to be non-empty).

domain: payment
domain_mode: full_trio
backend_spec_ref: specs/payment-l0.yaml
frontend_required: true

items:
