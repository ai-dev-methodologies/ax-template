version: "0.1.0"
scope: "problem-details-l0 — RFC 9457 application/problem+json error response contract for fork-receivers building any HTTP API surface. Cross-cutting catalog pattern, jurisdiction-agnostic + framework-agnostic."
stack: "Spring Boot 3.2.x + Spring MVC ProblemDetail / ResponseEntityExceptionHandler + Jackson + Micrometer metrics"
standard: "RFC 9457 (Problem Details for HTTP APIs) + RFC 7807 (obsoleted predecessor, retained for legacy interop) + IANA HTTP Problem Type registry + RFC 5646 / BCP 47 (language tags) + W3C Trace Context + RFC 9110 (HTTP Semantics, content negotiation)"
domain_mode: full_trio
introduced_at: "R105 phase α — generic cross-cutting catalog (R102+ generic principle, memory feedback_prefer_generic_catalog). P11 standards lens + P9 distributed-system lens active. R105 P12 NEW finding TBD."

# OPT-IN baseline error-format contract. Any fork-receiver exposing HTTP
# endpoints adopts to make error responses machine-readable + uniform.
# Composition note: every existing L4 emitting 4xx/5xx (auth / payment /
# pagination-l0 / idempotency-l0 already reference RFC 9457) SHOULD route
# its error bodies through this contract; this spec canonicalizes the shape
# those recipes already cite in passing.

# ── Priority order for fork-receivers (R105 iter1 F2 closure — P4 박지영 lens) ──
# Adopt in order; earlier items are foundational.
#   1. PROBLEM-FORMAT-001
#   2. PROBLEM-TYPE-001
#   3. PROBLEM-EXTENSION-001
#   4. PROBLEM-VALIDATION-001
#   5. PROBLEM-TRACE-001
#   6. PROBLEM-I18N-001
#   7. PROBLEM-OBSERVABILITY-001

# ── RECIPE.md frontmatter example (R105 iter1 F3 closure — P5 이상호 lens) ──
#   ---
#   recipe: generic-problem-details
#   problem_details_enabled: true
#   problem_type_base_uri: "https://errors.example/"
#   problem_i18n_enabled: true
#   problem_validation_array: true
#   problem_trace_correlation: true
#   ---

# ── F8 standards pin (R105 iter1 F8 closure — P11 황태완 lens) ──
# Default pinned: application/problem+json + type URI base (RFC 9457 §3). 11-wave standards-pin streak (R93~R105).

items:
  - id: "PROBLEM-FORMAT-001"
    chapter: "problem+json structure"
    requirement: "Error responses (4xx/5xx) MUST use Content-Type `application/problem+json` and a JSON object carrying the five RFC 9457 members: `type` (URI reference, default \"about:blank\"), `title` (short human-readable summary), `status` (HTTP status code int, MUST equal response status line), `detail` (this-occurrence explanation), `instance` (URI reference identifying this occurrence). Absent `type` defaults to \"about:blank\" with `title` matching the status phrase. A 4xx/5xx body using bare `application/json` or a non-conforming envelope → contract violation."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Implementation: Spring MVC ProblemDetail via @ControllerAdvice
      extending ResponseEntityExceptionHandler. Anchored to RFC 9457
      (https://www.rfc-editor.org/rfc/rfc9457.html#section-3.1).
      Quote anchor (RFC 9457 §3.1.1 + §3.1.2): "The 'type' member is a JSON
      string containing a URI reference [URI] that identifies the problem
      type." / "The 'status' member is a JSON number indicating the HTTP
      status code ([HTTP], Section 15) generated by the origin server for
      this occurrence of the problem."
  - id: "PROBLEM-TYPE-001"
    chapter: "type URI registry"
    requirement: "Each distinct problem class MUST own a stable, dereferenceable `type` URI (e.g., `https://errors.example.com/insufficient-funds`) that resolves to human-readable documentation of the condition. The `type` URI is the primary machine-identifier — clients MUST NOT branch on `title` or `detail` wording. `type` URIs MUST be versioned/stable across releases; a registry document MUST enumerate every type the API can emit. Reusing one generic type for distinct conditions, or returning a non-resolvable type URI → violation."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Maintain a project type registry mirroring the IANA HTTP Problem
      Type registry (https://www.iana.org/assignments/http-problem-types/).
      Anchored to RFC 9457 §3.1.1.
      Quote anchor (RFC 9457 §3.1.1): "If the type URI is a locator (e.g.,
      those with an 'http' or 'https' scheme), dereferencing it SHOULD
      provide human-readable documentation for the problem type (e.g.,
      using HTML)."
  - id: "PROBLEM-EXTENSION-001"
    chapter: "extension members"
    requirement: "Domain-specific context MUST be conveyed via top-level extension members alongside the five standard members (NOT nested under a wrapper, NOT overloaded into `detail` prose). Extension member names MUST be stable and documented per `type`. Consumers MUST ignore unknown extension members (forward-compat). Example: a balance problem adds `balance` and `accounts` members. Stuffing structured context into the free-text `detail` string instead of named extension members → violation."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Extension members are siblings of type/title/status/detail/instance
      in the JSON object. Anchored to RFC 9457 §3.2.
      Quote anchor (RFC 9457 §3.2): "Problem type definitions MAY extend
      the problem details object with additional members that are specific
      to that problem type."
  - id: "PROBLEM-VALIDATION-001"
    chapter: "validation errors array"
    requirement: "Field-level validation failures MUST be exposed as a structured extension member `errors` — an array of objects each carrying at minimum `detail` (human-readable) and a `pointer` (RFC 6901 JSON Pointer, e.g. `/email`) or `name` (form/query parameter) locating the offending input. A 400 validation response MUST return ALL field errors in one array (not fail-fast on the first). Returning a single concatenated string or omitting the field locator → violation."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Aligns with the RFC 9457 example modeling multiple validation
      problems via an extension array. Anchored to RFC 9457 §3 example +
      RFC 6901 (https://www.rfc-editor.org/rfc/rfc6901.html).
      Quote anchor (RFC 6901 §4): "The reference token then modifies which
      value is referenced according to the following scheme". Abstract:
      "JSON Pointer defines a string syntax for identifying a specific
      value within a JavaScript Object Notation (JSON) document."
  - id: "PROBLEM-TRACE-001"
    chapter: "trace correlation"
    requirement: "Every problem detail MUST carry a correlation identifier so a client report maps to server logs: a `trace_id` extension member populated from the W3C Trace Context `traceparent` trace-id (or a server-generated request id when no trace context is present). The same id MUST also appear in structured logs and SHOULD be echoed as a response header (`Trace-Id`). The `trace_id` MUST NOT leak internal stack traces, SQL, or secrets into `detail`. A 5xx with no correlation id, or a `detail` containing a raw exception/stack trace → violation."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Populate from Micrometer Tracing / W3C traceparent header.
      Anchored to W3C Trace Context (https://www.w3.org/TR/trace-context/).
      Quote anchor (W3C Trace Context §3.2.2.3 trace-id): "This is the ID
      of the whole trace forest and is used to uniquely identify a
      distributed trace through a system."
  - id: "PROBLEM-I18N-001"
    chapter: "localized detail"
    requirement: "The human-readable `detail` (and optionally `title`) MAY be localized via `Accept-Language` content negotiation (RFC 9110); the chosen language MUST be advertised in the `Content-Language` response header. The `type` URI MUST stay byte-identical across languages (it is the stable machine key), and `title` SHOULD remain a stable per-type label even when `detail` is localized — clients keying off `type` MUST be unaffected by language. Localizing or mutating the `type` URI per locale → violation."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Resolve via Spring MessageSource keyed by problem type; language
      tags per BCP 47 / RFC 5646
      (https://www.rfc-editor.org/rfc/rfc5646.html). A Korean variant
      (한국어 detail) is one supported locale among others, never the
      default. Anchored to RFC 9457 §3.1.3.
      Quote anchor (RFC 9457 §3.1.3): "It SHOULD NOT change from occurrence
      to occurrence of the problem, except for localization (e.g., using
      proactive content negotiation; see [HTTP], Section 12.1)."
  - id: "PROBLEM-OBSERVABILITY-001"
    chapter: "관측 (3 canonical metrics)"
    requirement: "Problem-detail emission MUST expose exactly 3 canonical Micrometer metrics with bounded-cardinality labels: (1) `problem_response_total{problem_type}` — counter keyed by the registered short type slug (NOT the full URI, NOT free-text title); (2) `problem_response_total{status_class}` — same counter sliced by status class ∈ {4xx, 5xx}; (3) `problem_response_seconds{status_class}` — handler timing histogram. Labels MUST draw only from the closed type registry + fixed status classes; `trace_id`, `instance`, `pointer`, user id, and any PII/high-cardinality value are EXCLUDED. SLO/alert wiring is a fork-receiver concern."
    test_method: "Micrometer registry assertion"
    verification_type: "positive"
    applicable: true
    notes: >
      Bounded cardinality = registered type slugs (closed set) × {4xx,5xx}.
      Anchored to OpenTelemetry Semantic Conventions for HTTP metrics
      (https://opentelemetry.io/docs/specs/semconv/http/http-metrics/).
      Quote anchor (OTel HTTP metrics, http.server.request.duration note):
      "The `error.type` value SHOULD be predictable and SHOULD have low
      cardinality."
