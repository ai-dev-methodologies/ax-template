version: "0.1.0"
scope: "consent-management-l0 — explicit opt-in capture + withdrawal + audit record + purpose-scoped consent + cookie category gating + policy-version re-consent for fork-receivers handling personal data. Cross-cutting catalog pattern, jurisdiction-agnostic + framework-agnostic."
stack: "Spring Boot 3.2.x + JPA (consent record persistence) + Bucket cookie category mapping + Micrometer metrics"
standard: "GDPR Art 7 (conditions for consent) + GDPR Recital 32 (unambiguous affirmative action) + ePrivacy Directive 2002/58/EC Art 5(3) (cookie consent) + IAB Europe TCF v2.2 (de facto consent-string framework) + ISO/IEC 29184:2020 (online privacy notices and consent)"
domain_mode: full_trio
introduced_at: "R110 phase α — generic cross-cutting catalog (R102+ generic principle, memory feedback_prefer_generic_catalog). P11 standards lens + P9 distributed-system lens active. R110 P12 NEW finding TBD."

# OPT-IN consent layer. Any fork-receiver collecting personal data (auth
# signup, marketing email, analytics cookies) MAY adopt to make consent
# explicit + revocable + auditable. Generic GDPR/ePrivacy pattern; not a
# Korean-specific spec (PIPA variant noted only as a one-line aside).
#
# Composition note: cross-references audit-log-l0 (CONSENT-RECORD reuses
# append-only audit posture) + email-outbox-l0 (marketing send gated on
# CONSENT-PURPOSE marketing grant) + session-management-l0 (cookie set
# gated on CONSENT-COOKIE functional grant). Identity-verification-l0
# (backend_only) MAY inherit capture-at-onboarding flow.

# ── Priority order for fork-receivers (R110 iter1 F2 closure — P4 박지영 lens) ──
# Adopt in order; earlier items are foundational.
#   1. CONSENT-CAPTURE-001
#   2. CONSENT-WITHDRAW-001
#   3. CONSENT-RECORD-001
#   4. CONSENT-PURPOSE-001
#   5. CONSENT-COOKIE-001
#   6. CONSENT-VERSIONING-001
#   7. CONSENT-OBSERVABILITY-001

# ── RECIPE.md frontmatter example (R110 iter1 F3 closure — P5 이상호 lens) ──
#   ---
#   recipe: generic-consent-management
#   consent_management_enabled: true
#   consent_cookie_categories: [necessary, functional, analytics, marketing]
#   consent_re_consent_on_version_change: true
#   consent_withdraw_one_step: true
#   consent_record_retention_years: 5
#   ---

# ── F8 standards pin (R110 iter1 F8 closure — P11 황태완 lens) ──
# Default pinned: explicit opt-in + one-step withdrawal + audit record (GDPR Art 7). 11-wave standards-pin streak (R93~R110).

items:
  - id: "CONSENT-CAPTURE-001"
    chapter: "명시적 동의 수집 (explicit opt-in)"
    requirement: "Consent MUST be captured by an explicit affirmative action — POST /api/consent with body `{purpose, granted: true, policy_version}`. Default state for every purpose is `granted: false` (no consent). Server MUST reject any capture attempt where `granted` is absent / null / defaulted-true-without-action → 400 CONSENT_NOT_AFFIRMATIVE. Pre-ticked boxes, opt-out flows, and silence/inactivity are NOT valid consent and MUST be rejected at the contract level (no implicit `granted: true`)."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Default-deny per purpose; only an explicit client action flips a
      grant. Anchored to GDPR Recital 32
      (https://gdpr-info.eu/recitals/no-32/).
      Quote anchor (GDPR Recital 32): "Consent should be given by a clear
      affirmative act establishing a freely given, specific, informed and
      unambiguous indication of the data subject's agreement ... Silence,
      pre-ticked boxes or inactivity should not therefore constitute
      consent."
  - id: "CONSENT-WITHDRAW-001"
    chapter: "동의 철회 (withdrawal)"
    requirement: "Withdrawal MUST be as easy as granting — DELETE /api/consent/{purpose} (or POST with `granted: false`) MUST require no more steps than the original grant (no confirmation chains, no support ticket). Withdrawal takes effect immediately: subsequent purpose-gated operations (e.g., marketing send) MUST observe the revoked state on the very next request. Server returns 200 with the new consent state; withdrawing an already-absent consent is idempotent (200, no error). Prior processing based on consent before withdrawal remains lawful and is NOT retroactively invalidated."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Symmetry test: step-count(withdraw) <= step-count(grant). Anchored
      to GDPR Art 7(3) (https://gdpr-info.eu/art-7-gdpr/).
      Quote anchor (GDPR Art 7(3)): "The data subject shall have the right
      to withdraw his or her consent at any time. The withdrawal of
      consent shall not affect the lawfulness of processing based on
      consent before its withdrawal ... It shall be as easy to withdraw
      as to give consent."
  - id: "CONSENT-RECORD-001"
    chapter: "동의 기록 증빙 (audit proof)"
    requirement: "Every consent state change MUST write an append-only record proving who/what/when/version: `{subject_id, purpose, granted, policy_version, captured_at (UTC), source_ip_masked, user_agent_summary, capture_method}`. Records MUST be immutable (JPA columns `updatable=false`; no public setters; withdrawal appends a new row, never updates). On demonstrate-consent challenge, GET /api/consent/{purpose}/history MUST return the full ordered trail. Absence of a record MUST be treated as no-consent."
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Append-only ledger reuses audit-log-l0 posture. Anchored to
      GDPR Art 7(1) (https://gdpr-info.eu/art-7-gdpr/).
      Quote anchor (GDPR Art 7(1)): "Where processing is based on
      consent, the controller shall be able to demonstrate that the
      data subject has consented to processing of his or her personal
      data."
  - id: "CONSENT-PURPOSE-001"
    chapter: "목적 제한 (purpose limitation)"
    requirement: "Consent MUST be granular per declared purpose — recipe declares `consent_purposes` (e.g., {marketing_email, analytics, personalization, third_party_share}). A single bundled `granted: true` covering multiple purposes is REJECTED → 400 CONSENT_PURPOSE_BUNDLED. Each purpose carries its own grant/withdraw lifecycle and its own record. Purpose-gated operations MUST check the specific purpose grant, never a global consent flag. Unknown purpose → 400 CONSENT_PURPOSE_UNKNOWN."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Per-purpose grants prevent forced bundling. Anchored to GDPR
      Recital 32 (https://gdpr-info.eu/recitals/no-32/).
      Quote anchor (GDPR Recital 32): "Consent should cover all
      processing activities carried out for the same purpose or
      purposes. When the processing has multiple purposes, consent
      should be given for all of them."
  - id: "CONSENT-COOKIE-001"
    chapter: "쿠키 카테고리 (cookie categories)"
    requirement: "Cookies MUST be classified into exactly four categories: {necessary, functional, analytics, marketing}. `necessary` cookies are exempt from consent (set unconditionally). `functional` / `analytics` / `marketing` cookies MUST NOT be set until the matching purpose grant exists — server MUST suppress Set-Cookie for non-necessary categories absent a grant. Capturing analytics/marketing consent before any non-necessary cookie is set is mandatory; setting a non-necessary cookie without a prior grant → contract violation (test asserts no Set-Cookie header)."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Four-bucket model aligns with IAB TCF purpose stacks; PIPA cookie
      variant is the same gating with a different notice text (aside).
      Anchored to ePrivacy Directive 2002/58/EC Art 5(3)
      (https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32002L0058).
      Quote anchor (ePrivacy Directive 2002/58/EC, original 2002 text,
      Art 5(3)): "Member States shall ensure that the use of electronic
      communications networks to store information or to gain access to
      information stored in the terminal equipment of a subscriber or
      user is only allowed on condition that the subscriber or user
      concerned is provided with clear and comprehensive information ...
      and is offered the right to refuse such processing by the data
      controller. This shall not prevent any technical storage or access
      for the sole purpose of carrying out or facilitating the
      transmission of a communication ... or as strictly necessary in
      order to provide an information society service explicitly
      requested by the subscriber or user."
  - id: "CONSENT-VERSIONING-001"
    chapter: "정책 버전 변경 재동의 (re-consent)"
    requirement: "Each consent record pins the `policy_version` it was granted against. When the active privacy-policy version advances beyond a subject's recorded grant version, that grant MUST be treated as STALE — purpose-gated operations MUST behave as no-consent until re-captured. GET /api/consent/{purpose} on a stale grant returns `{granted: true, stale: true, current_policy_version}` so the client can prompt re-consent. A material policy change MUST NOT silently carry forward an old grant; re-consent is an explicit new affirmative action (reuses CONSENT-CAPTURE-001)."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Version pin + stale-on-advance forces fresh affirmative act.
      Anchored to ISO/IEC 29184:2020 (online privacy notices and
      consent, https://www.iso.org/standard/70331.html).
      Reference: ISO/IEC 29184:2020 — change-of-consent-conditions
      provisions (see standard; paywalled, no verbatim quote available
      from a public source).
  - id: "CONSENT-OBSERVABILITY-001"
    chapter: "관측 (3 canonical metrics)"
    requirement: "Consent implementations MUST expose exactly 3 canonical Micrometer metrics with bounded labels: (1) `consent_granted_total{purpose}` — counter incremented on each affirmative grant; (2) `consent_withdrawn_total{purpose}` — counter incremented on each withdrawal; (3) `consent_active_ratio{purpose}` (gauge) — active-grant fraction per purpose. The `purpose` label is the only dimension and MUST come from the closed recipe-declared `consent_purposes` set (bounded cardinality). Labels MUST exclude subject_id / source_ip / user_agent / policy_version (PII + high-cardinality). SLO/alert wiring is a fork-receiver concern."
    test_method: "Micrometer registry assertion"
    verification_type: "positive"
    applicable: true
    notes: >
      Anchored to OpenTelemetry Semantic Conventions (metric
      cardinality guidance, https://opentelemetry.io/docs/specs/semconv/general/metrics/).
      Reference: OpenTelemetry Semantic Conventions, general metrics
      guidelines (see source; no verbatim quote — the cited page does
      not contain a low-cardinality / user-ID statement at this section).
