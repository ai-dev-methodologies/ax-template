version: "1.0.0"
scope: "audit-log-domain"
stack: "Spring Boot 3.2.x + JPA + AOP + Spring Security"
standard: "OWASP ASVS V7 + ISO 27001 A.12.4 + RFC 7807 + GDPR Art.17 (retention)"
items:
  # ─── RECORD family (3 items) ──────────────────────────────────────────────
  - id: "AUDIT-RECORD-001"
    chapter: "RECORD"
    requirement: >
      Every state-changing operation on a protected resource records an audit log entry
      with: actor (userId + IP), action (verb), resource (type + id), timestamp (UTC),
      outcome (SUCCESS|FAILURE), and optional metadata payload.
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: invoke a @Audited method (e.g., POST /api/items) as an authenticated user;
      confirm an AuditLog row is persisted with all required fields.
      Implementation: @AuditLoggingAspect intercepts @Audited-annotated service methods;
      extracts SecurityContext user + HttpServletRequest IP; persists AuditLog entity.
    policy_ref: "blueprints/audit-log-manifest.yaml#audit_policy"

  - id: "AUDIT-RECORD-002"
    chapter: "RECORD"
    requirement: >
      Audit log entries are immutable after creation. No UPDATE or DELETE operations
      are permitted on the audit_logs table from application code.
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Test: attempt to call any service method that would update/delete an AuditLog entity;
      assert that no such public method exists on AuditLogService (or that any attempt throws).
      Implementation: AuditLogRepository exposes only save() and read operations.
      No delete/update methods are defined. @Column(updatable=false) on all fields.
    policy_ref: "blueprints/audit-log-manifest.yaml#retention"

  - id: "AUDIT-RECORD-003"
    chapter: "RECORD"
    requirement: >
      Audit logging failures are non-blocking: if persisting an audit entry fails (e.g.,
      database error), the original operation completes normally and the failure is
      logged at ERROR level. The audit failure does NOT roll back the original transaction.
    test_method: "Unit test (Mockito)"
    verification_type: "negative"
    applicable: true
    notes: >
      Test: mock AuditLogRepository.save() to throw DataAccessException; confirm the
      intercepted business method still returns its result and no exception propagates.
      Implementation: AuditLoggingAspect wraps the persist call in a try-catch;
      uses a separate @Transactional(propagation=REQUIRES_NEW) to isolate the audit write.
    policy_ref: "blueprints/audit-log-manifest.yaml#audit_policy"

  # ─── LIST family (2 items) ────────────────────────────────────────────────
  - id: "AUDIT-LIST-001"
    chapter: "LIST"
    requirement: >
      GET /api/audit-logs returns a paginated list of audit log entries, sorted by
      timestamp descending. Pagination uses cursor-based or page+size parameters.
      Response includes total count for UI display.
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: seed 25 audit entries; call GET /api/audit-logs?size=10&page=0; assert
      response.content.length=10, response.totalElements=25, response.totalPages=3.
      Implementation: AuditLogRepository extends JpaRepository with Pageable support.
    policy_ref: "blueprints/audit-log-manifest.yaml#list_policy"

  - id: "AUDIT-LIST-002"
    chapter: "LIST"
    requirement: >
      GET /api/audit-logs supports filtering by: actorId, resourceType, resourceId,
      action, outcome, and date range (from/to). Multiple filters are combined with AND.
      Each filter is optional.
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: seed entries for two different actors; call GET /api/audit-logs?actorId=user-A;
      assert only user-A entries are returned.
      Test: filter by dateFrom + dateTo; assert only entries within the range are returned.
      Implementation: AuditLogRepository uses JPA Specification (criteria) or a custom
      JPQL query with conditional predicates for each optional filter.
    policy_ref: "blueprints/audit-log-manifest.yaml#list_policy"

  # ─── RETENTION family (3 items) ──────────────────────────────────────────
  - id: "AUDIT-RETENTION-001"
    chapter: "RETENTION"
    requirement: >
      Audit log entries older than the configured retention period are eligible for
      purge by the scheduled retention job. Default retention period is 90 days.
      The retention period is configurable per resource type via application properties.
    test_method: "Unit test (Mockito)"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: configure retention to 1 day; seed one entry with timestamp = now-2days;
      invoke the retention job; assert the entry is deleted.
      Test: seed one entry with timestamp = now-12hours; assert it is NOT deleted.
      Implementation: @Scheduled method on AuditLogService; calls
      AuditLogRepository.deleteByTimestampBefore(cutoff).
    policy_ref: "blueprints/audit-log-manifest.yaml#retention"

  - id: "AUDIT-RETENTION-002"
    chapter: "RETENTION"
    requirement: >
      The audit log system supports three standard retention tiers declared in the
      manifest: SHORT (30 days), STANDARD (90 days), LONG (365 days).
      Retention tier is selected per resource type in application configuration.
    test_method: "Configuration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: load application context with retention.tier=SHORT; assert the purge
      cutoff date is 30 days ago. Same for STANDARD (90d) and LONG (365d).
      Implementation: RetentionTier enum with daysToKeep field; AuditLogProperties
      maps resource types to tiers.
    policy_ref: "blueprints/audit-log-manifest.yaml#retention"

  - id: "AUDIT-RETENTION-003"
    chapter: "RETENTION"
    requirement: >
      The retention purge job runs on a configurable cron schedule (default: daily at 02:00 UTC).
      The job logs the number of records deleted at INFO level, and logs a WARN if the
      deleted count exceeds a configurable threshold (default: 10,000).
    test_method: "Unit test (Mockito)"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: mock repository to return 15,000 as delete count; verify WARN log is emitted.
      Test: mock repository to return 500; verify only INFO log is emitted.
      Implementation: AuditLogRetentionJob checks deleteCount >= warningThreshold.
    policy_ref: "blueprints/audit-log-manifest.yaml#retention"

  # ─── EXPORT family (2 items) ─────────────────────────────────────────────
  - id: "AUDIT-EXPORT-001"
    chapter: "EXPORT"
    requirement: >
      POST /api/audit-logs/export accepts filter criteria and export format (CSV or JSON)
      and returns HTTP 202 Accepted with an export job ID. The export is processed
      asynchronously; the caller polls GET /api/audit-logs/export/{jobId} for status.
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: POST /api/audit-logs/export with format=CSV; assert 202 + exportJobId present.
      Test: GET /api/audit-logs/export/{jobId}; assert status field is one of
      PENDING|PROCESSING|COMPLETED|FAILED.
      Implementation: AuditLogExportService enqueues the job; returns job ID immediately.
    policy_ref: "blueprints/audit-log-manifest.yaml#export"

  - id: "AUDIT-EXPORT-002"
    chapter: "EXPORT"
    requirement: >
      Export requests require ROLE_ADMIN or ROLE_AUDITOR authority.
      Export requests from users without these roles are rejected with HTTP 403.
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Test: call POST /api/audit-logs/export as a ROLE_MEMBER user; assert 403.
      Test: call POST /api/audit-logs/export as a ROLE_AUDITOR user; assert 202.
      Implementation: @PreAuthorize("hasAnyRole('ADMIN','AUDITOR')") on the export endpoint.
    policy_ref: "blueprints/audit-log-manifest.yaml#export"

  # ─── PII family (1 item) ─────────────────────────────────────────────────
  - id: "AUDIT-PII-001"
    chapter: "PII"
    requirement: >
      Fields designated as PII in the manifest (e.g., IP address, email, username) are
      stored in redacted form (masked or hashed) unless the deployment explicitly opts
      in to full PII storage by setting audit.pii.store-full=true.
    test_method: "Unit test (Mockito)"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: with audit.pii.store-full=false (default), record an entry with IP=192.168.1.100;
      assert the stored IP is masked (e.g., "192.168.1.xxx").
      Test: with audit.pii.store-full=true, assert the full IP is stored.
      Implementation: AuditLogPiiRedactor is injected into AuditLoggingAspect;
      conditionally masks PII fields before persisting.
    policy_ref: "blueprints/audit-log-manifest.yaml#pii_redaction"
