version: "0.1.0"
scope: "ownership-transfer-l0 — authority-handoff lifecycle for fork-receivers that attach owned records to a principal (created_by / owner_id / assignee). When a principal leaves a tenant (offboarding, role change, deactivation), every record they own MUST be reassigned to a NAMED successor in one atomic, audited transaction — never orphaned, never silently last-owner-wins. Cross-cutting catalog pattern, jurisdiction-agnostic + framework-agnostic. Generic SaaS / 이커머스 / admin-CRUD applicable."
stack: "Spring Boot 3.2.x + JPA (bulk UPDATE owner_id in a single @Transactional) + audit-log-l0 record semantics + Micrometer metrics"
standard: "NIST SP 800-53 Rev.5 AC-2 (Account Management — disabling/transfer of accounts, alignment of account management with personnel termination/transfer) + OWASP ASVS V4.1 (Access Control — principle of least privilege) + RFC 9457 (Problem Details for HTTP APIs)"
domain_mode: backend_only
introduced_at: "IDW5 2026-06-01 LMS dogfood"

# ownership-transfer is OPT-IN and BACKEND-ONLY. ax-template reference
# workloads do NOT require it (single-owner ASVS L1 baseline assumes the
# owner never departs). Recipes where records are OWNED by a principal
# (course author owns courses, manager owns approval lines, agent owns
# tickets, seller owns listings) MUST adopt these items before they
# support offboarding / deactivation, or a departing principal leaves a
# trail of unreachable rows.
#
# Distinct from data-subject-rights-l0 (DSR): in DSR the leaver is the
# data SUBJECT and the right is access/erase/restrict of THEIR OWN
# personal data. Here the leaver is the record OWNER / AUTHORITY and the
# obligation is to hand their owned records to a successor so the records
# stay reachable and governed. A leaver can be BOTH (erase their personal
# data AND reassign the business records they owned) — the two specs
# compose; they do not overlap.
#
# Composition note (depends on existing catalog domains):
# - TRANSFER-AUDIT-001 reuses audit-log-l0 (R27) record semantics.
# - TRANSFER-ATOMIC-001 layers under any L4 CRUD recipe owning rows
#   (crud-l0 / approval-workflow-l0 / favorites-bookmarks-l0) without
#   changing their resource model — only the bulk-reassign transaction.
# - TRANSFER-OBSERVABILITY-001 follows the same bounded-cardinality
#   metric convention as observability-convention-l0.
# Generic pattern; zero Korean law cite (R102+ generic catalog principle).

# ── Priority order for fork-receivers ──
# Adopt in order; earlier items are foundational.
#   1. TRANSFER-REASSIGN-001
#   2. TRANSFER-AUTHZ-001
#   3. TRANSFER-AUDIT-001
#   4. TRANSFER-ATOMIC-001
#   5. TRANSFER-OBSERVABILITY-001

# ── RECIPE.md frontmatter example ──
#   ---
#   recipe: generic-ownership-transfer
#   ownership_transfer_enabled: true
#   owner_column: owner_id          # the FK every owned entity carries
#   transfer_initiator: admin_or_owner
#   transfer_require_named_successor: true
#   ---

items:
  - id: "TRANSFER-REASSIGN-001"
    chapter: "승계 (Reassign on deprovision — never orphan)"
    requirement: "When a principal is deprovisioned (offboarded / deactivated / role-removed), every row they own (owner_id == departing principal across all owning modules) MUST be reassigned to a NAMED, explicitly-supplied successor principal in a single transaction. Orphaning is forbidden: the server MUST NOT null out owner_id, MUST NOT leave rows pointing at a now-inactive principal, and MUST NOT silently retain the departed owner. A deprovision request that omits a successor → 400 TRANSFER_SUCCESSOR_REQUIRED (the caller MUST name where the records go). After a successful transfer, zero rows MUST remain owned by the departed principal."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Orphaned-on-departure rows become unreachable: no owner can list,
      edit, or govern them, and they evade owner-scoped authorization and
      retention sweeps. Reassign-to-named-successor keeps every record
      reachable and accountable. NIST SP 800-53 AC-2 ties account lifecycle
      directly to personnel transfer. Anchored to NIST SP 800-53 Rev.5 AC-2
      (https://csf.tools/reference/nist-sp-800-53/r5/ac/ac-2/).
      Quote anchor (AC-2 Discussion): "Align account management processes
      with personnel termination and transfer processes."
  - id: "TRANSFER-AUTHZ-001"
    chapter: "권한 (Who may initiate + successor eligibility)"
    verification:
      mechanism: rule
      ref: ownership-transfer-authz-audit-atomic
    requirement: "Only an ADMIN (ROLE_ADMIN) OR the current owner of the records may initiate a transfer of those records. Any other principal → 403. The named successor MUST be an ACTIVE principal in the SAME tenant as the records (cross-tenant handoff is forbidden) and MUST NOT be the departing principal themselves (a transfer to the leaver is a no-op masquerading as a handoff). Successor that is inactive / suspended → 409 TRANSFER_SUCCESSOR_INACTIVE; successor in a different tenant or not found → 404 (IDOR-safe, never confirm a foreign-tenant principal's existence)."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Transfer hands authority over potentially many records at once, so
      the initiator gate (admin OR current owner) and the successor gate
      (active + same tenant) both apply least privilege: nobody widens
      access without specific authorization, and authority never escapes
      the tenant boundary. Anchored to OWASP ASVS V4.1.3
      (https://github.com/OWASP/ASVS/blob/v4.0.3/4.0/en/0x12-V4-Access-Control.md).
      Quote anchor (ASVS V4.1.3): "Verify that the principle of least
      privilege exists - users should only be able to access functions,
      data files, URLs, controllers, services, and other resources, for
      which they possess specific authorization."
  - id: "TRANSFER-AUDIT-001"
    chapter: "감사 (Audit every reassignment)"
    verification:
      mechanism: rule
      ref: ownership-transfer-authz-audit-atomic
    requirement: "Every reassignment MUST write exactly one audit record capturing {from_owner, to_owner, actor (initiator), resource_type, count (rows moved), timestamp}. The actor MUST be the authenticated initiator, never the from_owner by default (an admin-driven offboarding is initiated by the admin, not the leaver). The audit record MUST be written inside the SAME transaction as the reassignment so a committed transfer always has a matching audit entry and a rolled-back transfer leaves none. Audit fields MUST carry principal identifiers (ids), not PII (no raw email / name) — reuse the audit PII helper."
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      A bulk authority handoff with no record of who moved what to whom is
      unauditable; AC-2 requires account-lifecycle actions (including
      transfer) to be governed and traceable. Anchored to NIST SP 800-53
      Rev.5 AC-2 (https://csf.tools/reference/nist-sp-800-53/r5/ac/ac-2/).
      Quote anchor (AC-2(h) notification requirement): "Notify account
      managers ... when users are terminated or transferred".
  - id: "TRANSFER-ATOMIC-001"
    chapter: "원자성 (Atomic — partial handoff forbidden)"
    requirement: "The reassignment of all of a departing principal's rows MUST be atomic: it runs in a single @Transactional unit so either EVERY targeted row moves to the successor and the audit record is written, OR (on any failure — optimistic-lock conflict, constraint violation, partial-failure) NOTHING is reassigned and the audit record is not written. A partial handoff (some rows moved, some left with the departed owner) is forbidden — it is the worst outcome, leaving the records split across a live and a dead owner with no single accountable party. On failure the server MUST respond 409 TRANSFER_CONFLICT (or 5xx) with the original ownership fully intact."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Atomicity is the keystone: a half-applied transfer is harder to
      recover than no transfer at all. Negative test: force a failure
      mid-batch (e.g. inject a constraint violation on row N) → assert zero
      rows moved AND no audit record AND the departed principal still owns
      the full original set. Anchored to NIST SP 800-53 Rev.5 AC-2
      Discussion (https://csf.tools/reference/nist-sp-800-53/r5/ac/ac-2/).
      Quote anchor (AC-2 Discussion): "Align account management processes
      with personnel termination and transfer processes."
  - id: "TRANSFER-OBSERVABILITY-001"
    chapter: "관측 (canonical metric)"
    verification:
      mechanism: rule
      ref: domain-metrics-bounded-cardinality
    requirement: "Ownership-transfer implementations MUST expose the canonical Micrometer counter `ownership_transfer_total{outcome}` with bounded-cardinality labels: outcome ∈ {applied, rejected, conflict} (fixed enum). A complementary `ownership_transfer_rows_total{resource}` MAY count moved rows by fixed resource-type enum. Labels MUST exclude from_owner / to_owner / actor / resource_id / tenant_id-as-free-text or any PII / unbounded value. SLO/alert wiring is a fork-receiver concern."
    test_method: "Micrometer registry assertion"
    verification_type: "positive"
    applicable: true
    notes: >
      Bounded labels (fixed outcome + resource enum) keep the time-series
      count finite; the principal identifiers that make a transfer
      meaningful are exactly the high-cardinality / PII values that must
      NOT become labels. Anchored to OpenTelemetry metrics data model,
      which treats unbounded attribute combinations as a cardinality cost
      to be controlled
      (https://opentelemetry.io/docs/specs/otel/metrics/data-model/).
      Reference: OTel Metrics Data Model, "Timeseries Model" section (see
      source; no verbatim quote — the cited page constrains cardinality as
      a design cost rather than carrying a single blanket prohibition
      sentence).
