version: "0.1.0"
scope: "content-versioning-l0 — copy-on-write published-edition contract for any fork-receiver serving versioned, consumer-pinned content (course/lesson, terms-of-service, pricing plan, API spec, policy document, published article). A publish produces a NEW immutable edition row; the working draft stays a separate mutable row; pinned consumers keep the edition they joined. Cross-cutting catalog pattern, jurisdiction-agnostic + framework-agnostic. Generic SaaS / e-commerce / LMS / docs-platform applicable."
stack: "Spring Boot 3.2.x + Jakarta Persistence (published columns @Column(updatable=false), monotonically increasing version_no) + a sole-mutator publish state machine (DRAFT -> PUBLISHED) + RFC 9457 Problem Details + Micrometer metrics. Storage is append-only for published editions (event-sourcing / copy-on-write posture)."
standard: "Semantic Versioning 2.0.0 (released-version immutability, §3) + Martin Fowler — Event Sourcing (capture changes as a sequence; rebuild state by replay) + PostgreSQL MVCC snapshot semantics (a reader sees a snapshot regardless of the current underlying state) + RFC 9457 (Problem Details for HTTP APIs) + Jakarta Persistence 3.1 (@Column(updatable=false) immutable mapping)"
domain_mode: backend_only
introduced_at: "IDW5 2026-06-01 LMS dogfood"

# OPT-IN content-versioning catalog. Adopted by any recipe that must edit
# live content (a course, a terms-of-service page, a pricing plan, an API
# spec) WITHOUT retroactively rewriting what already-pinned consumers see.
# The pattern is copy-on-write editions: the published edition is an
# immutable snapshot (append-only, never mutated in place), while the
# working draft is a separate mutable row. A publish bumps the version and
# supersedes the prior published edition; the prior edition is retained, not
# overwritten, so consumers pinned to it keep a stable view.
#
# Composition note: this layers UNDER existing L4 CRUD recipes
# (crud-l0 / approval-workflow-l0 / invoicing-l0 / billing-l0) — a resource
# that needs editable-yet-pinned content adds a published-edition table and
# a draft table without changing its identity model. It is COMPLEMENTARY to
# optimistic-locking-l0: optimistic locking prevents the lost-update race on
# a SINGLE mutable row; content-versioning instead removes the race for
# PUBLISHED content entirely by making it immutable (you never update it —
# you publish a new edition). Use optimistic locking on the draft row; use
# copy-on-write editions for everything a consumer can pin. Generic pattern;
# zero jurisdiction cite (R102+ generic catalog principle).

# ── Priority order for fork-receivers ──
# Adopt in order; earlier items are foundational.
#   1. PUBLISH-SNAPSHOT-001
#   2. DRAFT-MUTABLE-001
#   3. PUBLISH-TRANSITION-001
#   4. CONSUMER-PIN-001
#   5. VERSION-OBSERVABILITY-001

# ── RECIPE.md frontmatter example ──
#   ---
#   recipe: generic-content-versioning
#   content_versioning_enabled: true
#   published_edition_immutable: true   # @Column(updatable=false) on content columns
#   draft_table_separate: true
#   consumer_pin_strategy: edition_id   # pin row stores the edition FK it joined
#   ---

items:
  - id: "PUBLISH-SNAPSHOT-001"
    chapter: "Published edition is an immutable copy-on-write snapshot"
    requirement: "Publishing MUST INSERT a NEW published-edition row carrying a frozen copy of the content at publish time; it MUST NOT mutate any previously published edition in place. Every content-bearing column on the published-edition entity (title, body, price, payload, etc.) MUST be mapped `@Column(updatable=false)` so the persistence provider never emits an UPDATE against a published row, and the table MUST be treated as append-only. A published edition carries a monotonically increasing `version_no` and a publish timestamp that are also write-once. The invariant: once an edition is published, its content bytes are frozen forever — any change becomes a new edition, never an in-place edit of the old one."
    test_method: "RestAssured integration test + JPA mapping assertion (publish twice, assert two distinct edition rows; assert the first edition's content is byte-identical before and after the second publish)"
    verification_type: "positive"
    applicable: true
    notes: >
      This is the keystone invariant: copy-on-write editions, not in-place
      edits. Anchored to Semantic Versioning 2.0.0 §3
      (https://semver.org/). Quote anchor (SemVer 2.0.0 §3): "Once a
      versioned package has been released, the contents of that version
      MUST NOT be modified. Any modifications MUST be released as a new
      version." The same released-immutability discipline applies to a
      published content edition: a release/publish is frozen; changes ship
      as a new version.
  - id: "DRAFT-MUTABLE-001"
    chapter: "Working draft is a separate mutable row"
    verification:
      mechanism: rule
      ref: published-edition-immutable-copy-on-write
    requirement: "Authoring edits MUST target a SEPARATE working-draft row (distinct table or a row whose status is DRAFT), never the live published edition. The draft is freely mutable — authors may overwrite its fields any number of times — and editing the draft MUST have zero observable effect on any already-published edition or on any consumer currently served a published edition. There MUST be at most one open draft per logical content item; saving the draft MUST NOT change `version_no` (the draft has no public version until it is published). The invariant: draft mutation and published-edition immutability are physically separated, so an in-progress edit can never leak to live consumers."
    test_method: "RestAssured integration test (mutate the draft repeatedly; GET the live published edition and assert it is unchanged across every draft save)"
    verification_type: "positive"
    applicable: true
    notes: >
      Separating the mutable draft from the immutable published snapshot is
      the copy-on-write half of the pattern. Anchored to PostgreSQL MVCC
      snapshot semantics
      (https://www.postgresql.org/docs/current/mvcc-intro.html). Quote
      anchor (PostgreSQL 'Introduction to MVCC'): "This means that each
      SQL statement sees a snapshot of data (a database version) as it was
      some time ago, regardless of the current state of the underlying
      data." A consumer reading a pinned published edition sees a stable
      snapshot even while the draft underneath is being rewritten — the
      same isolation guarantee, expressed at the edition level.
  - id: "PUBLISH-TRANSITION-001"
    chapter: "Atomic draft->published transition via a sole mutator"
    verification:
      mechanism: rule
      ref: published-edition-immutable-copy-on-write
    requirement: "The draft->published transition MUST be a single atomic operation owned by ONE sole-mutator component (a state machine / service method, `@Transactional`): it freezes the draft content into a new published edition, assigns the next `version_no` (prior_max + 1), and supersedes the prior published edition by marking it superseded (or flipping a single `is_current` pointer) — WITHOUT deleting or rewriting the prior edition's content. Prior editions MUST be retained. No other code path may insert a published edition or change `is_current`. A failed publish MUST roll back atomically, leaving the prior current edition authoritative. The invariant: exactly one current edition at any instant, monotonic version numbers, and every superseded edition preserved."
    test_method: "RestAssured integration test (publish v1, publish v2; assert v2 is current, assert v1 row still exists with original content, assert no second mutator path can write a published row)"
    verification_type: "review"
    applicable: true
    notes: >
      Sole-mutator + atomic supersede gives a clean version-bump without
      destroying history — the event-sourcing posture of building forward
      rather than overwriting. Anchored to Martin Fowler — Event Sourcing
      (https://martinfowler.com/eaaDev/EventSourcing.html). Quote anchor:
      "Capture all changes to an application state as a sequence of
      events." Each publish is an append (a new edition), so the full
      edition history is reconstructable rather than overwritten.
  - id: "CONSUMER-PIN-001"
    chapter: "Consumers are pinned to the edition they joined"
    verification:
      mechanism: rule
      ref: published-edition-immutable-copy-on-write
    requirement: "A consumer that enrolls in / accepts / subscribes to content MUST be pinned to the SPECIFIC published edition current at join time by persisting that edition's identifier (edition FK or `{content_id, version_no}`) on the consumer's record. Serving that consumer MUST resolve content through their pinned edition id, NOT through the latest `is_current` edition. A subsequent publish MUST NOT retroactively rewrite any pinned consumer's view; migrating a consumer to a newer edition MUST be an explicit, audited opt-in (re-acceptance of new terms, re-enrollment, plan change), never an implicit side effect of publishing. The invariant: publishing a new edition is invisible to already-pinned consumers until they explicitly move."
    test_method: "RestAssured integration test (consumer joins at v1; publish v2; GET the consumer's served content and assert it still resolves to v1 until an explicit migrate call)"
    verification_type: "positive"
    applicable: true
    notes: >
      Pinning to a frozen edition is exactly why the published edition must
      be immutable (PUBLISH-SNAPSHOT-001) — the pin would be meaningless if
      the underlying edition could change. Anchored to Martin Fowler —
      Event Sourcing
      (https://martinfowler.com/eaaDev/EventSourcing.html). Quote anchor:
      "We can discard the application state completely and rebuild it by
      re-running the events from the event log on an empty application."
      Because every edition is retained, any consumer's pinned view is
      always reconstructable from its stored edition id.
  - id: "VERSION-OBSERVABILITY-001"
    chapter: "관측 (3 canonical metrics)"
    requirement: "Content-versioning implementations SHOULD expose exactly 3 canonical Micrometer metrics with bounded-cardinality labels: (1) `content_publish_total{content_type, result}` — result ∈ {published, rejected}; (2) `content_edition_current{content_type}` (gauge) — count of currently-current editions per content type; (3) `content_consumer_pinned_total{content_type, pin_state}` — pin_state ∈ {current, behind}, the number of pinned consumers on the current vs a superseded edition. The `content_type` label MUST be a fixed enum; labels MUST exclude content_id / edition_id / version_no / consumer_id (no PII, no high-cardinality). SLO/alert wiring is a fork-receiver concern."
    test_method: "Micrometer registry assertion (publish + pin flows; assert the 3 meters exist with only the enumerated labels)"
    verification_type: "review"
    applicable: true
    notes: >
      Bounded labels keep the time-series count finite and let a
      fork-receiver alert when consumers drift many editions behind.
      Anchored to OpenTelemetry Semantic Conventions for HTTP metrics
      (https://opentelemetry.io/docs/specs/semconv/http/http-metrics/) —
      the cited page constrains metric attributes to low cardinality
      per-metric; the `pin_state`/`result` enums follow that guidance.
