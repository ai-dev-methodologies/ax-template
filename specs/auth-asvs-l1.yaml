    applicable: true
    notes: "API test: Check HttpOnly flag"
  - id: "ASVS-V3.4.3"
    chapter: "V3 - Session Management"
    requirement: "Verify that cookie-based session tokens have the 'SameSite' attribute."
    test_method: "asvs_V3_4_3_cookieSameSiteAttribute"
    verification_type: "api_test"
    applicable: true
    notes: "API test: Check SameSite flag"
  - id: "ASVS-V3.7.1"
    chapter: "V3 - Session Management"
    requirement: "Verify that the application requires a full session for highly sensitive operations."
    test_method: "asvs_V3_7_1_fullSessionRequired"
