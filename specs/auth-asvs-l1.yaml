version: "4.0.3"
scope: "email-auth-vertical-slice"
stack: "Spring Boot 3.2.x + React"
items:
  - id: "ASVS-V2.1.1"
    chapter: "V2 - Authentication"
    requirement: "User set passwords are at least 12 characters in length."
    test_method: "asvs_V2_1_1_passwordMinLength12_rejectsShorter"
    verification_type: "api_test"
    applicable: true
    notes: "API test: POST /auth/email/signup with 11-char password → 400"
  - id: "ASVS-V2.1.2"
    chapter: "V2 - Authentication"
    requirement: "Passwords of at least 64 chars are permitted; >128 chars are denied."
    test_method: "asvs_V2_1_2_password64CharsAllowed_129Rejected"
    verification_type: "api_test"
    applicable: true
    notes: "API test: 64-char → 200, 129-char → 400"
  - id: "ASVS-V2.1.3"
    chapter: "V2 - Authentication"
    requirement: "Verify that password truncation is not performed."
    test_method: "asvs_V2_1_3_noPasswordTruncation"
    verification_type: "api_test"
    applicable: true
    notes: "API test: Ensure long passwords aren't truncated"
  - id: "ASVS-V2.1.4"
    chapter: "V2 - Authentication"
    requirement: "Verify that any printable Unicode character, including spaces and emoji, are permitted in passwords."
    test_method: "asvs_V2_1_4_unicodeAndEmojiAllowed"
    verification_type: "api_test"
    applicable: true
    notes: "API test: Allow emoji and spaces"
  - id: "ASVS-V2.1.6"
    chapter: "V2 - Authentication"
    requirement: "Verify that password change functionality requires the user's current password."
    test_method: "asvs_V2_1_6_passwordChangeRequiresCurrent"
    verification_type: "api_test"
    applicable: true
    notes: "API test: Require old and new password"
  - id: "ASVS-V2.1.9"
    chapter: "V2 - Authentication"
    requirement: "Verify that there are no password composition rules."
    test_method: "asvs_V2_1_9_noCompositionRules"
    verification_type: "api_test"
    applicable: true
    notes: "API test: Accept long passwords without complex chars"
  - id: "ASVS-V2.2.1"
    chapter: "V2 - Authentication"
    requirement: "Verify that anti-automation controls are effective at mitigating credential stuffing and brute force."
    test_method: "asvs_V2_2_1_rateLimit_5FailedPer15Min"
    verification_type: "api_test"
    applicable: true
    notes: "API test: 5 failed per 15 min"
  - id: "ASVS-V2.5.2"
    chapter: "V2 - Authentication"
    requirement: "Verify that security questions or 'knowledge-based authentication' are not used."
    test_method: "asvs_V2_5_2_noSecurityQuestions"
    verification_type: "code_review"
    applicable: true
    notes: "Code review: No security questions in schema"
  - id: "ASVS-V2.5.3"
    chapter: "V2 - Authentication"
    requirement: "Verify that password reset mechanisms do not reveal the current password."
    test_method: "asvs_V2_5_3_resetDoesntRevealPassword"
    verification_type: "api_test"
    applicable: true
    notes: "API test: Reset sends token/link, no password disclosure"
  - id: "ASVS-V2.5.4"
    chapter: "V2 - Authentication"
    requirement: "Verify that there are no default passwords."
    test_method: "asvs_V2_5_4_noDefaultAccounts"
    verification_type: "code_review"
    applicable: true
    notes: "Code review: No default passwords hardcoded"
  - id: "ASVS-V2.7.2"
    chapter: "V2 - Authentication"
    requirement: "Verify that verification tokens have a short validity period."
    test_method: "asvs_V2_7_2_verificationTokenExpiry24h"
    verification_type: "api_test"
    applicable: true
    notes: "API test: Max 24h validity for tokens"
  - id: "ASVS-V2.7.3"
    chapter: "V2 - Authentication"
    requirement: "Verify that verification tokens are single-use."
    test_method: "asvs_V2_7_3_verificationTokenSingleUse"
    verification_type: "api_test"
    applicable: true
    notes: "API test: Token is consumed upon use"
  - id: "ASVS-V3.1.1"
