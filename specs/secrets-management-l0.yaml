version: "0.1.0"
scope: "secrets-management-l0 — application secret handling (sourcing, redaction, rotation, encryption, least-privilege access, revocation) for fork-receivers managing DB passwords, API tokens, signing keys, and other runtime credentials. Cross-cutting catalog pattern, jurisdiction-agnostic."
stack: "Spring Boot 3.2.x + Spring Cloud Config / Spring Boot env property sources + javax.crypto (envelope encryption via a KMS SPI) + SLF4J log-masking converter + Micrometer metrics"
standard: "OWASP Secrets Management Cheat Sheet + The Twelve-Factor App (III. Config) + NIST SP 800-57 Part 1 Rev. 5 (key rotation / cryptoperiod lifecycle) + AWS KMS / HashiCorp Vault envelope-encryption (de facto)"
domain_mode: backend_only   # P2-22: cross-cutting backend concern, no UI surface (no frontend Trio / contract / blueprint / L4); governed by spec_item_verification_binding_guard, not a full Trio
introduced_at: "R115 phase α — generic cross-cutting (memory feedback_prefer_generic_catalog). P11 standards + P9 distributed-system lens. R115 P12 TBD."

# secrets-management-l0 is OPT-IN. It governs how the application HANDLES its own
# runtime secrets — sourcing them from an external store, keeping them out of
# logs, rotating them without downtime, encrypting them, and revoking them on
# compromise. A fork-receiver adopts this whenever it holds any credential that
# would cause harm if leaked (DB password, third-party API token, signing key).
#
# Composition note: api-key-l0 (existing L4) is the INBOUND axis — issuing,
# storing (SHA-256 hash), and authenticating client `X-API-Key` credentials.
# THIS spec is the application's own OUTBOUND/runtime secret-handling axis and
# does NOT re-cover X-API-Key authn. config-validation-l0
# CONFIG-SECRET-SEPARATION-001 is the SEPARATION axis (config holds a reference,
# never the value) and explicitly defers value HANDLING to this sibling — they
# compose, they do not duplicate. SECRET-NO-LOG-001 composes with
# webhook-signing-l0 WHSIGN-SECRET-001 (a signing secret is one kind of managed
# secret) and SECRET-ACCESS-001 composes audit-log-l0 (each secret read is an
# auditable event). A fork-receiver picks ONE external store (Vault, AWS Secrets
# Manager, K8s Secrets, injected env) — the items are store-agnostic.

# ── Priority order for fork-receivers (earlier items are foundational) ──
#   1. SECRET-SOURCE-001        — externalized config (keystone)
#   2. SECRET-NO-LOG-001        — redaction on every egress path
#   3. SECRET-ENCRYPTION-001    — encrypted at rest + in transit
#   4. SECRET-ACCESS-001        — least-privilege + access audit
#   5. SECRET-ROTATION-001      — rotation with 2-version overlap window
#   6. SECRET-LIFECYCLE-001     — immediate revocation + TTL/expiry
#   7. SECRET-OBSERVABILITY-001 — 3 canonical metrics

# ── RECIPE.md frontmatter example (P5 recipe-author lens) ──
#   ---
#   recipe: generic-secrets-management
#   secrets_source: vault            # OR aws-secrets-manager / k8s-secrets / env
#   secrets_rotation_overlap: true   # accept 2 active versions during rotation
#   secrets_encryption: envelope-kms # at-rest envelope encryption via KMS
#   secrets_default_ttl_hours: 720   # issued-credential expiry (NIST cryptoperiod)
#   ---

# ── F8 standards pin (P11 standards lens) ──
# Default pinned: externalized config (Twelve-Factor III) sourced from an
# external store; AES-GCM-256 envelope encryption with a KMS-held data key;
# rotation overlap = EXACTLY 2 active versions; issued-credential TTL bounded
# by a NIST SP 800-57 cryptoperiod. Standards-pin streak continued.

items:
  - id: "SECRET-SOURCE-001"
    chapter: "Externalized secret sourcing"
    requirement: "Secrets MUST be sourced at runtime from an external secret store (Vault / AWS Secrets Manager / K8s Secrets) OR an injected environment variable — NEVER committed to source control and NEVER baked into a container image layer. A configuration property whose value is a non-placeholder secret literal MUST fail startup with a clear error (fail-fast). A missing required secret MUST abort startup rather than fall back to a default; an HTTP probe of a config-status endpoint that exposes a resolved secret value → 500 (the endpoint MUST surface only presence booleans, never values)."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Impl hint: bind secrets via @Value/@ConfigurationProperties from an env
      or external PropertySource, validate required keys in an
      ApplicationContextInitializer / @PostConstruct and throw on absence. A
      config-status endpoint returns {key: present|absent}, never the value.
      Anchored to The Twelve-Factor App, III. Config
      (https://12factor.net/config).
      Quote anchor (Twelve-Factor, III. Config): "The twelve-factor app stores
      config in environment variables."

  - id: "SECRET-NO-LOG-001"
    chapter: "Redaction across every egress path"
    requirement: "Secret values MUST be redacted from logs, exception/error messages, metric labels, and stack traces — no plaintext secret may leave the process boundary. A request that triggers an error while a secret is in scope MUST return a problem response whose body contains no secret material, and the corresponding log line MUST show the value masked (e.g. '****'). A wrapper secret type MUST override toString() to a masked form so an accidental string interpolation cannot leak it."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Impl hint: model secrets as a SecretValue wrapper whose toString() and
      JSON serializer emit a constant mask; register a Logback masking
      converter for known patterns; never put secrets in Micrometer tags (see
      SECRET-OBSERVABILITY-001). Assert the error body + captured log line
      contain no plaintext.
      Anchored to OWASP Secrets Management Cheat Sheet (§8.3 Detection
      lifecycle)
      (https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html).
      Quote anchor (OWASP Secrets Management Cheat Sheet, §8.3 Detection
      lifecycle): "Never be logged (must implement either an encryption or
      masking approach in place to avoid logging plaintext secrets)"

  - id: "SECRET-ENCRYPTION-001"
    chapter: "Encryption at rest and in transit"
    requirement: "Secrets MUST be encrypted at rest using envelope encryption — a data encryption key (DEK) encrypts the secret and is itself wrapped by a key-encryption key (KEK) held in a KMS — and MUST be transmitted only over TLS in transit. A secret retrieved from the store MUST be returned only as ciphertext on any persistence-layer surface; a plaintext-at-rest column or an HTTP fetch of a secret over a non-TLS endpoint MUST be rejected → 400. Recipe declares `secrets_encryption=envelope-kms`."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Impl hint: use AES-GCM-256 with a KMS-wrapped DEK (KmsClient SPI);
      decrypt lazily and only in memory; never persist the plaintext or the
      DEK alongside the ciphertext. Enforce TLS at the connector for any
      secret-bearing endpoint.
      Anchored to NIST SP 800-57 Part 1 Rev. 5 (§6 Protection Requirements for
      Key Information; key-wrapping keys) + §5.3 Cryptoperiods
      (https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf).
      Quote anchor (NIST SP 800-57 Part 1 Rev. 5, §5.3 Cryptoperiods): "A
      cryptoperiod is the time span during which a specific key is authorized
      for use by legitimate entities or the keys for a given system will remain
      in effect." AWS KMS envelope encryption (de facto).

  - id: "SECRET-ACCESS-001"
    chapter: "Least-privilege access + access auditing"
    requirement: "Access to each secret MUST be least-privilege — a principal MUST be authorized for the specific secret it reads, not a wildcard grant. Every secret read MUST emit an audit record {principal, secret_id, action=SECRET_READ, timestamp, outcome} via audit-log-l0; the audit record MUST NOT contain the secret value. An attempt to read a secret outside the caller's grant → 403 SECRET_ACCESS_DENIED, and that denial MUST also be audited (action=SECRET_ACCESS_DENIED)."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Impl hint: gate reads through a SecretAccessService that checks a
      per-secret ACL/policy and calls AuditLogService.record on both grant and
      denial; compose audit-log-l0 rather than re-implementing the trail. The
      audit row stores secret_id only — never the value.
      Anchored to OWASP Secrets Management Cheat Sheet (§2.3 Access Control,
      §2.6 Auditing)
      (https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html).
      Quote anchor (OWASP Secrets Management Cheat Sheet, §2.3 Access Control):
      "Engineers should not have access to all secrets in the secrets
      management system, and the Least Privilege principle should be applied."

  - id: "SECRET-ROTATION-001"
    chapter: "Rotation with overlap window (2 active versions)"
    requirement: "Rotation MUST be supported with an overlap window in which EXACTLY 2 versions of a secret are simultaneously valid — during overlap a consumer presenting EITHER the current OR the previous version is accepted — so rotation requires no downtime. After the overlap window closes the previous version MUST be retired (rejected). Recipe declares `secrets_rotation_overlap=true`. Test: rotate a secret, confirm both versions verify during overlap, then confirm the retired version fails → 401 SECRET_VERSION_RETIRED."
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Impl hint: store an ordered {current, previous} pair per secret;
      verification tries both candidates; rotation promotes new→current,
      current→previous, and drops the third. Mirrors webhook-signing-l0
      WHSIGN-SECRET-001 overlap shape.
      Anchored to NIST SP 800-57 Part 1 Rev. 5, §5.3 Cryptoperiods (key
      validity bounded by a defined cryptoperiod, after which the key is
      transitioned)
      (https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf).
      Quote anchor (NIST SP 800-57 Part 1 Rev. 5, §5.3 Cryptoperiods): "A
      cryptoperiod is the time span during which a specific key is authorized
      for use by legitimate entities or the keys for a given system will remain
      in effect." AWS Secrets Manager rotation with two versions (de facto).

  - id: "SECRET-LIFECYCLE-001"
    chapter: "Immediate revocation + issued-credential expiry"
    requirement: "A compromised secret MUST be revocable immediately — once revoked, any subsequent use of that version → 401 SECRET_REVOKED with effect that does not wait for the next rotation cycle. Issued/derived credentials (tokens, short-lived DEKs) MUST carry an expiry/TTL bounded by a configured cryptoperiod; an expired credential → 401 SECRET_EXPIRED. Recipe declares `secrets_default_ttl_hours`. Revocation and expiry MUST be auditable (compose SECRET-ACCESS-001)."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Impl hint: keep a revocation set checked on every resolve (fail-closed
      on store outage for high-value secrets); stamp expiresAt on issued
      credentials and reject past-expiry before use. Revocation must take
      effect within the resolve path, not only at rotation.
      Anchored to NIST SP 800-57 Part 1 Rev. 5, §5.5 Compromise of Keys and
      other Keying Material (revocation per §8.3.5)
      (https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf).
      Quote anchor (NIST SP 800-57 Part 1 Rev. 5, §5.3 Cryptoperiods): "If a
      key is compromised, its cryptoperiod shall no longer be considered
      valid."

  - id: "SECRET-OBSERVABILITY-001"
    chapter: "관측 (3 canonical metrics)"
    requirement: "Secret handling MUST expose EXACTLY 3 bounded-cardinality Micrometer metrics: (1) `secret_access_total{outcome}` — outcome ∈ {granted, denied} (bounded enum) — counter of secret read attempts; (2) `secret_rotation_total{result}` — result ∈ {success, failure} — counter of rotation operations; (3) `secret_resolution_failure_total{reason}` — reason ∈ {not_found, revoked, expired, store_unavailable} (bounded enum). Labels MUST NOT include secret_id, secret value, principal identity, or any high-cardinality source."
    test_method: "Micrometer registry assertion"
    verification_type: "positive"
    applicable: true
    notes: >
      Impl hint: register the three meters at startup with fixed enum tag sets
      so cardinality is bounded; an unbounded {secret_id} or {principal} label
      is the anti-pattern this item forbids. SLO/alert wiring is fork-receiver
      concern. Anchored to Micrometer naming/cardinality guidance
      (https://docs.micrometer.io/micrometer/reference/concepts/naming.html).
      Quote anchor (Micrometer Naming, Tag Values): "Beware of the potential
      for tag values coming from user-supplied sources to blow up the
      cardinality of a metric."
