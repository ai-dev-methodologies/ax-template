version: "0.1.0"
scope: "react-practices-l0 — seed React/Next.js best-practice items projected by practices-react/rules/*.md. Stack-agnostic where possible; Next.js-specific items carry `applicable_to: nextjs`."
stack: "React 19 / Next.js 16 (App Router) / TypeScript / ECMAScript 2024+"
status: "seed — grows item-by-item as practices-react/rules ship through the 4-phase curation pipeline (multi-source → audit → codex consensus → time-decay refresh)"
items:
  - id: "REACT-PRACTICES-ASYNC-001"
    chapter: "Async / Waterfalls"
    requirement: "Independent async operations must be initiated before any of them is awaited; aggregate with Promise.all (or Promise.allSettled when partial-failure tolerance is required). Sequential awaits over independent calls block each call until the previous one resolves and constitute a waterfall."
    test_method: "react_practices_ASYNC_001_initiateEarlyAwaitLate"
    verification_type: "lint"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Static check planned via custom ESLint rule `ax/react-async-parallel`: flags two or more top-level await statements that share no await-bound identifiers in the same async function body where each awaited expression is a call. Rule body and evidence: practices-react/rules/async-parallel.md."

  - id: "REACT-PRACTICES-BUNDLE-001"
    chapter: "Bundle / Imports"
    requirement: "Imports from packages with very large barrel files must either rely on the bundler's auto-optimization (e.g. Next.js experimental.optimizePackageImports default list), use a documented subpath export, or be transformed by a per-module mapping; private `dist/*` deep imports are forbidden because they couple to package internals."
    test_method: "react_practices_BUNDLE_001_noBroadBarrelImports"
    verification_type: "lint"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Static check planned via custom ESLint rule `ax/no-broad-barrel-imports`. Maintains an allowlist of packages already optimized by the project's bundler. Flags `import { ... } from 'X'` only when X is on the project's 'known expensive, not auto-optimized' list and the import is not from a documented subpath. Rule body and evidence: practices-react/rules/bundle-barrel-imports.md."

  - id: "REACT-PRACTICES-SERVER-001"
    chapter: "Server / Cache"
    requirement: "Non-fetch async server work that may be invoked from multiple Server Components within a single request (DB queries, auth lookups, file I/O, expensive computations) must be deduplicated with React.cache(fn) defined at module scope. Arguments must be primitives or stable references (Object.is)."
    test_method: "react_practices_SERVER_001_reactCacheModuleScopeDedup"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Static detection unreliable from AST alone. Reviewers confirm (a) module-scope `cache(fn)` definition, (b) primitive args / stable references, (c) Server-Component-only call sites, (d) not nested inside a 'use cache' boundary. Rule body and evidence: practices-react/rules/server-cache-react.md."

  - id: "REACT-PRACTICES-SERVER-002"
    chapter: "Server / Cache"
    requirement: "In Next.js 16 with Cache Components enabled (`cacheComponents: true`), persistent / cross-request caching uses the `'use cache'` directive at file, component, or function level. Runtime APIs (cookies/headers/searchParams) must not be accessed inside cached scopes; values must be read outside and passed as arguments. Cache lifetime is controlled with `cacheLife` and invalidation with `cacheTag` / `updateTag`."
    test_method: "react_practices_SERVER_002_useCacheDirective"
    verification_type: "code_review"
    applicable: true
    applicable_to: [nextjs]
    notes: "Build-time enforcement by Next.js itself catches several constraint violations (forbidden runtime APIs inside cached scope, non-serializable args). Reviewer confirms appropriate apply level, cache key/closure semantics, and absence of build-hang anti-pattern (runtime Promise into cached scope). Rule body and evidence: practices-react/rules/nextjs-use-cache.md."

  - id: "REACT-PRACTICES-RERENDER-001"
    chapter: "Re-render / Memoization"
    requirement: "Manual memoization (memo / useMemo / useCallback) is a fallback optimization, not a default. When React Compiler is enabled, do not add manual memo for ordinary re-render optimization (compiler handles it); manual memo is reserved for custom comparator cases or explicit migration leave-in-place. When React Compiler is not enabled, manual memo is allowed only after profiler evidence shows perceptible lag and parent's call site has been audited for stable-reference props."
    test_method: "react_practices_RERENDER_001_profileBeforeMemo"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "PR review checks (a) whether React Compiler is configured (look for babel-plugin-react-compiler or equivalent), (b) profiler evidence in the PR description for new memo additions, (c) stable-reference audit for memoized component's props, (d) explicit justification + benchmark for custom comparator usage. Deep-equality comparators rejected without justification. Rule body and evidence: practices-react/rules/rerender-memo.md."

  - id: "REACT-PRACTICES-JS-001"
    chapter: "JavaScript / Data structures"
    requirement: "When the same collection is queried for membership repeatedly in a hot path, build a Set or Map once and use has/get instead of Array.prototype.includes/find. Build cost is O(n), so the pattern only pays off when lookups are repeated. Object collections must use primitive keys (ids) — Set/Map matches objects by reference identity."
    test_method: "react_practices_JS_001_setMapForRepeatedLookups"
    verification_type: "lint"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Static check planned via custom ESLint rule `ax/no-array-includes-in-loop`: flag `arr.includes(x)` or `arr.find(...)` inside `.filter`/`.map`/`for-of`/`while` when the array is closed over and not mutated inside the loop. Rule body and evidence: practices-react/rules/js-set-map-lookups.md."

  - id: "REACT-PRACTICES-JS-002"
    chapter: "JS / DOM"
    requirement: "DOM style writes must be grouped before layout reads (offsetWidth, getBoundingClientRect, getComputedStyle). In React, prefer state-driven className over imperative ref.style mutations; reach for refs only for genuinely imperative cases."
    test_method: "react_practices_JS_002_noLayoutThrash"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/js-batch-dom-css.md."

  - id: "REACT-PRACTICES-JS-003"
    chapter: "JS / Indexing"
    requirement: "When joining two collections by a key in a hot path, build a Map(id → row) once instead of N .find() calls. Sibling to JS-001 (membership Set) — this rule covers join, not membership."
    test_method: "react_practices_JS_003_buildMapForJoins"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/js-index-maps.md."

  - id: "REACT-PRACTICES-JS-004"
    chapter: "JS / Loop micro-opt"
    requirement: "Deep stable property paths inside genuinely hot loops may be hoisted before the loop. Modern engines inline-cache property access; apply only with profiling evidence. The classic 'cache length' optimization is mostly noise on modern engines."
    test_method: "react_practices_JS_004_cacheDeepStablePathInHotLoop"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/js-cache-property-access.md."

  - id: "REACT-PRACTICES-JS-005"
    chapter: "JS / Memoization"
    requirement: "Pure deterministic functions called many times with the same inputs may be memoized in a BOUNDED module-level Map (LRU or explicit max size). Unbounded module-level caches are forbidden — they leak memory in long-lived processes. Cache keys must include locale/options/version, never user/tenant-scoped data without explicit scoping."
    test_method: "react_practices_JS_005_boundedFunctionMemo"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Narrow scope: pure client/shared JS function memo. Server caches use sibling rules. Rule body: practices-react/rules/js-cache-function-results.md."

  - id: "REACT-PRACTICES-JS-006"
    chapter: "JS / Storage perf"
    requirement: "Repeated synchronous browser-storage reads (localStorage, sessionStorage, document.cookie) in a hot path are cached in memory. SSR guard required (window/document undefined on server). Same-tab storage events do NOT fire on the writing tab — every local setItem must update the cache manually. Cross-tab invalidation via storage event; cookies revalidate on visibilitychange (best-effort)."
    test_method: "react_practices_JS_006_storageReadCacheWithInvalidation"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Sibling client-localstorage-schema covers correctness; this rule is performance. Rule body: practices-react/rules/js-cache-storage.md."

  - id: "REACT-PRACTICES-JS-007"
    chapter: "JS / Array iteration"
    requirement: "Multiple .filter/.map passes over the same array may be combined into one for-of loop when (a) the array is large (~1K+), (b) the path is hot, (c) intermediate arrays would be wasted. Not a blanket replacement — small or non-hot arrays favor readable pipelines. Preserve semantics: order, short-circuit, holes, side-effects."
    test_method: "react_practices_JS_007_combineHotIterations"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/js-combine-iterations.md."

  - id: "REACT-PRACTICES-JS-008"
    chapter: "JS / Array equality"
    requirement: "Array equality checks that invoke expensive comparison (sort, serialize, deep compare) must guard with an O(1) length check first. JSON.stringify equality is forbidden for objects with non-stable key order, NaN, undefined, Date, Map, Set, or function values."
    test_method: "react_practices_JS_008_lengthGuardBeforeExpensiveCompare"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/js-length-check-first.md."

  - id: "REACT-PRACTICES-JS-009"
    chapter: "JS / Control flow"
    requirement: "Return on first failure in validators and predicate searches unless the API contract requires collecting all errors (e.g. form validation showing all field errors at once). Sibling of async-defer-await for sync control flow."
    test_method: "react_practices_JS_009_returnOnFirstFailure"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/js-early-exit.md."

  - id: "REACT-PRACTICES-JS-010"
    chapter: "JS / RegExp"
    requirement: "Static regex patterns must be defined at module scope, not inside render. Dynamic patterns (from props/state) must be memoized with useMemo. Global (/g) and sticky (/y) regex instances have mutable lastIndex state — don't share across calls, or reset lastIndex before use, or use String.prototype.matchAll."
    test_method: "react_practices_JS_010_hoistOrMemoRegex"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/js-hoist-regexp.md."

  - id: "REACT-PRACTICES-JS-011"
    chapter: "JS / Algorithms"
    requirement: "Min/max selection uses a single pass O(n) loop, not O(n log n) sort. Math.min(...arr) / Math.max(...arr) hits engine call-argument limits — use loop form for arrays that could exceed ~125K elements. Empty-array and NaN behavior must be handled explicitly."
    test_method: "react_practices_JS_011_singlePassMinMax"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/js-min-max-loop.md."

  - id: "REACT-PRACTICES-JS-012"
    chapter: "JS / Immutability"
    requirement: "Arrays from React props or state must use ES2023 immutable variants (.toSorted, .toReversed, .toSpliced, .with) rather than mutating .sort, .reverse, .splice, [i]=v. For pre-ES2023 targets, use spread+sort fallback. Mutating props is a React contract violation."
    test_method: "react_practices_JS_012_immutableArrayOps"
    verification_type: "lint"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Custom ESLint rule planned: flag .sort/.reverse/.splice on prop-or-state arrays. Rule body: practices-react/rules/js-tosorted-immutable.md."

  - id: "REACT-PRACTICES-JS-013"
    chapter: "JS / Array transformation"
    requirement: "Use flatMap(x => cond ? [y] : []) instead of map(x => cond ? y : null).filter(Boolean) — the latter silently drops legitimate falsy values (0, '', false). Primary win is semantic clarity; perf is one-pass but allocates small wrapper arrays."
    test_method: "react_practices_JS_013_flatMapOverMapFilter"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/js-flatmap-filter.md."

  - id: "REACT-PRACTICES-ADVANCED-001"
    chapter: "Advanced / Effect callbacks"
    requirement: "When subscribing to external listeners (window/document/SDK) inside an Effect, the callback identity must be stable from the Effect's perspective so subscriptions don't churn. On React 19.2+ use useEffectEvent. On older React (19.0/19.1 or 18.x) use the ref-backed pattern. Real dependencies must remain in the dependency array — refs/Effect Events must never be used to hide them."
    test_method: "react_practices_ADVANCED_001_handlerRefFallback"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body and evidence: practices-react/rules/advanced-event-handler-refs.md (fallback). Sibling: practices-react/rules/advanced-use-latest.md (preferred 19.2+)."

  - id: "REACT-PRACTICES-ADVANCED-002"
    chapter: "Advanced / Initialization"
    requirement: "App-wide one-time initialization (storage hydration, auth token check, analytics connect) must run at module scope (with optional typeof window guard) or be guarded by a module-level didInit flag. Plain useEffect([]) inside a component is not reliable for once-only behavior due to StrictMode dev double-mount and remount."
    test_method: "react_practices_ADVANCED_002_initOncePerAppLoad"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body and evidence: practices-react/rules/advanced-init-once.md."

  - id: "REACT-PRACTICES-ADVANCED-003"
    chapter: "Advanced / Effect callbacks"
    requirement: "On React 19.2+, callbacks consumed inside Effects that should NOT re-trigger the Effect on identity change must be wrapped with useEffectEvent. The Effect Event must never be called during render, passed to other components, or placed in dependency arrays. Effect Events must not hide dependencies that should legitimately re-run the Effect."
    test_method: "react_practices_ADVANCED_003_useEffectEventStableCallback"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Sibling rule of ADVANCED-001 (handler refs fallback). Rule body and evidence: practices-react/rules/advanced-use-latest.md."

  - id: "REACT-PRACTICES-BUNDLE-002"
    chapter: "Bundle / Code splitting"
    requirement: "Heavy Client Components off the initial render path must be lazy-loaded. Use React.lazy + Suspense for portable code, next/dynamic for Next.js-specific options (ssr:false, loading:). Lazy declarations must be module top-level to avoid state-reset bugs."
    test_method: "react_practices_BUNDLE_002_lazyHeavyClientComponents"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/bundle-dynamic-imports.md."

  - id: "REACT-PRACTICES-BUNDLE-003"
    chapter: "Bundle / Third-party deferral"
    requirement: "Non-critical third-party SDKs/scripts must not block initial render. Use the framework's script primitive (next/script) for HTML <script> tags, dynamic import() for SDK modules, dynamic component import for vendor provider components."
    test_method: "react_practices_BUNDLE_003_deferThirdParty"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/bundle-defer-third-party.md."

  - id: "REACT-PRACTICES-BUNDLE-004"
    chapter: "Bundle / Feature gating"
    requirement: "Optional feature modules (admin tools, advanced editor, heavy visualizations) must load only when the feature is genuinely activated, via dynamic import() inside an effect/handler. Loading-state UI required. The typeof window guard inside useEffect is forbidden — it is dead code there."
    test_method: "react_practices_BUNDLE_004_conditionalLoading"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Distinct from BUNDLE-005 (intent prefetch). Rule body: practices-react/rules/bundle-conditional.md."

  - id: "REACT-PRACTICES-BUNDLE-005"
    chapter: "Bundle / Intent prefetch"
    requirement: "Heavy modules may be prefetched on STRONG user-intent signals (hover, focus, viewport-proximity, likely next-step routing) to reduce perceived latency. Weak signals (page load for all users, generic hover) are forbidden — that wastes bandwidth and is a static import in disguise."
    test_method: "react_practices_BUNDLE_005_intentPreload"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Distinct from BUNDLE-004 (load on activation). Rule body: practices-react/rules/bundle-preload.md."

  - id: "REACT-PRACTICES-SERVER-003"
    chapter: "Server / Authentication"
    requirement: "Every Server Action (function with 'use server' directive) must authenticate the caller, validate untrusted input, and authorize the operation INSIDE the action — not via middleware or layout only. Order: authenticate → validate → authorize → mutate."
    test_method: "react_practices_SERVER_003_serverActionAuth"
    verification_type: "code_review"
    applicable: true
    applicable_to: [nextjs]
    notes: "Rule body: practices-react/rules/server-auth-actions.md."

  - id: "REACT-PRACTICES-SERVER-004"
    chapter: "Server / Cache"
    requirement: "Cross-request caching in Next.js 16+ should use 'use cache' (Cache Components). Manual LRU is a fallback when Cache Components is unavailable or when best-effort in-process caching scoped to a warm instance is the intent. Cache keys must include tenant/user scope where applicable; LRU is not coherent across instances."
    test_method: "react_practices_SERVER_004_crossRequestLRUFallback"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/server-cache-lru.md."

  - id: "REACT-PRACTICES-SERVER-005"
    chapter: "Server / RSC props"
    requirement: "Operations that create new references (.toSorted, .filter, .map, .slice, spread) at the Server→Client boundary break RSC payload dedup and re-serialize. For LARGE duplicated props, pass the canonical reference once and derive in the client; for small props, ignore this rule."
    test_method: "react_practices_SERVER_005_rscPropDedupNotBroken"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/server-dedup-props.md."

  - id: "REACT-PRACTICES-SERVER-006"
    chapter: "Server / Module-scope I/O"
    requirement: "Truly static asset I/O (fonts, templates, bundled config, logos) must be hoisted to module scope to run once per process instance. Request-, user-, tenant-scoped data, rotating secrets, live feature flags must NOT be hoisted — that's a correctness bug, not an optimization. Edge runtime cannot use node:fs."
    test_method: "react_practices_SERVER_006_hoistStaticIOOnly"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/server-hoist-static-io.md."

  - id: "REACT-PRACTICES-SERVER-007"
    chapter: "Server / RSC serialization"
    requirement: "Client Components must receive minimal explicit DTOs, not whole server entities. Whole entities risk leaking secrets, internal IDs, role flags, and audit metadata across the boundary, in addition to bloating payload. Define DTOs in a dedicated module; map at the boundary."
    test_method: "react_practices_SERVER_007_minimizeClientPayloadDTO"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/server-serialization.md."

  - id: "REACT-PRACTICES-SERVER-008"
    chapter: "Server / Component composition"
    requirement: "Server Component trees must be composed to parallelize independent data fetches. Three valid patterns: (1) sibling async components, (2) slot/children composition with Suspense, (3) Promise.all inside a single component. Dependent fetches stay sequential by design."
    test_method: "react_practices_SERVER_008_parallelizeIndependentRSCFetches"
    verification_type: "code_review"
    applicable: true
    applicable_to: [nextjs, react]
    notes: "Rule body: practices-react/rules/server-parallel-fetching.md."

  - id: "REACT-PRACTICES-RENDERING-001"
    chapter: "Rendering / Animation"
    requirement: "Whole-SVG transform/opacity animations apply to a wrapper div, not the <svg> element. Inner path/shape animation stays on SVG elements. will-change is applied only during active animation and removed when idle."
    test_method: "react_practices_RENDERING_001_animateSVGWrapper"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rendering-animate-svg-wrapper.md."

  - id: "REACT-PRACTICES-RENDERING-002"
    chapter: "Rendering / content-visibility"
    requirement: "Long static sections must use `content-visibility: auto` paired with realistic `contain-intrinsic-size` to defer off-screen layout/paint. Not a list virtualization replacement — DOM nodes still exist."
    test_method: "react_practices_RENDERING_002_contentVisibility"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rendering-content-visibility.md."

  - id: "REACT-PRACTICES-RENDERING-003"
    chapter: "Rendering / JSX hoisting"
    requirement: "When React Compiler is enabled, manual JSX hoisting is unnecessary. When compiler is off, hoist JSX only if it has zero dependencies on props/state/context/hooks/locale/auth/theme. Hoisting JSX that closes over any of those is a correctness bug."
    test_method: "react_practices_RENDERING_003_hoistJSXOnlyWhenStatic"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rendering-hoist-jsx.md."

  - id: "REACT-PRACTICES-RENDERING-004"
    chapter: "Rendering / SVG optimization"
    requirement: "SVGs ship through SVGO with measured precision (default `--precision=3`). Blanket `--precision=1` is forbidden without per-asset visual-regression check. Animated SVGs and viewBox-critical artwork preserve higher precision."
    test_method: "react_practices_RENDERING_004_svgPrecisionMeasured"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rendering-svg-precision.md."

  - id: "REACT-PRACTICES-RENDERING-005"
    chapter: "Rendering / Hydration"
    requirement: "Inline-script prehydration is used only for tiny deterministic boot values (theme/color-scheme/auth-shell). Values are whitelisted inline (no string interpolation of user-controlled data). CSP nonce attached. No fetch / heavy logic inside. Framework primitives (next-themes etc.) preferred where available."
    test_method: "react_practices_RENDERING_005_inlineScriptPrehydrateSafely"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/rendering-hydration-no-flicker.md."

  - id: "REACT-PRACTICES-RENDERING-006"
    chapter: "Rendering / Hydration"
    requirement: "`suppressHydrationWarning` is applied to the smallest element containing the known intentional text mismatch (timestamps, locale, randomized ids only). Never used to mask structural mismatches. Deterministic SSR or client-only render is preferred when feasible."
    test_method: "react_practices_RENDERING_006_suppressHydrationNarrowly"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/rendering-hydration-suppress-warning.md."

  - id: "REACT-PRACTICES-RENDERING-007"
    chapter: "Rendering / Activity"
    requirement: "React 19.2's <Activity> is used for expensive UI that toggles visibility frequently (tabs, drawers, panels). Reviewers must verify hidden mode's effect-unmount and update-deferral semantics are acceptable for the component."
    test_method: "react_practices_RENDERING_007_activityForTogglingUI"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/rendering-activity.md."

  - id: "REACT-PRACTICES-RENDERING-008"
    chapter: "Rendering / Conditional"
    requirement: "Numeric/falsy-tricky conditions in JSX use ternary `?:` or explicit `Boolean(x) &&`. Pure-boolean `&&` is permitted and idiomatic — the rule targets numeric/string/unknown-shape conditions where `0`/`NaN`/`''` render as visible text."
    test_method: "react_practices_RENDERING_008_noFalsyNumericRender"
    verification_type: "lint"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rendering-conditional-render.md."

  - id: "REACT-PRACTICES-RENDERING-009"
    chapter: "Rendering / Transitions"
    requirement: "useTransition is used for non-urgent interruptible UI updates (search/filter/tab navigation). Network-lifecycle loading state (uploads, mutations, imperative async) uses explicit useState OR the data library's pending/error/data primitive OR React 19 use() + Suspense."
    test_method: "react_practices_RENDERING_009_useTransitionScope"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rendering-usetransition-loading.md."

  - id: "REACT-PRACTICES-RENDERING-010"
    chapter: "Rendering / Resource hints"
    requirement: "react-dom resource-hint APIs (prefetchDNS/preconnect/preload/preloadModule/preinit/preinitModule) are invoked in Server Components or layouts. preload/preinit are limited to critical above-the-fold resources. Framework primitives (next/font, next/Link prefetch, metadata API) are preferred where stronger."
    test_method: "react_practices_RENDERING_010_resourceHintsServerSideCritical"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/rendering-resource-hints.md."

  - id: "REACT-PRACTICES-RENDERING-011"
    chapter: "Rendering / Script loading"
    requirement: "Every <script> tag must declare defer or async (or be type=module which defers by default). Critical inline boot scripts (theme prehydration, <1KB, deterministic, CSP nonce) are an explicit exception. In Next.js, next/script with strategy is preferred over raw <script>."
    test_method: "react_practices_RENDERING_011_scriptDeferAsync"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rendering-script-defer-async.md."

  - id: "REACT-PRACTICES-SERVER-010"
    chapter: "Server / Cache (private)"
    requirement: "'use cache: private' is an experimental escape hatch in Next.js 16.2.6 (not production-recommended). Use ONLY when refactoring the runtime read out of a cached scope is impractical, or when compliance forbids server-side storage. The cache is per-client browser-memory, lost on reload, not stored server-side, not allowed in Route Handlers, requires stale >= 30s, and cannot have a custom cache handler. connection() is forbidden inside."
    test_method: "react_practices_SERVER_010_useCachePrivateEscapeHatch"
    verification_type: "code_review"
    applicable: true
    applicable_to: [nextjs]
    notes: "Sibling of nextjs-use-cache (parent) and nextjs-use-cache-remote. Rule body: practices-react/rules/nextjs-use-cache-private.md."

  - id: "REACT-PRACTICES-SERVER-011"
    chapter: "Server / Cache (remote)"
    requirement: "'use cache: remote' stores cache entries in a remote handler for cross-instance durable shared caching. Decision gate: (a) work is expensive/rate-limited/flaky/slow, (b) cache keys have low cardinality (high hit rate), (c) cache scope is shared across users. Forbidden cases: existing KV layer in front of the data source, sub-50ms operations, mostly-unique cache keys, rapidly-changing data. Nesting: remote+private forbidden in both directions."
    test_method: "react_practices_SERVER_011_useCacheRemoteSharedDurable"
    verification_type: "code_review"
    applicable: true
    applicable_to: [nextjs]
    notes: "Sibling of nextjs-use-cache (parent) and server-cache-lru (fallback). Rule body: practices-react/rules/nextjs-use-cache-remote.md."

  - id: "REACT-PRACTICES-RERENDER-002"
    chapter: "Re-render / Subscriptions"
    requirement: "When a dynamic value is only consumed inside a callback, do not subscribe via useSearchParams or similar reactive hooks. Read on-demand from window.location.search / document.cookie inside the handler. Subscriptions are reserved for values that drive rendered output."
    test_method: "react_practices_RERENDER_002_deferReadsToCallback"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/rerender-defer-reads.md."

  - id: "REACT-PRACTICES-RERENDER-003"
    chapter: "Re-render / Memo defaults"
    requirement: "When a memoized component already has a non-primitive default parameter value (function/array/object), the default must be extracted to a module-level constant. This rule applies ONLY when the memo boundary is already justified — see RERENDER-001 for memo policy."
    test_method: "react_practices_RERENDER_003_memoDefaultsAsConstants"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/rerender-memo-with-default-value.md."

  - id: "REACT-PRACTICES-RERENDER-004"
    chapter: "Re-render / Effect deps"
    requirement: "useEffect dependencies must list only what the Effect actually reads, AT THE PRIMITIVE LEVEL. Listing the whole object causes Effect to re-run on unrelated field changes; listing fewer deps than the Effect reads creates a stale-closure bug (use useEffectEvent on 19.2+ instead)."
    test_method: "react_practices_RERENDER_004_narrowEffectDeps"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/rerender-dependencies.md."

  - id: "REACT-PRACTICES-RERENDER-005"
    chapter: "Re-render / Derived signals"
    requirement: "When the UI consumes only the threshold/derived signal (mobile vs desktop), subscribe to the derived boolean (useMediaQuery) rather than the continuous source (useWindowWidth). Keep the continuous source when exact pixel values are rendered or used in layout math."
    test_method: "react_practices_RERENDER_005_subscribeToDerivedSignal"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rerender-derived-state.md."

  - id: "REACT-PRACTICES-RERENDER-006"
    chapter: "Re-render / Derivation"
    requirement: "Values computable from current props and state must be derived during render, not stored in state and synced via useEffect. useMemo only for genuinely expensive derivation with profiler evidence."
    test_method: "react_practices_RERENDER_006_deriveDuringRender"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Canonical React docs guidance ('You Might Not Need an Effect'). Rule body: practices-react/rules/rerender-derived-state-no-effect.md."

  - id: "REACT-PRACTICES-RERENDER-007"
    chapter: "Re-render / setState correctness"
    requirement: "When the new state depends on the current state, use the functional update form: setState(curr => ...). Direct setState(...) closing over the state variable risks stale closures. Primary value is correctness; stable callback identity is the secondary benefit."
    test_method: "react_practices_RERENDER_007_functionalSetStateUpdates"
    verification_type: "lint"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Custom ESLint rule planned. Rule body: practices-react/rules/rerender-functional-setstate.md."

  - id: "REACT-PRACTICES-RERENDER-008"
    chapter: "Re-render / Initialization"
    requirement: "When useState's initial value requires non-trivial sync computation (parsing storage, building indexes), pass an initializer function: useState(() => ...). Cheap literals and direct prop references stay as useState(value). Initializers must be pure (StrictMode may run them twice)."
    test_method: "react_practices_RERENDER_008_lazyStateInit"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rerender-lazy-state-init.md."

  - id: "REACT-PRACTICES-RERENDER-009"
    chapter: "Re-render / useMemo policy"
    requirement: "useMemo must NOT wrap simple primitive-result expressions (boolean OR, arithmetic, string concat). The memo overhead exceeds the cost. Exception: measured-expensive computation OR referential stability required by external API. React Compiler usually makes manual useMemo redundant entirely."
    test_method: "react_practices_RERENDER_009_noUseMemoForSimplePrimitives"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rerender-simple-expression-in-memo.md."

  - id: "REACT-PRACTICES-RERENDER-010"
    chapter: "Re-render / Hook composition"
    requirement: "When a single useMemo or useEffect performs independent tasks with different dependency sets, split into separate hooks so each task invalidates only on its own dependency change. Don't split tightly coupled logic into noise; compiler-on projects may auto-track finer boundaries."
    test_method: "react_practices_RERENDER_010_splitIndependentHooks"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rerender-split-combined-hooks.md."

  - id: "REACT-PRACTICES-RERENDER-011"
    chapter: "Re-render / Effect-vs-handler"
    requirement: "Side effects triggered by user actions (submit / click / drag) must run in the event handler, not be modeled as state + useEffect. Effects are reserved for synchronization with external systems caused by render/visibility/subscription state."
    test_method: "react_practices_RERENDER_011_eventDrivenEffectsInHandlers"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Canonical React docs guidance. Rule body: practices-react/rules/rerender-move-effect-to-event.md."

  - id: "REACT-PRACTICES-RERENDER-012"
    chapter: "Re-render / Transitions"
    requirement: "Use startTransition for non-urgent state updates that drive rendering (filtered list update behind a search input, tab content load). Do not use for imperative bookkeeping (scroll position, mouse tracking) — refs and throttle/rAF are the right tools there. Not a perf cure-all."
    test_method: "react_practices_RERENDER_012_startTransitionForNonUrgentRenders"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rerender-transitions.md."

  - id: "REACT-PRACTICES-RERENDER-013"
    chapter: "Re-render / Deferred value"
    requirement: "When an expensive derived render lags behind an urgent input, useDeferredValue combined with useMemo (with the deferred value as dependency) keeps the input snappy. The useMemo dep must be the DEFERRED value, not the urgent one. For very large datasets, fix the algorithmic cost first."
    test_method: "react_practices_RERENDER_013_useDeferredValueWithMemoOnDeferred"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rerender-use-deferred-value.md."

  - id: "REACT-PRACTICES-RERENDER-014"
    chapter: "Re-render / Ref vs state"
    requirement: "useRef for values that don't drive rendering (mouse positions, intervals, transient flags, frequently-updated metrics). useState ONLY for values the UI must reflect. Updating a ref does NOT trigger a re-render — use it whenever the UI doesn't need to."
    test_method: "react_practices_RERENDER_014_refForTransientValues"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/rerender-use-ref-transient-values.md."

  - id: "REACT-PRACTICES-RERENDER-015"
    chapter: "Re-render / Component definition"
    requirement: "Components must NEVER be defined inside other components. A function literal at component body scope creates a new component type each render → full remount → lost state, focus, animations, effect setup/cleanup. Define at module scope; pass data as props."
    test_method: "react_practices_RERENDER_015_noInlineComponentDefinition"
    verification_type: "lint"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Custom ESLint rule planned. Highest-impact rerender rule. Rule body: practices-react/rules/rerender-no-inline-components.md."

  - id: "REACT-PRACTICES-SERVER-009"
    chapter: "Server / Post-response work"
    requirement: "Next.js after() is for BEST-EFFORT post-response work: analytics, audit logs where occasional loss is acceptable, cache warming, cleanup. Never use after() for critical operations (billing, payment confirmation, guaranteed notifications) — function instance may be killed shortly after response ships. Use a durable queue for critical work."
    test_method: "react_practices_SERVER_009_afterBestEffortOnly"
    verification_type: "code_review"
    applicable: true
    applicable_to: [nextjs]
    notes: "Rule body: practices-react/rules/server-after-nonblocking.md."

  - id: "REACT-PRACTICES-CLIENT-001"
    chapter: "Client / Server-state dedup"
    requirement: "Client-Component server-state reads must go through a deduplicating cache layer (SWR / TanStack Query / RTK Query / framework Suspense+use()) when the same data may be requested by multiple component instances. Plain useEffect+fetch+setState is reserved for genuinely one-off init reads."
    test_method: "react_practices_CLIENT_001_serverStateDedup"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Vendor-neutral; SWR is one option. Rule body: practices-react/rules/client-swr-dedup.md."

  - id: "REACT-PRACTICES-CLIENT-002"
    chapter: "Client / Event listeners"
    requirement: "Hooks that subscribe to a global event target (window/document) and may be used in multiple component instances must route through a singleton listener + subscriber registry. N hook instances = 1 listener, not N. Cleanup attaches/detaches based on subscriber count."
    test_method: "react_practices_CLIENT_002_globalListenerDedup"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Implementation can be useEffect + module registry, useSyncExternalStore, or a subscription library. Rule body: practices-react/rules/client-event-listeners.md."

  - id: "REACT-PRACTICES-CLIENT-003"
    chapter: "Client / Scroll performance"
    requirement: "Touch and wheel listeners that do not call preventDefault must declare { passive: true } explicitly. Listeners that intentionally call preventDefault must declare { passive: false } explicitly. Bare addEventListener without options for these event types is forbidden — it leaves ambiguity that browsers resolve inconsistently."
    test_method: "react_practices_CLIENT_003_passiveListenerOptions"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/client-passive-event-listeners.md."

  - id: "REACT-PRACTICES-ASYNC-002"
    chapter: "Async / Conditional"
    requirement: "Async functions must place cheap guards (validation, early returns, permission gates that don't require expensive I/O) BEFORE expensive awaits. Don't await data on a code path that discards it. Exception: awaits whose purpose IS the side effect (auth, validation, audit log, transaction setup) must run regardless of return path."
    test_method: "react_practices_ASYNC_002_deferAwaitToBranch"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/async-defer-await.md."

  - id: "REACT-PRACTICES-ASYNC-003"
    chapter: "Async / Dependency graphs"
    requirement: "For promise graphs where some calls depend on others' outputs and some don't, the primary pattern is: initiate root promises, chain dependent promises via .then() from their input promise, await aggregate with Promise.all at the latest moment. Third-party DSLs (better-all) are an optional advanced tool, not the catalog's primary recommendation."
    test_method: "react_practices_ASYNC_003_partialDepGraphChained"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/async-dependencies.md."

  - id: "REACT-PRACTICES-ASYNC-004"
    chapter: "Async / API routes"
    requirement: "API routes and Server Actions must follow the init-early-await-late pattern WITHIN API-specific constraints: auth gate before any business work, mutations respect ordering, transactions scope work atomically, request signal propagated to fetches, rate-limit budget considered before fan-out, idempotency for concurrent invocations."
    test_method: "react_practices_ASYNC_004_apiRouteParallelSafely"
    verification_type: "code_review"
    applicable: true
    applicable_to: [nextjs]
    notes: "Specialization of ASYNC-001. Rule body: practices-react/rules/async-api-routes.md."

  - id: "REACT-PRACTICES-ASYNC-005"
    chapter: "Async / Streaming"
    requirement: "When a page has both fast and slow content, the slow content must be wrapped in Suspense so the wrapper layout ships immediately. Promises must be created in Server Components and passed to Client Components as props (never created inside Client Component render). Client Components consume promises with use() inside Suspense. Layout-shift mitigation: fallback bounding box approximates final content."
    test_method: "react_practices_ASYNC_005_suspenseStreamingForSlowRegions"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Rule body: practices-react/rules/async-suspense-boundaries.md."

  - id: "REACT-PRACTICES-ASYNC-006"
    chapter: "Async / Next.js params"
    requirement: "In Next.js 16 App Router, route params and searchParams are Promise<T>. Param-independent server work must be initiated alongside (or aggregated with) the params promise, not after a sequential `await params`. Param-dependent work must wait for params to resolve; param-independent work that depends on the param result is parallelized via Promise.all."
    test_method: "react_practices_ASYNC_006_nextAsyncParamsParallel"
    verification_type: "code_review"
    applicable: true
    applicable_to: [nextjs]
    notes: "Specialization of ASYNC-001 for Next.js 16 async params. Rule body: practices-react/rules/next-async-params-parallel.md."

  - id: "REACT-PRACTICES-CLIENT-004"
    chapter: "Client / Storage"
    requirement: "All localStorage access must be (a) keyed with a version suffix, (b) wrapped in try-catch (Safari private mode and quota overflow throw), (c) store the minimal field set the UI needs (no tokens, PII, full server objects), (d) guarded by typeof window check if the access can run during SSR. Migration code documented when version bumps."
    test_method: "react_practices_CLIENT_004_localStorageSchemaSafety"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs, vite]
    notes: "Rule body: practices-react/rules/client-localstorage-schema.md."

  - id: "REACT-PRACTICES-L2-001"
    chapter: "L2 Layer / Form Blocks"
    requirement: "L2 form blocks must accept an onSubmit callback prop; they must not import server actions, app/ routes, or any domain-specific lib/ module directly. Domain wiring (server action binding, error handling) is the caller's responsibility."
    test_method: "react_practices_L2_001_onSubmitPropNotServerAction"
    verification_type: "code_review"
    applicable: true
    applicable_to: [nextjs]
    notes: "Observed violation pattern during SP7 L2 block implementation. Rule body: practices-react/rules/l2-prefer-onsubmit-prop.md. Enforced statically by ax-verify-L2/scripts/check-imports.sh."

  - id: "REACT-PRACTICES-L2-002"
    chapter: "L2 Layer / Data Blocks"
    requirement: "L2 data blocks must receive data as typed props; they must not call fetch(), useQuery(), useSWR(), or any data-fetching primitive internally. Loading and error state is also passed as props."
    test_method: "react_practices_L2_002_dataAsPropNotDirectFetch"
    verification_type: "code_review"
    applicable: true
    applicable_to: [react, nextjs]
    notes: "Observed violation pattern during SP7 L2 block implementation (DataTable, FilterBar, Pagination). Rule body: practices-react/rules/l2-prefer-data-prop-over-direct-fetch.md."

  - id: "REACT-PRACTICES-L4-001"
    chapter: "L4 Layer / Recipe Composition"
    requirement: "When a Next.js page in an L4 domain implements a multi-domain composition pattern covered by a Business Pattern Recipe (saas-subscription, e-commerce, crm), it MUST follow the Recipe's L2 block and domain wiring contract. Directly importing hooks, stores, or components from sibling L4 domains without an applied_recipe: declaration on the L4 domain README is prohibited. Rule body: practices-react/rules/prefer-recipe-over-l4-page-cross-import.md."
    test_method: "react_practices_L4_001_recipeCompositionOverAdHocL4CrossImport"
    verification_type: "code_review"
    applicable: true
    applicable_to: [nextjs]
    notes: "ESLint no-restricted-imports or import/no-restricted-paths detects cross-L4 domain imports in pages that lack applied_recipe: on their L4 README. Failing fixture: practices/evals/fixtures/prefer-recipe-composition-over-l4-cross-import/fail_ad_hoc_cross_import/SaasPage.tsx."
