# specs/practices-frontend-l0.yaml
# Page Compliance Spec — practices domain, frontend_only mode.
#
# No backend API. The practices viewer reads static markdown files from
# practices/AGENTS.md, practices-react/AGENTS.md, and rules/**/*.md
# directly via Server Components + fs.readFile at request time.
#
# Every item has:
#   backend_operation_id: null          (frontend_only: no backend to bind)
#   static_source_ref: [glob or path]   (resolves to ≥1 file at repo root)
#
# trio_integrity_guard --domain practices validates:
#   - This file exists (MISSING_FRONTEND_SPEC)
#   - All items have backend_operation_id: null
#   - All items have non-empty static_source_ref resolving to existing files

version: "1.0"
domain: practices
domain_mode: frontend_only
backend_spec_ref: null

items:
  - id: PRACTICES-FE-001
    requirement: "Index page lists all Java rules from practices/rules/**/*.md with title, impact, and tags"
    test_method: practices_index_renders_java_rules
    backend_operation_id: null
    static_source_ref:
      - practices/AGENTS.md
      - practices/rules/async-virtual-thread-executor.md

  - id: PRACTICES-FE-002
    requirement: "Index page lists all React rules from practices-react/rules/**/*.md with title, impact, and tags"
    test_method: practices_index_renders_react_rules
    backend_operation_id: null
    static_source_ref:
      - practices-react/AGENTS.md
      - practices-react/rules/async-parallel.md

  - id: PRACTICES-FE-003
    requirement: "Index page shows combined rule count (≥64 Java rules + ≥70 React rules)"
    test_method: practices_index_shows_rule_counts
    backend_operation_id: null
    static_source_ref:
      - practices/rules/async-virtual-thread-executor.md
      - practices-react/rules/async-parallel.md

  - id: PRACTICES-FE-004
    requirement: "Category page filters rules by prefix (e.g. /practices/category/async shows only async-* rules)"
    test_method: practices_category_page_filters_by_prefix
    backend_operation_id: null
    static_source_ref:
      - practices/rules/async-virtual-thread-executor.md
      - practices-react/rules/async-parallel.md

  - id: PRACTICES-FE-005
    requirement: "Category page shows rules from both Java and React catalogs that match the prefix"
    test_method: practices_category_page_shows_both_catalogs
    backend_operation_id: null
    static_source_ref:
      - practices/rules/async-completablefuture-return-type.md
      - practices-react/rules/async-defer-await.md

  - id: PRACTICES-FE-006
    requirement: "Rule detail page renders the full markdown body for a specific rule ID"
    test_method: practices_rule_detail_renders_markdown
    backend_operation_id: null
    static_source_ref:
      - practices/rules/async-virtual-thread-executor.md
      - practices-react/rules/async-parallel.md

  - id: PRACTICES-FE-007
    requirement: "Rule detail page shows rule metadata: title, impact, tags, and spec_ref"
    test_method: practices_rule_detail_shows_metadata
    backend_operation_id: null
    static_source_ref:
      - practices/rules/async-virtual-thread-executor.md
      - practices-react/rules/async-parallel.md

  - id: PRACTICES-FE-008
    requirement: "Rule detail page for a non-existent rule ID returns a 404 not-found state"
    test_method: practices_rule_detail_404_for_unknown_id
    backend_operation_id: null
    static_source_ref:
      - practices/rules/async-virtual-thread-executor.md

  - id: PRACTICES-FE-009
    requirement: "Index page groups rules by catalog (Java / React) with clear headings"
    test_method: practices_index_groups_by_catalog
    backend_operation_id: null
    static_source_ref:
      - practices/AGENTS.md
      - practices-react/AGENTS.md

  - id: PRACTICES-FE-010
    requirement: "Index page navigation link leads to /practices from the app shell sidebar"
    test_method: practices_index_nav_link
    backend_operation_id: null
    static_source_ref:
      - practices/AGENTS.md
      - practices-react/AGENTS.md

  - id: PRACTICES-FE-011
    requirement: "Category page shows an empty state when no rules match the given prefix"
    test_method: practices_category_page_empty_state
    backend_operation_id: null
    static_source_ref:
      - practices/rules/async-virtual-thread-executor.md
      - practices-react/rules/async-parallel.md

  - id: PRACTICES-FE-012
    requirement: "Rule detail page breadcrumb links back to the category and index pages"
    test_method: practices_rule_detail_breadcrumb
    backend_operation_id: null
    static_source_ref:
      - practices/rules/async-virtual-thread-executor.md
      - practices-react/rules/async-parallel.md
