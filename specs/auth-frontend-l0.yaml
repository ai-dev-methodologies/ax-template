# specs/auth-frontend-l0.yaml
# Page Compliance Spec — auth domain, full_trio mode.
# ADR: TD-2026-05-17-007 (Frontend Spec Trio schema)
# ADR: TD-2026-05-17-001 (Next.js 16 App Router)
# ADR: TD-2026-05-17-006 (Playwright + Vitest + MSW)
#
# Every item's backend_operation_id resolves to contracts/auth-openapi.yaml.
# Every item's backend_spec_ref resolves to an id in specs/auth-asvs-l1.yaml.
# static_source_ref is [] for all items (full_trio: FORBIDDEN to be non-empty).

domain: auth
domain_mode: full_trio
backend_spec_ref: specs/auth-asvs-l1.yaml
frontend_required: true

items:
  - id: AUTH-FE-001
    requirement: "Signup page renders email and password fields and submits credentials to the backend signup endpoint"
    backend_operation_id: emailSignup
    backend_spec_ref: ASVS-V2.1.1
    static_source_ref: []
    test_method: "auth/signup.spec.ts"
    verification_type: e2e_test
    policy_ref: "blueprints/auth-ui-manifest.yaml#a11y"
    coverage_threshold: 1.0
    backend_only_marker: false

  - id: AUTH-FE-002
    verification:
      mechanism: rule
