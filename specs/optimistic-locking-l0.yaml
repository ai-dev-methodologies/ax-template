version: "0.1.0"
scope: "optimistic-locking-l0 — ETag + If-Match conditional-request optimistic concurrency contract for fork-receivers building any mutable-resource HTTP API (PUT / PATCH / DELETE). Cross-cutting catalog pattern, jurisdiction-agnostic + framework-agnostic. Generic e-commerce / SaaS / admin-CRUD applicable."
stack: "Spring Boot 3.2.x + Jakarta Persistence (JPA @Version) + Spring Web ETag/ShallowEtagHeaderFilter + RFC 9457 Problem Details + Micrometer metrics"
standard: "RFC 7232 (Conditional Requests — ETag / If-Match) + RFC 9110 (HTTP Semantics, conditional request supersedes) + RFC 9457 (Problem Details for HTTP APIs) + Jakarta Persistence 3.1 @Version (optimistic locking) + MDN HTTP Conditional Requests (de facto reference)"
domain_mode: full_trio
introduced_at: "R106 phase α — generic cross-cutting catalog (R102+ generic principle, memory feedback_prefer_generic_catalog). P11 standards lens + P9 distributed-system lens active. R106 P12 NEW finding TBD."

# OPT-IN concurrency-control catalog. Adopted by any recipe exposing
# mutable resources where two clients may race a write (admin CRUD,
# product catalog edits, order updates, profile edits). Prevents the
# lost-update anomaly via HTTP-native conditional requests, not custom
# locks. Composition note: layers under existing L4 CRUD recipes —
# crud-l0 / approval-workflow-l0 / invoicing-l0 MAY adopt the If-Match
# precondition without changing their resource model. Generic pattern;
# zero Korean law cite (R102+ generic catalog principle).

# ── Priority order for fork-receivers (R106 iter1 F2 closure — P4 박지영 lens) ──
# Adopt in order; earlier items are foundational.
#   1. OPTLOCK-ETAG-001
#   2. OPTLOCK-IFMATCH-001
#   3. OPTLOCK-VERSION-001
#   4. OPTLOCK-CONFLICT-001
#   5. OPTLOCK-RETRY-001
#   6. OPTLOCK-LOSTUPDATE-001
#   7. OPTLOCK-OBSERVABILITY-001

# ── RECIPE.md frontmatter example (R106 iter1 F3 closure — P5 이상호 lens) ──
#   ---
#   recipe: generic-optimistic-locking
#   optimistic_locking_enabled: true
#   optlock_etag_mode: strong  # version-derived
#   optlock_if_match_required: true
#   optlock_version_column: true
#   ---

# ── F8 standards pin (R106 iter1 F8 closure — P11 황태완 lens) ──
# Default pinned: strong ETag from @Version + If-Match required (RFC 7232 §3.1). 11-wave standards-pin streak (R93~R106).

items:
  - id: "OPTLOCK-ETAG-001"
    chapter: "Strong ETag derivation"
    requirement: "GET / mutating-response of a versioned resource MUST emit a strong `ETag` header (no `W/` weak prefix) derived deterministically from the resource version state — `ETag: \"<entityType>-<id>-<version>\"` where version is the JPA @Version value (or a hash of `updated_at` when no version column). Same resource state MUST yield byte-identical ETag; any field change MUST change the ETag. ETag MUST be quoted per RFC 7232 grammar."
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Strong validator (not weak) is required because If-Match on
      mutations demands exact-match comparison. Anchored to RFC 7232
      (https://datatracker.ietf.org/doc/html/rfc7232#section-2.3).
      Quote anchor (RFC 7232 §2.3): "An entity-tag is an opaque
      validator for differentiating between multiple representations of
      the same resource, regardless of whether those multiple
      representations are due to resource state changes over time,
      content negotiation resulting in multiple representations being
      valid at the same time, or both."
  - id: "OPTLOCK-IFMATCH-001"
    chapter: "If-Match precondition on mutations"
    requirement: "Mutating methods (PUT / PATCH / DELETE) on a versioned resource MUST require an `If-Match: \"<etag>\"` precondition. When the header is absent, the server MUST reject with 428 Precondition Required (RFC 6585) + RFC 9457 body `type=urn:problem:precondition-required`, refusing to apply the write. `If-Match: *` MAY be accepted to mean unconditional update only when the recipe explicitly opts in via `optlock_allow_wildcard_ifmatch=true` (default false)."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Forcing If-Match makes blind overwrites impossible by contract.
      Anchored to RFC 7232 §3.1 + RFC 6585 §3 (428).
      Quote anchor (RFC 7232 §3.1): "An origin server MUST NOT perform
      the requested method if a received If-Match condition evaluates to
      false; instead, the origin server MUST respond with either a) the
      412 (Precondition Failed) status code or b) one of the 2xx
      (Successful) status codes if the origin server has verified that a
      state change is being requested and the final state is already
      reflected in the current state of the target resource."
  - id: "OPTLOCK-VERSION-001"
    chapter: "JPA @Version optimistic column"
    requirement: "Every optimistically-locked entity MUST declare a `@Version` field (`Long` or `@Version Instant`/`@Version Timestamp`) mapped to a non-null version column with DB default 0. The persistence provider MUST increment it on every flush; application code MUST NOT manually set or reset @Version. The column MUST be `updatable=true` (provider-managed) but MUST NOT be exposed as a client-writable DTO field. ETag (OPTLOCK-ETAG-001) MUST be sourced from this same value."
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      JPA @Version is the canonical row-version optimistic-lock
      mechanism; a stale UPDATE bumps no rows and triggers
      OptimisticLockException. Anchored to Jakarta Persistence 3.1
      (https://jakarta.ee/specifications/persistence/3.1/jakarta-persistence-spec-3.1#a2059).
      Quote anchor (Jakarta Persistence 3.1 §3.4.2 Version Attributes): "An
      entity may access the state of its version field or property or
      export a method for use by the application to access the version,
      but must not modify the version value. ... The version attribute is
      updated by the persistence provider runtime when the object is
      written to the database."
  - id: "OPTLOCK-CONFLICT-001"
    chapter: "412 vs 409 conflict mapping"
    requirement: "When the supplied If-Match ETag does not match the current resource version (client validator is stale), the server MUST respond 412 Precondition Failed + RFC 9457 body `type=urn:problem:precondition-failed` carrying the current ETag in a `current_etag` member. When the precondition passes at request entry but the underlying flush raises OptimisticLockException (a concurrent committed bump in the same window), the server MUST translate it to 409 Conflict + `type=urn:problem:optimistic-lock-conflict`. The two outcomes MUST be distinguishable by status code."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      412 = client validator was already stale at request time; 409 =
      a race lost during commit. Anchored to RFC 9110 §15.5.13 (412) +
      §15.5.10 (409) + RFC 9457
      (https://datatracker.ietf.org/doc/html/rfc9110#section-15.5.13).
      Quote anchor (RFC 9110 §15.5.13): "The 412 (Precondition Failed)
      status code indicates that one or more conditions given in the
      request header fields evaluated to false when tested on the
      server."
  - id: "OPTLOCK-RETRY-001"
    chapter: "Client retry semantics"
    requirement: "On a 412/409 conflict the response MUST guide a safe client retry loop: include the authoritative `current_etag` in the Problem Details body so the client can re-GET, merge changes onto the fresh representation, and re-PUT/PATCH with the new If-Match. The server MUST NOT auto-merge or last-write-wins. Conflict responses MUST be free of `Retry-After` (the retry is conditional, not time-based) and the recipe documents a bounded client retry budget (default `optlock_client_retry_max=3`)."
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Read-modify-write is the only correct optimistic recovery; the
      server stays a pure validator. Anchored to MDN HTTP Conditional
      Requests
      (https://developer.mozilla.org/en-US/docs/Web/HTTP/Conditional_requests).
      Quote anchor (MDN Conditional requests — Avoiding the lost update
      problem with optimistic locking): "This is implemented using the
      If-Match or If-Unmodified-Since headers. If the ETag doesn't match
      the original file, or if the file has been modified since it has
      been obtained, the change is rejected with a 412 Precondition
      Failed error. It is then up to the client to deal with the error:
      either by notifying the user to start again (this time on the
      newest version), or by showing the user a diff of both versions,
      helping them decide which changes they wish to keep."
  - id: "OPTLOCK-LOSTUPDATE-001"
    chapter: "Lost-update prevention (concurrency)"
    requirement: "The contract MUST prevent the lost-update anomaly under concurrency: two clients each GET the resource at version v (same ETag), both PATCH with `If-Match: \"...-v\"`. Exactly ONE write MUST succeed (200/204, version → v+1); the OTHER MUST fail with 412 or 409 and MUST NOT overwrite the winner. Negative test: 2 concurrent PATCH with the identical stale ETag → assert one success + one conflict + final persisted state equals the winner's payload only."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      This is the keystone invariant — without If-Match + @Version the
      second writer silently clobbers the first. Anchored to RFC 7232
      §3.1 (https://datatracker.ietf.org/doc/html/rfc7232#section-3.1).
      Quote anchor (RFC 7232 §3.1): "If-Match is most often used with
      state-changing methods (e.g., POST, PUT, DELETE) to prevent
      accidental overwrites when multiple user agents might be acting in
      parallel on the same resource (i.e., to prevent the 'lost update'
      problem)."
  - id: "OPTLOCK-OBSERVABILITY-001"
    chapter: "관측 (3 canonical metrics)"
    requirement: "Optimistic-locking implementations MUST expose exactly 3 canonical Micrometer metrics with bounded-cardinality labels: (1) `optlock_conflict_total{resource, outcome}` — outcome ∈ {precondition_failed, lock_conflict}; (2) `optlock_precondition_required_total{resource}` — If-Match-absent rejections (428); (3) `optlock_write_seconds{resource, result}` (histogram, result ∈ {applied, conflict}). The `resource` label MUST be a fixed entity-type enum; labels MUST exclude resource_id / etag / version / user_id (no PII, no high-cardinality). SLO/alert wiring is a fork-receiver concern."
    test_method: "Micrometer registry assertion"
    verification_type: "positive"
    applicable: true
    notes: >
      Bounded labels keep the time-series count finite. Anchored to
      OpenTelemetry Semantic Conventions for HTTP metrics
      (https://opentelemetry.io/docs/specs/semconv/http/http-metrics/).
      Reference: OTel HTTP metrics semantic conventions (see source; no
      verbatim quote — the cited page constrains specific attributes to
      low cardinality per-metric rather than carrying a single blanket
      sentence prohibiting unbounded-cardinality labels).

  - id: "OPTLOCK-REPARENT-CYCLE-001"
    chapter: "Self-referential reparent acyclicity"
    requirement: >
      Moving a node in a MUTABLE self-referential tree/hierarchy (org chart,
      category/taxonomy tree, folder tree, BOM, threaded comment, GL account
      tree) by setting node.parent = target MUST reject any reparent that would
      introduce a CYCLE. The target parent MUST NOT be the node itself, NOR any
      of the node's own descendants; persisting such a move would detach the
      node's subtree into an unreachable cycle and break every recursive
      descendant traversal of the tree. The check target NOT IN ({node} UNION
      descendants(node)) MUST be evaluated server-side, inside the SAME
      transaction as the parent write (so a concurrent reparent cannot slip a
      cycle through the check-to-write window), and a violating move MUST be
      rejected with 409 Conflict or 422 Unprocessable Entity carrying an RFC
      9457 body of type=urn:problem:tree-cycle — never silently applied. The
      invariant: the parent relation of a self-referential hierarchy MUST
      remain a directed acyclic graph (a forest) across every reparent.
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Pairs with OPTLOCK-IFMATCH-001 + OPTLOCK-VERSION-001 — concurrent
      reparents race the same node's parent column, so the acyclicity check
      MUST run under the optimistic-lock guard, not before it. Generic across
      org chart, category/taxonomy, folder/file tree, BOM explosion, threaded
      comments and GL account trees. Descendant computation is a transitive
      closure over the parent edges (PostgreSQL WITH RECURSIVE, a closure
      table, or an in-memory walk). Anchored to the directed-acyclic-graph
      definition (no directed cycles) and the PostgreSQL recursive-CTE
      hierarchical-traversal docs. Negative test: reparent a node under one of
      its own descendants -> assert 409/422 + tree-cycle problem type + parent
      column unchanged; positive test: reparent under an unrelated subtree ->
      assert 200/204 + acyclic forest preserved.

  - id: "OPTLOCK-NULLPRIMITIVE-001"
    chapter: "Primitive numeric field rejects null (no silent coercion)"
    requirement: >
      A mutable-resource create / update request whose body carries an EXPLICIT JSON
      null for a primitive numeric field (e.g. a `int quantity` component) MUST be
      rejected with 400 Bad Request — the binding layer MUST NOT silently coerce the
      null to the primitive zero value and let a semantically-absent quantity reach
      business logic. A null quantity is a client error (the field was sent but empty),
      not a request for quantity 0; coercion would mask the error and could, on a
      versioned resource, persist an unintended 0. Fork-receivers MUST keep the
      framework's fail-on-null-for-primitives binding strictness ON (do not re-enable
      lossy coercion).
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Pairs with the strict-binding posture of request-validation-l0#VALIDATION-TYPE-001
      (no silent coercion). Anchored to RFC 8259 §3 (JSON `null` is a distinct value,
      not a number) + JSON Schema 2020-12 `type` keyword (a null instance does not
      validate against `integer`). The reference optlock CreateRequest declares
      `int quantity` (a Java primitive); a JSON null cannot bind to it, so the strict
      binder rejects the request rather than defaulting to 0. Quote anchor (RFC 8259
      §3 Values): "A JSON value MUST be an object, array, number, or string, or one of
      the following three literal names: false null true." — null is not a number.
      Negative test: POST the create endpoint with {"quantity":null} → assert 400 and
      the resource is NOT created with quantity 0.
