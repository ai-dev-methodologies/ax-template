version: "0.1.0"
scope: "chat-messaging-l0 — realtime 1:1 / group / broadcast chat 시스템 (message envelope / room lifecycle / delivery guarantees / presence + typing / history pagination / moderation + 청소년보호 / observability) contract for fork-receivers building messaging surfaces (SaaS 고객 지원 / 팀 협업 / 마켓플레이스 판매자-구매자 / 커뮤니티 / 푸시 알림 inbox). Builds on realtime-policy-l0 (R94) transport contract."
stack: "Spring Boot 3.2.x + Spring WebSocket (STOMP) + JPA + Redis (presence) + RabbitMQ or Kafka (fan-out broker) + Caffeine (local cache) + identity-verification (R54 audit) + Micrometer metrics"
standard: "XMPP RFC 6120 (Core) + RFC 6121 (IM/Presence) + Matrix.org Client-Server API spec + RFC 8259 (JSON) + RFC 3339 (timestamps) + XEP-0184 (Message Delivery Receipts) + XEP-0085 (Chat State Notifications) + XEP-0313 (Message Archive Management) + 정보통신망법 §44의2 (이용자 신고 처리 의무) + 정보통신망법 §44의7 (불법정보 유통 금지) + 청소년보호법 §16의2 (청소년 유해정보 차단) + 개인정보보호법 §29 (안전성 확보 조치 — 메시지 암호화)"
domain_mode: full_trio
introduced_at: "R98 phase α — seeded as the 6th modular-catalog candidate from R93 probability table (40% adoption — A6 chat). Pivot from R97 mandatory_R98_iter1_agenda A5 결재 (collision with existing approval-workflow-l0.yaml R31 active workload). P3 김민준 mobile lens 다시 활성 wave (모바일 chat UI is the default consumer surface — KakaoTalk-grade UX expectations) + P11 황태완 standards lens (XMPP RFC 6120 / Matrix.org / RFC 8259 JSON) + P10 신경수 backward-compat lens (기존 polling-based notification 시스템에서 realtime chat 전환). **Second mechanical wave** to follow R97 5-commit shape (phase α atomic via wave_kickoff_ledger_guard + iter1 closures + iter1 ledger + iter2 terminator + registry backfill via R98 49th guard registry_backfill_completeness_guard). R98 P12 NEW finding TBD at iter1."

# chat-messaging is OPT-IN. ax-template's reference workloads do NOT
# require chat (R30 ASVS L1 baseline assumes simple bearer-token auth +
# REST-only API). Recipes building messaging surfaces (고객 지원 인박스
# / 팀 협업 채널 / 마켓플레이스 메신저 / 커뮤니티 댓글-as-chat / 푸시
# 알림 inbox) MUST adopt items below before production. This spec
# defines the policy contract; the future templates/L4/chat-messaging/
# vertical will define canonical Spring WebSocket + STOMP + Redis +
# broker wiring.
#
# Composition note (depends on existing catalog domains):
# - CHAT-DELIVERY-001 cross-references realtime-policy-l0 (R94) for the
#   WebSocket subprotocol pinning + reconnect backoff + tenant scope.
#   Chat MUST adopt RT-RECONNECT-001 + RT-SUBPROTOCOL-001 + RT-TENANT-SCOPE-001
#   before production. Without realtime-policy R94 in place, chat delivery
#   degrades to long-poll fallback (acceptable but not the canonical path).
# - CHAT-MODERATION-001 cross-references identity-verification-l0 (R54)
#   for moderation audit trail — moderator identity tracked via the same
#   VerifiedIdentity ElementCollection pattern (R67 AuditPiiHelper recipient
#   hash). 신고 처리 정보통신망법 §44의2 의무 이행은 actor 신원 boundary
#   필요.
# - CHAT-OBSERVABILITY-001 will adopt OBSERVABILITY-002 표준 item (R98
#   mandatory_R98_iter1_agenda item #2) when that lands across the 5 affected
#   specs (multi-tenant + realtime + invoicing + 2FA + document-signing).
#   chat-messaging will be the 6th adopter.

# ── Priority order for fork-receivers (R98 iter1 F2 closure — P4 박지영 lens) ──
# Adopt items in this order. Earlier items are foundational for later
# ones — skipping CHAT-MESSAGE-001 (envelope schema) makes everything
# else moot because un-declared envelope cannot be canonically routed
# OR persisted. 6-wave pattern (R93/R94/R95/R96/R97/R98 F2): Junior
# priority lens consistently flags missing adoption order — closure
# adds explicit foundation rationale to spec body.
#
#   1. CHAT-MESSAGE-001       — envelope schema (foundation; everything else references envelope)
#   2. CHAT-ROOM-001          — room lifecycle (dm idempotent / group ADMIN / broadcast write-only)
#   3. CHAT-DELIVERY-001      — at-least-once outbox + receipts (depends on envelope persistence)
#   4. CHAT-PRESENCE-001      — presence + typing (UX layer; ephemeral)
#   5. CHAT-HISTORY-001       — cursor pagination + offline catchup
#   6. CHAT-MODERATION-001    — moderation + 신고 (depends on stable envelope + history tombstones)
#   7. CHAT-OBSERVABILITY-001 — 3 canonical metrics

# ── RECIPE.md frontmatter example (R98 iter1 F3 closure — P5 이상호 lens) ──
# Canonical opt-in shape. 6-wave pattern (R93/R94/R95/R96/R97/R98 F3): Senior
# docs lens consistently flags missing copy-pasteable recipe block — closure
# adds verbatim saas-customer-support-chat frontmatter example.
#
#   ---
#   recipe: saas-customer-support-chat
#   tenant_model: multi
#   default_locale: ko-KR
#   supported_locales: [ko-KR, en-US]
#   chat_enabled: true
#   chat_message_id_format: ulid                  # R98 F8 default — lexicographic sort + 128-bit + millisecond timestamp
#   chat_default_room_retention_days: 90          # CHAT-HISTORY-001 default
#   chat_realtime_subprotocol: stomp-v12          # R94 RT-SUBPROTOCOL-001 reference (Spring WebSocket default)
#   chat_moderation_report_sla_hours: 24          # 정보통신망법 §44의2 1차 처리 SLA
#   chat_moderation_final_response_days: 7        # 정보통신망법 §44의2 최종 통보 SLA
#   chat_min_age_filter_enabled: true             # 청소년보호법 §16의2 가입 시 미성년자 보호 layer
#   chat_e2e_encryption: false                    # default at-rest only; vertical-flip for healthcare/legal
#   chat_broker: rabbitmq                         # OR kafka (fan-out vs partition semantics)
#   chat_presence_grace_seconds: 30               # CHAT-PRESENCE-001 default
#   chat_typing_inactivity_seconds: 5             # CHAT-PRESENCE-001 ephemeral expiry
#   ---
#
# Fork-receivers building 의료 / 금융 / 법률 verticals SHOULD flip
# chat_e2e_encryption=true (Signal Protocol / Megolm) per
# 개인정보보호법 §29 안전성 확보 조치 + 의료법 §21 환자정보 보호.
# 청소년 vertical (게임 + 교육) MUST enable chat_min_age_filter_enabled
# per 청소년보호법 §16의2.

items:
  # ── MESSAGE family ─────────────────────────────────────────────────────
  - id: "CHAT-MESSAGE-001"
    chapter: "메시지 envelope schema"
    requirement: "All chat messages MUST carry a canonical envelope with the following required fields: `id` (UUID v4, server-assigned at persistence), `room_id` (UUID referencing CHAT-ROOM-001), `sender_id` (user id), `timestamp` (RFC 3339 UTC with `Z` suffix), `content_type` (enum: text/plain, text/markdown, application/json, image/*, file/*), `body` (string OR base64-encoded binary OR JSON object). Optional: `reply_to_id` (UUID referencing parent message for threading), `mentions[]` (list of user ids referenced via @-notation), `client_msg_id` (client-generated UUID for idempotency — server dedups on (sender_id, client_msg_id) tuple for 24h window). Envelope MUST be JSON (RFC 8259) — binary content_type values encode body as base64 string. Server MUST reject envelopes lacking any required field with HTTP 400."
    test_method: "RestAssured integration test"
    verification_type: "negative"
    applicable: true
    notes: >
      Test: POST /api/chat/rooms/{room}/messages with missing `room_id`
      → 400. POST with two identical (sender_id, client_msg_id) within
      24h → 200 idempotent (same `id` returned). POST with malformed
      RFC 3339 timestamp → 400. Anchored to RFC 6120 §8 (XMPP Stanzas)
      + Matrix Client-Server spec §13.2 (Room Events) + RFC 8259 (JSON
      Data Interchange) + RFC 3339 (Date and Time on the Internet).
      Quote anchor (RFC 6120 §8.1.1): "The 'id' attribute is REQUIRED
      for the IQ stanza, RECOMMENDED for the message stanza, and
      OPTIONAL for the presence stanza."
      R98 iter1 F8 closure (P11 황태완 standards lens): message id
      format MUST be pinned per RFC 4122 (UUID) vs ULID spec
      (https://github.com/ulid/spec) vs Snowflake — recipe declares
      `chat_message_id_format` in RECIPE.md frontmatter where value
      ∈ {uuid-v4, ulid, snowflake}. Default catalog opinion: `ulid`
      (lexicographic sort order compatible with CHAT-HISTORY-001
      cursor pagination; 128-bit collision-free; embeds millisecond
      timestamp prefix for natural temporal ordering). `uuid-v4`
      acceptable but breaks cursor lexsort assumption — recipe must
      maintain separate sort field. `snowflake` requires central id
      allocator (operational complexity; only for high-scale verticals
      requiring sub-millisecond resolution). 6-wave streak: R93 ISO
      8601 Z + R94 subprotocol + R95 XML namespace + R96 WebAuthn
      attestation + R97 c14n+PAdES baseline + R98 message id format.
      P11 standards lens consistently catches default-pinning gap
      at phase α — closure adds default catalog opinion to spec body.

  # ── ROOM family ─────────────────────────────────────────────────────────
  - id: "CHAT-ROOM-001"
    chapter: "Room lifecycle (1:1 / group / broadcast)"
    requirement: "Rooms MUST declare a `room_type` enum: {dm, group, broadcast}. DM rooms are idempotent on (member_a_id, member_b_id) — POST /api/chat/rooms with same member pair returns the existing room (200) NOT a new room (201). Group rooms support multi-member with at least one ADMIN role (creator becomes ADMIN by default); ADMIN can invite/kick/ban members + assign other ADMINs. Broadcast rooms are write-only: only the room owner (declared at creation) can post; all other members are read-only subscribers (channel pattern). Membership transitions (join / leave / kick / ban) MUST emit CHAT-MESSAGE-001 envelopes with content_type=application/json and structured body (`{type: 'membership', action, actor_id, target_id}`) — clients render these as system events."
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: POST /api/chat/rooms {type=dm, members=[A,B]} twice → same
      room.id returned. POST {type=group} then PATCH adds member C → C
      receives CHAT-MESSAGE-001 with body.type=membership.action=join.
      Broadcast room MUST reject POST /messages from non-owner with 403.
      Anchored to Matrix Client-Server spec §6 (Rooms) + XMPP MUC RFC
      7574 (Multi-User Chat) + RFC 7574 §7 (creation semantics).
      Quote anchor (Matrix Client-Server §6.1): "A room has a list of
      members, and each member has a power level."

  # ── DELIVERY family ────────────────────────────────────────────────────
  - id: "CHAT-DELIVERY-001"
    chapter: "Delivery guarantees (ack / receipt / read)"
    requirement: "Messages MUST be persisted to the outbox (CHAT-MESSAGE-001) BEFORE being broadcast to subscribers — at-least-once delivery semantics. Receivers MUST send `delivered` receipt (XEP-0184) upon receiving via WebSocket OR upon HTTP GET retrieval; server stores receipt per (message_id, recipient_id). Receivers MUST send `read` marker per (room_id, user_id) tuple — read marker is room-scoped 'up to and including this message_id' NOT per-message. Receipt and read are SEPARATE semantics: `delivered` = bytes received by client; `read` = displayed to user (UI-determined timing). Server-Sent Events (SSE) / WebSocket disconnections MUST trigger redelivery on reconnect via CHAT-HISTORY-001 catchup (last_seen_msg_id parameter)."
    test_method: "RestAssured + WebSocket integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: send message → DB outbox row exists BEFORE WebSocket emit.
      Receiver disconnects + reconnects → server returns messages since
      last_seen_msg_id (CHAT-HISTORY-001 catchup). Receipt acks (XEP-0184
      <received/>) and read markers separate — read marker advancing
      DOES NOT auto-mark all earlier messages delivered (independent).
      Cross-references realtime-policy-l0 (R94) RT-RECONNECT-001 for
      reconnect backoff + RT-SUBPROTOCOL-001 for STOMP/WebSocket framing.
      Anchored to XEP-0184 (Message Delivery Receipts) + Matrix Receipts
      §13.5 (m.receipt event) + RFC 6120 §10 (Server-to-Server XML
      streams reliability).
      Quote anchor (XEP-0184 §1): "The intent of this protocol is to
      enable a sender to know that the recipient has received the
      message."

  # ── PRESENCE family ────────────────────────────────────────────────────
  - id: "CHAT-PRESENCE-001"
    chapter: "Presence + typing indicators"
    requirement: "Presence states: enum {online, away, busy, offline, invisible}. `online` set on WebSocket connect; `offline` set on disconnect with 30s grace period (handles brief reconnects). `away` = client-declared (5min+ idle); `busy` = client-declared (do-not-disturb); `invisible` = appears offline to others but receives messages normally. Typing indicators MUST be ephemeral (no persistence) — emit `typing` event on first keystroke + `stopped` event after 5s of inactivity OR on send. Typing scoped to room (other room members see indicator). Last-seen-at timestamp MUST be room-scoped (privacy: A and B share last-seen only if they share a room); never globally exposed. `invisible` presence MUST be sticky — server respects user's setting across reconnects."
    test_method: "RestAssured + WebSocket integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: user A connects → presence online emitted to room members.
      A sets away via API → presence updates. A disconnects → 30s
      grace before presence flips offline. A sends typing event → other
      room members receive within 200ms. 5s without typing → stopped
      emitted automatically. invisible presence persists across reconnect.
      Anchored to RFC 6121 §4 (Presence Stanzas) + XEP-0085 (Chat State
      Notifications) + Matrix Presence §13.6 (m.presence).
      Quote anchor (RFC 6121 §4.1): "Presence is the mechanism whereby
      an entity is informed about the network availability of other
      entities."

  # ── HISTORY family ────────────────────────────────────────────────────
  - id: "CHAT-HISTORY-001"
    chapter: "Message history + pagination + offline catchup"
    requirement: "GET /api/chat/rooms/{room_id}/messages MUST support cursor-based pagination via `before` (message_id, older direction) and `after` (message_id, newer direction) parameters. Cursor MUST NOT be offset-based (avoids drift on concurrent insertions). Default page size 50 messages; max 500. Response carries `Link` header (RFC 5988) with `prev` and `next` rel values. Offline catchup: client sends `last_seen_msg_id` query parameter; server returns ALL messages with id > last_seen_msg_id, ordered ascending (oldest first for sequential replay). Per-room retention policy MUST be declared (default 90 days; archive policy fork-receiver concern). Deleted messages (CHAT-MODERATION-001) MUST appear in history with body=null and `deleted_at` populated (tombstone — preserves message id continuity for read markers)."
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: GET /messages?before=<id> returns 50 older messages with
      Link header. GET /messages?last_seen_msg_id=<id> returns all
      messages since that id ASC ordered. Message soft-deleted via
      moderation API → still appears in pagination with body=null +
      deleted_at populated. Anchored to RFC 5988 (Link header) + XEP-0313
      (Message Archive Management) + Matrix /messages §13.3 (room event
      pagination).
      Quote anchor (RFC 5988 §1): "This document defines a means of
      indicating the relationships between resources on the Web."

  # ── MODERATION family ─────────────────────────────────────────────────
  - id: "CHAT-MODERATION-001"
    chapter: "Moderation + 청소년보호 + 신고 처리"
    requirement: "User-level moderation: `block` (mute incoming from blocked user — blocked user can still see un-blocked room participants), `report` (escalate to admin with reason category + free-text). Room-level moderation: `kick` (remove member; can rejoin), `ban` (remove + prevent rejoin), `mute_room` (member can read but not write for N minutes). Content-level moderation: ADMIN can soft-delete a message (tombstone per CHAT-HISTORY-001) — body=null, deleted_at populated. Moderation events MUST emit audit log entries (R67 AuditPiiHelper recipient_hash pattern; never raw user ids in logs). 정보통신망법 §44의2 (정보통신서비스 제공자 이용자 보호의무): report 접수 24h 내 1차 처리 + 7d 내 최종 통보 SLA enforced via outbox + scheduled task. 청소년보호법 §16의2 + 정보통신망법 §44의7 (불법정보 유통 금지): 청소년 유해정보 자동 필터링 시 (text classifier hook 위치 표시 only — implementation fork-receiver concern)."
    test_method: "RestAssured integration test"
    verification_type: "positive"
    applicable: true
    notes: >
      Test: user A blocks B → B's messages do not appear in A's stream
      (server-side filter). report → audit log entry with R67 recipient
      hash (not raw user id). ADMIN soft-deletes message → CHAT-HISTORY
      retrieval shows tombstone. report SLA: outbox row scheduled for
      24h initial handling reminder + 7d final notification.
      Cross-references identity-verification-l0 (R54) for moderator
      VerifiedIdentity tracking in audit trail (moderator boundary).
      Anchored to 정보통신망법 §44의2 (이용자 보호의무) + §44의7 (불법정보
      유통 금지) + 청소년보호법 §16의2 (청소년 유해정보 차단) + Matrix
      Moderation §15 + XMPP Privacy Lists XEP-0016.
      Quote anchor (정보통신망법 §44의2①): "정보통신서비스 제공자는 자신이
      운영ㆍ관리하는 정보통신망에 유통되는 정보로 인하여 사생활 침해 또는
      명예훼손 등 타인의 권리가 침해된 경우 그 침해를 받은 자가 침해사실을
      소명하여 그 정보의 삭제 또는 반박내용의 게재(이하 "삭제등"이라 한다)를
      요청하면 지체 없이 삭제ㆍ임시조치 등의 필요한 조치를 하고 즉시 신청인
      및 정보게재자에게 알려야 한다."

  # ── OBSERVABILITY family ──────────────────────────────────────────────
  - id: "CHAT-OBSERVABILITY-001"
    chapter: "관측 (3 canonical metrics)"
    verification:
      mechanism: rule
      ref: domain-metrics-bounded-cardinality
    requirement: "Chat implementations MUST expose exactly three canonical Micrometer metrics with bounded cardinality labels: (1) `chat_messages_sent_total{tenant, room_type}` — messages sent (counter; room_type ∈ {dm, group, broadcast}); (2) `chat_delivery_failure_rate{tenant, reason}` — delivery failures (counter; reason ∈ {timeout, receiver_offline, room_disabled, blocked_by_recipient, broker_unavailable}); (3) `chat_active_room_count{tenant}` — currently-active rooms with at least 1 member online (gauge). Labels MUST exclude user_id, room_id, message_id, content_body, or any high-cardinality / PII value. SLO/alert wiring is fork-receiver concern (scope_deferral; matches R93/R94/R95/R96/R97 F6 pattern — 6th wave consecutive)."
    test_method: "Micrometer registry assertion test"
    verification_type: "positive"
    applicable: true
    notes: >
      Implementation: Micrometer MeterRegistry with @ConditionalOnClass
      Counter.builder() / Gauge.builder() invocations + MeterFilter
      denylist for user_id / room_id / message_id labels.
      Anchored to OpenTelemetry Semantic Conventions
      (https://opentelemetry.io/docs/specs/semconv/) §metric naming
      + 6-wave canonical "3 metric" pattern (R94 realtime / R95
      invoicing / R96 two-factor-auth / R97 document-signing all
      settled on 3-metric bounded-label discipline; chat-messaging
      inherits). When R98 mandatory_R98_iter1_agenda item #2
      (OBSERVABILITY-002 표준 item batch) lands, this item adopts.
      Quote anchor (OpenTelemetry semconv stability): "Label
      cardinality SHOULD be bounded to prevent metric explosion."
