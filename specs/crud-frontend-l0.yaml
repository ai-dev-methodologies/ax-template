# specs/crud-frontend-l0.yaml
# Page Compliance Spec — crud domain, full_trio mode.
#
# Every item's backend_operation_id resolves to contracts/crud-openapi.yaml.
# Every item's backend_spec_ref resolves to an id in specs/crud-security.yaml.
# static_source_ref is [] for all items (full_trio: FORBIDDEN to be non-empty).

domain: crud
domain_mode: full_trio
backend_spec_ref: specs/crud-security.yaml
frontend_required: true

items:
  - id: CRUD-FE-001
    requirement: "Items list page renders DataTable with server-paginated data and calls the listItems endpoint"
    backend_operation_id: listItems
    backend_spec_ref: CRUD-AUTH-1
    static_source_ref: []
    test_method: "crud/composition.spec.ts"
    verification_type: e2e_test
    policy_ref: "blueprints/crud-ui-manifest.yaml#a11y"
    coverage_threshold: 1.0
    backend_only_marker: false

  - id: CRUD-FE-002
    verification:
      mechanism: rule
      ref: crud-frontend-pages-bind-crud-contract
    requirement: "Items list page renders FilterBar and SearchInput allowing users to filter the list"
