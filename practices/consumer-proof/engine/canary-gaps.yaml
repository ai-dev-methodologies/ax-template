# Every entry below was verified absent AT PLANT TIME (2026-07-19) by actually
# running the stored grep/find command against this repo's HEAD and confirming
# it returns zero matches. If a future catalog change closes one of these
# (the grep starts matching), the canary is stale and must be re-verified or
# replaced before the next wave — a canary that has silently become "covered"
# can no longer prove the loop's gap-detection reflex.
#
# canary: true on every entry — these are NOT real BACKLOG candidates. They
# are excluded from BACKLOG registration by construction (Part 3.6: "Canary
# rows are tagged canary: true and excluded from real BACKLOG registration").
