# S2.QUERY-BOUNDS.XB, CANARY-006 <-> S1.multi-tenant.BE). That is intentional
# and harmless: coverage-map.yaml already carries the honest gap/partial status
# for those cells; canary-gaps.yaml is a SEPARATE staging file whose only job
# is to feed the wave orchestrator's STEP-1 injection + STEP-5 falsifiability
# check (Part 3.6), never the scored map itself.
