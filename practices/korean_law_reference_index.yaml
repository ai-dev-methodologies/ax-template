# Mechanical anchor class taxonomy reference (R100 contribution)
mechanical_anchor_classes:
  - class: hard_guard
    description: |
      Mandatory shell guard registered in practices/evals/run-all-guards.sh.
      Runs as part of verify-completion (R25 Iron Law) and may be invoked
      from pre-commit / pre-push hooks. Fork-receivers cannot opt out
      without breaking catalog quality contract.
    examples:
      - "R97 48th wave_kickoff_ledger_guard.sh"
      - "R98 49th registry_backfill_completeness_guard.sh"
      - "R85 spec_policy_ref_guard.sh"

  - class: catalog_helper
    description: |
      Catalog-provided shell script, fork-receiver opt-in. NOT registered
      in run-all-guards.sh. Fork-receivers wire to .git/hooks/pre-commit
      (or Husky / lefthook / pre-commit framework) per their workflow.
      Catalog provides contract; fork-receiver decides adoption per the
      CLAUDE.md fork-receiver-decides-git-policy principle.
    examples:
      - "R99 practices/scripts/pre-commit-fast-guards.sh"

  - class: data_artifact
    description: |
      Static YAML / JSON / Markdown reference file. NO execution semantics.
      Read by humans (P6 한국 규제 lens compliance audit) or by other
      tools (future build_law_index.sh generator). Catalog provides
      structured data; consumers query.
    examples:
      - "R100 practices/korean_law_reference_index.yaml (this file)"

  # Future class candidates (R101+ exploration):
  - class: auto_data_artifact
    description: |
      Static DATA artifact + automated generator script. Generator scans
      catalog state + emits artifact. Bridges DATA artifact and HELPER —
      data is canonical (committed), generator keeps it synced. R101
      mandatory_iter1_agenda candidate via build_law_index.sh + this
      YAML synced.
    examples: []  # not yet introduced
