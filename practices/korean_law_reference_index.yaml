schema_version: 1
description: |
  Aggregated index of 한국법 (Korean law) citations across the ax-template
  catalog. Built as the R100 pre-wave artifact closing R99 P12 F10 NEW
  finding — **3rd mechanical anchor class** (DATA artifact) after R97/R98
  hard guards + R99 catalog HELPER. Demonstrates pattern adaptation
  beyond hard-guard-only mechanical anchors.

  Primary consumer: P6 한국 규제 lens compliance audit. Secondary consumer:
  standards lens (P11) for ratification of Korean standards against
  international counterparts.

  Scope: R94-R99 modular catalog specs (6 specs) + selected L4 workload
  references found in spec headers / standard fields / items[].notes.
  L4 backfill (auth / payment / billing / etc. internal law cites) is
  R101+ extension agenda (see future_work below).

  Generator: MANUAL update at each wave end. R101 mandatory_iter1_agenda
  candidate: build_law_index.sh script to keep index synced. Pattern
  fitness check (per R99 P12 observation): 3rd anchor class adaptation
  validates the pattern is NOT ritualistic — DATA artifact class is
  distinct from hard guard / HELPER classes.

last_updated_at: "R100 pre-wave (catalog snapshot post R99 commit 8b1a21a)"
catalog_revision_seen: "R94-R99 modular catalog 6 specs + L4 partial"

# Schema:
# laws[].id              short canonical Korean law name
# laws[].full_name       official Korean law full name
# laws[].domain          lens grouping (privacy / commerce / public_sector / industry_specific / tax)
# laws[].citations[].section    §-prefix section reference
# laws[].citations[].topic      human-readable topic
# laws[].citations[].references[].spec     spec file path
# laws[].citations[].references[].item     spec item id (or 'standard:' field for top-level cite)
# laws[].citations[].references[].wave     catalog wave (R94-R99)
# laws[].citations[].references[].context  brief description of how the law applies

