version: '1.0'
notes: 'PRD-final-4 W1 per-URL fetch receipts (Lane A, single-writer). EVERY attempted URL during the
  2026-07-30 curl+snapshot-extract.sh refresh gets a `kind: fetch` row here — url, curl_exit, http_status,
  bytes + sha256 of THAT URL''s EXTRACTED output (not the raw HTML download size), fetched_at, and error
  (blank unless the transport itself failed; a substantively-empty-but-200 response, e.g. recharts.org
  root, is not an error). A `kind: assembly` row additionally records, per touched (catalog, snapshot_id)
  identity, the sha256 + byte count of that identity''s FULL assembled BODY (the snapshot file with its
  header stripped, split on the first `---\n\n` divider) plus the `from_receipts` list of fetch-row ids
  it was built from (append-only: historical pre-2026-07-30 content is preserved verbatim and is not re-fetched,
  so only THIS session''s new URLs are listed). recharts-2026-05 has fetch rows only (5 canonical probe
  URLs + 2 informational root/redirect checks) — no snapshot body or assembly row exists for it; it stays
  a registered-but-dead residual (BACKLOG W5(c)).'
