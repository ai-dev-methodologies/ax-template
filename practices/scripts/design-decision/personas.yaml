# design-system/personas.yaml
# ─────────────────────────────────────────────────────────────────────────────
# DESIGN PERSONAS — the audience archetypes that DRIVE which design gets chosen.
#
# A persona is NOT a user story. It is a *design-direction contract*: given a
# product whose audience matches a persona, the design-decision algorithm
# (design_decide.py) uses these fields to score and pick catalog components, a
# theme (tokens), typography, and a motion budget. Personas are the policy layer;
# the 3696-component crawl (attributes.json) is the supply; the algorithm is the
# matcher.
#
# Every persona declares:
#   design_direction  — one of the worthwhile style directions (web/design-quality.md)
#   palette_intent    — semantic intent weighting (maps to --ax-status-* / --ax-color-* tokens)
#   typography        — display + body pairing strategy + scale contrast
#   motion_level      — 0 none · 1 restrained · 2 expressive · 3 cinematic
#   density           — compact | comfortable | airy   (drives complexity/whitespace fit)
#   a11y_priority     — 1..3  (3 = regulated/operator-critical; raises has_aria weight)
#   category_affinity — catalog categories this persona reaches for, weighted
#   avoid             — anti-template / off-brand signals the algorithm penalizes
#   token_overrides   — persona-specific theme deltas applied on top of ux-design-tokens-l0
# ─────────────────────────────────────────────────────────────────────────────
schema_version: 1
last_verified_at: "2026-06-03"

personas:
  - id: enterprise-operator
    name: "Enterprise Operator"
    audience: "B2B SaaS admin / internal operator console; power users living in the app 6h/day"
    design_direction: ["swiss", "data-dense-dashboard"]
    palette_intent: { neutral: 3, info: 2, success: 1, danger: 1, accent: 1 }
    typography:
      display: "geometric sans, tight tracking, modest scale"
      body: "neutral grotesque, 14px base, high legibility"
      scale_contrast: low        # function over drama
    motion_level: 1              # state feedback only; no decorative motion
    density: compact
    a11y_priority: 3             # keyboard-first, SR-critical, WCAG AA hard floor
    category_affinity:
      table: 3, form: 3, input: 3, sidebar: 2, menu: 2, chart: 2, command: 2, button: 2, card: 1
    avoid: ["shader", "confetti", "gradient-hero", "cinematic-motion", "glass"]
    token_overrides: { surface_elevation: flat, radius: "6px", accent_saturation: low }

  - id: consumer-delight
    name: "Consumer Delight"
    audience: "B2C mobile-first app / marketing site; first-time visitors, emotional conversion"
    design_direction: ["bento", "glassmorphism"]
    palette_intent: { accent: 3, info: 2, attention: 2, success: 2, neutral: 1 }
    typography:
      display: "rounded humanist sans, large, friendly"
      body: "humanist sans, 16px base, relaxed leading"
      scale_contrast: high       # big playful hero → calm body
    motion_level: 2              # entrance + hover delight, spring physics
    density: airy
    a11y_priority: 2
    category_affinity:
      hero: 3, card: 3, button: 3, features: 2, testimonial: 2, pricing: 2, image: 2, badge: 1
    avoid: ["data-table-walls", "terminal", "monospace-body"]
    token_overrides: { surface_elevation: layered, radius: "20px", accent_saturation: high }

  - id: editorial-luxury
    name: "Editorial / Luxury"
    audience: "Brand site / portfolio / publishing; taste-driven, image-and-type forward"
    design_direction: ["editorial", "light-luxury", "scrollytelling"]
    palette_intent: { neutral: 3, accent: 1, attention: 1 }   # restraint; color is rare punctuation
    typography:
      display: "high-contrast serif or fashion grotesk, very large"
      body: "book serif or refined sans, generous measure"
      scale_contrast: extreme    # editorial scale jumps
    motion_level: 2              # refined reveal / parallax, never bouncy
    density: airy
    a11y_priority: 2
    category_affinity:
      hero: 3, image: 3, text: 3, gallery: 2, scrolly: 2, card: 1, menu: 1
    avoid: ["dashboard", "data-table", "neon", "confetti", "saturated-gradient"]
    token_overrides: { surface_elevation: flat, radius: "0px", accent_saturation: low }

  - id: developer-tool
    name: "Developer Tool"
    audience: "Dev-facing product / API docs / CLI companion; keyboard-first, dark-by-default"
    design_direction: ["retro-futurism", "swiss"]   # terminal/code aesthetic, disciplined grid
    palette_intent: { neutral: 3, info: 2, success: 2, danger: 2, accent: 1 }
    typography:
      display: "grotesk, tight"
      body: "monospace for code surfaces, sans for prose, 14px"
      scale_contrast: medium
    motion_level: 1
    density: compact
    a11y_priority: 3             # keyboard nav + focus rings are the product
    category_affinity:
      code: 3, terminal: 3, command: 3, table: 2, menu: 2, button: 2, input: 2, card: 1
    avoid: ["shader", "confetti", "rounded-pill-everything", "illustration-hero"]
    token_overrides: { surface_elevation: flat, radius: "4px", default_mode: dark }

  - id: fintech-trust
    name: "Fintech Trust"
    audience: "Banking / payments / regulated finance; trust, clarity, number-correctness"
    design_direction: ["swiss", "dark-luxury"]   # disciplined, secure-feeling
    palette_intent: { neutral: 3, success: 2, info: 2, danger: 2, accent: 1 }
    typography:
      display: "grotesk, confident, not loud"
      body: "tabular-figure sans (numerals align), 15px"
      scale_contrast: medium
    motion_level: 1              # conservative; motion must never imply instability
    density: comfortable
    a11y_priority: 3             # regulated; AA+ and clear error states mandatory
    category_affinity:
      stat: 3, chart: 3, table: 3, form: 3, card: 2, button: 2, input: 2, badge: 2
    avoid: ["confetti", "shader", "playful-wobble", "neon-gradient", "glass-over-data"]
    token_overrides: { surface_elevation: subtle, radius: "8px", accent_saturation: low, tabular_nums: true }

  - id: playful-creator
    name: "Playful Creator"
    audience: "Social / creator / community app; expressive, avatar-rich, reaction-driven"
    design_direction: ["claymorphism", "glassmorphism", "3d-integration"]
    palette_intent: { accent: 3, attention: 3, info: 2, success: 2 }
    typography:
      display: "chunky rounded display, playful"
      body: "rounded sans, 16px"
      scale_contrast: high
    motion_level: 3              # cinematic; reactions, springs, shimmer welcome
    density: comfortable
    a11y_priority: 2
    category_affinity:
      card: 3, avatar: 3, feed: 2, badge: 2, button: 2, image: 2, hero: 2, shader: 1
    avoid: ["data-table-walls", "monospace-body", "flat-corporate-gray"]
    token_overrides: { surface_elevation: layered, radius: "24px", accent_saturation: high }

# How the algorithm consumes this (see DESIGN-DECISION.md):
#   1. caller picks a persona (or the brief is classified into one)
#   2. for each content_need in the target, candidates = catalog components whose
#      category ∈ category_affinity, scored by affinity weight × quality × motion-fit
#   3. components hitting `avoid` signals are penalized; failing a11y_priority floor are demoted
#   4. theme = ux-design-tokens-l0 + token_overrides; typography + motion_budget emitted as decisions
matching:
  affinity_weight: 0.40       # category_affinity weight dominates "what to reach for"
  quality_weight: 0.25        # has_aria, low hardcoded_hex (codify-ready), typed
  motion_fit_weight: 0.20     # |component.motion - persona.motion_level| penalty
  density_fit_weight: 0.10    # component complexity (lines) vs persona.density
  avoid_penalty: 0.05         # multiplicative knockdown per avoid-signal hit
