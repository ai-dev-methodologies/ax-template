# practices/verification-checklist.yaml — R25 machine-readable completion contract.
#
# This file is the BINARY ground truth for "is the task done".
# Every AI agent / persona / fork-receiver MUST run
# `bash practices/scripts/verify-completion.sh` before declaring a task complete.
#
# The script reads THIS yaml — adding/removing a step here automatically
# propagates to every downstream agent. Do NOT hard-code a step in the script.
#
# Schema:
#   version: int                      # bump on breaking-shape change
#   defaults:
#     working_directory: str          # relative to repo root for all commands
#     timeout_seconds: int            # per-step kill switch
#   checklist:
#     - id: <slug>                    # stable kebab-case identifier
#       title: <human-readable>
#       parallel: bool                # if true, items below run concurrently
#       commands:                     # list (single-item list = sequential)
#         - command: <shell>
#           working_directory: <opt>  # override defaults
#           expected_exit: int        # one of: 0 | <int>
#           advisory: bool            # if true: FAIL → WARN (loop continues)
#       fix_playbook: |               # printed on FAIL; AI agent retry hint
#         <multi-line markdown>
#
# Iron Law (from R25 brief):
#   "AI agent / skill / 슬래시 명령이 자체 feedback loop 강제하는 메커니즘"
# The mechanism is: this yaml + verify-completion.sh + 49th hard guard.
# Manual intervention by the user is NOT required.
version: 1

defaults:
  working_directory: "."
  timeout_seconds: 900   # 15-minute cap per step

checklist:
  # ── 1. Backend compile (fast fail before tests) ─────────────────────────────
  - id: backend-build
    title: "Backend Spring Boot compile (fast-fail before tests)"
    parallel: false
    fail_fast: true  # a compile break short-circuits — do not run the ~89 per-domain tasks on broken code
    commands:
      - command: "./gradlew build -x test"
        working_directory: "backend"
        expected_exit: 0
    fix_playbook: |
      Backend compile failed.
      1. Read the gradle stderr — look for `error:` lines (javac) or
         `Unresolved reference:` (kotlin DSL).
      2. Common causes:
         • new dependency in build.gradle.kts without matching version
         • Java syntax error / missing import
         • new entity field without matching column on existing migration
      3. Fix the offending file. Do NOT delete tests to silence compile errors.
      4. Re-run only this step:  cd backend && ./gradlew build -x test

  # ── 1b. Structural pre-gate (fail-fast — runs ALONE, BEFORE the ~89 per-domain tasks) ──
  # testPractices is its OWN single-command step: _collapse_plan.py does NOT collapse a step
  # with <2 non-advisory commands, so it runs alone, and on a HARD_FAIL the fail_fast flag
  # SHORT-CIRCUITS the remaining steps (verified non-vacuously) — surfacing a god-service /
  # controller→repository / @Tag / ProblemDetail regression in ~1 min instead of ~18.
  # testPractices was MOVED out of per-domain-tests (below); the set of tasks R25 runs on success is unchanged.
  - id: structural-pregate
    title: "Structural pre-gate — testPractices (DDD/layering/problemdetail, fail-fast)"
    parallel: false
    fail_fast: true  # a structural/DDD/layering break short-circuits the ~89 per-domain tasks (18min→1min)
    timeout_seconds: 900
    commands:
      - command: "./gradlew testPractices"
        working_directory: "backend"
        expected_exit: 0
    fix_playbook: |
      A structural / architecture rule failed (DDD aggregate bijection, controller→repository
      layering, @Tag binding, or ProblemDetail). This step runs BEFORE the ~89 per-domain tasks
      so the regression shows in ~1 min, not ~18.
      1. Read the failing test:
         • DddAllowlistBijectionTest — a @Transactional method writes >1 aggregate root (god-service),
           or a cross-aggregate object pointer (DDD-006). Move the second-aggregate write into a
           private helper, or split the method; reference other aggregates by id, not object pointer.
         • ArchitectureLayerBoundaryTest / controller_repository_shell — a @RestController injects a
           @Repository. Route through a @Service instead.
         • @Tag / ProblemDetail checks — uppercase @Tag bound to the per-domain task; @ExceptionHandler
           returns ProblemDetail, never a Map.
      2. Re-run only this step:  cd backend && ./gradlew testPractices

  # ── 2. Per-domain test tasks (the catalog's binary pass/fail surface) ───────
  - id: per-domain-tests
    title: "Per-domain ./gradlew test{Domain} suite (89 tasks)"
    parallel: false  # gradle daemon serializes anyway; keep stderr deterministic
    # The growing domain matrix + the R22 BEFORE_CLASS DirtiesContext on hot
    # @SpringBootTest classes pushes cumulative wall-clock past the global
