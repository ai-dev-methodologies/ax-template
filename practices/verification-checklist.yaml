# practices/verification-checklist.yaml — R25 machine-readable completion contract.
#
# This file is the BINARY ground truth for "is the task done".
# Every AI agent / persona / fork-receiver MUST run
# `bash practices/scripts/verify-completion.sh` before declaring a task complete.
#
# The script reads THIS yaml — adding/removing a step here automatically
# propagates to every downstream agent. Do NOT hard-code a step in the script.
#
# Schema:
#   version: int                      # bump on breaking-shape change
#   defaults:
#     working_directory: str          # relative to repo root for all commands
#     timeout_seconds: int            # per-step kill switch
#   checklist:
#     - id: <slug>                    # stable kebab-case identifier
#       title: <human-readable>
#       parallel: bool                # if true, items below run concurrently
#       commands:                     # list (single-item list = sequential)
#         - command: <shell>
#           working_directory: <opt>  # override defaults
#           expected_exit: int        # one of: 0 | <int>
#           advisory: bool            # if true: FAIL → WARN (loop continues)
#       fix_playbook: |               # printed on FAIL; AI agent retry hint
#         <multi-line markdown>
#
# Iron Law (from R25 brief):
#   "AI agent / skill / 슬래시 명령이 자체 feedback loop 강제하는 메커니즘"
# The mechanism is: this yaml + verify-completion.sh + 49th hard guard.
# Manual intervention by the user is NOT required.
version: 1

defaults:
  working_directory: "."
  timeout_seconds: 900   # 15-minute cap per step

checklist:
  # ── 1. Backend compile (fast fail before tests) ─────────────────────────────
  - id: backend-build
    title: "Backend Spring Boot compile (fast-fail before tests)"
    parallel: false
    commands:
      - command: "./gradlew build -x test"
        working_directory: "backend"
        expected_exit: 0
    fix_playbook: |
      Backend compile failed.
      1. Read the gradle stderr — look for `error:` lines (javac) or
         `Unresolved reference:` (kotlin DSL).
      2. Common causes:
         • new dependency in build.gradle.kts without matching version
         • Java syntax error / missing import
         • new entity field without matching column on existing migration
      3. Fix the offending file. Do NOT delete tests to silence compile errors.
      4. Re-run only this step:  cd backend && ./gradlew build -x test

  # ── 2. Per-domain test tasks (the catalog's binary pass/fail surface) ───────
  - id: per-domain-tests
    title: "Per-domain ./gradlew test{Domain} suite (30 tasks)"
    parallel: false  # gradle daemon serializes anyway; keep stderr deterministic
    # The 25-domain matrix + the R22 BEFORE_CLASS DirtiesContext on hot
    # @SpringBootTest classes pushes cumulative wall-clock past the global
    # 900s default — observed 15-16 min runs on a warm daemon. Bumping to
    # 1800s (30 min) gives stable headroom. The matrix only grows; this
    # is a catalog-mechanics adjustment, not a per-domain regression.
    timeout_seconds: 1800
    commands:
      - command: "./gradlew testAsvs"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testCrud"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testPractices"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testRateLimit"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testPayment"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testNotification"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testSearch"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testAuditLog"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testFileStorage"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testFeatureFlags"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testBilling"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testIdentityVerification"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testScheduledTask"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testWebhook"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testEcommerce"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testReportExport"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testApiKey"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testApprovalWorkflow"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testTagCategorization"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testSessionManagement"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testFavorites"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testActivityFeed"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testCommentThread"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testEmailOutbox"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testDsr"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testCommonAdvice"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testCommonPrimitives"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testI18n"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testRealtime"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testApiVersioning"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testCaching"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testIdempotency"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testOptimisticLocking"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testPagination"
        working_directory: "backend"
