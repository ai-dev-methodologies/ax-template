      - command: "./gradlew testSecrets"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testSoftDelete"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testWebhookSigning"
        working_directory: "backend"
        expected_exit: 0
      - command: "./gradlew testIntegration"
        working_directory: "backend"
        expected_exit: 0
        advisory: true  # cross-cutting wiring; treat regression as warn
      - command: "./gradlew testPortability"
        working_directory: "backend"
        expected_exit: 0
        advisory: true  # external fixture (spring-realworld) has known cycle
    fix_playbook: |
      A per-domain test task failed.
      1. Identify which `test{Domain}` task failed from the FAIL line above.
      2. Read the JUnit report:
         backend/build/reports/tests/test{Domain}/index.html
      3. Find the single failing test. Reproduce in isolation:
         cd backend && ./gradlew test{Domain} --tests <TestClass.method> --info
      4. Fix the IMPLEMENTATION (not the test) unless the spec/contract changed.
         Catalog rule: tests anchor to spec yaml — flipping a test to GREEN by
         editing the assertion violates spec_ref_guard.
      5. Re-run the single domain task first, then re-run this whole step.

  # ── 3. Hard guards (36 mechanical guards under run-all-guards.sh) ───────────
  - id: hard-guards
    title: "36+ mechanical hard guards (run-all-guards.sh --include-fixtures)"
    parallel: false
    commands:
      - command: "bash practices/evals/run-all-guards.sh --include-fixtures"
        expected_exit: 0
    fix_playbook: |
      One or more catalog hard guards failed.
      1. Find the FAIL [<guard_name>] line in the output above.
      2. Run that guard in isolation for a focused trace:
         bash practices/evals/<guard_name>.sh
      3. The guard's stderr names the exact file + line of violation.
      4. Common patterns:
         • evidence_guard FAIL → rules/*.md missing `evidence:` block
                                 or quoting text not present in upstream snapshot
         • spec_ref_guard FAIL → rule's `spec_ref:` points at a yaml entry that
                                 does not exist
         • substance_guard FAIL → rule body is too short / has no code block
         • trio_integrity FAIL → spec/contract/blueprint drifted from one another
         • recipe_invariant_spec_normalization FAIL → INV-ID in RECIPE.md not in
           specs/recipes/<slug>-recipe-l0.yaml#business_invariants
         • test_tag_naming_convention FAIL → @Tag("...") not UPPERCASE
      5. Fix the offending artifact, then re-run this step.

  # ── 4. Catalog meta-guards (sentinel + spec cross-refs) ─────────────────────
  - id: catalog-meta-guards
    title: "Catalog meta-guards (AGENTS.md sentinel + spec/policy refs)"
    parallel: false
    commands:
      - command: "bash practices/evals/agents_md_toc_disk_truth_guard.sh"
        expected_exit: 0
      - command: "bash practices/evals/spec_policy_ref_guard.sh"
        expected_exit: 0
    fix_playbook: |
      Catalog meta-guard failed — sentinel or cross-reference drift.
      1. AGENTS.md sentinel drift → re-run:
         bash practices/generate_agents.sh
         git add practices/AGENTS.md
      2. spec_policy_ref drift → a rule or blueprint references a spec that has
         been renamed/deleted. Locate via:
         bash practices/evals/spec_policy_ref_guard.sh
      3. Do NOT hand-edit AGENTS.md; the generator script is the source of truth.

  # ── 5. Aggregate regression (final binary pass/fail) ────────────────────────
  - id: aggregate-regression
    title: "Aggregate ./gradlew test (catch cross-domain regression)"
    parallel: false
    commands:
      - command: "./gradlew test"
        working_directory: "backend"
        expected_exit: 0
        advisory: true  # PortabilityCyclic external fixture is permanently RED
    fix_playbook: |
      Aggregate test failed but per-domain tests passed.
      This means test isolation broke (R22-class regression).
      1. Compare failing test count: aggregate FAIL minus PortabilityCyclic.
         If only PortabilityCyclic fails → advisory PASS, no action.
      2. Otherwise, the failing test runs GREEN in its own task but RED in
         aggregate. Root cause is shared state:
         • static fields not reset between tests
         • @MockBean leaking into a later test's ApplicationContext
         • Spring context cache hitting a stale bean configuration
      3. Read R22 closure (commit ae64c5c) for the precedent fix pattern.
      4. Do NOT mark as advisory — fix the isolation leak.
