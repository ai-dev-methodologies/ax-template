schema_version: 2
# Domain mode assignments for trio_integrity_guard.sh.
# Each domain must declare one of: full_trio | backend_only | frontend_only
#
# full_trio:      backend Spec Trio AND frontend Spec Trio both required.
#                 Every UI route must carry a non-null backend_operation_id resolving
#                 against backend_contract_ref.
#
# backend_only:   backend Spec Trio only (no UI in scope). Frontend check skipped.
#
# frontend_only:  frontend Spec Trio only; no backend OpenAPI to bind to.
#                 Every route and item must have backend_operation_id: null AND
#                 non-empty static_source_ref pointing to existing files.
domains:
  auth: full_trio
  crud: full_trio
  payment: full_trio
  practices: frontend_only      # static viewer reading practices/AGENTS.md + rules/
  ratelimit: backend_only
  announcement: backend_only  # G007 ax-plan dogfood: time-boxed admin notices, lifecycle FSM + injected-clock window; no UI in scope
  audit-log: full_trio      # SP17: append-only log entries, async export, VirtualizedTable for >10k rows
  notification: full_trio    # SP16: inbox/settings/detail vertical + bell + list + item L2 blocks
  file-storage: full_trio    # SP18: upload/list/download/delete + presigned URL + L4 vertical
  email-outbox: backend_only      # SP19: transactional outbox, retry/DLQ, admin API; no frontend UI
  scheduled-task: backend_only    # SP19: distributed-lock cron jobs, job history; no frontend UI
  search: full_trio             # SP26: full-text search + typeahead + Cmd+K palette + charts L2
  feature-flags: full_trio      # SP28: runtime feature toggles, admin CRUD, FeatureGate + FeatureFlagToggle L2
  billing: full_trio            # SP30: subscription lifecycle, plan management, invoice listing, billing event history
  data-subject-rights: full_trio    # IMW6 FMW: GDPR DSR self-service console (access/rectify/erase/restrict/portability + SLA tracking)
  identity-verification: backend_only  # SP31: KISA 본인인증 callback storage (CI/DI tokens); no frontend UI in scope
  webhook: backend_only         # SP45 R9: outbound webhook-emit + HMAC-SHA256 signing + idempotent retries + dead-letter + circuit-breaker; no frontend UI in scope
  multi-tenant: backend_only    # R93: cross-cutting tenancy enforcement runtime; no first-class UI (every L4's tenant_model cites specs/multi-tenant-l0.yaml)
  i18n-policy: backend_only     # cross-cutting Spring i18n CONFIG + policy (LocaleResolver/MessageSource/UTC-Instant/formatting); no first-class UI
  realtime-policy: backend_only # cross-cutting SSE channel policy + runtime (SseEmitter registry/audience-fan-out/backpressure/Last-Event-ID/3 metrics); no first-class UI
  dunning-collections: backend_only # P1-20~23: overdue-receivable collections lifecycle (one-way exactly-once notice ladder + recorded aging bucket + cure-period grace); no UI in scope
  settlement-finality: backend_only # P1-24~27: post-trade DvP + novation + irrevocable finality + fail-ladder; no UI in scope
  authorization-parity: backend_only # P1-5/6/36: executed-matches-authorized parity hash + four-eyes signoff + positive companion gates; no UI in scope
  self-reported-input-plausibility: backend_only # P1-42: 자가보고 입력 plausibility 게이트 + unverified provenance; no UI
  business-day-deadline-arithmetic: backend_only # P1-51: calendar/business-day 기한 산술 + versioned holidays; no UI
  order-multiple-quantization: backend_only # P1-52: 비보존 MOQ/lot-size round-up quantization; no UI
  time-bounded-access-grant: backend_only # P1-44/45: 시한부 ReBAC grant + 다중자격 만료 게이트; no UI in scope
  two-axis-inventory-reservation: backend_only # P1-46: available/reserved 2축 + reserve→commit→release; no UI in scope
  containment-scope-authz: backend_only # P1-47: org-tree containment-scope cascade authz; no UI in scope
  variance-tolerance-band: backend_only # P1-48: standard-vs-actual 비대칭 tolerance-band 게이트; no UI in scope
  state-conditional-mutability: backend_only # P1-49: state별 mutable 필드집합 권위 테이블; no UI in scope
  completion-reset-recurring-interval: backend_only # P1-50: 완료 reset recurring interval; no UI in scope
  query-field-allowlist: backend_only # P1-38: sort/filter field allowlist (injection/enumeration guard); no UI in scope
  sensitive-read-audit: backend_only # P1-43: generic sensitive-field read-audit (append-only access log); no UI in scope
  reproducible-procedure: backend_only # P1-7/8/9: seeded replayable draw + version-pinned classification + role-blinding; no UI in scope
  mandate-fanout: backend_only # P1-37/35/31: conserved fan-out recall + multi-check battery + deemed-election; no UI in scope
  valuation-run-projection: backend_only # P1-28/29/30: as-of snapshot + conserving fan-out + rebase-with-history; no UI in scope
  external-reconciliation: backend_only # P1-32: classify/dispose breaks + idempotent re-run; no UI in scope
  signed-dual-register: backend_only # P1-18: bidirectional monotone import/export + derived net + period close; no UI in scope
  timed-offer-exclusive-assignment: backend_only # P1-39/40/41: timed-offer expiry + exclusive assignment + re-offer ladder; no UI in scope
  # security: backend_only  # no specs/security-*.yaml yet — add when backend domain is scaffolded
  # user: backend_only      # no specs/user-*.yaml yet — add when backend domain is scaffolded
