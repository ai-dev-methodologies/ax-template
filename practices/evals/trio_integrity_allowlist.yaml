schema_version: 2
# Domain mode assignments for trio_integrity_guard.sh.
# Each domain must declare one of: full_trio | backend_only | frontend_only
#
# full_trio:      backend Spec Trio AND frontend Spec Trio both required.
#                 Every UI route must carry a non-null backend_operation_id resolving
#                 against backend_contract_ref.
#
# backend_only:   backend Spec Trio only (no UI in scope). Frontend check skipped.
#
# frontend_only:  frontend Spec Trio only; no backend OpenAPI to bind to.
#                 Every route and item must have backend_operation_id: null AND
#                 non-empty static_source_ref pointing to existing files.
domains:
  auth: full_trio
  crud: full_trio
  payment: full_trio
  practices: frontend_only      # static viewer reading practices/AGENTS.md + rules/
  ratelimit: backend_only
  audit-log: full_trio      # SP17: append-only log entries, async export, VirtualizedTable for >10k rows
  notification: full_trio    # SP16: inbox/settings/detail vertical + bell + list + item L2 blocks
  file-storage: full_trio    # SP18: upload/list/download/delete + presigned URL + L4 vertical
  email-outbox: backend_only      # SP19: transactional outbox, retry/DLQ, admin API; no frontend UI
  scheduled-task: backend_only    # SP19: distributed-lock cron jobs, job history; no frontend UI
  search: full_trio             # SP26: full-text search + typeahead + Cmd+K palette + charts L2
  feature-flags: full_trio      # SP28: runtime feature toggles, admin CRUD, FeatureGate + FeatureFlagToggle L2
  billing: full_trio            # SP30: subscription lifecycle, plan management, invoice listing, billing event history
  # security: backend_only  # no specs/security-*.yaml yet — add when backend domain is scaffolded
  # user: backend_only      # no specs/user-*.yaml yet — add when backend domain is scaffolded
