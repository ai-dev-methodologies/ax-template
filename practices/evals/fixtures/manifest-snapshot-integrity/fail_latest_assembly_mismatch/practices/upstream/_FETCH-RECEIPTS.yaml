version: '1.0'
notes: 'fail_latest_assembly_mismatch — the LATEST assembly row does not describe the body, while an EARLIER row does. Non-vacuity for P1-2c: binding to the latest row must not degrade into any-row-matches or first-row-wins, or appending a stale row would re-open laundering. Two `kind: assembly` rows for
  practices::fresh-src: asm-fresh-src-v1 (the first refresh, whose body has since been superseded)
  and asm-fresh-src-v2 (the latest). The ledger is APPEND-ONLY vs the release anchor, so the
  superseded row may not be rewritten or deleted — it stays as the audit trail of what the earlier
  fetch produced. The chain therefore binds to the LATEST assembly row per identity (last in file
  order = last appended), which is what makes append-only and "one digest per body" compatible.
  Before P1-2c a second assembly row was RECEIPTS_DUPLICATE_ASSEMBLY (exit 2), i.e. every repeat
  refresh was forced to MUTATE history — exactly what the append-only ratchet must forbid.'
