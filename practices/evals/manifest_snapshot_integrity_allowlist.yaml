# manifest_snapshot_integrity_allowlist.yaml — the residual of BACKLOG P2-57 / PRD-final-4 W1b.
# Consumed by practices/evals/manifest_snapshot_integrity_guard.sh, which enforces every
# mechanic described below rather than trusting this comment.
#
# WHAT IS BEING SUPPRESSED, AND WHY IT IS NOT A COVER-UP
# -----------------------------------------------------
# For these ids the manifest's `sha`/`bytes` do not describe the `<id>.snapshot.md` currently on
# disk, and the ORIGINALLY-FETCHED bytes are gone — so the records are history that cannot be
# corrected by editing a number. Correcting them by recomputing from the present file would be
# the worst option available: it would MANUFACTURE a provenance claim ("this is what the fetch
# produced") about bytes nobody can attest to, which is the exact defect this guard exists to
# make impossible. The honest closure is a re-fetch per id, appending receipts — i.e. burn-down,
# tracked as a backlog row, not a same-wave edit.
#
# Three of the baseline's records are provably fabricated rather than merely stale:
# recharts-2026-05, next-intl-2026-05 and kakao-postcode-2026-05 shared ONE sha across three
# different byte counts. A sha256 is a function of the bytes, so at least two of those three were
# never computed from any file.
#
# MECHANICS (all enforced by the guard, exit code in parentheses)
# --------------------------------------------------------------
#   · `baseline_universe` below is the FROZEN wave-start divergent census — 71 (catalog, id)
#     pairs, measured 2026-07-30 before any Lane A edit, at commit-tree HEAD. Every entry must be
#     a member (2). Additions are therefore impossible: divergence introduced after the freeze
#     can be FIXED but never suppressed.
#   · entries are keyed by unique (catalog, id) — a duplicate is a defect (2).
#   · NON-REDUNDANCY — an entry whose manifest now MATCHES disk is stale and FAILS (1). The list
#     length therefore always equals the true residual, and burn-down is visible instead of being
#     absorbed by padding.
#   · every entry carries a non-empty `reason:` (2).
#   · a W1-touched id (one carrying a `kind: assembly` receipt) may NOT appear here (2) — a
#     freshly-fetched body has a verifiable digest by construction.
#
# ARITHMETIC AT INTRODUCTION: 71 frozen baseline − 8 ids synchronized by the W1 refresh
# (practices-react shadcn-ui / shadcn-registry / react-dropzone / next-themes / kakao-postcode /
# input-otp / stripe-billing, plus practices stripe-billing) = 63 entries below. Both numbers
# were re-censused from disk at integration, not carried over from the plan.
#
# THE ONLY LEGAL EDIT IS REMOVAL: re-fetch an id with practices/scripts/snapshot-extract.sh,
# append its receipts, sync the manifest to the true whole-file sha/bytes, delete its row here.

