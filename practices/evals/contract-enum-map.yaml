    java_enum: com.ax.template.authblueprint.reportexport.ExportJobStatus
  - kind: contract_enum
    contract: contracts/report-export-openapi.yaml
    pointer: /components/schemas/ExportJobResponse/properties/format
    java_enum: com.ax.template.authblueprint.reportexport.ExportFormat

