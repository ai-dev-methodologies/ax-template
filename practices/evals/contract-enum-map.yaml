# practices/evals/contract-enum-map.yaml
# P2-33 — classification manifest for `contract_enum_parity_guard.sh`.
#
# EVERY `enum:` block under contracts/*.yaml must appear here exactly once.
# An unclassified block FAILS the guard; a stale entry (pointing at a block that
# no longer exists) also FAILS. There is no inference and no default — the
# exhaustiveness is what makes the gate non-heuristic.
#
# contract_enum entry — exactly ONE of:
#   java_enum: <FQCN>    the block is bound to a Java enum; constant sets must match
#   wire_only: <reason>  no Java ENUM backs the block (the code side is a String).
#                        A reason is NOT sufficient (P0-2): the entry MUST also carry a
#                        `wire_source:` block naming WHERE the literals are produced, and
#                        the guard compares the EXTRACTED literal set to the block by
#                        exact set equality — the same treatment a java_enum entry gets.
#
# wire_source kinds (full contract in contract_enum_parity_guard.sh's header):
#   java_field_literals   file: X.java [symbol: NAME]   the literals of that field's
#                         initializer, or of every `static final String` in the file
#   java_enum_decl        file: X.java  name: E         `enum E { … }` — for a producer
#                         that lives in a templates/ copy-target skeleton
#   java_method_returns   files: <glob>  method: m      every `return "…";` in m()'s body
#                         across the glob (the SPI shape; an abstract decl adds nothing)
#   literal_pattern       file:|files:  pattern: <regex with ONE group>   inline literals;
#                         comments are stripped first for .java/.ts/.tsx
#   unproduced            NOTHING in this tree produces the block. The ONLY escape from
#                         set equality, and it is checked: `absence_probes: [{pattern,
#                         globs}]` must match ZERO files over a NON-EMPTY file set, so the
#                         exemption self-destructs as soon as a producer appears.
# An extraction that yields the EMPTY set FAILS — a pattern that matches nothing must
# never read as "no drift".
#
# Modifiers (java_enum or an EXTRACTING wire_source; each requires `reason:`):
#   wire_extra:   [T…]   tokens on the wire that are not Java constants (filter sentinels)
#   wire_missing: [T…]   Java constants deliberately absent from THIS block
#   wire_case: lower     the wire spells the constants lower-case
# Both modifier lists are non-redundancy-checked: listing a token that is not
# actually in the difference FAILS, so an allowance cannot rot into a lie.
#
# vocab_scan entry — word-boundary token scan of a non-contract surface
# (L4 fork copies, java skeletons, README tables). `SUCCESS` does not match
# inside `SUCCEEDED`; `FAILED` does not match inside `FAILED_PERMANENT`.

contract_enums:

  # ── announcement ──────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/announcement-openapi.yaml
    pointer: /components/schemas/Announcement/properties/state
    java_enum: com.ax.template.authblueprint.announcement.AnnouncementState

  # ── api-key ───────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/api-key-openapi.yaml
    pointer: /components/schemas/CreateApiKeyRequest/properties/scopes/items
    java_enum: com.ax.template.authblueprint.apikey.ApiKeyScope
  - kind: contract_enum
    contract: contracts/api-key-openapi.yaml
    pointer: /components/schemas/CreateApiKeyResponse/properties/scopes/items
    java_enum: com.ax.template.authblueprint.apikey.ApiKeyScope
  - kind: contract_enum
    contract: contracts/api-key-openapi.yaml
    pointer: /components/schemas/CreateApiKeyResponse/properties/status
    java_enum: com.ax.template.authblueprint.apikey.ApiKeyStatus
  - kind: contract_enum
    contract: contracts/api-key-openapi.yaml
    pointer: /components/schemas/ApiKeyResponse/properties/scopes/items
    java_enum: com.ax.template.authblueprint.apikey.ApiKeyScope
  - kind: contract_enum
    contract: contracts/api-key-openapi.yaml
    pointer: /components/schemas/ApiKeyResponse/properties/status
    java_enum: com.ax.template.authblueprint.apikey.ApiKeyStatus

  # ── approval-workflow ─────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/approval-workflow-openapi.yaml
    pointer: /components/schemas/ApprovalStepResponse/properties/status
    java_enum: com.ax.template.authblueprint.approvalworkflow.ApprovalStepStatus
  - kind: contract_enum
    contract: contracts/approval-workflow-openapi.yaml
    pointer: /components/schemas/ApprovalRequestResponse/properties/status
    java_enum: com.ax.template.authblueprint.approvalworkflow.ApprovalRequestStatus
  - kind: contract_enum
    contract: contracts/approval-workflow-openapi.yaml
    pointer: /components/schemas/ApprovalRequestResponse/properties/allowedActions/items
    wire_only: >-
      P2-38b action vocabulary. The values are String constants on
      ApprovalActionEvaluator (VIEW/SUBMIT/CANCEL/APPROVE/REJECT), deliberately not a Java
      enum: `allowedActions` is an OPEN, additive vocabulary — clients are told to ignore
      tokens they do not recognize — so a fork-receiver can advertise a domain-specific
      action without a breaking enum change in the public catalog (R26).
    wire_source:
      kind: java_field_literals
      file: backend/src/main/java/com/ax/template/authblueprint/approvalworkflow/ApprovalActionEvaluator.java
  - kind: contract_enum
    contract: contracts/approval-workflow-openapi.yaml
    pointer: /components/schemas/ApprovalInboxEntry/properties/status
    java_enum: com.ax.template.authblueprint.approvalworkflow.ApprovalStepStatus
    wire_missing: [APPROVED, REJECTED]
    reason: >-
      Inbox entries are PENDING steps by construction — ApprovalRequestRepository
      .findInboxFor filters `step.status = PENDING`, so an acted step can never
      appear in this projection.

  # ── audit-log ─────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /paths/~1audit-logs/get/parameters/6/schema
    java_enum: com.ax.template.authblueprint.auditlog.AuditOutcome
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /components/schemas/AuditLogSummary/properties/outcome
    java_enum: com.ax.template.authblueprint.auditlog.AuditOutcome
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /components/schemas/ExportRequest/properties/format
    java_enum: com.ax.template.authblueprint.auditlog.AuditExportFormat
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /components/schemas/ExportRequest/properties/outcome
    java_enum: com.ax.template.authblueprint.auditlog.AuditOutcome
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /components/schemas/ExportJobResponse/properties/status
    java_enum: com.ax.template.authblueprint.auditlog.AuditExportStatus
    wire_missing: [PROCESSING, COMPLETED, FAILED]
    reason: >-
      Creation acknowledgement: the export job is persisted PENDING and the worker
      has not run yet, so this response can only carry PENDING. The full lifecycle
      vocabulary is served by ExportJobStatus (polled separately).
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /components/schemas/ExportJobStatus/properties/status
    java_enum: com.ax.template.authblueprint.auditlog.AuditExportStatus

  # ── auth ──────────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /paths/~1auth~1oauth~1{provider}~1authorize/get/parameters/0/schema
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: >-
      The provider path segment is lower-case in every OAuth vendor's own docs and
      is folded to OAuthProvider.valueOf(upper) on binding.
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /paths/~1auth~1oauth~1{provider}~1callback/get/parameters/0/schema
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: Same lower-case provider segment as the authorize endpoint.
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /paths/~1auth~1oauth~1link/post/requestBody/content/application~1json/schema/properties/provider
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: Same lower-case provider vocabulary, carried in the link request body.
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /paths/~1auth~1oauth~1unlink~1{provider}/delete/parameters/0/schema
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: Same lower-case provider segment as the authorize endpoint.
  # P0-2 RECLASSIFIED (was wire_only): the SHAPE drift (AuthState vs the shipped
  # UserProfileResponse) is real and stays a registered finding, but the VOCABULARY of
  # this block is the domain's own role enum spelled lower-case — so it binds, and a new
  # Java role now forces a decision here instead of drifting silently.
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /components/schemas/UserRole
    java_enum: com.ax.template.authblueprint.user.UserRole
    wire_case: lower
    wire_missing: [AUDITOR]
    reason: >-
      The schema lower-cases the role vocabulary for the UI-state contract. AUDITOR
      (R14 audit-log export role) postdates this schema and is absent from it; the
      block is not served by any shipped operation today — GET /api/auth/me returns
      UserProfileResponse with a single upper-case `role` (AuthSessionController:29) —
      so no client is affected. The AuthState-vs-UserProfileResponse shape drift
      remains a registered finding; when it is closed, AUDITOR must be added here or
      the omission re-justified.
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /components/schemas/VerificationState
    java_enum: com.ax.template.authblueprint.user.VerificationState
    wire_case: lower
    reason: >-
      Exact vocabulary of user.VerificationState spelled lower-case for the UI-state
      contract. (The shipped /api/auth/me carries a boolean `emailVerified` instead —
      the same registered shape drift as UserRole — but the tri-state vocabulary this
      block promises IS that enum's, so it is bound rather than exempted.)
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /components/schemas/ProviderLink/properties/provider
    wire_only: >-
      Same AuthState UI-state schema. The shipped response exposes
      `linkedProviders: string[]` from OAuthService.getLinkedProviders; the ProviderLink
      entity's provider column is an OAuthProvider, which cannot be `email`. The only
      producer of THIS block's vocabulary in the tree is the MSW reference handler that
      implements the AuthState contract for the frontend.
    wire_source:
      kind: literal_pattern
      file: frontend/src/mocks/handlers.ts
      pattern: "provider: '([a-z]+)'"

  # ── auth-ui ───────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/auth-ui.yaml
    pointer: /routes/9/params/provider
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: Route params mirror the lower-case OAuth path segment.
  - kind: contract_enum
    contract: contracts/auth-ui.yaml
    pointer: /routes/11/params/provider
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: Route params mirror the lower-case OAuth path segment.

  # ── billing ───────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/billing-openapi.yaml
    pointer: /components/schemas/SubscriptionStatus
    java_enum: com.ax.template.authblueprint.billing.SubscriptionStatus
  - kind: contract_enum
    contract: contracts/billing-openapi.yaml
    pointer: /components/schemas/InvoiceStatus
    wire_only: >-
      The reference workload has no invoice aggregate — there is no Java
