# ── L4 / doc surfaces the contract_enum schema cannot express (P2-34) ────────
# The L4 webhook fork-copy carried a NON-ISOMORPHIC 5-value vocabulary
# (PENDING|IN_FLIGHT|SUCCEEDED|FAILED|DEAD_LETTER). Canonical←L4 mapping applied:
#   PENDING     → PENDING
#   IN_FLIGHT   → dropped (the reference model has no in-flight state)
#   SUCCEEDED   → SUCCEEDED
#   FAILED      → FAILED_PERMANENT
#   DEAD_LETTER → FAILED_PERMANENT
#   (new)       ← PENDING_RETRY, which the fork-copy had no word for
# Replay gates on FAILED_PERMANENT only: PENDING_RETRY is auto-retried by the
# scheduler, so a manual replay of it would double-send.
#
# Every entry carries a MANDATORY `declaration:` block: the guard parses the DECLARED
# token set out of the file and asserts EXACT SET EQUALITY with the canonical vocabulary,
# so a brand-new UNKNOWN token fails even though no `forbidden:` entry names it. The
# `forbidden:` / `require_all` pair is retained as a secondary whole-file floor.
#
# And every entry carries a MANDATORY `canonical_from:` block naming WHERE that canonical
# vocabulary is resolved from — an inline `canonical:` list is REFUSED (P1 round 5,
# cross-family review). These four surfaces used to repeat the token set inline, so the
# vocabulary lived in FOUR independent copies (WebhookDeliveryStatus, the two contract
# blocks above, and one list per surface) with nothing binding the fourth to the first
# three: add a constant to the enum AND to both contract blocks — so the contract_enum
# entries above stay green — and forget the fork-copy templates, which is precisely what
# an ordinary contributor does, and the guard exited 0 with four templates advertising a
# vocabulary the API no longer speaks. Two surfaces resolve from the CONTRACT block (the
# front-end fork copies consume the wire) and two from the java ENUM (the backend skeleton
# and the README document the producer); §4/§5 already pin those two sources to each other,
# so a constant added anywhere in the chain now reaches every template. A surface that
# legitimately renders only PART of the vocabulary declares `canonical_subset: {omit, reason}`
# — non-redundancy-checked, so the allowance cannot rot into a lie. None does today.
#
# Declaration kinds and their honest scope:
#   ts_union / java_enum_decl  — exhaustive over the whole declaration.
#   marker_region              — exhaustive ONLY between the `<marker>:start` /
#                                `<marker>:end` comments. Prose surfaces carry dozens of
#                                unrelated ALL-CAPS acronyms (this README has 76), so
#                                whole-file set equality is unsound and is NOT claimed;
#                                outside the region the floor is the denylist only.
vocab_scans:
  - kind: vocab_scan
    file: templates/L4/webhook/app/(admin)/webhooks/deliveries/page.tsx
    canonical_from:
      kind: contract_enum
      contract: contracts/webhook-openapi.yaml
      pointer: /components/schemas/WebhookDeliverySummary/properties/status
    declaration:
      kind: ts_union
      name: DeliveryStatus
    require_all: true
    forbidden: [IN_FLIGHT, DEAD_LETTER, SUCCESS, FAILED]
  - kind: vocab_scan
    file: templates/L4/webhook/backend/WebhookDelivery.java.skeleton
    canonical_from:
      kind: java_enum
      fqcn: com.ax.template.authblueprint.webhook.WebhookDeliveryStatus
    declaration:
      kind: java_enum_decl
      name: Status
    require_all: true
    forbidden: [SUCCESS, IN_FLIGHT, DEAD_LETTER]
  - kind: vocab_scan
    file: templates/L4/webhook/app/providers.tsx
    canonical_from:
      kind: contract_enum
      contract: contracts/webhook-openapi.yaml
      pointer: /paths/~1webhook-deliveries/get/parameters/1/schema
    declaration:
      kind: marker_region
      marker: vocab:delivery-status
      scope_note: >-
        prose (a JSDoc block). Exhaustive inside the delimited region only; the rest of
        the file is denylist-only.
    require_all: true
    forbidden: [IN_FLIGHT, DEAD_LETTER, SUCCESS]
  - kind: vocab_scan
    file: templates/L4/webhook/README.md
    canonical_from:
      kind: java_enum
      fqcn: com.ax.template.authblueprint.webhook.WebhookDeliveryStatus
    declaration:
      kind: marker_region
      marker: vocab:delivery-status
      scope_note: >-
        prose. Exhaustive inside the "Delivery status vocabulary" table only; the rest of
        the README is denylist-only (76 unrelated ALL-CAPS tokens make whole-file set
        equality unsound).
    require_all: true
    forbidden: [IN_FLIGHT, DEAD_LETTER, SUCCESS]
