# practices/evals/contract-enum-map.yaml
# P2-33 — classification manifest for `contract_enum_parity_guard.sh`.
#
# EVERY `enum:` block under contracts/*.yaml must appear here exactly once.
# An unclassified block FAILS the guard; a stale entry (pointing at a block that
# no longer exists) also FAILS. There is no inference and no default — the
# exhaustiveness is what makes the gate non-heuristic.
#
# contract_enum entry — exactly ONE of:
#   java_enum: <FQCN>    the block is bound to a Java enum; constant sets must match AND
#                        the binding must be COHERENT (P0-2 round 3): the enum's package
#                        leaf must be the contract file's own domain (session-management-
#                        openapi.yaml ↔ …sessionmanagement.SessionStatus). A copy-pasted
#                        FQCN pointing at an unrelated enum with the SAME constants used to
#                        redirect the whole check and leave the real enum free to drift.
#                        Genuine cross-domain reuse is allowlisted IN THE GUARD
#                        (CROSS_DOMAIN_BINDINGS), not here, and is non-redundancy-checked.
#   wire_only: <reason>  no Java ENUM backs the block (the code side is a String).
#                        A reason is NOT sufficient (P0-2): the entry MUST also carry a
#                        `wire_source:` block naming WHERE the literals are produced, and
#                        the guard compares the EXTRACTED literal set to the block by
#                        exact set equality — the same treatment a java_enum entry gets.
#
# wire_source kinds (full contract in contract_enum_parity_guard.sh's header):
#   java_field_literals   file: X.java [symbol: NAME]   the literals of that field's
#                         initializer, or of every `static final String` in the file
#   java_enum_decl        file: X.java  name: E         `enum E { … }` — for a producer
#                         that lives in a templates/ copy-target skeleton
#   java_method_returns   files: <glob>  method: m      every `return "…";` in m()'s body
#                         across the glob (the SPI shape; an abstract decl adds nothing)
#   literal_pattern       file:|files:  pattern: <regex with ONE group>
#                         residue_probe: <regex>   inline literals; comments are stripped
#                         first for .java/.ts/.tsx
#                         producer_scope: MANDATORY — {kind: method_bodies, methods: [m…]}
#                         for a .java producer (extraction AND residue are scoped to those
#                         bodies), or {kind: file_wide, reason: …} for a producer with no
#                         brace-delimited method (REFUSED for .java)
#   unproduced            NOTHING in this tree produces the block. The ONLY escape from
#                         PRODUCER set equality, and it is checked three ways:
#                         `absence_probes: [{pattern, globs}]` must match ZERO files over a
#                         NON-EMPTY file set; `verified_by:` must bind a runtime/bytecode
#                         test; and (P0-2 round 4) `canonical_vocabulary: {kind: yaml_list,
#                         file, pointer}` must name an INDEPENDENT source of the legal token
#                         set, which the block must EQUAL exactly. The first two prove only
#                         that nothing PRODUCES the block — the branch used to return right
#                         there, so a CONTRACT-ONLY edit (`mock` -> `accidental_typo`) was
#                         invisible. `file:` may not be the contract itself, and
#                         wire_extra / wire_missing are refused here: elsewhere an allowance
#                         is corroborated by a real producer, and on this path nothing is.
#                         No canonical source ⇒ the contract is advertising a closed
#                         vocabulary nobody legislates and nobody enforces: DELETE the
#                         declaration instead of exempting it (that is what happened to
#                         GET /payments' unbound `sortBy` parameter).
# An extraction that yields the EMPTY set FAILS — a pattern that matches nothing must
# never read as "no drift".
#
# FAIL-CLOSED EXTRACTION (P0-2 round 2 — cross-family review). A regex over java source
# is not a parser: it can silently SKIP a producing expression it does not recognise and
# still return a non-empty set scraped from elsewhere, i.e. report PASS on literals that
# are NOT the ones on the wire. Silently extracting the wrong set is the defect; blocking
# is acceptable, guessing is not. So every VALUE-extracting kind now refuses to guess:
#   java_field_literals   the addressed initializer (resp. every `static final String`)
#                         must be built from plain literals + collection syntax ONLY; a
#                         value-bearing identifier ERRORS.
#   java_method_returns   EVERY return in a matched body must be a plain literal; a
#                         computed slug ERRORS instead of being skipped.
#   literal_pattern       `residue_probe:` is MANDATORY. It matches the PRODUCING
#                         CONSTRUCT (not the literal); the guard requires it to fire at
#                         least once in the producer scope AND zero times after every
#                         `pattern` capture is deleted — so every occurrence of the
#                         construct was consumed by a plain literal. The reviewer's
#                         reproduction (`return Map.of("status", "healthy".toString());` in
#                         one method while a sibling method still returns the contract's
#                         literal) leaves residue and now ERRORS.
#                         ROUND 3: a probe proves ONE construct, not the construct CLASS —
#                         `return Collections.singletonMap("status", System.getProperty(…))`
#                         matched neither pattern nor probe while the sibling kept the
#                         literal, so file-wide residue was empty and the guard passed on a
#                         payload the endpoint no longer emits. `producer_scope:` moves the
#                         scope to the producing METHOD BODY and adds return-completeness
#                         (when the capture IS the returned value), so a foreign map
#                         factory, a helper call, a ternary, a constant reference or a
#                         multi-line build all land in the fail-closed branch.
#   java_enum_decl        already structural — the declaration is parsed, not scraped.
#
# RUNTIME / BYTECODE TRUTH — `verified_by:` (MANDATORY on `unproduced`, optional and
# validated elsewhere):
#   verified_by:
#     test:        backend/src/test/java/…/XTest.java   must exist
#     tag:         PAYMENT                              must appear as @Tag("…") in it
#     gradle_task: testPayment                          must includeTags that tag in
#                                                       backend/build.gradle.kts
#     anchors:     [substring, …]                       must appear in the test, so the
#                                                       binding cannot name an unrelated
#                                                       test that shares the tag
# An absence claim has no producer region a static extractor could be made fail-closed
# over, and the shapes that defeat an absence regex (an SPI implemented ALONGSIDE another
# interface, a nested/anonymous class, a generic parameterisation, a @Bean factory) are
# exactly the ordinary ways a producer appears — so `unproduced` must be backed by a test
# that reads the RUNNING bean graph or the BYTECODE, and that R25 actually runs.
#
# Modifiers (java_enum or an EXTRACTING wire_source; each requires `reason:`):
#   wire_extra:   [T…]   tokens on the wire that are not Java constants (filter sentinels)
#   wire_missing: [T…]   Java constants deliberately absent from THIS block
#   wire_case: lower     the wire spells the constants lower-case
# Both modifier lists are non-redundancy-checked: listing a token that is not
# actually in the difference FAILS, so an allowance cannot rot into a lie.
#
# vocab_scan entry — word-boundary token scan of a non-contract surface
# (L4 fork copies, java skeletons, README tables). `SUCCESS` does not match
# inside `SUCCEEDED`; `FAILED` does not match inside `FAILED_PERMANENT`.

contract_enums:

  # ── announcement ──────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/announcement-openapi.yaml
    pointer: /components/schemas/Announcement/properties/state
    java_enum: com.ax.template.authblueprint.announcement.AnnouncementState

  # ── api-key ───────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/api-key-openapi.yaml
    pointer: /components/schemas/CreateApiKeyRequest/properties/scopes/items
    java_enum: com.ax.template.authblueprint.apikey.ApiKeyScope
  - kind: contract_enum
    contract: contracts/api-key-openapi.yaml
    pointer: /components/schemas/CreateApiKeyResponse/properties/scopes/items
    java_enum: com.ax.template.authblueprint.apikey.ApiKeyScope
  - kind: contract_enum
    contract: contracts/api-key-openapi.yaml
    pointer: /components/schemas/CreateApiKeyResponse/properties/status
    java_enum: com.ax.template.authblueprint.apikey.ApiKeyStatus
  - kind: contract_enum
    contract: contracts/api-key-openapi.yaml
    pointer: /components/schemas/ApiKeyResponse/properties/scopes/items
    java_enum: com.ax.template.authblueprint.apikey.ApiKeyScope
  - kind: contract_enum
    contract: contracts/api-key-openapi.yaml
    pointer: /components/schemas/ApiKeyResponse/properties/status
    java_enum: com.ax.template.authblueprint.apikey.ApiKeyStatus

  # ── approval-workflow ─────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/approval-workflow-openapi.yaml
    pointer: /components/schemas/ApprovalStepResponse/properties/status
    java_enum: com.ax.template.authblueprint.approvalworkflow.ApprovalStepStatus
  - kind: contract_enum
    contract: contracts/approval-workflow-openapi.yaml
    pointer: /components/schemas/ApprovalRequestResponse/properties/status
    java_enum: com.ax.template.authblueprint.approvalworkflow.ApprovalRequestStatus
  - kind: contract_enum
    contract: contracts/approval-workflow-openapi.yaml
    pointer: /components/schemas/ApprovalRequestResponse/properties/allowedActions/items
    wire_only: >-
      P2-38b action vocabulary. The values are String constants on
      ApprovalActionEvaluator (VIEW/SUBMIT/CANCEL/APPROVE/REJECT), deliberately not a Java
      enum: `allowedActions` is an OPEN, additive vocabulary — clients are told to ignore
      tokens they do not recognize — so a fork-receiver can advertise a domain-specific
      action without a breaking enum change in the public catalog (R26).
    wire_source:
      kind: java_field_literals
      file: backend/src/main/java/com/ax/template/authblueprint/approvalworkflow/ApprovalActionEvaluator.java
  - kind: contract_enum
    contract: contracts/approval-workflow-openapi.yaml
    pointer: /components/schemas/ApprovalInboxEntry/properties/status
    java_enum: com.ax.template.authblueprint.approvalworkflow.ApprovalStepStatus
    wire_missing: [APPROVED, REJECTED]
    reason: >-
      Inbox entries are PENDING steps by construction — ApprovalRequestRepository
      .findInboxFor filters `step.status = PENDING`, so an acted step can never
      appear in this projection.

  # ── audit-log ─────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /paths/~1audit-logs/get/parameters/6/schema
    java_enum: com.ax.template.authblueprint.auditlog.AuditOutcome
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /components/schemas/AuditLogSummary/properties/outcome
    java_enum: com.ax.template.authblueprint.auditlog.AuditOutcome
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /components/schemas/ExportRequest/properties/format
    java_enum: com.ax.template.authblueprint.auditlog.AuditExportFormat
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /components/schemas/ExportRequest/properties/outcome
    java_enum: com.ax.template.authblueprint.auditlog.AuditOutcome
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /components/schemas/ExportJobResponse/properties/status
    java_enum: com.ax.template.authblueprint.auditlog.AuditExportStatus
    wire_missing: [PROCESSING, COMPLETED, FAILED]
    reason: >-
      Creation acknowledgement: the export job is persisted PENDING and the worker
      has not run yet, so this response can only carry PENDING. The full lifecycle
      vocabulary is served by ExportJobStatus (polled separately).
  - kind: contract_enum
    contract: contracts/audit-log-openapi.yaml
    pointer: /components/schemas/ExportJobStatus/properties/status
    java_enum: com.ax.template.authblueprint.auditlog.AuditExportStatus

  # ── auth ──────────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /paths/~1auth~1oauth~1{provider}~1authorize/get/parameters/0/schema
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: >-
      The provider path segment is lower-case in every OAuth vendor's own docs and
      is folded to OAuthProvider.valueOf(upper) on binding.
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /paths/~1auth~1oauth~1{provider}~1callback/get/parameters/0/schema
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: Same lower-case provider segment as the authorize endpoint.
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /paths/~1auth~1oauth~1link/post/requestBody/content/application~1json/schema/properties/provider
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: Same lower-case provider vocabulary, carried in the link request body.
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /paths/~1auth~1oauth~1unlink~1{provider}/delete/parameters/0/schema
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: Same lower-case provider segment as the authorize endpoint.
  # P3-74 CLOSED the AuthState-vs-UserProfileResponse shape drift this section used to
  # track (was wire_case:lower + wire_missing:[AUDITOR] because the schema promised a
  # `roles[]`/`verificationState`/`providerLinks[]` shape no shipped operation ever
  # emitted). AuthState now mirrors UserProfileResponse field-for-field, so its role
  # vocabulary binds exactly — no case-fold, no omission.
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /components/schemas/UserRole
    java_enum: com.ax.template.authblueprint.user.UserRole
    reason: >-
      GET /api/auth/me (AuthSessionController.me, UserProfileResponse.role) emits
      UserRole.name() verbatim — exact upper-case set, AUDITOR included.
  - kind: contract_enum
    contract: contracts/auth-openapi.yaml
    pointer: /components/schemas/AuthState/properties/linkedProviders/items
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    reason: >-
      UserProfileResponse.linkedProviders is OAuthService.getLinkedProviders(userId),
      which maps each link to ProviderLink.getProvider().name() — exact upper-case
      OAuthProvider constant set, no case-fold (unlike the OAuth path-segment blocks
      below, which are deliberately lower-case).

  # ── auth-ui ───────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/auth-ui.yaml
    pointer: /routes/9/params/provider
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: Route params mirror the lower-case OAuth path segment.
  - kind: contract_enum
    contract: contracts/auth-ui.yaml
    pointer: /routes/11/params/provider
    java_enum: com.ax.template.authblueprint.auth.OAuthProvider
    wire_case: lower
    reason: Route params mirror the lower-case OAuth path segment.

  # ── billing ───────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/billing-openapi.yaml
    pointer: /components/schemas/SubscriptionStatus
    java_enum: com.ax.template.authblueprint.billing.SubscriptionStatus
  - kind: contract_enum
    contract: contracts/billing-openapi.yaml
    pointer: /components/schemas/InvoiceStatus
    wire_only: >-
      The reference workload has no invoice aggregate — there is no Java
      InvoiceStatus in backend/src. The block documents the vocabulary a fork-receiver's
      invoicing module is expected to speak, and that vocabulary IS declared on disk: the
      copy-target skeleton templates/backend/billing/Invoice.java. Binding the contract to
      the skeleton keeps the two from drifting apart while the aggregate is unbuilt here.
    wire_source:
      kind: java_enum_decl
      file: templates/backend/billing/Invoice.java
      name: InvoiceStatus
  - kind: contract_enum
    contract: contracts/billing-openapi.yaml
    pointer: /components/schemas/BillingEventType
    java_enum: com.ax.template.authblueprint.billing.BillingEventType

  # ── comment-thread ────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/comment-thread-openapi.yaml
    pointer: /components/schemas/CommentResponse/properties/status
    java_enum: com.ax.template.authblueprint.commentthread.CommentStatus

  # ── data-subject-rights ───────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/data-subject-rights-openapi.yaml
    pointer: /paths/~1me~1dsr~1portability/post/parameters/0/schema
    wire_only: >-
      DsrService.producePortableCopy takes a raw String format and validates it
      against a lookup (DSR_PORTABILITY_FORMAT_INVALID); no Java enum exists. The
      accepted set is the `fmt.equals("…")` chain in that method — adding a format there
      (or dropping one) without editing the contract now FAILS.
    wire_source:
      kind: literal_pattern
      file: backend/src/main/java/com/ax/template/authblueprint/dsr/DsrService.java
      pattern: 'fmt\.equals\("([a-z]+)"\)'
      # Fail-closed: every `fmt.equals(…)` in the file must compare against a plain
      # literal. `fmt.equals(DEFAULT_FORMAT)` survives the deletion and ERRORS. And if the
      # chain is replaced wholesale by another construct the probe stops firing at all,
      # which also FAILS (a vacuous probe proves nothing) — so the extraction cannot
      # quietly degrade in either direction.
      residue_probe: '\bfmt\s*\.\s*equals\s*\('
      # P0-2 ROUND 3: scoped to the accepting method, so the chain cannot borrow
      # credibility from an `equals` elsewhere in this 600-line service, and a NEW
      # acceptance site outside producePortableCopy is residue rather than a silent
      # widening. The captures sit in an `if` condition, not in a return, so the
      # return-completeness rule (derived from the source) does NOT apply here — the
      # method legitimately returns an AccessBundle, not a wire literal.
      producer_scope:
        kind: method_bodies
        methods: [producePortableCopy]
  - kind: contract_enum
    contract: contracts/data-subject-rights-openapi.yaml
    pointer: /components/schemas/DsrRequestResponse/properties/type
    java_enum: com.ax.template.authblueprint.dsr.DsrRequestType
    wire_case: lower
    reason: >-
      DsrDtos.DsrRequestResponse.from emits DsrRequestType.metricType() — the
      lower-case bounded label (DSR-OBSERVABILITY-001) — not name().

  # ── email-outbox ──────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/email-outbox-openapi.yaml
    pointer: /paths/~1email-outbox/get/parameters/0/schema
    java_enum: com.ax.template.authblueprint.emailoutbox.EmailOutboxStatus
    wire_extra: [ALL]
    reason: >-
      ALL is the family's no-filter sentinel (notification-openapi is the reference
      implementation); EmailOutboxAdminController maps it to a null filter (P2-35b).
  - kind: contract_enum
    contract: contracts/email-outbox-openapi.yaml
    pointer: /components/schemas/EmailOutboxEntry/properties/status
    java_enum: com.ax.template.authblueprint.emailoutbox.EmailOutboxStatus

  # ── file-storage ──────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/file-storage-openapi.yaml
    pointer: /components/schemas/FileStatus
    java_enum: com.ax.template.authblueprint.filestorage.FileStatus

  # ── identity-verification ─────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/identity-verification-openapi.yaml
    pointer: /paths/~1identity-verification~1callback~1{provider}/post/parameters/0/schema
    wire_only: >-
      Provider names come from the IdentityVerificationProvider SPI
      (PassAdapter.providerName() = "pass", KcbAdapter = "kcb") — deliberately
      Strings so a fork-receiver can register another provider without editing an
      enum in the public catalog (R26). The SHIPPED adapter set is still exhaustively
      checkable: it is the return literal of every providerName() body in the domain.
    wire_source: &idv_provider_spi
      kind: java_method_returns
      files: backend/src/main/java/com/ax/template/authblueprint/identityverification/*.java
      method: providerName
  - kind: contract_enum
    contract: contracts/identity-verification-openapi.yaml
    pointer: /paths/~1admin~1identity-verification/get/parameters/0/schema
    wire_only: >-
      Same SPI-provided provider Strings, plus the family's ALL no-filter sentinel
      (P2-35a). No Java enum backs either.
    wire_source: *idv_provider_spi
    wire_extra: [ALL]
    reason: >-
      Family no-filter sentinel — a filter token, not a provider name, so no adapter
      returns it (notification-openapi is the reference implementation of the family).
  - kind: contract_enum
    contract: contracts/identity-verification-openapi.yaml
    pointer: /components/schemas/IdentityVerificationCallbackResponse/properties/providerName
    wire_only: Same SPI-provided provider Strings (see the callback parameter entry).
    wire_source: *idv_provider_spi
  - kind: contract_enum
    contract: contracts/identity-verification-openapi.yaml
    pointer: /components/schemas/VerifiedIdentityDto/properties/providerName
    wire_only: Same SPI-provided provider Strings (see the callback parameter entry).
    wire_source: *idv_provider_spi

  # ── notification ──────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/notification-openapi.yaml
    pointer: /paths/~1notifications/get/parameters/0/schema
    java_enum: com.ax.template.authblueprint.notification.NotificationStatus
    wire_extra: [ALL]
    reason: >-
      Reference implementation of the family's no-filter sentinel: the controller
      maps "ALL" to a null status filter.
  - kind: contract_enum
    contract: contracts/notification-openapi.yaml
    pointer: /components/schemas/NotificationType
    wire_only: >-
      Notification.type is a String column (length 64) in the reference workload — the
      taxonomy is fork-receiver-extensible by design, so no Java enum constrains it
      there. The vocabulary the contract advertises is nevertheless DECLARED on disk, in
      the copy-target skeleton templates/backend/notification/Notification.java, and the
      two must not drift apart.
    wire_source:
      kind: java_enum_decl
      file: templates/backend/notification/Notification.java
      name: NotificationType
  - kind: contract_enum
    contract: contracts/notification-openapi.yaml
    pointer: /components/schemas/NotificationStatus
    java_enum: com.ax.template.authblueprint.notification.NotificationStatus

  # ── payment ───────────────────────────────────────────────────────────────
  # NOTE — there is deliberately NO entry for a `sortBy` query parameter on
  # GET /payments. P0-2's producer census found it advertised but UNBOUND (PaymentController
  # .list declares only page/size and hard-codes Sort.by(DESC, "createdAt")) and classified
  # it `unproduced`. Round 4 of the same review showed why that was the wrong disposal: an
  # `unproduced` block escaped vocabulary checking entirely, so the parameter's tokens could
  # be edited to anything and nothing noticed — a closed vocabulary that nobody legislated
  # and nobody enforced. `unproduced` now requires a canonical_vocabulary, and there is no
  # canonical source for a sort vocabulary the server does not implement. The parameter was
  # therefore DELETED from contracts/payment-openapi.yaml. Re-adding it means implementing
  # it and binding its accepted set to the producer.
  - kind: contract_enum
    contract: contracts/payment-openapi.yaml
    pointer: /paths/~1payments~1callback~1{provider}/post/parameters/0/schema
    wire_only: >-
      PaymentCallbackController binds `provider` as a String and routes it through the
      PaymentCallbackVerifier SPI registry. The public catalog ships ZERO verifier
      implementations by design (R26 — a fork-receiver registers its own PG); the only
      implementation in the tree is a test-local stub deliberately named `stubpg` so it
      cannot collide with one. So no main-source producer emits this slug — the exemption
      is an absence proof, and registering a verifier flips this entry RED until it is
      bound to that verifier's providerName().
      P0-2 ROUND 2: the absence_probe below requires the interface name IMMEDIATELY after
      `implements`, so the reviewer defeated it with an ORDINARY declaration —
      `implements java.io.Serializable, PaymentCallbackVerifier` — that Spring registers
      normally. No regex closes that class of shape (multi-interface, generic, nested,
      anonymous, @Bean factory); bytecode and the running bean graph do, and both are now
      asserted by the test bound below. The probe is retained as a cheap secondary floor.
    wire_source:
      kind: unproduced
      # ROUND 4: absence of a producer is NOT the same claim as correctness of the
      # vocabulary, and this branch used to check only the first — so `mock` could be
      # edited to `accidental_typo` in the contract alone and the guard exited 0. The
      # contract's own prose already names the source of truth ("MIRROR of
      # blueprints/payment-manifest.yaml#provider.type_allowed"); that mirror is now
      # MECHANICAL in both directions. payment_provider_type_enum_guard.sh reads the same
      # manifest but only checks provider.type ∈ type_allowed — it never looks at the
      # contract, so it is not a backstop for this.
      canonical_vocabulary:
        kind: yaml_list
        file: blueprints/payment-manifest.yaml
        pointer: /provider/type_allowed
      absence_probes:
        - pattern: '(implements|extends|new)\s+PaymentCallbackVerifier\b'
          globs: ['backend/src/main/java/**/*.java']
      # Runtime + bytecode truth: ArchUnit reads the compiled main sources (so it sees a
      # class assignable to the SPI however it is declared), and the autowired registry is
      # asserted EMPTY (so it sees a bean contributed by a @Bean factory or a nested class
      # that never names the interface in a source position a regex could anchor on).
      verified_by:
        test: backend/src/test/java/com/ax/template/authblueprint/payment/PaymentContractAbsenceProofTest.java
        tag: PAYMENT
        gradle_task: testPayment
        anchors:
          - contracts/payment-openapi.yaml
          - PaymentCallbackVerifier
          - PaymentCallbackVerifierRegistry
  - kind: contract_enum
    contract: contracts/payment-openapi.yaml
    pointer: /components/schemas/Currency
    wire_only: >-
      ISO 4217 alphabetic codes are handled as Strings by common/Money (which
      derives minor-unit scale from java.util.Currency); the two listed codes are
      the reference workload's configured set, not a closed Java enum. That configured
      set is PaymentService.ALLOWED_CURRENCIES — the gate the money path actually
      enforces — so contract and enforcement can no longer diverge.
    wire_source:
      kind: java_field_literals
      file: backend/src/main/java/com/ax/template/authblueprint/payment/PaymentService.java
      symbol: ALLOWED_CURRENCIES
  - kind: contract_enum
    contract: contracts/payment-openapi.yaml
    pointer: /components/schemas/PaymentState
    java_enum: com.ax.template.authblueprint.payment.PaymentState
  - kind: contract_enum
    contract: contracts/payment-openapi.yaml
    pointer: /components/schemas/RefundResponse/properties/status
