  # ── payment ───────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/payment-openapi.yaml
    pointer: /paths/~1payments/get/parameters/2/schema
    wire_only: >-
      Sort field names (property paths), not a domain vocabulary — AND, as of P0-2's
      producer census, NOTHING consumes them: PaymentController.list declares only
      page/size and hard-codes Sort.by(DESC, "createdAt"), so the advertised `sortBy`
      parameter is UNBOUND (registered as a drift finding). There is therefore no
      producer to bind; the exemption is carried by an absence proof that self-destructs
      the moment the parameter is wired up.
    wire_source:
      kind: unproduced
      absence_probes:
        - pattern: '\bsortBy\b'
          globs: ['backend/src/main/java/**/*.java']
  - kind: contract_enum
    contract: contracts/payment-openapi.yaml
    pointer: /paths/~1payments~1callback~1{provider}/post/parameters/0/schema
    wire_only: >-
      PaymentCallbackController binds `provider` as a String and routes it through the
      PaymentCallbackVerifier SPI registry. The public catalog ships ZERO verifier
      implementations by design (R26 — a fork-receiver registers its own PG); the only
      implementation in the tree is a test-local stub deliberately named `stubpg` so it
      cannot collide with one. So no main-source producer emits this slug — the exemption
      is an absence proof, and registering a verifier flips this entry RED until it is
      bound to that verifier's providerName().
    wire_source:
      kind: unproduced
      absence_probes:
        - pattern: '(implements|extends|new)\s+PaymentCallbackVerifier\b'
          globs: ['backend/src/main/java/**/*.java']
  - kind: contract_enum
    contract: contracts/payment-openapi.yaml
    pointer: /components/schemas/Currency
    wire_only: >-
      ISO 4217 alphabetic codes are handled as Strings by common/Money (which
      derives minor-unit scale from java.util.Currency); the two listed codes are
      the reference workload's configured set, not a closed Java enum. That configured
      set is PaymentService.ALLOWED_CURRENCIES — the gate the money path actually
      enforces — so contract and enforcement can no longer diverge.
    wire_source:
      kind: java_field_literals
      file: backend/src/main/java/com/ax/template/authblueprint/payment/PaymentService.java
      symbol: ALLOWED_CURRENCIES
  - kind: contract_enum
    contract: contracts/payment-openapi.yaml
    pointer: /components/schemas/PaymentState
    java_enum: com.ax.template.authblueprint.payment.PaymentState
  - kind: contract_enum
    contract: contracts/payment-openapi.yaml
    pointer: /components/schemas/RefundResponse/properties/status
    java_enum: com.ax.template.authblueprint.payment.RefundState

