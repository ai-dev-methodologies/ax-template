  # ── ratelimit ─────────────────────────────────────────────────────────────
  - kind: contract_enum
    contract: contracts/ratelimit-openapi.yaml
    pointer: /paths/~1ratelimit~1ping/get/responses/200/content/application~1json/schema/properties/status
    wire_only: >-
      Literal probe payload ({"status":"ok"}), not a domain vocabulary. Emitted inline by
      RateLimitPingController (both the authenticated and the anonymous probe), so the
      literal itself is the producer — this is the block the P0-2 reviewer mutated
      ("ok" → "healthy") to show that a classification-only wire_only entry drifts freely.
      P0-2 ROUND 2: the reviewer then showed the literal_pattern REWRITE still passed that
      mutation, because `"healthy".toString()` is not a plain literal so the regex skipped
      ping() entirely and scraped "ok" out of the UNRELATED anonPing(). Both halves are now
      closed — `residue_probe` makes the static extraction refuse to guess, and
      `verified_by` asserts the values the RUNNING endpoints actually emit.
    wire_source:
      kind: literal_pattern
      file: backend/src/main/java/com/ax/template/authblueprint/ratelimit/RateLimitPingController.java
      pattern: 'Map\.of\("status",\s*"([^"]+)"\)'
      # Fail-closed: every `Map.of("status", …)` in the controller must hold a plain
      # literal. The reviewer's `Map.of("status", "healthy".toString())` is NOT matched by
      # `pattern`, so it survives the deletion, the probe fires on the residue and the
      # guard ERRORS instead of reporting the sibling method's "ok" as the wire vocabulary.
      residue_probe: 'Map\.of\(\s*"status"\s*,'
      # P0-2 ROUND 3: the probe above proves only the ONE construct it names, so the
      # reviewer swapped the construct instead — `Collections.singletonMap("status",
      # System.getProperty(…))` in ping() matched neither pattern nor probe, while
      # anonPing() still carried "ok", and the file-wide residue was empty. The scope is
      # now the PRODUCING METHOD BODIES: each must consume every probe occurrence AND
      # (because the capture is the returned value) leave no return expression unconsumed,
      # so ANY construct that produces the payload without a plain literal is residue.
      producer_scope:
        kind: method_bodies
        methods: [ping, anonPing]
      # Runtime truth (the primary proof — a regex cannot know what an endpoint emits):
      # both probes are driven over live HTTP and the observed value set is compared to
      # THIS block, parsed from the contract on disk by the same JSON pointer.
      verified_by:
        test: backend/src/test/java/com/ax/template/authblueprint/ratelimit/RateLimitPingWireVocabularyTest.java
        tag: RATELIMIT
        gradle_task: testRateLimit
        anchors:
          - contracts/ratelimit-openapi.yaml
          - /api/ratelimit/ping
          - /api/ratelimit/anon/ping

