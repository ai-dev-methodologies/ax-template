    neuter: 'False'

  # ── completion_checklist_recency/fail_audit_log_tree_mutated_midrun ───────────
  # fixture: runs.jsonl latest line is green on EVERY endpoint axis — head match, exit=0,
  #          hard_fail=0, full_run=true, usable tree_fingerprint, tree_clean AND
