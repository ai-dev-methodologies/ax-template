  # fixture: AKIA key in backend/src/com/example/Config.java with "// your-env override" comment.
  #          The path contains "example" and the comment contains "your-" (both in ALLOWLIST).
  #          The AKIA TOKEN VALUE itself is not a placeholder — so the guard must exit 1.
  # anchor:  Layer 2 token-level allowlist check (not Layer 1 which uses -qiE).
  # neuter:  check full $content line instead of individual $tok value → "your-" in comment
  #          triggers allowlist → all_placeholder=1 → suppress → exit 0.
  - id: private_boundary/fail_secret_incidental
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_secret_incidental
    fixture_arg: '--repo-root'
    anchor: 'echo "$tok" | grep -qE "$ALLOWLIST_PATTERN"'
    neuter: 'echo "$content" | grep -qE "$ALLOWLIST_PATTERN"'

  # ── fail_secret_multitoken: all-token scanning loop (N1 fix — head -1 removed) ──
  # fixture: MultiTokenConfig.java has two AKIA tokens on one line:
  #          first  = AKIAEXAMPLEXXXXXXXXX (placeholder, in allowlist)
  #          second = AKIA0123456789ABCDEF (real key, NOT in allowlist)
  # anchor:  Layer 2 grep-oE extraction (distinct from Layer 1 which uses -oiE + $pattern).
  # neuter:  add "| head -1" to the extraction → only the first (placeholder) token is checked
  #          → all_placeholder=1 → suppress → exit 0.
  - id: private_boundary/fail_secret_multitoken
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_secret_multitoken
    fixture_arg: '--repo-root'
    anchor: 'done < <(echo "$content" | grep -oE -e "$secret_pattern")'
    neuter: 'done < <(echo "$content" | grep -oE -e "$secret_pattern" | head -1)'

  # ── fail_pragma_in_code: pragma path restriction (docs/ and practices/rules/ only) ──
  # fixture: PragmaBypass.java in backend/src/ has AKIA key with "# pragma: allow-secret".
  #          SecurityNotes.md also in backend/src/ has the same.
  #          Both are in code paths — pragma must be ignored → exit 1.
  # anchor:  the is_doc_path case pattern that restricts valid doc paths.
  # neuter:  replace with bare "*)" → every path becomes a doc path → pragma accepted
  #          everywhere → code-tree secrets suppressed → exit 0.
  - id: private_boundary/fail_pragma_in_code
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_pragma_in_code
    fixture_arg: '--repo-root'
    anchor: 'docs/* | practices/rules/*)'
    neuter: '*)'

  # ── fail_commit_msg: --commit-msg-file scan (P2-15, .githooks/commit-msg) ───
  # fixture: fail_commit_msg/.ax-private-markers has 'AcmeCorp'; COMMIT_MSG contains
  #          it in free text (no tracked file has it — only the commit-msg-file
  #          scan can catch this). Two-input guard: --repo-root (loads the
  #          fixture's own .ax-private-markers) + --commit-msg-file (the message
  #          text) — needs fixture_arg2/fixture2 since one fixture_arg is not enough.
  # anchor:  the counter increment that turns a detected commit-msg marker match
  #          into a reported violation (the print alone doesn't flip the exit —
  #          the surrounding `if [ "$commit_msg_violations" -gt 0 ]` gate does).
  # neuter:  no-op the increment → matches are still printed to stderr but never
  #          counted → the mode's exit-0 branch fires regardless of match → exit 0.
  - id: private_boundary/fail_commit_msg
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_commit_msg
    fixture_arg: '--repo-root'
    fixture_arg2: '--commit-msg-file'
    fixture2: practices/evals/fixtures/private-boundary/fail_commit_msg/COMMIT_MSG
    anchor: 'commit_msg_violations=$((commit_msg_violations + 1))'
    neuter: 'true  # neutered: commit-msg violation counter disabled'

  # ── completion_checklist_recency/fail_audit_log_partial_run: full_run gate ───
  # fixture: runs.jsonl latest line matches expected_head with exit=0/hard_fail=0
  #          but full_run=false (written by a --step partial run) → exit 1.
  # anchor:  the full_run check condition (check #5 in the guard).
