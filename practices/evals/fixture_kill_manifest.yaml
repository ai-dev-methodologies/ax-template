  # neuter:  condition-constant False → a tree mutated mid-run certifies a push again → exit 0.
  - id: completion_checklist_recency/fail_audit_log_tree_mutated_midrun
    guard: practices/evals/completion_checklist_recency_guard.sh
    fixture: practices/evals/fixtures/completion_checklist_recency/fail_audit_log_tree_mutated_midrun
    fixture_arg: '--root'
    anchor: 'not tree_settled'
    neuter: 'False'

  # ── completion_checklist_recency/fail_audit_log_no_tree_fingerprint ───────────
  # fixture: runs.jsonl latest line is green on every other axis (including
  #          tree_clean=true) but omits tree_fingerprint entirely — the shape of every
  #          line written before the tree binding existed, and of a run whose
