# fixture_kill_manifest.yaml — shell-guard fail fixture kill-proof registry
# (covers private_boundary_guard [86] + completion_checklist_recency_guard [49th])
#
# Each item proves that a specific fail fixture is NON-VACUOUS by mutation:
#   original guard on fixture → exit 1  (fixture reproduces the failure)
#   neutered guard on fixture → exit 0  (fixture depends on the targeted logic)
#
# anchor rules:
#   - MUST appear exactly once in the guard source (0 or 2+ → manifest stale → BLOCK)
#   - identifies the specific detection logic being tested
#
# neuter rules:
#   - a minimal source change that disables only the targeted detection
#   - must cause the exit to flip from 1 to 0 on the paired fixture

items:

  # ── fail_marker: Layer 1 opt-in marker detection ─────────────────────────────
  # fixture: .ax-private-markers has 'AcmeCorp', backend/src/AcmeOrderService.java contains it.
  # anchor:  the single call that reports a Layer 1 marker violation.
  # neuter:  silence that call → Layer 1 fires but never increments violations → exit 0.
  - id: private_boundary/fail_marker
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_marker
    fixture_arg: '--repo-root'
    anchor: 'report_violation "1:marker" "$pattern" "$hit"'
    neuter: 'true  # neutered: layer 1 marker reporting disabled'

  # ── fail_secret: Layer 2 PEM private key pattern (SECRET_A) ──────────────────
  # fixture: backend/src/InfraConfig.java contains a raw PEM private key header.
  # anchor:  the SECRET_A pattern definition.
  # neuter:  replace PEM pattern with a non-matching string → SECRET_A never fires → exit 0.
  - id: private_boundary/fail_secret
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_secret
    fixture_arg: '--repo-root'
    anchor: "SECRET_A='-----BEGIN [A-Z ]*PRIVATE KEY-----'"
    neuter: "SECRET_A='NEUTER_NOMATCH_XXXXXXXX'"

  # ── fail_secret_incidental: value-only token check (C1 fix) ──────────────────
  # fixture: AKIA key in backend/src/com/example/Config.java with "// your-env override" comment.
  #          The path contains "example" and the comment contains "your-" (both in ALLOWLIST).
  #          The AKIA TOKEN VALUE itself is not a placeholder — so the guard must exit 1.
  # anchor:  Layer 2 token-level allowlist check (not Layer 1 which uses -qiE).
  # neuter:  check full $content line instead of individual $tok value → "your-" in comment
  #          triggers allowlist → all_placeholder=1 → suppress → exit 0.
  - id: private_boundary/fail_secret_incidental
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_secret_incidental
    fixture_arg: '--repo-root'
    anchor: 'echo "$tok" | grep -qE "$ALLOWLIST_PATTERN"'
    neuter: 'echo "$content" | grep -qE "$ALLOWLIST_PATTERN"'

  # ── fail_secret_multitoken: all-token scanning loop (N1 fix — head -1 removed) ──
  # fixture: MultiTokenConfig.java has two AKIA tokens on one line:
  #          first  = AKIAEXAMPLEXXXXXXXXX (placeholder, in allowlist)
  #          second = AKIA0123456789ABCDEF (real key, NOT in allowlist)
  # anchor:  Layer 2 grep-oE extraction (distinct from Layer 1 which uses -oiE + $pattern).
  # neuter:  add "| head -1" to the extraction → only the first (placeholder) token is checked
  #          → all_placeholder=1 → suppress → exit 0.
  - id: private_boundary/fail_secret_multitoken
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_secret_multitoken
    fixture_arg: '--repo-root'
    anchor: 'done < <(echo "$content" | grep -oE -e "$secret_pattern")'
    neuter: 'done < <(echo "$content" | grep -oE -e "$secret_pattern" | head -1)'

  # ── fail_pragma_in_code: pragma path restriction (docs/ and practices/rules/ only) ──
  # fixture: PragmaBypass.java in backend/src/ has AKIA key with "# pragma: allow-secret".
  #          SecurityNotes.md also in backend/src/ has the same.
  #          Both are in code paths — pragma must be ignored → exit 1.
  # anchor:  the is_doc_path case pattern that restricts valid doc paths.
  # neuter:  replace with bare "*)" → every path becomes a doc path → pragma accepted
  #          everywhere → code-tree secrets suppressed → exit 0.
  - id: private_boundary/fail_pragma_in_code
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_pragma_in_code
    fixture_arg: '--repo-root'
    anchor: 'docs/* | practices/rules/*)'
    neuter: '*)'

  # ── fail_commit_msg: --commit-msg-file scan (P2-15, .githooks/commit-msg) ───
  # fixture: fail_commit_msg/.ax-private-markers has 'AcmeCorp'; COMMIT_MSG contains
  #          it in free text (no tracked file has it — only the commit-msg-file
  #          scan can catch this). Two-input guard: --repo-root (loads the
  #          fixture's own .ax-private-markers) + --commit-msg-file (the message
  #          text) — needs fixture_arg2/fixture2 since one fixture_arg is not enough.
  # anchor:  the counter increment that turns a detected commit-msg marker match
  #          into a reported violation (the print alone doesn't flip the exit —
  #          the surrounding `if [ "$commit_msg_violations" -gt 0 ]` gate does).
  # neuter:  no-op the increment → matches are still printed to stderr but never
  #          counted → the mode's exit-0 branch fires regardless of match → exit 0.
  - id: private_boundary/fail_commit_msg
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_commit_msg
    fixture_arg: '--repo-root'
    fixture_arg2: '--commit-msg-file'
    fixture2: practices/evals/fixtures/private-boundary/fail_commit_msg/COMMIT_MSG
    anchor: 'commit_msg_violations=$((commit_msg_violations + 1))'
    neuter: 'true  # neutered: commit-msg violation counter disabled'

  # ── completion_checklist_recency/fail_audit_log_partial_run: full_run gate ───
  # fixture: runs.jsonl latest line matches expected_head with exit=0/hard_fail=0
  #          but full_run=false (written by a --step partial run) → exit 1.
  # anchor:  the full_run check condition (check #5 in the guard).
  # neuter:  replace the condition with False → partial runs accepted → exit 0.
  - id: completion_checklist_recency/fail_audit_log_partial_run
    guard: practices/evals/completion_checklist_recency_guard.sh
    fixture: practices/evals/fixtures/completion_checklist_recency/fail_audit_log_partial_run
    fixture_arg: '--root'
    anchor: 'latest.get("full_run") is not True'
    neuter: 'False'

  # ── evidence_guard/fail_missing_caveat: P2-20 internal_design caveat check ────
  # fixture: an internal_design rule carrying a source_type:external evidence entry
  #          that omits `anchors: generic_principle_only` → evidence_guard exit 1.
  # anchor:  the P2-20 condition expression that flags the missing caveat.
  # neuter:  replace the condition with False → the caveat check never fires →
  #          the fixture's only violation disappears → exit 0.
  # fixture_arg: evidence_guard reads its target catalog as a bare absolute
  #          positional (the `/*` CATALOG_DIR_OVERRIDE branch, which always wins
  #          over --catalog). The kill-proof harness always appends the fixture
  #          path AFTER fixture_arg, so a non-empty fixture_arg is required to
  #          route through the two-input branch — `--catalog=practices` is an
  #          inert placeholder (immediately overridden by the positional fixture
  #          path). It must be non-empty: an empty middle column collapses under
  #          the harness's `IFS=$'\t' read` (tab is whitespace) and shifts the
  #          anchor into the wrong field.
  - id: evidence_guard/fail_missing_caveat
    guard: practices/evals/evidence_guard.sh
    fixture: practices/evals/fixtures/evidence-caveat/fail_missing_caveat
    fixture_arg: '--catalog=practices'
    anchor: 'prov == "internal_design" and str(item.get("anchors", "")).strip() != "generic_principle_only"'
    neuter: 'False'

  # ── contract_enum_parity/fail_drift: java_enum constant-set comparison ───────
  # fixture: the constructor-arg enum (WidgetFormat) drops XLSX and gains PDF while
  #          the contract still promises [CSV, XLSX] → both difference directions
  #          are non-empty → exit 1.
  # anchor:  the single condition that turns an undeclared difference into a violation.
  # neuter:  condition-constant False → drift is never reported → exit 0.
  - id: contract_enum_parity/fail_drift
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_drift
    fixture_arg: '--root'
    anchor: 'undeclared_extra or undeclared_missing'
    neuter: 'False'

  # ── contract_enum_parity/fail_unmapped_enum: exhaustiveness ─────────────────
  # fixture: the `label` block's wire_only entry is removed from the manifest, so a
  #          real enum: block on disk is unclassified → exit 1.
  # anchor:  the forward-direction exhaustiveness test — the property that makes
  #          this gate non-heuristic (no name inference, no default classification).
  # neuter:  condition-constant False → unclassified blocks pass silently → exit 0.
  - id: contract_enum_parity/fail_unmapped_enum
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_unmapped_enum
    fixture_arg: '--root'
    anchor: 'key not in claimed'
    neuter: 'False'

  # ── contract_enum_parity/fail_wire_only_no_source: P0-2 hole closure ────────
  # fixture: the `note` block's entry is CLASSIFICATION-ONLY — a wire_only reason and
  #          nothing else, which is exactly what the pre-fix guard accepted (it checked
  #          the reason was non-empty, then `continue`d). The sibling `label` entry keeps
  #          a real wire_source, so the ZERO_WIRE_SOURCE_EXTRACTION floor stays quiet and
  #          the fixture fails on ONE axis → exit 1.
  # anchor:  the wire_source kind membership test — the gate that turns "no producer
  #          declared" into a violation instead of a silent skip.
  # neuter:  condition-constant False → every wire_only entry falls through the tolerant
  #          extractor lookup and is skipped unchecked (the pre-fix behaviour) → exit 0.
  - id: contract_enum_parity/fail_wire_only_no_source
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_wire_only_no_source
    fixture_arg: '--root'
    anchor: 'skind not in WIRE_SOURCE_KINDS'
    neuter: 'False'

  # ── contract_enum_parity/fail_wire_only_drift: producer↔contract set equality ─
  # fixture: the declared producer (WidgetNotes, literal_pattern) emits "note-healthy"
  #          while the contract still promises [note-a] — the miniature of the reviewer's
  #          reproduction (ratelimit "ok" → "healthy") → exit 1.
  # anchor:  the single undeclared-difference test. Shared with fail_drift by design:
  #          the java_enum path and the wire_source path deliberately compare through the
  #          SAME helper, so an allowance means the same thing on both. The two fixtures
  #          prove the two entry kinds reach it.
  # neuter:  condition-constant False → drift is never reported → exit 0.
  - id: contract_enum_parity/fail_wire_only_drift
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_wire_only_drift
    fixture_arg: '--root'
    anchor: 'undeclared_extra or undeclared_missing'
    neuter: 'False'

  # ── contract_enum_parity/fail_wire_only_unproduced_producer_exists ──────────
  # fixture: the `origin` entry is exempted as `unproduced`, but WidgetOriginResolver.java
  #          now matches its absence probe — the exemption has rotted into a lie → exit 1.
  #          This is the check that keeps the ONLY escape from set equality honest.
  # anchor:  the probe-hit test inside the absence proof.
  # neuter:  condition-constant False → a matching probe is ignored, so the exemption
  #          survives its own producer → exit 0.
  - id: contract_enum_parity/fail_wire_only_unproduced_producer_exists
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_wire_only_unproduced_producer_exists
    fixture_arg: '--root'
    anchor: 'len(probe_hits) > 0'
    neuter: 'False'

  # NOTE — contract_enum_parity/fail_vocab_scan is deliberately NOT registered here.
  # That fixture restores the skeleton's real P2-34 drift token SUCCESS, which trips
  # BOTH vocab_scan axes at once (forbidden token present AND require_all missing
  # SUCCEEDED), so no SINGLE allowlisted neuter shape can flip it 1→0 — the
  # condition-constant shape silences one axis and leaves the other firing. The
  # double-axis property is the point (per the P2-33 spec), so the fixture keeps it
  # and its non-vacuity is recorded as an observed manual 1→0 flip in the closure
  # note instead of being weakened to fit this manifest's vocabulary.

  # ── full_trio_artifact_completeness/fail_l4_empty_directory: P1-2 fix ───────
  # (cross-family review, xhigh) — the pre-fix guard used os.path.isdir() alone
  # to check the L4 frontend leg, so an empty/.gitkeep-only templates/L4/<stem>/
  # dir satisfied a full_trio spec's frontend-Trio claim. The fixture reproduces
  # exactly that: specs/contracts/blueprints all present, but
  # templates/L4/widget/ holds only a .gitkeep (no non-empty .tsx) → exit 1.
  # anchor:  the condition that turns "no non-empty .tsx found" into a reported gap.
  # neuter:  condition-constant False → the gap is never reported → exit 0 (this
  #          is exactly the reverted-to-vacuous isdir()-only behavior the P1-2
  #          fix closed).
  - id: full_trio_artifact_completeness/fail_l4_empty_directory
    guard: practices/evals/full_trio_artifact_completeness_guard.sh
    fixture: practices/evals/fixtures/full_trio_artifact_completeness/fail_l4_empty_directory
    fixture_arg: '--root'
    anchor: 'not has_nonempty_tsx'
    neuter: 'False'
