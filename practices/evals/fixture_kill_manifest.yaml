# fixture_kill_manifest.yaml — shell-guard fail fixture kill-proof registry
# (covers private_boundary_guard [86] + completion_checklist_recency_guard [49th])
#
# Each item proves that a specific fail fixture is NON-VACUOUS by mutation:
#   original guard on fixture → exit 1  (fixture reproduces the failure)
#   neutered guard on fixture → exit 0  (fixture depends on the targeted logic)
#
# anchor rules:
#   - MUST appear exactly once in the guard source (0 or 2+ → manifest stale → BLOCK)
#   - identifies the specific detection logic being tested
#
# neuter rules:
#   - a minimal source change that disables only the targeted detection
#   - must cause the exit to flip from 1 to 0 on the paired fixture

items:

  # ── fail_marker: Layer 1 opt-in marker detection ─────────────────────────────
  # fixture: .ax-private-markers has 'AcmeCorp', backend/src/AcmeOrderService.java contains it.
  # anchor:  the single call that reports a Layer 1 marker violation.
  # neuter:  silence that call → Layer 1 fires but never increments violations → exit 0.
  - id: private_boundary/fail_marker
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_marker
    fixture_arg: '--repo-root'
    anchor: 'report_violation "1:marker" "$pattern" "$hit"'
    neuter: 'true  # neutered: layer 1 marker reporting disabled'

  # ── fail_secret: Layer 2 PEM private key pattern (SECRET_A) ──────────────────
  # fixture: backend/src/InfraConfig.java contains a raw PEM private key header.
  # anchor:  the SECRET_A pattern definition.
  # neuter:  replace PEM pattern with a non-matching string → SECRET_A never fires → exit 0.
  - id: private_boundary/fail_secret
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_secret
    fixture_arg: '--repo-root'
    anchor: "SECRET_A='-----BEGIN [A-Z ]*PRIVATE KEY-----'"
    neuter: "SECRET_A='NEUTER_NOMATCH_XXXXXXXX'"

  # ── fail_secret_incidental: value-only token check (C1 fix) ──────────────────
  # fixture: AKIA key in backend/src/com/example/Config.java with "// your-env override" comment.
  #          The path contains "example" and the comment contains "your-" (both in ALLOWLIST).
  #          The AKIA TOKEN VALUE itself is not a placeholder — so the guard must exit 1.
  # anchor:  Layer 2 token-level allowlist check (not Layer 1 which uses -qiE).
  # neuter:  check full $content line instead of individual $tok value → "your-" in comment
  #          triggers allowlist → all_placeholder=1 → suppress → exit 0.
  - id: private_boundary/fail_secret_incidental
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_secret_incidental
    fixture_arg: '--repo-root'
    anchor: 'echo "$tok" | grep -qE "$ALLOWLIST_PATTERN"'
    neuter: 'echo "$content" | grep -qE "$ALLOWLIST_PATTERN"'

  # ── fail_secret_multitoken: all-token scanning loop (N1 fix — head -1 removed) ──
  # fixture: MultiTokenConfig.java has two AKIA tokens on one line:
  #          first  = AKIAEXAMPLEXXXXXXXXX (placeholder, in allowlist)
  #          second = AKIA0123456789ABCDEF (real key, NOT in allowlist)
  # anchor:  Layer 2 grep-oE extraction (distinct from Layer 1 which uses -oiE + $pattern).
  # neuter:  add "| head -1" to the extraction → only the first (placeholder) token is checked
  #          → all_placeholder=1 → suppress → exit 0.
  - id: private_boundary/fail_secret_multitoken
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_secret_multitoken
    fixture_arg: '--repo-root'
    anchor: 'done < <(echo "$content" | grep -oE -e "$secret_pattern")'
    neuter: 'done < <(echo "$content" | grep -oE -e "$secret_pattern" | head -1)'

  # ── fail_pragma_in_code: pragma path restriction (docs/ and practices/rules/ only) ──
  # fixture: PragmaBypass.java in backend/src/ has AKIA key with "# pragma: allow-secret".
  #          SecurityNotes.md also in backend/src/ has the same.
  #          Both are in code paths — pragma must be ignored → exit 1.
  # anchor:  the is_doc_path case pattern that restricts valid doc paths.
  # neuter:  replace with bare "*)" → every path becomes a doc path → pragma accepted
  #          everywhere → code-tree secrets suppressed → exit 0.
  - id: private_boundary/fail_pragma_in_code
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_pragma_in_code
    fixture_arg: '--repo-root'
    anchor: 'docs/* | practices/rules/*)'
    neuter: '*)'

  # ── fail_commit_msg: --commit-msg-file scan (P2-15, .githooks/commit-msg) ───
  # fixture: fail_commit_msg/.ax-private-markers has 'AcmeCorp'; COMMIT_MSG contains
  #          it in free text (no tracked file has it — only the commit-msg-file
  #          scan can catch this). Two-input guard: --repo-root (loads the
  #          fixture's own .ax-private-markers) + --commit-msg-file (the message
  #          text) — needs fixture_arg2/fixture2 since one fixture_arg is not enough.
  # anchor:  the counter increment that turns a detected commit-msg marker match
  #          into a reported violation (the print alone doesn't flip the exit —
  #          the surrounding `if [ "$commit_msg_violations" -gt 0 ]` gate does).
  # neuter:  no-op the increment → matches are still printed to stderr but never
  #          counted → the mode's exit-0 branch fires regardless of match → exit 0.
  - id: private_boundary/fail_commit_msg
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_commit_msg
    fixture_arg: '--repo-root'
    fixture_arg2: '--commit-msg-file'
    fixture2: practices/evals/fixtures/private-boundary/fail_commit_msg/COMMIT_MSG
    anchor: 'commit_msg_violations=$((commit_msg_violations + 1))'
    neuter: 'true  # neutered: commit-msg violation counter disabled'

  # ── completion_checklist_recency/fail_audit_log_partial_run: full_run gate ───
  # fixture: runs.jsonl latest line matches expected_head with exit=0/hard_fail=0
  #          but full_run=false (written by a --step partial run) → exit 1.
  # anchor:  the full_run check condition (check #5 in the guard).
  # neuter:  replace the condition with False → partial runs accepted → exit 0.
  - id: completion_checklist_recency/fail_audit_log_partial_run
    guard: practices/evals/completion_checklist_recency_guard.sh
    fixture: practices/evals/fixtures/completion_checklist_recency/fail_audit_log_partial_run
    fixture_arg: '--root'
    anchor: 'latest.get("full_run") is not True'
    neuter: 'False'

  # ── completion_checklist_recency/fail_audit_log_dirty_tree: push-evidence gate ─
  # fixture: runs.jsonl latest line is green on every pre-existing axis (head match,
  #          exit=0, hard_fail=0, full_run=true, tree_fingerprint present) but carries
  #          tree_clean=false — evidence produced on a dirty tree, which certifies a
  #          tree that differs from the commit being pushed → exit 1.
  # anchor:  the tree_clean check condition (check #7 in the guard).
  # neuter:  condition-constant False → dirty-tree evidence accepted again → exit 0.
  - id: completion_checklist_recency/fail_audit_log_dirty_tree
    guard: practices/evals/completion_checklist_recency_guard.sh
    fixture: practices/evals/fixtures/completion_checklist_recency/fail_audit_log_dirty_tree
    fixture_arg: '--root'
    anchor: 'latest.get("tree_clean") is not True'
    neuter: 'False'

  # ── completion_checklist_recency/fail_audit_log_no_tree_fingerprint ───────────
  # fixture: runs.jsonl latest line is green on every other axis (including
  #          tree_clean=true) but omits tree_fingerprint entirely — the shape of every
  #          line written before the tree binding existed, and of a run whose
  #          fingerprint degraded (nogit / unverifiable-*) → exit 1.
  # anchor:  the fingerprint-usability check condition (check #6 in the guard).
  # neuter:  condition-constant False → unidentified trees accepted again → exit 0.
  - id: completion_checklist_recency/fail_audit_log_no_tree_fingerprint
    guard: practices/evals/completion_checklist_recency_guard.sh
    fixture: practices/evals/fixtures/completion_checklist_recency/fail_audit_log_no_tree_fingerprint
    fixture_arg: '--root'
    anchor: 'not tree_fp_usable'
    neuter: 'False'

  # ── evidence_guard/fail_missing_caveat: P2-20 internal_design caveat check ────
  # fixture: an internal_design rule carrying a source_type:external evidence entry
  #          that omits `anchors: generic_principle_only` → evidence_guard exit 1.
  # anchor:  the P2-20 condition expression that flags the missing caveat.
  # neuter:  replace the condition with False → the caveat check never fires →
  #          the fixture's only violation disappears → exit 0.
  # fixture_arg: evidence_guard reads its target catalog as a bare absolute
  #          positional (the `/*` CATALOG_DIR_OVERRIDE branch, which always wins
  #          over --catalog). The kill-proof harness always appends the fixture
  #          path AFTER fixture_arg, so a non-empty fixture_arg is required to
  #          route through the two-input branch — `--catalog=practices` is an
  #          inert placeholder (immediately overridden by the positional fixture
  #          path). It must be non-empty: an empty middle column collapses under
  #          the harness's `IFS=$'\t' read` (tab is whitespace) and shifts the
  #          anchor into the wrong field.
  - id: evidence_guard/fail_missing_caveat
    guard: practices/evals/evidence_guard.sh
    fixture: practices/evals/fixtures/evidence-caveat/fail_missing_caveat
    fixture_arg: '--catalog=practices'
    anchor: 'prov == "internal_design" and str(item.get("anchors", "")).strip() != "generic_principle_only"'
    neuter: 'False'

  # ── contract_enum_parity/fail_drift: java_enum constant-set comparison ───────
  # fixture: the constructor-arg enum (WidgetFormat) drops XLSX and gains PDF while
  #          the contract still promises [CSV, XLSX] → both difference directions
  #          are non-empty → exit 1.
  # anchor:  the single condition that turns an undeclared difference into a violation.
  # neuter:  condition-constant False → drift is never reported → exit 0.
  - id: contract_enum_parity/fail_drift
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_drift
    fixture_arg: '--root'
    anchor: 'undeclared_extra or undeclared_missing'
    neuter: 'False'

  # ── contract_enum_parity/fail_unmapped_enum: exhaustiveness ─────────────────
  # fixture: the `label` block's wire_only entry is removed from the manifest, so a
  #          real enum: block on disk is unclassified → exit 1.
  # anchor:  the forward-direction exhaustiveness test — the property that makes
  #          this gate non-heuristic (no name inference, no default classification).
  # neuter:  condition-constant False → unclassified blocks pass silently → exit 0.
  - id: contract_enum_parity/fail_unmapped_enum
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_unmapped_enum
    fixture_arg: '--root'
    anchor: 'key not in claimed'
    neuter: 'False'

  # ── contract_enum_parity/fail_wire_only_no_source: P0-2 hole closure ────────
  # fixture: the `note` block's entry is CLASSIFICATION-ONLY — a wire_only reason and
  #          nothing else, which is exactly what the pre-fix guard accepted (it checked
  #          the reason was non-empty, then `continue`d). The sibling `label` entry keeps
  #          a real wire_source, so the ZERO_WIRE_SOURCE_EXTRACTION floor stays quiet and
  #          the fixture fails on ONE axis → exit 1.
  # anchor:  the wire_source kind membership test — the gate that turns "no producer
  #          declared" into a violation instead of a silent skip.
  # neuter:  condition-constant False → every wire_only entry falls through the tolerant
  #          extractor lookup and is skipped unchecked (the pre-fix behaviour) → exit 0.
  - id: contract_enum_parity/fail_wire_only_no_source
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_wire_only_no_source
    fixture_arg: '--root'
    anchor: 'skind not in WIRE_SOURCE_KINDS'
    neuter: 'False'

  # ── contract_enum_parity/fail_wire_only_drift: producer↔contract set equality ─
  # fixture: the declared producer (WidgetNotes, literal_pattern) emits "note-healthy"
  #          while the contract still promises [note-a] — the miniature of the reviewer's
  #          reproduction (ratelimit "ok" → "healthy") → exit 1.
  # anchor:  the single undeclared-difference test. Shared with fail_drift by design:
  #          the java_enum path and the wire_source path deliberately compare through the
  #          SAME helper, so an allowance means the same thing on both. The two fixtures
  #          prove the two entry kinds reach it.
  # neuter:  condition-constant False → drift is never reported → exit 0.
  - id: contract_enum_parity/fail_wire_only_drift
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_wire_only_drift
    fixture_arg: '--root'
    anchor: 'undeclared_extra or undeclared_missing'
    neuter: 'False'

  # ── contract_enum_parity/fail_wire_only_unproduced_producer_exists ──────────
  # fixture: the `origin` entry is exempted as `unproduced`, but WidgetOriginResolver.java
  #          now matches its absence probe — the exemption has rotted into a lie → exit 1.
  #          This is the check that keeps the ONLY escape from set equality honest.
  # anchor:  the probe-hit test inside the absence proof.
  # neuter:  condition-constant False → a matching probe is ignored, so the exemption
  #          survives its own producer → exit 0.
  - id: contract_enum_parity/fail_wire_only_unproduced_producer_exists
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_wire_only_unproduced_producer_exists
    fixture_arg: '--root'
    anchor: 'len(probe_hits) > 0'
    neuter: 'False'

  # ── contract_enum_parity/fail_literal_pattern_residue: P0-2 round 2, ESCAPE 1 ─
  # fixture: WidgetNotes.note() — the method the contract block describes — emits
  #          `Map.of("note", "note-healthy".toString())`. That is NOT a plain literal, so
  #          the entry's `pattern:` skips it entirely and captures "note-a" from the
  #          UNRELATED altNote(); set equality then HELD against a contract the running
  #          method contradicts. This is the reviewer's ratelimit reproduction in
  #          miniature ("ok" kept in the sibling probe, "healthy".toString() in the one
  #          under test). `residue_probe` survives the pattern deletion → exit 1.
  # anchor:  the residue test — the single condition that turns "the producing construct
  #          held something other than a literal" into "cannot prove the literal set"
  #          instead of a silent skip.
  # neuter:  condition-constant False → residue is ignored, the wrong literals are
  #          reported as the whole set, and they happen to equal the contract → exit 0.
  - id: contract_enum_parity/fail_literal_pattern_residue
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_literal_pattern_residue
    fixture_arg: '--root'
    anchor: 'len(residue_hits) > 0'
    neuter: 'False'

  # ── contract_enum_parity/fail_unproduced_unverified: P0-2 round 2, ESCAPE 2 ──
  # fixture: the `origin` entry claims `unproduced` with source absence_probes ONLY. The
  #          real-tree analogue is the PaymentCallbackVerifier probe, which the reviewer
  #          defeated with an entirely ordinary declaration — `implements
  #          java.io.Serializable, PaymentCallbackVerifier` — because the regex requires
  #          the interface name immediately after `implements`. Tightening the regex only
  #          moves the hole (generic, nested, anonymous, @Bean factory), so an absence
  #          claim must be bound to a runtime/bytecode test → exit 1.
  #          The sibling `label` entry keeps a resolvable verified_by, so the
  #          ZERO_RUNTIME_VERIFIED floor stays quiet and the fixture fails on ONE axis.
  # anchor:  the mandatory-binding test on the absence kind.
  # neuter:  condition-constant False → the absence claim rests on the source regex again
  #          (the shape the reviewer defeated) and the entry passes → exit 0.
  - id: contract_enum_parity/fail_unproduced_unverified
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_unproduced_unverified
    fixture_arg: '--root'
    anchor: 'not vb_declared'
    neuter: 'False'

  # ── contract_enum_parity/fail_verified_by_not_run: the binding must be load-bearing ─
  # fixture: the `origin` entry declares a verified_by naming `gradle_task: testGhost`,
  #          which backend/build.gradle.kts does not register — a "runtime proof" that no
  #          per-domain task selects is a citation, not a gate → exit 1.
  # anchor:  the task-registration test inside check_verified_by.
  # neuter:  condition-constant False → the missing task is ignored; the tolerant
  #          `if registered else gbody` fallback then scans the whole build file, finds
  #          the tag under some other task, and the binding is accepted → exit 0.
  - id: contract_enum_parity/fail_verified_by_not_run
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_verified_by_not_run
    fixture_arg: '--root'
    anchor: 'not registered'
    neuter: 'False'

  # ── contract_enum_parity/fail_java_enum_foreign_domain: P0-2 round 3, CLASS A ─
  # fixture: the `status` block is bound to com.demo.other.OtherStatus — an UNRELATED
  #          domain's enum that happens to declare the same {OPEN, CLOSED} as the
  #          com.demo.WidgetStatus that really serves it. Set equality HOLDS against the
  #          wrong enum, so nothing else fires and the right enum is never examined again
  #          (real-tree reproduction: repoint the SessionStatus entry at apikey
  #          .ApiKeyStatus — both {ACTIVE, REVOKED} — then add EXPIRED to SessionStatus) →
  #          exit 1.
  # anchor:  the binding-coherence test — the single condition that stops a java_enum
  #          FQCN from being an uncorroborated assertion by requiring the enum's on-disk
  #          package leaf to be the contract file's own domain.
  # neuter:  condition-constant False → any FQCN is accepted again, the constants match,
  #          and the mis-binding passes → exit 0.
  - id: contract_enum_parity/fail_java_enum_foreign_domain
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_java_enum_foreign_domain
    fixture_arg: '--root'
    anchor: 'pkg_leaf != domain_key and allow_key not in CROSS_DOMAIN_BINDINGS'
    neuter: 'False'

  # ── contract_enum_parity/fail_producer_construct_swap: P0-2 round 3, CLASS B ──
  # fixture: WidgetNotes.note() — the method the block describes — builds its payload with
  #          a DIFFERENT construct (`Collections.singletonMap("note", System.getProperty(
  #          …))`), which matches neither `pattern:` nor the `Map.of("note",` residue_probe,
  #          while the sibling altNote() still carries the contract's literal. Round 2's
  #          FILE-wide residue is therefore empty and the extracted set still equals the
  #          contract — a residue_probe proves occurrences of the ONE construct it names,
  #          not the construct CLASS. Body-scoped residue sees an unconsumed return in the
  #          declared producer → exit 1.
  # anchor:  the return-completeness test inside the body-scoped residue sweep — active
  #          exactly when the captured literal IS the returned value (derived from the
  #          source, so an acceptance chain like `fmt.equals("csv")` is not held to it).
  # neuter:  condition-constant False → a return holding any non-literal expression is no
  #          longer residue, the sibling's literal reads as the whole vocabulary, and set
  #          equality passes → exit 0.
  - id: contract_enum_parity/fail_producer_construct_swap
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_producer_construct_swap
    fixture_arg: '--root'
    anchor: 'bool(ret_expr.strip())'
    neuter: 'False'

  # ── contract_enum_parity/fail_producer_scope_incomplete: P0-2 round 3, CLASS B' ─
  # fixture: the entry declares `methods: [note]` while a SECOND request-mapped handler,
  #          altNote(), serves the same block and emits "note-b" via a construct neither
  #          `pattern:` nor `residue_probe:` names. Body-scoped residue is quiet (it only
  #          looks inside note()) and the extracted set still equals the contract — so
  #          simply OMITTING a method from the declaration restores the escape the scope
  #          exists to close → exit 1.
  # anchor:  the declaration-completeness test: the request-mapped handler set is a fact on
  #          disk, so `methods:` must cover all of it.
  # neuter:  condition-constant False → the undeclared handler is invisible again and the
  #          declared sibling's literal reads as the whole vocabulary → exit 0.
  - id: contract_enum_parity/fail_producer_scope_incomplete
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_producer_scope_incomplete
    fixture_arg: '--root'
    anchor: 'bool(mapped_methods - set(seen))'
    neuter: 'False'

  # ── contract_enum_parity/fail_unproduced_no_canonical: P0-2 round 4 ─────────
  # fixture: the `origin` entry is `unproduced` with absence_probes + verified_by and NO
  #          canonical_vocabulary — the pre-round-4 shape. Both existing obligations are
  #          fully satisfied; what is missing is the SECOND obligation, which did not
  #          exist: nothing ever compared the contract's own declared tokens to anything,
  #          so the reviewer's CONTRACT-ONLY edits (mock -> accidental_typo; a sort
  #          vocabulary -> [accidentalTypo]) both exited 0. Absence-of-producer and
  #          vocabulary-correctness are two separate claims → exit 1.
  #          The blueprint file the entry ought to name IS present in the fixture, so the
  #          failure is about the missing DECLARATION, not a missing file.
  # anchor:  the mandatory-canonical test on the absence kind.
  # neuter:  condition-constant False → the entry declares no canonical source, the
  #          equality branch is skipped (it is guarded by the same flag), and the
  #          vocabulary is unchecked exactly as before round 4 → exit 0.
  - id: contract_enum_parity/fail_unproduced_no_canonical
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_unproduced_no_canonical
    fixture_arg: '--root'
    anchor: 'not cv_declared'
    neuter: 'False'

  # ── contract_enum_parity/fail_unproduced_contract_vocab_drift: round 4 ──────
  # fixture: a CONTRACT-ONLY token edit — `outbound` -> `accidental_typo` in
  #          contracts/demo-openapi.yaml and NOTHING else (the java sources, the producers,
  #          the blueprint and the manifest are byte-identical to pass_clean). This is the
  #          reviewer's `mock` -> `accidental_typo` on the payment callback slug in
  #          miniature: the absence proof still holds perfectly, the runtime binding still
  #          resolves, and only the advertised vocabulary moved — which is precisely the
  #          thing nothing was looking at. The block must MIRROR its canonical source → exit 1.
  # anchor:  the exact-equality test against the canonical vocabulary. Deliberately NOT
  #          routed through compare_sets: on this path there is no producer, so the
  #          wire_extra / wire_missing allowances that helper implements would be pure
  #          author assertion. A distinct anchor also pins THIS path rather than sharing a
  #          neuter with the java_enum and producer drift fixtures.
  # neuter:  condition-constant False → contract-side drift is never reported, the entry
  #          counts as canonical-bound, and the guard exits 0 on a vocabulary the canonical
  #          source contradicts.
  - id: contract_enum_parity/fail_unproduced_contract_vocab_drift
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_unproduced_contract_vocab_drift
    fixture_arg: '--root'
    anchor: 'canon_set != wire_set'
    neuter: 'False'

  # ── contract_enum_parity/fail_vocab_canonical_stale: P1 round 5 hole closure ─
  # fixture: the producer (com.demo.DeliveryStatus) AND the contract block it serializes
  #          both gain DELIVERING — the ordinary way a vocabulary grows, and the reason the
  #          contract_enum entry stays green — while the two fork-copy templates are left
  #          untouched. With the canonical vocabulary written INLINE in the manifest (the
  #          pre-fix schema) the templates were compared to a literal that had gone stale in
  #          the very same edit, so the guard exited 0; resolved from the producer, both
  #          surfaces are named. The fixture's map deliberately drops `require_all` so the
  #          EXACT SET EQUALITY axis fires ALONE — a two-axis fixture cannot be kill-proofed
  #          (see the fail_vocab_scan note below), and the equality axis is the one the
  #          canonical binding feeds.
  # anchor:  the declared-vs-canonical difference test. Shared with fail_added_token's axis
  #          by design — what differs is WHERE `canonical` comes from, which is the
  #          fixture's content, not a separate branch.
  # neuter:  condition-constant False → drift against the resolved vocabulary is never
  #          reported → exit 0.
  - id: contract_enum_parity/fail_vocab_canonical_stale
    guard: practices/evals/contract_enum_parity_guard.sh
    fixture: practices/evals/fixtures/contract_enum_parity_guard/fail_vocab_canonical_stale
