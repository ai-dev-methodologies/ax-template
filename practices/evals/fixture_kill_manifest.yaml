# fixture_kill_manifest.yaml — shell-guard fail fixture kill-proof registry
# (covers private_boundary_guard [86] + completion_checklist_recency_guard [49th])
#
# Each item proves that a specific fail fixture is NON-VACUOUS by mutation:
#   original guard on fixture → exit 1  (fixture reproduces the failure)
#   neutered guard on fixture → exit 0  (fixture depends on the targeted logic)
#
# anchor rules:
#   - MUST appear exactly once in the guard source (0 or 2+ → manifest stale → BLOCK)
#   - identifies the specific detection logic being tested
#
# neuter rules:
#   - a minimal source change that disables only the targeted detection
#   - must cause the exit to flip from 1 to 0 on the paired fixture
#
# IDENTITY, NOT ROW COUNT (2026-07-30, BACKLOG P2-50)
#   The registry may not SHRINK and may not be padded. Two properties are enforced by
#   fixture_kill_proof_guard.sh before any mutation runs:
#     - `min_items` below — the floor the unique item count may not fall below. The guard
#       pins the same number as LIVE_MIN_ITEMS for its OWN default manifest, so lowering
#       the gate takes two coordinated edits instead of one silent deletion (the
#       evidence_protected_template_anchors.txt `min_entries` ratchet, same posture).
#     - duplicate rejection — a repeated `id`, or a repeated (guard, fixture) pair under a
#       fresh id, is a BLOCK. A count is not an identity: without this, deleting the item
#       that actually matters and duplicating a cheap already-proven one keeps the floor
#       satisfied while the proof it stood for is gone.
#   Registering a SECOND anchor against an already-registered (guard, fixture) pair is
#   therefore a reviewed edit to the guard, not a manifest-only change. No such item exists
#   today — every registered pair is distinct, so the unique-pair count equals the item count
#   and `min_items` below is the single place that number is stated. (BACKLOG P3-104: this
#   paragraph used to restate a literal count, which then rotted independently of the
#   directive — the file claimed 57 while enforcing 62. Prose refers to the directive now.)

# min_items — the unique item count MAY NOT BE REDUCED below this number, and it is the ONLY
# place in this file that states it (BACKLOG P3-104 — a prose restatement rotted to 57 while the
# directive read 62). Re-measured from disk 2026-08-10 after the D-7 append (doc_headline_count's
# plugin/marketplace version-sync kill-proof): items, distinct ids and distinct (guard, fixture)
# pairs are all equal to the value below. fixture_kill_proof_guard.sh pins the same number as
# LIVE_MIN_ITEMS, so lowering the gate takes two coordinated edits rather than one silent deletion.
min_items: 74

items:

  # ── fail_marker: Layer 1 opt-in marker detection ─────────────────────────────
  # fixture: .ax-private-markers has 'AcmeCorp', backend/src/AcmeOrderService.java contains it.
  # anchor:  the single call that reports a Layer 1 marker violation.
  # neuter:  silence that call → Layer 1 fires but never increments violations → exit 0.
  - id: private_boundary/fail_marker
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_marker
    fixture_arg: '--repo-root'
    anchor: 'report_violation "1:marker" "$pattern" "$hit"'
    neuter: 'true  # neutered: layer 1 marker reporting disabled'

  # ── fail_secret: Layer 2 PEM private key pattern (SECRET_A) ──────────────────
  # fixture: backend/src/InfraConfig.java contains a raw PEM private key header.
  # anchor:  the SECRET_A pattern definition.
  # neuter:  replace PEM pattern with a non-matching string → SECRET_A never fires → exit 0.
  - id: private_boundary/fail_secret
    guard: practices/evals/private_boundary_guard.sh
    fixture: practices/evals/fixtures/private-boundary/fail_secret
    fixture_arg: '--repo-root'
    anchor: "SECRET_A='-----BEGIN [A-Z ]*PRIVATE KEY-----'"
    neuter: "SECRET_A='NEUTER_NOMATCH_XXXXXXXX'"

