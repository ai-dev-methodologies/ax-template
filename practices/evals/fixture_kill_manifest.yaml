# ── JUSTIFIED NON-REGISTRATIONS ───────────────────────────────────────────────
# Recorded here rather than left as an unexplained absence — the (P2-33) fail_vocab_scan
# precedent. A fixture listed below is NOT unproven by neglect; it is unprovable through
# THIS harness, and the reason is mechanical.
#
# evidence_quote_spotcheck / fail_template_fabricated_anchor  (BACKLOG P3-82)
#   run-all reproduces this fixture as:
#     evidence_quote_spotcheck_guard.sh --strict --include-templates --strict-templates --root <fixture>
#   i.e. THREE boolean switches plus one value-taking flag. This manifest can express at
#   most one value-consuming flag+path pair (fixture_arg/fixture) plus optionally a second
#   (fixture_arg2/fixture2) — but a second pair requires fixture_arg2 to CONSUME its path,
#   and every remaining switch this guard accepts is a bare boolean that shifts by one, so
#   the path lands as a free token and the parser rejects it. Measured, every reachable
#   invocation (2026-07-29):
#     <guard> <fixture>                                   -> exit 2 (unknown arg)
#     <guard> --root <fixture>                            -> exit 0 (advisory; no --strict)
#     <guard> --strict <fixture>                          -> exit 2 (unknown arg)
#     <guard> --root <fixture> --strict <repo_root>       -> exit 2 (unknown arg)
#     <guard> --root <fixture> --templates-only-protected <repo_root> -> exit 2 (unknown arg)
#     <guard> --root=<fixture>                            -> exit 0 (advisory)
#     <guard> '--strict --strict-templates --templates-only-protected --root' <fixture> -> exit 2
#   Step 2 of the algorithm requires the ORIGINAL guard to exit exactly 1, and no reachable
#   invocation does. This is a limitation of the harness's invocation vocabulary, not a
#   defect in the fixture: the fixture DOES reproduce the failure under run-all's own
#   invocation, where it is registered and asserted at exit 1. Closing it means teaching
#   this manifest boolean-flag arguments, which is a change to [87] and out of scope here.

  - id: domain_mode_consistency/fail_backlog_ref_closed
    guard: practices/evals/domain_mode_consistency_guard.sh
    fixture: practices/evals/fixtures/domain-mode-consistency/fail_backlog_ref_closed
