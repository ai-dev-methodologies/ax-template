# practices/evals/ruletier_full_trio_allowlist.yaml
#
# Rule-tier full_trio exemptions. Each spec below DECLARES `domain_mode: full_trio`
# but is enforced at RULE tier only: every applicable item binds via
# `verification: { mechanism: rule }` (rule_verification_binding) to an
# evidence-anchored catalog rule, and there is NO dedicated backend per-domain
# `./gradlew test<X>` task and NO templates/L4/<base>/ dir running its items. This
# is weaker than the binary-test domains (no runtime backend gate) — these entries
# are the HONEST acknowledgement of that, surfaced (e.g.) in
# docs/broadleaf-parity/checkout.md for saga-orchestration.
#
# full_trio_spec_backend_or_exempt_guard.sh BLOCKS a NEW full_trio spec that is
# neither backend-enforced nor listed here, AND BLOCKS a STALE entry that names a
# spec which has since gained a backend task / L4 dir (exempt rule-tier escapes
# only — do NOT exempt specs that actually have a backend test).
#
# To DISCHARGE an exemption: scaffold a backend domain (per docs/NEW-DOMAIN-CHECKLIST.md)
# so the spec's items run under a per-domain task — then DELETE its entry here.
#
# Each entry: `- spec: <filename>` + a one-line `rationale:` (non-empty, true).
exemptions:
# P2-22 (audit-seal): all 16 former entries were specs declaring domain_mode: full_trio
# while owning NO frontend Trio (no contract / blueprint / templates/L4 dir) — a lie on the
# frontend axis. They have been reclassified to domain_mode: backend_only in their specs
# (cross-cutting backend concerns, governed by spec_item_verification_binding_guard, not a
# Trio). The rule-tier verification honesty now lives in each spec's item
# `verification: { mechanism: rule }` bindings. This list is intentionally empty; it remains
# so a FUTURE genuine full_trio spec that is rule-tier-only can be honestly exempted here.
  []
