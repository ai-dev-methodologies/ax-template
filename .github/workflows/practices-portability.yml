name: practices-portability

# Advisory-only weekly portability probe. Builds external fixtures and runs the
# PortabilityXxxTest suite. Failures are reported but never block merges — the
# 4 hard gates (spec_ref / substance / time_decay / evidence) stay on practices-sentinel.

on:
  schedule:
    - cron: "0 7 * * 1"     # every Monday 07:00 UTC (one hour after drift)
  workflow_dispatch:

jobs:
  portability:
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory — never blocks
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Maven & Gradle dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: portability-${{ runner.os }}-${{ hashFiles('practices/evals/fixtures/**/pom.xml', 'practices/evals/fixtures/**/build.gradle*') }}

      - name: Build fixtures (petclinic Maven + realworld Gradle)
        run: bash practices/evals/portability/run.sh --full

      - name: Run testPortability
        id: tests
        continue-on-error: true
        working-directory: archive/backend-reference
        run: ./gradlew testPortability

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-report
          path: archive/backend-reference/build/reports/tests/testPortability/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
            echo "::notice::testPortability PASS across all fixtures"
          else
            echo "::warning::testPortability had failures — see uploaded report. Advisory only, does not block merges."
          fi
