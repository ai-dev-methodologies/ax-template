# blueprints/ui-tokens-manifest.yaml
# Design tokens canonical manifest — all L1 CSS custom properties declared here.
# Consumer: templates/L1/tokens/tokens.css (CSS variables)
# Test contract: frontend/tests/L1/token-contract.spec.ts
# Tailwind v4: CSS-vars declared in globals.css, consumed via @theme inline block.
#
# WCAG 2.2 enforcement:
#   Text on background: 4.5:1 minimum (SC 1.4.3 AA)
#   Large text (≥18pt / 14pt bold): 3:1 (SC 1.4.3)
#   UI components & graphics: 3:1 (SC 1.4.11)
#   Focus appearance: 3:1 against adjacent surface (SC 2.4.11)
#   Reduced motion: all duration tokens → 0ms (SC 2.3.3)

schema_version: "1.0"
upstream_ref: "practices-react/upstream/wcag-2-2.snapshot.md"

# ─── Color palette (oklch — perceptually uniform, P3-ready) ─────────────────
color:
  surface:
    default:    { token: "--color-surface",           oklch: "98% 0 0",         note: "page background" }
    subtle:     { token: "--color-surface-subtle",    oklch: "95% 0.005 250",   note: "card / raised surface" }
    inverse:    { token: "--color-surface-inverse",   oklch: "15% 0 0",         note: "dark surface for contrast reversal" }
  text:
    default:    { token: "--color-text",              oklch: "18% 0 0",         wcag_ratio: "≥16:1 vs surface.default" }
    muted:      { token: "--color-text-muted",        oklch: "50% 0 0",         wcag_ratio: "≥4.5:1 vs surface.default" }
    inverse:    { token: "--color-text-inverse",      oklch: "98% 0 0",         wcag_ratio: "≥4.5:1 vs surface.inverse" }
    placeholder:{ token: "--color-text-placeholder",  oklch: "55% 0 0",         wcag_ratio: "≥4.5:1 vs surface.default" }
  accent:
    default:    { token: "--color-accent",            oklch: "55% 0.21 250",    wcag_ratio: "≥4.5:1 vs surface.default" }
    hover:      { token: "--color-accent-hover",      oklch: "48% 0.21 250",    note: "10% darkened" }
    subtle:     { token: "--color-accent-subtle",     oklch: "92% 0.05 250",    note: "tinted background" }
  status:
    success:    { token: "--color-success",           oklch: "52% 0.15 145",    wcag_ratio: "≥3:1 vs surface (SC 1.4.11 UI component)" }
    warning:    { token: "--color-warning",           oklch: "65% 0.18 85",     wcag_ratio: "≥3:1 vs surface (SC 1.4.11 UI component)" }
    error:      { token: "--color-error",             oklch: "50% 0.22 25",     wcag_ratio: "≥4.5:1 vs surface.default (text level)" }
    info:       { token: "--color-info",              oklch: "52% 0.18 230",    wcag_ratio: "≥3:1 vs surface" }
  border:
    default:    { token: "--color-border",            oklch: "80% 0 0",         wcag_ratio: "≥3:1 vs surface (SC 1.4.11)" }
    focus:      { token: "--color-focus-ring",        oklch: "55% 0.21 250",    wcag_ratio: "≥3:1 vs adjacent (SC 2.4.11 Focus Appearance)" }
    subtle:     { token: "--color-border-subtle",     oklch: "90% 0 0" }

# ─── Typography (clamp-based fluid scale — WCAG 2.2 SC 1.4.4 Resize Text) ───
# All values use clamp() to support 320px–1920px viewport without overflow.
# Minimum 1rem base ensures no text below 16px default.
typography:
  base:     { token: "--text-base",     value: "clamp(1rem, 0.92rem + 0.4vw, 1.125rem)",   note: "body text" }
  sm:       { token: "--text-sm",       value: "clamp(0.875rem, 0.82rem + 0.28vw, 1rem)",  note: "captions, labels" }
  lg:       { token: "--text-lg",       value: "clamp(1.125rem, 1rem + 0.6vw, 1.375rem)",  note: "card titles" }
  xl:       { token: "--text-xl",       value: "clamp(1.25rem, 1.1rem + 0.75vw, 1.75rem)", note: "section headings" }
  hero:     { token: "--text-hero",     value: "clamp(3rem, 1rem + 7vw, 8rem)",            note: "hero display" }
  mono:     { token: "--text-mono",     value: "clamp(0.875rem, 0.82rem + 0.28vw, 1rem)",  note: "code blocks" }
  weight:
    regular:  { token: "--weight-regular",   value: "400" }
    medium:   { token: "--weight-medium",    value: "500" }
    semibold: { token: "--weight-semibold",  value: "600" }
    bold:     { token: "--weight-bold",      value: "700" }
  line_height:
    tight:    { token: "--leading-tight",    value: "1.25" }
    normal:   { token: "--leading-normal",   value: "1.5" }
    relaxed:  { token: "--leading-relaxed",  value: "1.75" }
  letter_spacing:
    tight:    { token: "--tracking-tight",   value: "-0.02em" }
    normal:   { token: "--tracking-normal",  value: "0em" }
    wide:     { token: "--tracking-wide",    value: "0.04em" }

# ─── Spacing scale (9-step) ──────────────────────────────────────────────────
spacing:
  1:    { token: "--space-1",       value: "0.25rem" }
  2:    { token: "--space-2",       value: "0.5rem" }
  3:    { token: "--space-3",       value: "0.75rem" }
  4:    { token: "--space-4",       value: "1rem" }
  6:    { token: "--space-6",       value: "1.5rem" }
  8:    { token: "--space-8",       value: "2rem" }
  12:   { token: "--space-12",      value: "3rem" }
  16:   { token: "--space-16",      value: "4rem" }
  section: { token: "--space-section", value: "clamp(4rem, 3rem + 5vw, 10rem)", note: "fluid section gap" }

# ─── Motion / animation (WCAG 2.2 SC 2.3.3 + prefers-reduced-motion) ────────
# All motion tokens MUST be set to 0ms inside @media (prefers-reduced-motion: reduce).
motion:
  duration:
    fast:     { token: "--duration-fast",    value: "150ms" }
    normal:   { token: "--duration-normal",  value: "300ms" }
    slow:     { token: "--duration-slow",    value: "600ms" }
  easing:
    default:  { token: "--ease-default",     value: "cubic-bezier(0.4, 0, 0.2, 1)" }
    out_expo: { token: "--ease-out-expo",    value: "cubic-bezier(0.16, 1, 0.3, 1)" }
    spring:   { token: "--ease-spring",      value: "cubic-bezier(0.34, 1.56, 0.64, 1)" }
  reduced_motion_override: |
    @media (prefers-reduced-motion: reduce) {
      --duration-fast: 0ms;
      --duration-normal: 0ms;
      --duration-slow: 0ms;
    }

# ─── Border radius (6-step) ──────────────────────────────────────────────────
radius:
  none:   { token: "--radius-none",   value: "0" }
  sm:     { token: "--radius-sm",     value: "0.25rem" }
  md:     { token: "--radius-md",     value: "0.5rem" }
  lg:     { token: "--radius-lg",     value: "0.75rem" }
  xl:     { token: "--radius-xl",     value: "1rem" }
  full:   { token: "--radius-full",   value: "9999px" }

# ─── Shadow scale (5-tier) ───────────────────────────────────────────────────
shadow:
  none:   { token: "--shadow-none",   value: "none" }
  sm:     { token: "--shadow-sm",     value: "0 1px 2px oklch(0% 0 0 / 0.08)" }
  md:     { token: "--shadow-md",     value: "0 4px 12px oklch(0% 0 0 / 0.10)" }
  lg:     { token: "--shadow-lg",     value: "0 8px 24px oklch(0% 0 0 / 0.12)" }
  xl:     { token: "--shadow-xl",     value: "0 16px 48px oklch(0% 0 0 / 0.15)" }

# ─── Z-index layers (8 layers) ───────────────────────────────────────────────
z_index:
  base:      { token: "--z-base",       value: "0" }
  raised:    { token: "--z-raised",     value: "10" }
  dropdown:  { token: "--z-dropdown",   value: "100" }
  sticky:    { token: "--z-sticky",     value: "200" }
  overlay:   { token: "--z-overlay",    value: "300",  note: "dialog backdrop" }
  modal:     { token: "--z-modal",      value: "400",  note: "dialog, sheet, alert-dialog" }
  toast:     { token: "--z-toast",      value: "500",  note: "Sonner toaster always above modal" }
  tooltip:   { token: "--z-tooltip",    value: "600",  note: "tooltip, hover-card, popover" }

# ─── WCAG 2.2 contrast attestation ──────────────────────────────────────────
# Source: practices-react/upstream/wcag-2-2.snapshot.md
# All verified pairs must be documented here.
wcag_contrast_attestation:
  - pair: ["--color-text", "--color-surface"]
    ratio: "≥16:1"
    criterion: "SC 1.4.3 AA (4.5:1 minimum) — well above threshold"
  - pair: ["--color-text-muted", "--color-surface"]
    ratio: "≥4.5:1"
    criterion: "SC 1.4.3 AA"
  - pair: ["--color-accent", "--color-surface"]
    ratio: "≥4.5:1"
    criterion: "SC 1.4.3 AA (interactive text)"
  - pair: ["--color-focus-ring", "adjacent-surface"]
    ratio: "≥3:1"
    criterion: "SC 2.4.11 Focus Appearance (WCAG 2.2 new)"
  - pair: ["--color-border", "--color-surface"]
    ratio: "≥3:1"
    criterion: "SC 1.4.11 Non-text Contrast"
  - pair: ["--color-error", "--color-surface"]
    ratio: "≥4.5:1"
    criterion: "SC 1.4.3 AA (error text must meet normal text threshold)"
