template_id: payment-blueprint
family: scaffold
status: draft
confidence: high
stack:
  backend: spring-boot
  contract: openapi
  repo_shape: single-repo

# ─── PCI-DSS scope ──────────────────────────────────────────────────────────
# SAQ-A applies because the implementation uses tokenization exclusively;
# no PAN is stored, processed, or transmitted by this application. The
# provider handles all raw card data via its own PCI-certified iframe/SDK.
pci_dss:
  saq_tier: SAQ-A
  pan_storage: NONE
  rationale: "Tokenization only. Raw PAN never touches application layer."
  trace:
    PAYMENT-SEC-001: PCI-DSS-3.4   # PAN protection — no PAN in logs/db/error-responses
    PAYMENT-SEC-002: PCI-DSS-6.5   # Secure coding — no hardcoded card fields
    PAYMENT-SEC-003: PCI-DSS-4.1   # Transmission encryption — TLS-only enforcement

# ─── Payment provider ────────────────────────────────────────────────────────
# Type=mock for this blueprint iteration. Iteration B adds a Stripe adapter;
# Iteration C adds Toss V2. The PaymentProvider interface is designed to survive
# both additions without breaking changes (L4 AI2-3 paper exercise).
provider:
  type: mock
  # PAYMENT-PROVIDER-ENUM-001 (iter-10): enumerated allow-list for provider.type.
  # Any value outside this list is rejected by
  # practices/evals/payment_provider_type_enum_guard.sh before Spring boot.
  # Iteration A (current): mock only. Iteration B adds `stripe`.
  # Iteration C adds `toss_v2`. Identifier rule: ^[a-z][a-z0-9_]*$ (snake_case ASCII).
  type_allowed:
    - mock
  timeout_ms: 5000
  # PAYMENT-PROVIDER-007: any provider call whose wall-clock latency exceeds this
  # threshold triggers a WARN log + payment_provider_slow_total counter increment.
  # The payment state is NOT changed — slow is observability, not an outcome.
  # Tests override this to a small value (e.g. 10ms) via @TestPropertySource so the
  # assertion runs fast; the production default is 3000ms as stated in the spec text.
  slow_threshold_ms: 3000
  retry:
    max: 3
    backoff: exponential
    initial_delay_ms: 1000
    multiplier: 2.0
  failure_modes:
    - timeout               # PAYMENT-PROVIDER-001: payment state → UNKNOWN
    - http_5xx              # PAYMENT-PROVIDER-002: retry then → FAILED
    - http_4xx_decline      # PAYMENT-PROVIDER-003: no retry → FAILED with declineReason
    - malformed_response    # PAYMENT-PROVIDER-004: no retry → FAILED with serializationError
    - network_reset         # PAYMENT-PROVIDER-005: payment state → UNKNOWN (indeterminate)
    - idempotency_replay    # PAYMENT-PROVIDER-006: return cached original response
    - slow_response         # PAYMENT-PROVIDER-007: WARN + payment_provider_slow_total++; state unchanged

# ─── Idempotency ─────────────────────────────────────────────────────────────
# Caffeine (in-process) for iteration A. Iteration B: replace with Postgres-backed
# store for distributed idempotency across pod restarts.
idempotency:
  window_hours: 24
  store: caffeine
  key_scope: "userId + Idempotency-Key header value"
  on_duplicate: return_original_response

# ─── Currency ────────────────────────────────────────────────────────────────
# ISO 4217 scale (minor units):
#   KRW = 0 (1원 = 1 minor unit, no fractional 원)
#   USD = 2 (1 cent = 1 minor unit, 100 cents = $1.00)
currency:
  default: KRW
  allowed:
    - KRW
    - USD
  scales:
    KRW: 0
    USD: 2

# ─── Amounts ─────────────────────────────────────────────────────────────────
# BigDecimal is mandatory for all monetary values in the Java domain model.
# JSON encoding: integer minor units OR decimal string. Float JSON numbers
# (VALUE_NUMBER_FLOAT Jackson token) are REJECTED immediately with 400 + RFC 7807.
# This is the Codex Critic C9 requirement.
amounts:
  type: BigDecimal
  json_format: minor_units_or_decimal_string
  float_json_rejection: true
  max: 100000000  # 1억원 / $1,000,000.00 — hard upper limit per payment

# ─── Refund policy ───────────────────────────────────────────────────────────
# window_hours: 720 = 30 days. Manifest-configurable so operators can adjust
# without code changes (read via @ConfigurationProperties in RefundService).
refund:
  window_hours: 720   # 30 days from capturedAt
  partial_supported: true
  invariant: "sum(refunds.amount) <= payment.capturedAmount"
  refund_of_refund: forbidden  # PAYMENT-REFUND-003

# ─── State machine ───────────────────────────────────────────────────────────
# Transition events: AUTHORIZE, CAPTURE, VOID, REFUND, PARTIAL_REFUND, PROVIDER_TIMEOUT,
# NETWORK_RESET, PROVIDER_REPLAY.
# UNKNOWN is a terminal holding state. ReconciliationJob resolves UNKNOWN by querying
# the provider or aging out after a configurable TTL.
state_machine:
  states:
    - CREATED
    - AUTHORIZED
    - CAPTURED
    - VOIDED
    - REFUNDED
    - PARTIAL_REFUNDED
    - UNKNOWN
  legal_transitions:
    CREATED:
      - event: AUTHORIZE
        next_state: AUTHORIZED
    AUTHORIZED:
      - event: CAPTURE
        next_state: CAPTURED
      - event: VOID
        next_state: VOIDED
      - event: PROVIDER_TIMEOUT
        next_state: UNKNOWN
      - event: NETWORK_RESET
        next_state: UNKNOWN
    CAPTURED:
      - event: REFUND
        next_state: REFUNDED
      - event: PARTIAL_REFUND
        next_state: PARTIAL_REFUNDED
    PARTIAL_REFUNDED:
      - event: REFUND
        next_state: REFUNDED
      - event: PARTIAL_REFUND
        next_state: PARTIAL_REFUNDED   # additional partial refunds until sum == capturedAmount
  terminal_states:
    - VOIDED
    - REFUNDED
    - UNKNOWN   # terminal pending resolution
  illegal_transitions_response: 409   # RFC 7807 urn:ax:payment:illegal-state-transition

# ─── Observability ───────────────────────────────────────────────────────────
# pan_redaction: required — verified by PAYMENT-SEC-001 (LogCaptor test).
# metrics: emitted via Micrometer; tested by PAYMENT-OBS-001.
# mdc: propagated by PaymentMdcFilter; tested by PAYMENT-OBS-002.
observability:
  pan_redaction: required
  metrics:
    - payment_attempted_total
    - payment_succeeded_total
    - payment_failed_total
    - refund_processed_total
    - recon_drift_detected_total
    - payment_provider_slow_total   # PAYMENT-PROVIDER-007: incremented when provider latency > slow_threshold_ms
  mdc:
    - payment_id
    - idempotency_key
    - correlation_id
  mdc_propagation: "PaymentMdcFilter (OncePerRequestFilter) sets MDC at request start; clears in finally; copies context map for async CompletableFuture threads"

# ─── Ledger ───────────────────────────────────────────────────────────────────
# Append-only event table. No UPDATE or DELETE operations are issued on this table.
# Hash chain provides tamper-evidence: each event records sha256 of its payload and
# the previous event's hash. Tested by PAYMENT-RECON-001.
ledger:
  table: payment_events
  schema: "(event_id UUID PK, payment_id UUID FK, type VARCHAR ENUM, occurred_at TIMESTAMP, payload_hash CHAR(64), prev_hash CHAR(64) NULLABLE, payload JSONB)"
  append_only: true
  hash_chain: true
  hash_algorithm: SHA-256
  genesis_prev_hash: null   # first event in a chain has prev_hash = null

# ─── Reconciliation ──────────────────────────────────────────────────────────
# Ledger is the source of truth. Payment.balance (stored) MUST equal ledger-derived value.
# ReconciliationInvariantTest detects divergence. ReconciliationJob (periodic, async)
# resolves UNKNOWN states and emits recon_drift_detected_total on drift.
reconciliation:
  invariant: "sum(captured.amount from ledger WHERE type=CAPTURED) - sum(refunded.amount from ledger WHERE type IN (REFUNDED, PARTIAL_REFUNDED)) = Payment.balance (stored)"
  derivation: "ledger is source of truth; stored Payment.balance is a denormalized cache that MUST be updated atomically with each ledger append"
  job_enabled: true
  job_schedule: "every 5 minutes"
  on_drift: "emit recon_drift_detected_total counter + log WARN with payment_id"

# ─── Callback policy (iter-9, PAYMENT-CALLBACK-001..003) ─────────────────────
# Anchor block for redirect-style PG callbacks (KG이니시스 / NICE페이먼츠 /
# KCP / Toss V1). Stripe / Toss V2 tokenization flows do NOT use this path —
# they go through the synchronous PaymentProvider.authorizeAndCapture surface.
#
# This policy block exists so Spec Trio integrity is intact when the spec
# items below cite policy_ref: blueprints/payment-manifest.yaml#callback.
# Backend implementation (PaymentCallbackController + signature SPI +
# markCapturedFromCallback service hook) is intentionally deferred — see
# templates/L4/payment/README.md "How to fork" Step 7 redirect-style branch
# and the PaymentProvider interface extension PRD (R18+).
callback:
  applicability: "redirect-style PGs only (KG이니시스 / NICE페이먼츠 / KCP / Toss V1). Tokenization-style PGs (Stripe / Toss V2) do NOT enter this code path."
  endpoint_path: "/api/payments/callback/{provider}"
  signature_verification: required   # fail-closed: missing/mismatched signature MUST reject with 401 BEFORE any state read
  signature_verifier_spi: "PaymentCallbackVerifier"   # SPI interface name; fork-receiver provides per-provider impl (KG SignatureKey, NICE MerchantKey, etc.)
  idempotency_key_source: "callback payload (PG-issued TID + orderId composite)"
  idempotent_replay: "if Payment is already CAPTURED for the same TID, return 200 with existing state — do NOT double-CAPTURE"
  allowed_states_before_callback: [AUTHORIZED, UNKNOWN]   # CAPTURED stays idempotent; CREATED + REFUNDED reject 409
  allowed_states_after_callback: [CAPTURED, FAILED]
  ledger_metadata: {source: "callback", provider_txn_id: "required"}
  audit_required: true   # every callback (success OR signature-fail) MUST emit an audit ledger row

split:
  # Split tender (Broadleaf-absorption payment vertical, 2026-06-25): one order paid by N tenders.
  applicability: "any order that may be paid by more than one payment row sharing one order_id (multi-card, gift-card + card)."
  coverage_invariant: "Σ(active, successfully-authorized tender amount for order_id, single currency) ≥ order frozen total"   # PAYMENT-SPLIT-001
  coverage_basis: "ORDER-TOTAL-SNAPSHOT-001 frozen total, SUPPLIED BY THE TRUSTED ORCHESTRATOR (payment is isolated from the order aggregate; it does not resolve the total itself — mirrors Broadleaf ValidateAndConfirmPaymentActivity reading order.getTotal() from checkout context). Exact BigDecimal at currency scale, no float."
  under_covered_response: 422   # PAYMENT_TENDERS_UNDERFUNDED, residual shortfall disclosed in the problem body
  authorized_states_counted: [AUTHORIZED, CAPTURED]   # active tenders that count toward coverage; CREATED/VOIDED/FAILED/UNKNOWN excluded. A fully-REFUNDED tender drops out; a PARTIAL_REFUNDED tender is excluded entirely (fail-safe under-count, never over-counts coverage)
  capture_bound_invariant: "Σ captured ≤ authorized (auth-side dual of refund cap; PAYMENT-SPLIT-002, impl-deferred)"
  over_capture_response: 422   # PAYMENT_CAPTURE_EXCEEDS_AUTH (spec-only until a capture ledger lands)
