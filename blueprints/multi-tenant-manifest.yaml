    quoted_at: "2026-05-20"
  - source_type: external
    citation: "NICE페이먼츠 API 가이드 — 가맹점별 시크릿 키 발급. 각 사업자(merchant)는 별도 sub-merchant ID 및 시크릿 키를 발급받을 수 있으며, 웹훅 callback 검증에 사용. (per-tenant secret 가능 근거)"
    url: "https://manual.smartro.co.kr/spc/dvz/intro.html"
    quoted_at: "2026-05-20"
  - source_type: external
    citation: "Stripe Webhook Signature Verification — recommends per-endpoint signing secret; explicitly documents constant-time HMAC comparison and forbids trust based on URL path or body content alone. Pattern: cryptographic verification is the tenant signal, not metadata."
    url: "https://stripe.com/docs/webhooks/signatures"
    quoted_at: "2026-05-20"
  - source_type: external
    citation: "OWASP API Security Top 10 (2023) — API1:2023 Broken Object Level Authorization. Tenant-scoping at the resource boundary; cross-tenant write via forged identifiers is canonical BOLA."
    url: "https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/"
    quoted_at: "2026-05-20"
  - source_type: external
    citation: "Spring Framework Reference — Task Execution and Scheduling, @Scheduled. Default scheduler runs on a single-threaded TaskScheduler; multi-tenant fork-receivers MUST either (a) per-tenant iterate or (b) provision a per-tenant pool. (manifest #scheduled-task-tenant-scope chooses iteration; R6 closes the full skeleton + 39th guard; pool variant remains deferred for the >100-tenant scale-out case)"
    url: "https://docs.spring.io/spring-framework/reference/integration/scheduling.html"
    quoted_at: "2026-05-20"
  - source_type: external
    citation: "ShedLock README — @SchedulerLock distributes lock key by name across cluster nodes; lock name supports SpEL via Spring's annotation processing. Per-tenant iteration scheduler MUST scope @SchedulerLock name by tenantId substring (e.g. \"reconciliation-#tenantId\") so two nodes can process two tenants in parallel; a bare job-name lock serializes all tenants behind a single node and turns one tenant's hang into a fleet-wide outage."
    url: "https://github.com/lukas-krecan/ShedLock#readme"
    quoted_at: "2026-05-20"
  - source_type: external
    citation: "Spring Framework Reference — SseEmitter. 'A specialization of ResponseBodyEmitter for sending Server-Sent Events.' Documents that the emitter's send() is invoked asynchronously after the controller method has returned and the originating HTTP request thread has been released. Establishes that request-scoped state (ThreadLocal-backed TenantContext) is NOT live at send time — confirming the registry + per-message set/clear contract required by #realtime-connection-tenant-scope."
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/servlet/mvc/method/annotation/SseEmitter.html"
    quoted_at: "2026-05-20"
  - source_type: external
    citation: "Spring Framework Reference — WebSocket HandshakeInterceptor. 'Interceptor for WebSocket handshake requests. Can be used to inspect the handshake request and response as well as to pass attributes to the target WebSocketHandler.' Establishes that the handshake is the canonical (and only) lifecycle point at which TenantContext is still populated from the upgrade HTTP request — confirming the WebSocketSession attribute capture contract in #realtime-connection-tenant-scope.websocket_session_attribute_contract."
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/socket/server/HandshakeInterceptor.html"
    quoted_at: "2026-05-20"
  - source_type: external
    citation: "Spring Data Redis Reference — Pub/Sub Messaging. Documents RedisMessageListenerContainer and that 'message listeners are invoked on a Lettuce/Jedis I/O thread that is not part of any servlet request lifecycle.' Establishes that the broker-listener thread has empty TenantContext by construction and confirms why the envelope-header pattern in #broker-fanout-tenant-scope is required — the listener thread CANNOT inherit request-scoped state."
    url: "https://docs.spring.io/spring-data/redis/reference/redis/pubsub.html"
    quoted_at: "2026-05-20"
  - source_type: external
    citation: "Apache Kafka Documentation — Record Headers (KIP-82). 'Headers are key-value pairs that are added to messages and travel with them. They are not part of the key or value of the record.' Establishes the canonical wire-format slot for cross-process metadata such as the X-Tenant-Id header in #broker-fanout-tenant-scope.kafka_header_contract — the structural alternative to burying tenantId inside the payload."
    url: "https://kafka.apache.org/documentation/#producerapi"
    quoted_at: "2026-05-20"
  - source_type: external
    citation: "CNCF CloudEvents Specification v1.0.2 — Context Attributes. Defines the cross-broker envelope pattern: 'CloudEvents attributes are the meta-data about an event' and explicitly recommends that broker-portable metadata (such as tenant scope) travel as STRUCTURAL context attributes, NOT inside the data payload. Industry-standard endorsement of the envelope-header pattern over payload-embedded tenant signals."
    url: "https://github.com/cloudevents/spec/blob/v1.0.2/cloudevents/spec.md#context-attributes"
    quoted_at: "2026-05-20"

# Total estimated fork-receiver effort to adopt multi-tenant (full pattern):
# row-level (7) + AOP guard (3) + context resolution (~1) + async propagation (2)
# + callback tenant resolution (~1.5) + scheduled-task (1) + realtime-connection (1)
# + broker fan-out (1.5) = ~18 eng-days.
# Schema-per-tenant alternative: 12 + 3 + 1 + 2 + 1.5 + 1 + 1 + 1.5 = ~23 eng-days.
# These match the R16 b2b-admin frontmatter "~10-15 eng-days" estimate plus
# the R5/R6/R7/R8 successive regime closures (~3.5 eng-days incremental beyond
# the baseline single-node deployment).
# Broker fan-out is opt-in: single-node deployments SKIP and never adopt
# TenantAwareRedisPubSubBridge; the 41st guard recognises this and live-repo
# SKIPs when no .../multitenancy/TenantAwareRedisPubSubBridge.java is present.

