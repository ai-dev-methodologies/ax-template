version: "1.0.0"
scope: "multi-tenant isolation policy values (Spring Boot + JPA)"
binds_spec: "specs/multi-tenant-l0.yaml"
introduced_at: "R17 — closes P2 R16 critique that specs/multi-tenant-l0.yaml's 6 policy_ref entries pointed to this file but it did not exist (Spec Trio self-violation). R17 ships the blueprint AND the spec_policy_ref_guard.sh that mechanically detects this kind of dangling reference."

# Multi-tenant policy anchors. Each spec item in specs/multi-tenant-l0.yaml
# declares a policy_ref of the form `blueprints/multi-tenant-manifest.yaml#<anchor>`.
# The anchors below are the canonical recipient definitions.

tenant-model-declaration:
  description: "RECIPE.md frontmatter MUST declare `tenant_model: single` OR `tenant_model: multi`. Single is the default when absent."
  enforcement_point: "recipe_governance_guard.sh extension OR static review (R17 ships static review; mechanical guard deferred R18+)"
  default: "single"
  rationale: "Closes P2 R15 critique that backend/src/main/java single-tenant assumption was implicit. Fork-receiver MUST see explicit declaration."

row-level-strategy:
  description: "Row-level isolation via tenant_id column + Hibernate @FilterDef('tenantFilter')."
  hibernate_filter_name: "tenantFilter"
  tenant_id_column: "tenant_id"
  tenant_id_type: "java.util.UUID"   # canonical — see #aop-guard.tenant_id_shape
  http_error_on_violation: 404   # NOT 403 — 404 prevents existence-leakage
  test_pattern: "RestAssured: tenant A creates → tenant B accesses same URL → assert 404"
  cost_estimate_eng_days: 7

  # ── Closure for P2 Round 2 gap D/E (filter activation lifecycle undefined) ──
  # P2 dogfooding session 2026-05-20: blueprint named @FilterDef('tenantFilter')
  # but never specified (1) where the filter is enabled per-request, (2) where
  # the tenantId parameter is bound, (3) where it is disabled / when the
  # Hibernate Session ends. Servlet Filter cannot inject request-scoped
  # EntityManager safely; Interceptor runs after EntityManager opens which
  # is too late for the first query in some flows.

  filter_activation:
    enable_point: "OncePerRequestFilter — extends EntityManagerFactoryAccessor; opens EntityManager explicitly OR delegates to OpenEntityManagerInViewFilter ordering"
    disable_point: "implicit — filter scope ends when EntityManager closes (request end via OEMIV)"
    parameter_binding: "session.enableFilter('tenantFilter').setParameter('tenantId', TenantContext.current().orElseThrow(...))"
    failure_mode: "if TenantContext is empty at enable_point → throw TenantContextMissingException (NOT enableFilter with null — that silently disables tenant scoping)"
    ordering_constraint: >
      MUST run AFTER the security filter chain (so principal is resolved
      and TenantContext is populated) and BEFORE the first @Transactional
      boundary (otherwise the first query in the transaction runs without
      filter). In a typical Spring Boot setup this means filter order is
      between SecurityFilterChain and OpenEntityManagerInViewFilter.
    java_skeleton: |
      package com.<root>.multitenancy;

      import jakarta.persistence.EntityManager;
      import jakarta.servlet.FilterChain;
      import jakarta.servlet.ServletException;
      import jakarta.servlet.http.HttpServletRequest;
      import jakarta.servlet.http.HttpServletResponse;
      import java.io.IOException;
      import org.hibernate.Session;
      import org.springframework.stereotype.Component;
      import org.springframework.web.filter.OncePerRequestFilter;

      @Component
      public class TenantFilterActivationFilter extends OncePerRequestFilter {

          private final EntityManager entityManager;

          public TenantFilterActivationFilter(EntityManager entityManager) {
              this.entityManager = entityManager;
          }

          @Override
          protected void doFilterInternal(HttpServletRequest req,
                                          HttpServletResponse res,
                                          FilterChain chain)
                  throws ServletException, IOException {
              Session session = entityManager.unwrap(Session.class);
              try {
                  TenantContext.current().ifPresentOrElse(
                      tenantId -> session.enableFilter("tenantFilter")
                                         .setParameter("tenantId", tenantId),
                      () -> {
                          // No tenant context = unauthenticated / public endpoint.
                          // Filter NOT enabled — relies on Spring Security to gate
                          // the endpoint. Tenant-scoped endpoints MUST be
                          // SecurityFilterChain-protected; otherwise data leaks.
                      }
                  );
                  chain.doFilter(req, res);
              } finally {
                  // Disable explicitly — even though session typically closes at
                  // request end, OEMIV / pooled sessions can outlive a single
                  // request in misconfigured setups.
                  if (session.isOpen()) {
                      session.disableFilter("tenantFilter");
                  }
              }
          }
      }

schema-per-tenant-strategy:
  description: "Schema-per-tenant via Hibernate MultiTenantConnectionProvider + CurrentTenantIdentifierResolver."
  shared_schema_purpose: "tenant catalog + shared reference data only"
  cost_estimate_eng_days: 12
  trade_off: "stricter isolation; higher operational cost (per-tenant migration, schema sprawl, connection pool sizing)"

aop-guard:
  description: "Service-boundary AOP via @AuthorizedTenant + AuthorizedTenantInterceptor."
  exception_thrown: "TenantBoundaryViolationException"
  http_mapping: 404   # RFC 7807 problem detail; never 403 (existence-leakage)
  defense_in_depth: "use alongside row-level-strategy OR schema-per-tenant-strategy"
  cost_estimate_eng_days: 3

  # ── Closure for P2 Round 2 gap A/B (advice scope + package layout undefined) ─
  # P2 dogfooding session 2026-05-20: fork-receiver attempting to write
  # TenantBoundaryViolationException blocked at three decisions —
  #   (1) which package owns cross-cutting multi-tenant types,
  #   (2) which @RestControllerAdvice scope catches the exception (per-domain
  #       advices like PracticesProblemDetailAdvice are basePackages-scoped),
  #   (3) what marker interface tags tenant-owned resources so static
  #       analysis can confirm every tenant-scoped @Entity declares tenant_id.

  package_layout:
    cross_cutting_package: "com.<root>.multitenancy"
    rationale: >
      Multi-tenant infrastructure (TenantContext, TenantOwned marker, the
      AOP interceptor, the boundary exception, the ProblemDetail advice,
      the TaskDecorator) is cross-cutting — it MUST NOT live under any
      single business domain package (e.g. authblueprint/payment/) because
      every tenant-scoped domain depends on it. ax-template's reference
      workload is single-tenant by default so this package is absent;
      fork-receivers adopting multi-tenant create it at the top level
      alongside their existing domain packages.
    forbidden_locations:
      - "<root>.<auth-package>.multitenancy   # framing as auth-owned is wrong; multi-tenant is cross-cutting"
      - "<root>.<any-business-domain>.multitenancy   # creates hidden coupling to that domain"

  marker_interface:
    name: "TenantOwned"
    location: "<cross_cutting_package>.TenantOwned"
    rationale: >
      Every JPA @Entity carrying tenant-scoped rows MUST implement
      TenantOwned. The interface exposes the tenant_id getter so:
      (a) static analysis can enumerate tenant-scoped entities,
      (b) the row-level @Filter activation aspect can verify the
          current entity is tenant-scoped before forcing the filter,
      (c) downstream audit / export tools can detect cross-tenant leak
          by reflection over entities marked TenantOwned.
    java_skeleton: |
      package com.<root>.multitenancy;

      /**
       * Marker interface for every JPA @Entity whose rows are
       * tenant-scoped. The tenant_id MUST be populated at insert
       * time from TenantContext.current() — never from request body
       * or query parameter (PROPAGATION-001 forbids forgeable
       * sources). The getter type MUST match #tenant-id-shape
       * (canonical: java.util.UUID).
       *
       * Defense in depth: row-level @Filter + AOP interceptor +
       * TenantOwned marker together close the three vectors —
       * SQL leak (filter), service-call leak (interceptor),
       * static-analysis blind spot (marker).
       */
      public interface TenantOwned {
          java.util.UUID getTenantId();
      }
    enforcement_static_check: >
      A practices rule (multi-tenant-aop-guard-skeleton) requires that
      every @Entity in a recipe declaring `tenant_model: multi` either
      implements TenantOwned OR sits in an explicit
      `non_tenant_scoped_entities:` allow-list in the recipe's
      RECIPE.md. fork-receivers can wire this check into their CI
      with the same shape as recipe_governance_guard.sh.

  exception_skeleton:
    fqcn: "<cross_cutting_package>.TenantBoundaryViolationException"
    java_skeleton: |
      package com.<root>.multitenancy;

      /**
       * Thrown by AuthorizedTenantInterceptor when the request principal's
       * TenantContext.current() does not match the resource's tenant_id.
       * Mapped to HTTP 404 via MultiTenantProblemDetailAdvice — NEVER 403
       * (would leak existence of cross-tenant resource).
       *
       * Symmetry note (Round 1 gap 3 closure): TenantContextMissingException
       * (thrown when async boundary lost context — see #async-propagation)
       * MUST sit in the same package and follow the same naming pattern.
       */
      public class TenantBoundaryViolationException extends RuntimeException {
          public TenantBoundaryViolationException(String message) {
              super(message);
          }
      }

  advice_scope:
    fqcn: "<cross_cutting_package>.MultiTenantProblemDetailAdvice"
    scope_strategy: "global"
    ordering_annotation: "@Order(Ordered.HIGHEST_PRECEDENCE + 100)"
    rationale: >
      Existing per-domain advices (e.g. PracticesProblemDetailAdvice with
      basePackages = "...practices") do NOT catch TenantBoundaryViolation
      thrown from a different domain. The multi-tenant advice MUST be
      globally scoped (no basePackages) AND ordered with high precedence
      so it wins over domain-scoped advices when the same exception type
      is handled differently in their fallback handlers. Without explicit
      @Order the ResolverOrder is undefined — first-match wins which is
      brittle.
    java_skeleton: |
      package com.<root>.multitenancy;

      import java.net.URI;
      import org.springframework.core.Ordered;
      import org.springframework.core.annotation.Order;
      import org.springframework.http.HttpStatus;
      import org.springframework.http.MediaType;
      import org.springframework.http.ProblemDetail;
      import org.springframework.http.ResponseEntity;
      import org.springframework.web.bind.annotation.ExceptionHandler;
      import org.springframework.web.bind.annotation.RestControllerAdvice;

      @RestControllerAdvice
      @Order(Ordered.HIGHEST_PRECEDENCE + 100)
      public class MultiTenantProblemDetailAdvice {

          private static final URI TENANT_BOUNDARY_TYPE =
              URI.create("https://errors.example.com/tenant-boundary");
          private static final URI TENANT_CONTEXT_MISSING_TYPE =
              URI.create("https://errors.example.com/tenant-context-missing");

          @ExceptionHandler(TenantBoundaryViolationException.class)
          public ResponseEntity<ProblemDetail> handleBoundary(TenantBoundaryViolationException ex) {
              // 404 — never 403. Existence-leakage prevention is the whole point.
              ProblemDetail pd = ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, "Resource not found");
              pd.setType(TENANT_BOUNDARY_TYPE);
              pd.setTitle("Resource Not Found");
              // Detail message stays generic — never include tenant_id or resource id.
              return ResponseEntity.status(HttpStatus.NOT_FOUND)
                      .contentType(MediaType.APPLICATION_PROBLEM_JSON)
                      .body(pd);
          }

          @ExceptionHandler(TenantContextMissingException.class)
          public ResponseEntity<ProblemDetail> handleMissingContext(TenantContextMissingException ex) {
              // 500 not 404 — this is a server bug (async boundary lost context),
              // not a client authz failure. Distinct ProblemDetail type so ops can
              // alert on it separately.
              ProblemDetail pd = ProblemDetail.forStatusAndDetail(HttpStatus.INTERNAL_SERVER_ERROR, "Internal server error");
              pd.setType(TENANT_CONTEXT_MISSING_TYPE);
              pd.setTitle("Internal Server Error");
              return ResponseEntity.status(HttpStatus.INTERNAL_SERVER_ERROR)
                      .contentType(MediaType.APPLICATION_PROBLEM_JSON)
                      .body(pd);
          }
      }

  tenant_id_shape:
    type: "java.util.UUID"
    column_name: "tenant_id"
    jwt_claim_name: "tenant_id"
    rationale: >
      Round 1 gap 1 closure: canonical JWT claim is snake_case `tenant_id`
      (matches RFC 7519 convention for custom claims and SCIM tenant
      identifiers — neither vendor specifies camelCase). The Java getter
      is `getTenantId()` (camelCase per JavaBeans), but the wire format
      (JWT claim, DB column, JSON property) is snake_case `tenant_id`.
      Type is UUID not Long: cross-tenant id collision in dev/staging
      with monotonic Long is a real foot-gun; UUID makes accidental
      cross-tenant reference detectable in logs.
    forbidden_alternatives:
      - "Long   # collision risk across tenants in dev/staging; not opaque"
      - "String # too loose — no format validation at boundary"
      - "tenantId (camelCase wire format)  # inconsistent with JWT custom-claim convention"

  # ── dogfood-5 (P2 R3 GAP-NEW-2 closure) — three new aop-guard anchors ────
  # The previous aop-guard description named @AuthorizedTenant +
  # AuthorizedTenantInterceptor as the service-boundary mechanism but
  # shipped no body. Fork-receivers stalled at the most security-critical
  # 60 lines, risking 403-vs-404 existence leakage and tenant_id detail
  # leakage. The three anchors below pin the canonical bodies.
  authorized_tenant_annotation:
    fqcn: "<cross_cutting_package>.AuthorizedTenant"
    target: "ElementType.METHOD"
    retention: "RetentionPolicy.RUNTIME"
    rationale: >
      Marks a service method that accesses tenant-scoped resources.
      AuthorizedTenantInterceptor enforces that every parameter
      annotated with @TenantId matches TenantContext.current() before
      the method body runs. Mismatch → TenantBoundaryViolationException
      → 404. Missing context → TenantContextMissingException → 500.
    java_skeleton: |
      package com.<root>.multitenancy;

      import java.lang.annotation.ElementType;
      import java.lang.annotation.Retention;
      import java.lang.annotation.RetentionPolicy;
      import java.lang.annotation.Target;

      @Target(ElementType.METHOD)
      @Retention(RetentionPolicy.RUNTIME)
      public @interface AuthorizedTenant {
      }

  tenant_id_marker:
    fqcn: "<cross_cutting_package>.TenantId"
    target: "ElementType.PARAMETER"
    retention: "RetentionPolicy.RUNTIME"
    rationale: >
      Marks a method parameter whose value is the tenant_id of the
      resource being accessed. Parameter type MUST be java.util.UUID
      (see #aop-guard.tenant_id_shape). Three forbidden alternatives
      (below) all lead to silent miss or leaks — a dedicated parameter
      annotation is the only refactor-safe form.
    forbidden_alternatives:
      - "convention-by-name (e.g. parameter literally named 'tenantId')   # silent miss on rename or DTO wrap"
      - "SpEL on @AuthorizedTenant(\"#dto.tenantId\")                       # not refactor-safe; no IDE rename"
      - "@PathVariable + manual check in controller                        # service-boundary leak vector remains"
    java_skeleton: |
      package com.<root>.multitenancy;

      import java.lang.annotation.ElementType;
      import java.lang.annotation.Retention;
      import java.lang.annotation.RetentionPolicy;
      import java.lang.annotation.Target;

      @Target(ElementType.PARAMETER)
      @Retention(RetentionPolicy.RUNTIME)
      public @interface TenantId {
      }

  interceptor_skeleton:
    fqcn: "<cross_cutting_package>.AuthorizedTenantInterceptor"
    advised_pointcut: "@annotation(<cross_cutting_package>.AuthorizedTenant)"
    failure_modes:
      empty_context:       "throw TenantContextMissingException (500 via MultiTenantProblemDetailAdvice)"
      parameter_not_uuid:  "throw IllegalStateException on first call (wiring bug, NOT a runtime authz failure)"
      missing_tenant_id_param: "throw IllegalStateException (misuse — @AuthorizedTenant method with no @TenantId param)"
      cross_tenant:        "throw TenantBoundaryViolationException (404 via MultiTenantProblemDetailAdvice; detail message MUST stay generic — never include tenant_id or resource id; existence-leakage prevention)"
      same_tenant:         "proceed"
    java_skeleton: |
      package com.<root>.multitenancy;

      import java.lang.annotation.Annotation;
      import java.lang.reflect.Method;
      import java.lang.reflect.Parameter;
      import java.util.UUID;
      import org.aspectj.lang.ProceedingJoinPoint;
      import org.aspectj.lang.annotation.Around;
      import org.aspectj.lang.annotation.Aspect;
      import org.aspectj.lang.reflect.MethodSignature;
      import org.springframework.stereotype.Component;

      @Aspect
      @Component
      public class AuthorizedTenantInterceptor {

          @Around("@annotation(com.<root>.multitenancy.AuthorizedTenant)")
          public Object enforce(ProceedingJoinPoint joinPoint) throws Throwable {
              UUID currentTenant = TenantContext.current().orElseThrow(() ->
                  new TenantContextMissingException(
                      "TenantContext empty at @AuthorizedTenant boundary: "
                          + joinPoint.getSignature().toShortString()));

              Method method = ((MethodSignature) joinPoint.getSignature()).getMethod();
              Parameter[] parameters = method.getParameters();
              Object[] args = joinPoint.getArgs();

              UUID resourceTenant = null;
              for (int i = 0; i < parameters.length; i++) {
                  if (hasTenantIdAnnotation(parameters[i])) {
                      if (!(args[i] instanceof UUID)) {
                          throw new IllegalStateException(
                              "@TenantId parameter must be UUID; got "
                                  + (args[i] == null ? "null" : args[i].getClass().getName())
                                  + " in " + method);
                      }
                      resourceTenant = (UUID) args[i];
                      break;
                  }
              }

              if (resourceTenant == null) {
                  throw new IllegalStateException(
                      "@AuthorizedTenant method missing @TenantId parameter: " + method);
              }

              if (!currentTenant.equals(resourceTenant)) {
                  // Generic message — never include tenant_id or resource id.
                  throw new TenantBoundaryViolationException("Resource not found");
              }

              return joinPoint.proceed();
          }

          private static boolean hasTenantIdAnnotation(Parameter parameter) {
              for (Annotation annotation : parameter.getAnnotations()) {
                  if (annotation.annotationType() == TenantId.class) {
                      return true;
                  }
              }
              return false;
          }
      }

context-resolution:
  description: "TenantContext resolved from authenticated principal at controller entry."
  allowed_sources:
    - "JWT claim (sub or custom tenant_id claim)"
    - "session attribute (server-side, not client-readable)"
    - "subdomain (e.g., tenant1.example.com)"
  forbidden_sources:
    - "URL path parameter (forgeable)"
    - "request body (forgeable)"
    - "query string (forgeable)"
  storage: "request-scoped ThreadLocal in TenantContext class"
  cleanup_point: "response sent (Filter or Interceptor postHandle)"

  # ── Closure for P2 Round 3 gap NEW-1 (TenantContext skeleton missing) ───────
  # P2 dogfooding session 2026-05-20 (R3): TaskDecorator + AOP interceptor +
  # ActivationFilter ALL depend on TenantContext.{current, set, clear}, but
  # the manifest never specified the class itself — only its semantics.
  # fork-receiver was forced to guess: ThreadLocal vs InheritableThreadLocal
  # (InheritableThreadLocal silently propagates across @Async without
  # TaskDecorator, defeating the failure_mode contract), getter return type
  # (Optional<UUID> required for empty-context detection), and whether
  # set() validates the UUID argument. Round 3 ships the canonical skeleton.

  tenant_context_skeleton:
    fqcn: "<cross_cutting_package>.TenantContext"
    java_skeleton: |
      package com.<root>.multitenancy;

      import java.util.Objects;
      import java.util.Optional;
      import java.util.UUID;

      /**
       * Request-scoped tenant identity holder.
       *
       * Storage choice (load-bearing): plain ThreadLocal — NOT
       * InheritableThreadLocal. The latter silently propagates the
       * value to child threads, defeating the explicit-propagation
       * contract in #async-propagation. With plain ThreadLocal,
       * crossing an @Async boundary without TenantContextAwareTaskDecorator
       * surfaces a hard failure (empty Optional → exception), which
       * is the only safe behaviour for tenant isolation.
       *
       * Lifecycle:
       *   set()     — called by TenantFilterActivationFilter (or the
       *               equivalent SecurityFilterChain extension) at
       *               request entry, AFTER principal resolution.
       *   current() — called by AOP interceptor, repository @Filter
       *               parameter binding, and TaskDecorator capture.
       *   clear()   — called in finally{} at request end AND by
       *               TaskDecorator after the async task runs.
       *
       * The set/clear pair MUST be balanced; ThreadLocal leaks
       * silently corrupt the next request scheduled on the same
       * Tomcat / Undertow worker thread.
       */
      public final class TenantContext {

          private static final ThreadLocal<UUID> CURRENT = new ThreadLocal<>();

          private TenantContext() {
              // utility class — no instances
          }

          public static Optional<UUID> current() {
              return Optional.ofNullable(CURRENT.get());
          }

          public static void set(UUID tenantId) {
              // Validate at boundary — never accept null silently. Empty
              // context is a distinct state (Optional.empty()) and MUST
              // be reached via clear(), not via set(null).
              Objects.requireNonNull(tenantId, "tenantId");
              CURRENT.set(tenantId);
          }

          public static void clear() {
              CURRENT.remove();   // remove(), not set(null) — frees the slot
          }
      }
    forbidden_alternatives:
      - "InheritableThreadLocal   # silently propagates across @Async, defeats failure_mode contract"
      - "ThreadLocal<String>      # loses UUID type discipline; allows '', 'null', 'undefined' values"
      - "static volatile UUID     # not request-scoped — single global tenant"
    enforcement_contract: >
      The three skeletons (TaskDecorator, AOP interceptor,
      ActivationFilter) call TenantContext.current() expecting
      Optional<UUID>. Changing the return type to bare UUID (or
      throwing on empty) breaks the empty-context detection path
      and shifts the failure mode from #async-propagation contract
      (loud exception with named type) to whatever the call site
      does with NPE (typically: 500 with leaky stack trace).

async-propagation:
  description: "Async boundary (CompletableFuture, @Async, message listeners) MUST explicitly propagate TenantContext."
  mechanisms:
    - "TaskDecorator implementation for @Async ThreadPoolTaskExecutor"
    - "Message header for AMQP / Kafka listeners"
  failure_mode: "TenantContextMissing exception (NOT silent default-tenant fallback)"
  rationale: "TenantContext is request-scoped (ThreadLocal); async runs on different thread; no propagation = empty context = either crash (preferred) or silent leak (forbidden)"
  cost_estimate_eng_days: 2

  # ── Closure for P2 Round 2 gap C (executor bean prerequisite undefined) ─────
  # P2 dogfooding session 2026-05-20: @EnableAsync alone uses Spring's default
  # SimpleAsyncTaskExecutor (new thread per task) which CANNOT be decorated —
  # TaskDecorator only applies to ThreadPoolTaskExecutor / ConcurrentTaskExecutor.
  # ax-template's reference workload has @EnableAsync but no explicit executor
  # bean (verified at backend/.../AuthBlueprintBackendApplication.java + grep
  # for ThreadPoolTaskExecutor returns empty). fork-receivers MUST declare the
  # executor bean explicitly before this propagation strategy works at all.

  prerequisite_executor_bean:
    required: true
    failure_if_absent: >
      Without an explicit ThreadPoolTaskExecutor bean, @EnableAsync falls back
      to SimpleAsyncTaskExecutor which spawns a new thread per task and has
      no TaskDecorator hook. The TenantContext silently fails to propagate
      and every @Async method runs with an empty ThreadLocal — leading to
      either NullPointerException at TenantContext.current() OR (worse)
      a silent default-tenant fallback if defensive code masks the missing
      context. fork-receivers MUST verify the executor bean exists before
      claiming PROPAGATION-002 compliance.
    java_skeleton: |
      package com.<root>.multitenancy;

      import java.util.concurrent.Executor;
      import org.springframework.context.annotation.Bean;
      import org.springframework.context.annotation.Configuration;
      import org.springframework.scheduling.annotation.AsyncConfigurer;
      import org.springframework.scheduling.annotation.EnableAsync;
      import org.springframework.scheduling.concurrent.ThreadPoolTaskExecutor;

      @Configuration
      @EnableAsync
      public class TenantAwareAsyncConfig implements AsyncConfigurer {

          @Override
          @Bean(name = "taskExecutor")
          public Executor getAsyncExecutor() {
              ThreadPoolTaskExecutor executor = new ThreadPoolTaskExecutor();
              executor.setCorePoolSize(4);
              executor.setMaxPoolSize(16);
              executor.setQueueCapacity(50);
              executor.setThreadNamePrefix("ax-async-");
              executor.setTaskDecorator(new TenantContextAwareTaskDecorator());
              executor.initialize();
              return executor;
          }
      }
    note_to_fork_receiver: >
      The bean name "taskExecutor" is the Spring default that @Async picks
      up without explicit qualifier. If multiple executor beans exist, use
      @Async("name") on the method side to disambiguate; otherwise Spring
      logs a warning and falls back to SimpleAsyncTaskExecutor — silently
      defeating this entire propagation strategy.

  task_decorator_skeleton:
    fqcn: "<cross_cutting_package>.TenantContextAwareTaskDecorator"
    java_skeleton: |
      package com.<root>.multitenancy;

      import java.util.Optional;
      import java.util.UUID;
      import org.springframework.core.task.TaskDecorator;

      /**
       * Captures the calling thread's TenantContext at submission time
       * and restores it on the worker thread before the task runs.
       * Guarantees:
       *   (a) absent context at submission → wrapped Runnable raises
       *       TenantContextMissingException on the worker (NOT a silent
       *       default-tenant fallback). This matches #async-propagation
       *       failure_mode contract.
       *   (b) ThreadLocal is cleared in finally — no leakage to the next
       *       task scheduled on the same worker thread.
       */
      public class TenantContextAwareTaskDecorator implements TaskDecorator {

          @Override
          public Runnable decorate(Runnable runnable) {
              // Captured at SUBMISSION (calling thread, still has request context).
              Optional<UUID> captured = TenantContext.current();
              return () -> {
                  if (captured.isEmpty()) {
                      // Crash loud — see #async-propagation failure_mode contract.
                      throw new TenantContextMissingException(
                          "TenantContext was empty at @Async submission; refusing to run async task");
                  }
                  try {
                      TenantContext.set(captured.get());
                      runnable.run();
                  } finally {
                      // MUST clear — worker threads are pooled and reused.
                      TenantContext.clear();
                  }
              };
          }
      }

  context_missing_exception_skeleton:
    fqcn: "<cross_cutting_package>.TenantContextMissingException"
    java_skeleton: |
      package com.<root>.multitenancy;

      /**
       * Thrown by TenantContextAwareTaskDecorator when an @Async task was
       * submitted from a thread with no TenantContext (typically: the
       * submission happened outside a tenant-aware request, OR the
       * filter that populates TenantContext was bypassed).
       *
       * Symmetry note (Round 1 gap 3 closure): pair with
       * TenantBoundaryViolationException — both extend RuntimeException,
       * both live in <cross_cutting_package>, both are handled by
       * MultiTenantProblemDetailAdvice. Boundary → 404 (client-side
       * authz fail), ContextMissing → 500 (server bug, ops alert).
       */
      public class TenantContextMissingException extends RuntimeException {
          public TenantContextMissingException(String message) {
              super(message);
          }
      }

ledger-audit-tenant-scope:
  description: >
    Tenant policy for append-only audit/ledger entities (PaymentEvent-style)
    that can be appended OUTSIDE a tenant-scoped request boundary — most
    commonly: signature_fail callbacks at permitAll endpoints where the
    request has no authenticated principal and therefore no TenantContext.
  introduced_at: >
    R4 — closes P2 R3 GAP-R3-3 surfaced during dogfood: PaymentEventLedger.append()
    is invoked from PaymentCallbackController on signature_fail path
    BEFORE any orderId → Payment → tenant_id resolution can succeed. With
    TenantContext.current() returning Optional.empty() AND audit entity
    declared TenantOwned (mandatory tenant_id), the callback handler
    threw TenantContextMissingException → 500 → external PG retried
    indefinitely (NICE / Toss V1 retry policy: up to 24h). The catalog
    previously had no policy for this asymmetry — the AOP / row-level
    anchors all assume request-scoped context exists.

  scope_decision: >
    Audit / ledger / append-only event entities are NOT tenant-scoped
    resources in the AOP-boundary sense. They are operational records
    whose tenant attribution is a best-effort enrichment, NOT an
    isolation boundary. The isolation boundary lives on the resource
    they reference (Payment, Order, etc.) — and orphan audit rows
    that reference no resource MUST be preserved with tenant_id = null
    rather than dropped or assigned a sentinel tenant.

  policy:
    entity_must_implement_tenant_owned: false
    rationale_for_not_implementing: >
      TenantOwned mandates a non-null getTenantId() (UUID). Forcing audit
      entities to implement it pushes one of three bad outcomes:
        (a) sentinel UUID(0,0,...) → pollutes any cross-tenant analytics
            and creates a synthetic "system tenant" that is itself a
            cross-tenant leak vector (admin queries filtered by
            tenant=sentinel see ALL orphan rows across tenants);
        (b) reject the append → external PG retries indefinitely
            (the GAP-R3-3 observed failure mode);
        (c) drop the audit row → loss of forensic evidence on the
            single path the auditor cares about most (signature_fail).
      Honest null is the only outcome consistent with the catalog
      vision (orphan audit row + null tenant_id is informative).

    tenant_id_column_nullability: nullable
    tenant_id_column_type: "java.util.UUID"
    tenant_id_field_visibility: "package-private getter that returns Optional<UUID>"

    append_call_site_contract: >
      Audit append code MUST use `TenantContext.current().orElse(null)`
      (Optional → null), NEVER `TenantContext.current().orElseThrow(...)`.
      The orElseThrow form is correct for tenant-scoped resources
      (matches AuthorizedTenantInterceptor line 354) but wrong for audit
      entities — the whole point of the orphan audit row is to capture
      the request that had no tenant context. The Optional API surface
      remains unchanged; this is purely a call-site discipline.

    cross_tenant_query_discipline: >
      Read queries on audit entities MUST filter by tenant_id explicitly
      (WHERE tenant_id = :currentTenant) AND treat null tenant_id rows
      as a separate operational concern (sysadmin queries with a
      distinct, explicitly-authorized role). Do NOT add the @Filter
      activation for audit tables — it would silently exclude null
      rows from the operational view, defeating the purpose.

    forbidden_alternatives:
      - "sentinel UUID(0,0,...) — creates synthetic cross-tenant ‘system’ tenant; admin queries filtered by sentinel see ALL orphan rows across tenants (cross-tenant leak vector)"
      - "TenantContext.current().orElseThrow() at audit append — pushes external PG into 24h retry loop on signature_fail"
      - "tenant_id NOT NULL on audit table — same effect as orElseThrow: insert fails, retry storm"
      - "implementing TenantOwned with @Override getTenantId() returning UUID — type system forbids null return; forces sentinel or NPE"
      - "Hibernate @Filter on audit table — silently hides null tenant_id rows from operational reads; loses orphan audit forensics"

  java_skeleton: |
    // Audit / ledger entity that may be appended OUTSIDE a tenant-scoped
    // request (e.g. PG callback signature_fail at permitAll endpoint).
    //
    // Does NOT implement TenantOwned (see #ledger-audit-tenant-scope policy).
    // tenant_id is nullable in both the JPA mapping AND the Flyway schema —
    // the ledger_audit_nullability_guard.sh-style lockstep guard applies.
    //
    // Read access: Optional<UUID> getTenantId() (NOT bare UUID) — forces
    // call sites to handle the empty case explicitly. There is no setter;
    // tenant_id is captured at insert time from TenantContext.current()
    // via Optional → null collapse below.
    package com.<root>.<audit-package>;

    import jakarta.persistence.Column;
    import jakarta.persistence.Entity;
    import java.util.Optional;
    import java.util.UUID;

    @Entity
    public class AuditEvent {

        @Column(name = "tenant_id", nullable = true, updatable = false)
        private UUID tenantId;   // nullable — orphan audit rows are valid

        protected AuditEvent() {
            // JPA
        }

        // Constructor — called from the append() service. The Optional
        // contract makes the null path explicit at every call site.
        public AuditEvent(Optional<UUID> tenantId /*, other audit fields */) {
            this.tenantId = tenantId.orElse(null);
        }

        public Optional<UUID> getTenantId() {
            return Optional.ofNullable(tenantId);
        }
    }

    // ─── Append call site (service layer) ─────────────────────────────
    // The single load-bearing line is `TenantContext.current()` →
    // passed unchanged to the AuditEvent constructor. NO orElseThrow.
    //
    //   public AuditEvent append(/* event fields */) {
    //       AuditEvent ev = new AuditEvent(TenantContext.current() /*, fields */);
    //       return auditRepo.save(ev);
    //   }

  schema_lockstep_contract: >
    The audit entity's tenant_id JPA nullability and the Flyway migration
    nullability MUST agree, identical in shape to the payment_events
    payment_id lockstep enforced by ledger_audit_nullability_guard.sh.
    A companion guard (ledger_audit_tenant_nullable_guard.sh) can mirror
    that algorithm for the audit table's tenant_id column when a
    fork-receiver wires multi-tenant onto an existing audit table.

  worked_example:
    scenario: >
      External PG (NICE페이먼츠) POSTs callback to
      /api/payments/callback/nice. Signature header is malformed
      (the integration partner regenerated keys but did not redeploy
      their callback signer). PaymentCallbackController.handle() runs at
      permitAll; SecurityFilterChain placed no Authentication on the
      context; TenantFilterActivationFilter (correctly) observed
      empty context and did NOT enable tenantFilter (multi-tenant-manifest
      #row-level-strategy.filter_activation.failure_mode line 36-37
      already documents this branch as a public endpoint case).
    audit_append_path: >
      Controller delegates to PaymentEventLedger.appendSignatureFailure().
      With #ledger-audit-tenant-scope policy applied:
        1. TenantContext.current() → Optional.empty()
        2. AuditEvent constructor receives Optional.empty() → stores null
        3. Insert succeeds (tenant_id column nullable)
        4. Controller returns 200 OK to PG → no retry storm
        5. Forensic record exists with tenant_id=null + provider_txn_id
           + raw signature + reason="signature_mismatch"
      Without the policy (TenantOwned mandatory tenant_id):
        1. TenantContext.current().orElseThrow() throws
           TenantContextMissingException
        2. MultiTenantProblemDetailAdvice maps to 500
        3. PG retries (NICE: up to 24h) → 500 storm until human ops
           manually clears or upstream signer is fixed
        4. No forensic record of the original failure — the 500s
           overwrite each other in alerting

  evidence_anchor: >
    multi-tenant-manifest #aop-guard.tenant_id_shape (line 252-264)
    fixes the type as UUID and forbids nullable wire formats for
    *tenant-scoped resource columns*. This anchor (#ledger-audit-tenant-scope)
    is the explicit exception: audit / ledger entities are not
    tenant-scoped resources in the isolation sense, so the UUID type
    is preserved but nullability is permitted. The two anchors
    together form a complete partition — every entity in a
    `tenant_model: multi` recipe is classified as either
    tenant-scoped (TenantOwned, NOT NULL) OR audit (NOT TenantOwned,
    nullable). No third bucket; recipe authors who reach for one
    SHOULD reach for the other by exclusion.

  cost_estimate_eng_days: 0.5
  applies_to_existing_anchors:
    - "PaymentEvent (ax-template reference workload) — currently has no tenant_id column. Single-tenant default; if a fork-receiver multi-tenant-izes payments, they add tenant_id with this policy."
    - "Any spec emitting `audit_required: true` (payment-manifest #callback.audit_required line 205) — the audit ledger row policy automatically pulls #ledger-audit-tenant-scope when the recipe is `tenant_model: multi`."

callback-tenant-resolution:
  description: >
    Tenant resolution policy for external PG callbacks (NICE / Toss / KakaoPay
    webhooks) and other unauthenticated permitAll endpoints that nonetheless
    write to tenant-scoped resources. #context-resolution above assumes an
    authenticated principal at controller entry — but PG callbacks arrive
    with NO principal (the PG signs the request, not a user). This is the
    most security-critical gap: a wrong tenant resolution at this boundary
    silently writes a Payment row under the WRONG tenant, leaking data
    across organizations.
  introduced_at: >
    R5 — closes P2 R3 GAP-R3-4 surfaced during compact dogfood: external PG
    callback controllers (PaymentCallbackController, IdentityVerificationCallbackController)
    run at permitAll endpoints where TenantContext is empty. #context-resolution
    forbids resolving tenant from request body / query / path (all forgeable),
    but the manifest never specified what IS allowed for the callback case.
    Without a canonical policy, fork-receivers reach for the easy
    (orderId-prefix / path-segment) routes that are explicitly forbidden
    elsewhere in the manifest — a Spec Trio self-violation by omission.

  threat_model:
    attacker: >
      Tenant B user with legitimate PG account at the same provider.
      Wants to write a Payment row under tenant A's namespace (e.g. to
      inflate A's reported revenue, frame A for refund fraud, or trigger
      A's downstream automation against B's order data).
    attack_vectors_to_defeat:
      - "orderId forgery: attacker crafts an orderId with tenant A's prefix and triggers a real PG charge"
      - "path forgery: attacker discovers tenant-specific callback URL via DNS enum / log scraping"
      - "header forgery: attacker adds X-Tenant-Id: <A> to a callback they originate via PG sandbox"
      - "replay across tenants: attacker captures a real tenant A callback and resubmits with their PG credentials"
    silent_failure_consequence: >
      Wrong-tenant Payment row inserted (tenant_id = A but funds settled to
      B's PG account). Downstream audit shows A received a payment that
      A's ledger does not match. Reconciliation looks like a bug, not an
      attack — detection latency typically days to weeks.

  candidate_strategies:

    candidate_a_subdomain:
      shape: "Per-tenant callback subdomain (e.g. tenantA.callbacks.example.com vs tenantB.callbacks.example.com). Tenant resolved from Host header at the proxy / SecurityFilterChain layer."
      strengths:
        - "DNS-level isolation — wildcard cert + per-tenant nginx server_name route the callback to a tenant-scoped Spring profile / context"
        - "Defense in depth: even if PG signing key leaks, the wrong-subdomain callback never reaches the wrong tenant's controller"
        - "Auditable: subdomain visible in nginx access logs without parsing request body"
      weaknesses:
        - "Many Korean PGs (NICE, Toss V1) allow only ONE callback URL per merchant account — fork-receiver MUST run per-tenant merchant accounts (multiplies PG-side ops cost)"
        - "Subdomain alone is NOT cryptographic — attacker who can DNS-spoof or compromise the proxy gets full bypass"
        - "TLS SNI not required by all PG clients; some emit Host header without enforcing it server-side"
      cost_estimate_eng_days: 4   # nginx per-tenant + DNS + cert management + per-tenant PG merchant onboarding flow
      verdict: "SECONDARY — defense in depth only; never the primary signal"

    candidate_b_orderid_prefix:
      shape: "orderId carries tenant prefix (e.g. A-9f3e... / B-7c21...). Controller parses the prefix and resolves TenantContext from it."
      strengths:
        - "Zero PG-side configuration — works with single-merchant-account setups"
        - "Cheap to implement (one regex)"
      weaknesses:
        - "orderId is CLIENT-SUPPLIED at PG checkout init — attacker creates an order with prefix 'A-' from tenant B's frontend and the PG dutifully echoes it back in the callback"
        - "Forbidden in spirit by #context-resolution.forbidden_sources line 407-409 (URL/body/query — orderId arrives in body)"
        - "No cryptographic binding between prefix and tenant — equivalent to trusting an HTTP header"
      cost_estimate_eng_days: 0.5
      verdict: "FORBIDDEN — strictly worse than #context-resolution.forbidden_sources because it adds the illusion of tenant scoping without any cryptographic backing. Recipes MUST NOT use this strategy."

    candidate_c_per_tenant_secret:
      shape: >
        Each tenant onboards a distinct webhook signing secret with the PG
        (NICE merchant key per tenant, Toss webhook secret per tenant, etc.).
        Callback verifier walks the active per-tenant secrets and accepts
        the request only when EXACTLY ONE secret produces a matching HMAC.
        The matching secret's owning tenant becomes the resolved TenantContext.
      strengths:
        - "Cryptographic binding: attacker without tenant A's PG webhook secret cannot forge a callback that resolves to tenant A — regardless of orderId, path, subdomain, or header content"
        - "Defeats all four attack_vectors_to_defeat above (orderId forgery, path forgery, header forgery, cross-tenant replay)"
        - "Tenant resolution is a SIDE EFFECT of signature verification — fork-receivers cannot accidentally enable callbacks without resolving tenant (the two operations are the same function)"
        - "Works with single-merchant-account setups (one PG, multiple webhook secrets per tenant)"
      weaknesses:
        - "PG MUST support per-tenant webhook secrets — verified supported by NICE (per merchant), Toss (per webhook endpoint), KakaoPay (per cid). Some smaller PGs only support one global secret per merchant — those PGs CANNOT be safely used for multi-tenant"
        - "Secret-walk is O(n_active_tenants) per callback — at 1000+ tenants the verifier MUST short-circuit on a leading tenant hint (header / subdomain) to keep p99 latency bounded"
        - "Constant-time comparison required to avoid timing oracle on which tenant matched (use MessageDigest.isEqual, never Arrays.equals)"
      cost_estimate_eng_days: 1.5
      verdict: "CANONICAL — defaults to this for any recipe with tenant_model: multi AND callback endpoints"

  canonical_choice: "candidate_c_per_tenant_secret"
  defense_in_depth_pairing: "candidate_a_subdomain (when PG supports multi-URL) — subdomain narrows the secret-walk and gives an audit signal, but never replaces the per-tenant secret verification"

  verifier_contract:
    fqcn: "<cross_cutting_package>.TenantAwareCallbackVerifier"
    interface_shape: |
      package com.<root>.multitenancy;

      import java.util.UUID;

      /**
       * Verifies an external PG callback and resolves the originating
       * tenant in a single operation. The two steps MUST NOT be split
       * across separate calls — splitting allows a bug where callback
       * verification passes against tenant A's secret but TenantContext
       * is set from a different (forgeable) source.
       *
       * Returns the tenant_id whose secret produced the matching HMAC.
       * Caller (the controller) MUST call TenantContext.set(result)
       * BEFORE invoking any tenant-scoped service. The audit append
       * path (see #ledger-audit-tenant-scope) runs BEFORE this
       * resolution succeeds — signature_fail audit rows correctly
       * carry tenant_id = null.
       *
       * Throws CallbackSignatureMismatchException when NO active
       * tenant's secret produces a matching HMAC. Throws
       * AmbiguousTenantResolutionException when MORE THAN ONE
       * tenant's secret matches (collision = key reuse across
       * tenants = operational error, never silently pick one).
       */
      public interface TenantAwareCallbackVerifier {
          UUID verifyAndResolveTenant(
              byte[] rawBody,
              String providerSignatureHeader,
              String providerName /* "nice" / "toss" / "kakaopay" */
          );
      }
    failure_modes:
      no_match:        "CallbackSignatureMismatchException — append signature_fail audit row with tenant_id=null per #ledger-audit-tenant-scope, return 200 OK to PG to avoid retry storm OR (per spec) return 401 to PG depending on provider contract"
      multiple_match:  "AmbiguousTenantResolutionException — operational error (key reuse). Return 500 to PG. Loud alert on ops. Loud BECAUSE the request itself is structurally valid but the catalog is misconfigured."
      single_match:    "Return matched tenant_id. Caller MUST TenantContext.set(...) before invoking downstream services."

    forbidden_alternatives:
      - "two-call shape: `verify(raw, header)` then `resolveTenantFromOrderId(orderId)` — splits the verification-and-resolution atomic; attacker can pass a valid signature for tenant B and an orderId from tenant A"
      - "trust the first matching secret without walking the rest — masks the multiple_match failure mode (silent cross-tenant collision)"
      - "Arrays.equals on HMAC bytes — timing oracle leaks which tenant's secret matched (attacker can mount a timing attack to enumerate active tenants)"
      - "fall back to orderId prefix when no secret matches — strictly worse than rejecting (now the attacker has a path that requires zero PG secret knowledge)"

  bounded_secret_walk:
    description: >
      Per-tenant secret verification is O(n_active_tenants). For deployments
      with >100 tenants, the verifier MUST short-circuit on a non-authoritative
      hint to keep p99 latency under SLO. The hint is SUGGESTIVE only — the
      cryptographic verification MUST still complete against the candidate
      tenant's secret, and a hint mismatch MUST NOT skip secrets that would
      otherwise match.
    allowed_hints:
      - "Host header (when candidate_a_subdomain is paired) — narrows search to tenants registered for that subdomain"
      - "X-Tenant-Hint header (advisory; never trusted as authoritative) — narrows search but full walk happens on hint miss"
    forbidden_hints:
      - "orderId prefix — explicitly forbidden as a tenant signal (candidate_b verdict)"
      - "path segment — same forbiddance as orderId; both are forgeable"
    fallback_on_hint_miss: >
      Walk all active tenants. Never silently drop on hint mismatch — a hint
      that points to no active tenant might be an attack probe OR a stale DNS
      record; both must reach the cryptographic verification stage.

  worked_example:
    scenario: >
      Tenant A has webhook secret SA registered with NICE merchant account.
      Tenant B has webhook secret SB registered with the same NICE account
      under a different sub-merchant id. Attacker (legitimate user of tenant
      B) initiates a real PG charge with orderId "A-fake-001" trying to
      impersonate tenant A. NICE signs the callback with SB (the attacker's
      sub-merchant secret), POSTs to /api/payments/callback/nice with
      orderId=A-fake-001.
    flow_with_canonical_policy: >
      1. Controller receives callback at permitAll endpoint.
      2. TenantContext.current() → Optional.empty() (no principal).
      3. Controller invokes TenantAwareCallbackVerifier.verifyAndResolveTenant(raw, sig, "nice").
      4. Verifier walks active tenants {A: SA, B: SB}. HMAC matches SB only.
      5. Verifier returns tenant_id = B.
      6. Controller calls TenantContext.set(B).
      7. Controller delegates to PaymentService which looks up Payment by orderId.
      8. orderId "A-fake-001" either does not exist OR exists under tenant A.
      9. Payment row's tenant_id (A) ≠ TenantContext.current() (B) → @AuthorizedTenant interceptor throws TenantBoundaryViolationException → 404.
      10. PG sees 404 (not 500) → no retry storm; orphan audit row preserved with tenant_id=B (the verified attacker tenant).
      Net result: attacker's attempt to fabricate a tenant A Payment row FAILS at the cryptographic verifier (step 4) regardless of orderId content.
    flow_without_policy_using_orderid_prefix: >
      1. Controller parses orderId prefix "A-" → sets TenantContext(A).
      2. Verifier checks signature against tenant A's secret SA — FAILS.
      3. Naive implementation either: returns 500 (PG retries) OR falls
         back to global secret (catastrophic — accepts any signed callback
         as tenant A).
      Net result: either retry storm OR silent cross-tenant write — both
      are observable in the wild on misconfigured Korean PG integrations.

  enforcement_static_check: >
    A practices rule candidate (multi-tenant-callback-verifier-required)
    can flag any controller annotated @PermitAll (or in a permitAll path
    of SecurityFilterChain) that writes to a TenantOwned @Entity WITHOUT
    invoking a TenantAwareCallbackVerifier in the call chain. Detection
    shape: AST-walk from the controller method body; if any reachable
    call chain reaches a JpaRepository.save() on a TenantOwned entity
    AND no call to a method whose return type is the resolved tenant_id
    intervenes, flag. 38th hard guard candidate.

  cost_estimate_eng_days: 1.5

scheduled-task-tenant-scope:
  description: >
    Tenant resolution policy for @Scheduled / Quartz / shedlock-style
    periodic jobs (reconciliation sweeps, retention purges, daily
    summaries) that run with NO inbound HTTP request and therefore
    NO request-scoped TenantContext. #async-propagation already
    covers @Async / message listeners where the SUBMITTING thread
    has a TenantContext that can be captured; the scheduler case is
    different — the job itself originates the unit of work and has
    no prior tenant context to propagate from.
  introduced_at: >
    R5 — opens P2 R3 GAP-R3-5 surfaced during compact dogfood: the
    manifest covered request-scoped (#context-resolution), AOP-scoped
    (#aop-guard), async-submission-scoped (#async-propagation), and
    callback-scoped (#callback-tenant-resolution) — but the scheduler
    /cron path was undefined. fork-receivers writing a nightly
    PaymentReconciliationJob would reach for either (a) bare
    repository.findAll() (silent cross-tenant read — every tenant's
    rows processed under no tenant context) OR (b) a single
    TenantContext.set(SYSTEM_TENANT_UUID) (creates a synthetic
    cross-tenant principal — the GAP-R3-3 sentinel anti-pattern in
    a new disguise). R5 anchors the canonical pattern at the
    catalog level.
  closed_at: >
    R6 — full closure. Manifest moves from staked-anchor to executable
    contract: TenantIterationScheduler + TenantCatalog skeleton ship
    in the multi-tenant fixture, the lock-key contract is concrete
    (Shedlock @SchedulerLock(name = "<job>-<tenantId>")), and the
    39th hard guard (scheduled_task_tenant_scope_guard.sh) blocks
    any of the three forbidden_alternatives from sneaking in via
    fork-receiver code.

  canonical_pattern: per_tenant_iteration

  per_tenant_iteration:
    description: >
      The scheduler enumerates the active tenant catalog and for
      EACH tenant, opens a tenant-scoped unit of work that sets
      TenantContext, runs the job body, then clears. The job body
      sees the same tenant-scoped repository view as any inbound
      HTTP request — the @Filter activation, AOP interceptor, and
      audit-row attribution all behave identically.

      Three load-bearing properties:
        (1) set/clear is balanced per iteration via try/finally —
            a leak between tenants is the cross-tenant write vector
            to guard against. The guard scans for an unmatched
            TenantContext.set without a sibling TenantContext.clear
            in the same finally block.
        (2) tenantCatalog.listActive() is the SINGLE source of
            tenant enumeration. Hardcoding tenant ids or reading
            from a foreign cache lets a deactivated tenant continue
            receiving job side effects.
        (3) The distributed lock key (Shedlock @SchedulerLock name)
            MUST include the tenantId scalar — see #scheduled-task-tenant-scope.lock_key_contract
            below. A single global lock per @Scheduled method
            serializes all tenants behind one node, eliminating the
            parallelism the per-tenant iteration model is supposed
            to enable.

    canonical_skeleton: |
      package com.acme.multitenancy;

      import java.util.UUID;
      import net.javacrumbs.shedlock.spring.annotation.SchedulerLock;
      import org.springframework.scheduling.annotation.Scheduled;
      import org.springframework.stereotype.Component;

      /**
       * Generated from blueprints/multi-tenant-manifest.yaml#scheduled-task-tenant-scope.per_tenant_iteration.canonical_skeleton
       * with <root> = acme.
       *
       * Per-tenant iteration scheduler. Each cron tick enumerates the
       * active tenant catalog and runs the job body in a tenant-scoped
       * unit of work. set/clear is balanced via try/finally; the
       * distributed lock key includes the tenantId so two nodes can
       * process two tenants in parallel (see #lock_key_contract).
       */
      @Component
      public class TenantIterationScheduler {

          private final TenantCatalog tenantCatalog;
          private final ReconciliationJob reconciliationJob;

          public TenantIterationScheduler(TenantCatalog tenantCatalog,
                                          ReconciliationJob reconciliationJob) {
              this.tenantCatalog = tenantCatalog;
              this.reconciliationJob = reconciliationJob;
          }

          @Scheduled(cron = "0 0 3 * * *")
          @SchedulerLock(name = "reconciliation-#tenantId",
                         lockAtMostFor = "PT10M",
                         lockAtLeastFor = "PT30S")
          public void reconcilePayments() {
              for (UUID tenantId : tenantCatalog.listActive()) {
                  try {
                      TenantContext.set(tenantId);
                      reconciliationJob.runForCurrentTenant();
                  } catch (RuntimeException ex) {
                      // Per-tenant try/catch: one tenant's failure
                      // MUST NOT abort the iteration for siblings.
                      // Logged via SLF4J at WARN; audit row attributed
                      // to the failing tenant_id (set() succeeded).
                  } finally {
                      // MUST clear — scheduler threads are pooled by
                      // TaskScheduler and reused across iterations.
                      TenantContext.clear();
                  }
              }
          }
      }

  tenant_catalog_contract:
    description: >
      The single source of tenant enumeration. MUST be a separate
      non-TenantOwned bean (it is the tenant discriminator, not
      a tenant-scoped resource — chicken-and-egg avoidance).
      Returns active tenants only; deactivated tenants MUST NOT
      receive scheduled-task side effects.
    interface_shape: |
      package com.acme.multitenancy;

      import java.util.List;
      import java.util.UUID;

      /**
       * Generated from blueprints/multi-tenant-manifest.yaml#scheduled-task-tenant-scope.tenant_catalog_contract
       * with <root> = acme.
       *
       * Non-TenantOwned bean — the tenant discriminator itself. Reads
       * the Tenant entity table directly without going through @Filter
       * activation (see #context-resolution); this is the only entity
       * type that legitimately bypasses tenant scoping.
       */
      public interface TenantCatalog {
          List<UUID> listActive();
      }

  lock_key_contract:
    description: >
      Distributed scheduler coordination (Shedlock / Quartz cluster /
      Redis lock) MUST scope the lock key by tenantId so two nodes
      can process two tenants in parallel. The lock name template
      "<job>-#tenantId" (Shedlock SpEL syntax) resolves at each
      iteration; a single global lock per @Scheduled method
      serializes all tenants behind one node.
    required_substring: "#tenantId"
    forbidden_substrings:
      - 'lockKey = "global"'
      - "@SchedulerLock(name = \"reconciliation\")"  # bare job name; no tenantId scoping
    rationale: >
      Without the tenantId in the lock key, a 100-tenant fork-receiver
      running a 30s-per-tenant reconciliation on a 2-node cluster
      observes 100×30s = 50min serial latency instead of the expected
      50×30s = 25min parallel latency. Worse, if any tenant's
      reconciliation hangs, ALL subsequent tenants block behind it on
      the global lock until lockAtMostFor expires — turning a
      single-tenant pathology into a cluster-wide outage.

  forbidden_alternatives:
    - "bare repository.findAll() with no TenantContext set — every tenant's rows processed under empty context; @Filter activation may either pass (filter not enabled — leaks all rows) or fail (TenantContextMissingException — job dies on first iteration)"
    - "TenantContext.set(SYSTEM_TENANT_UUID) — synthetic cross-tenant principal; @AuthorizedTenant boundary checks pass spuriously; audit rows attributed to a non-existent tenant; identical anti-pattern to the GAP-R3-3 sentinel UUID(0,0) just under a different name"
    - "per-tenant @Scheduled methods (one cron per tenant) — does not scale past ~10 tenants; new tenants require code change + redeploy"
    - "InheritableThreadLocal-backed TenantContext for scheduler threads — same forbiddance as #async-propagation; silent propagation across @Async defeats explicit-failure contract"
    - "global @SchedulerLock(name = \"reconciliation\") without #tenantId — single cluster-wide lock serializes all tenants behind one node and turns one tenant's hang into a fleet-wide outage (see lock_key_contract.rationale)"

  failure_modes:
    set_without_clear:
      description: >
        TenantContext.set(tenantId) called without a matching
        TenantContext.clear() in a finally block. Worker thread
        reused for the next iteration retains tenantId N's context;
        tenantId N+1's job body executes under N's TenantContext.
        Cross-tenant write vector.
      detection: >
        Mechanical AST proxy via 39th guard: in any scheduler file
        that calls TenantContext.set, count must equal count of
        TenantContext.clear in the same file. Strict equality, not
        inequality — extra clears without sets are also a smell.
    catalog_bypass:
      description: >
        Scheduler enumerates tenants from a hardcoded array, a
        property file, or a foreign cache instead of calling
        tenantCatalog.listActive(). Deactivated tenants continue
        receiving job side effects; new tenants miss the job until
        a redeploy.
      detection: >
        39th guard scans for the absence of a tenantCatalog field
        and a listActive() call in any @Scheduled-bearing class.
    no_lock_key_tenant_scope:
      description: >
        @SchedulerLock present but name does not include the
        tenantId scalar — either bare job name or a global key.
        See lock_key_contract.forbidden_substrings.
      detection: >
        39th guard scans @SchedulerLock annotations and requires
        the name attribute to contain the substring "#tenantId"
        (Shedlock SpEL) or "${tenantId}".

  open_questions_remaining:
    - "Cluster-wide degraded-tenant skip list (e.g. tenant N's job has thrown 5 times in a row → skip for the rest of the day): not yet anchored. Operator policy, not a tenant-isolation concern; deferred."
    - "Per-tenant rate limiting inside the iteration (Token bucket per tenant to throttle PG API calls): can be added via existing #ratelimit-manifest.yaml; not in scope."

  cost_estimate_eng_days: 1.5

realtime-connection-tenant-scope:
  description: >
    Tenant resolution policy for long-lived push connections (SSE
    SseEmitter, STOMP @MessageMapping over WebSocket, raw
    WebSocketHandler). #context-resolution covers request-scoped
    TenantContext (set on request entry, cleared on request exit);
    #async-propagation covers short-lived submission-to-worker
    propagation via TaskDecorator; this anchor covers the third
    thread-flow regime: a connection registered on one HTTP request
    thread that subsequently emits messages on a DIFFERENT thread
    (the event publisher / broker pool) AFTER the originating
    request has exited and TenantContext has been cleared.
  introduced_at: >
    R7 — opens P2 R6 GAP-NEW-1 surfaced during compact dogfood:
    blueprints/realtime-policy-manifest.yaml defines transport
    selection (polling default, SSE / WebSocket opt-in) but is
    silent on tenant scope across the long-lived connection
    lifecycle. fork-receivers writing a tenant admin dashboard
    SseEmitter at /api/v1/events would reach for either
    (a) bare emitters.forEach(e -> e.send(payload)) inside an
    @EventListener — silent cross-tenant push leak when payload
    is tenant-A's PaymentCapturedEvent and the subscriber set
    contains tenant-B's admin) OR (b) capture TenantContext at
    subscribe time but never re-set it at send time — payload
    serializes under empty TenantContext, audit-event MDC has no
    tenant_id, and any TenantOwned lookup inside the
    serialization path NPEs. R7 anchors the canonical pattern.
  closed_at: >
    R7 — full closure. Manifest moves from staked-anchor to
    executable contract: TenantAwareSseEmitterRegistry skeleton
    ships in the multi-tenant fixture, the
    (connection-registration → broadcast-filter → per-message
    set/clear) triad is concrete, and the 40th hard guard
    (realtime_connection_tenant_scope_guard.sh) blocks any of
    the three forbidden_alternatives from sneaking in via
    fork-receiver code.

  canonical_pattern: registry_per_message_set_clear

  registry_per_message_set_clear:
    description: >
      Connection registration captures the subscribing tenant's
      tenantId at HTTP-request thread time (when TenantContext is
      populated by TenantFilterActivationFilter) and stores it
      ALONGSIDE the SseEmitter / WebSocketSession in a
      ConcurrentHashMap<UUID emitterId, TenantBoundEmitter> owned
      by a singleton registry bean. Event publishers do NOT iterate
      raw emitter sets; they iterate the registry's
      sendToTenant(tenantId, payload) method which (a) filters the
      registry by tenantId, (b) wraps each send call in a
      TenantContext set/clear around send(), and (c) handles
      IOException by unregistering the dead emitter.

      Four load-bearing properties:
        (1) Connection-registration happens at HTTP-request time —
            TenantContext.current().orElseThrow() is the tenant
            signal. Resolving tenantId from a query parameter, a
            client-supplied header, or the connection URL path is
            FORBIDDEN (#failure_modes.client_supplied_tenant).
        (2) Storage is a singleton bean keyed by emitterId, NOT a
            ThreadLocal. SseEmitter outlives the originating HTTP
            request thread by design; ThreadLocal-keyed registries
            are empty at send time.
        (3) Broadcast is sendToTenant(tenantId, ...), NEVER
            sendToAll(...). Server-side broadcast iterates the
            ENTIRE registry by default; without a tenant filter
            the payload reaches every connected tenant's admin.
        (4) Per-message TenantContext.set is wrapped in try/finally
            around the actual SseEmitter.send() / WebSocketSession
            .sendMessage() call. The send may trigger downstream
            serializers, @JsonView resolvers, or AOP-intercepted
            getters that call TenantContext.current() — they MUST
            see the receiving tenant's context, not the publisher's.
            finally clears so the broker-pool thread is released
            with empty TenantContext (mirrors #async-propagation
            failure_mode contract).

    canonical_skeleton: |
      package com.acme.multitenancy;

      import java.io.IOException;
      import java.util.UUID;
      import java.util.concurrent.ConcurrentHashMap;
      import org.springframework.stereotype.Component;
      import org.springframework.web.servlet.mvc.method.annotation.SseEmitter;

      /**
       * Generated from blueprints/multi-tenant-manifest.yaml#realtime-connection-tenant-scope.registry_per_message_set_clear.canonical_skeleton
       * with <root> = acme.
       *
       * Tenant-scoped SseEmitter registry. Connection registration
       * captures TenantContext at HTTP-request time; broadcast is
       * sendToTenant only; per-message TenantContext set/clear
       * wraps each send() so the serialization path sees the
       * receiving tenant's context, not the publisher's.
       */
      @Component
      public class TenantAwareSseEmitterRegistry {

          private final ConcurrentHashMap<UUID, TenantBoundEmitter> emitters =
              new ConcurrentHashMap<>();

          /**
           * Called from a controller @GetMapping("/api/v1/events")
           * handler. TenantContext is populated by
           * TenantFilterActivationFilter at this point — resolving
           * tenantId from any other source is the
           * client_supplied_tenant anti-pattern.
           */
          public SseEmitter register(SseEmitter emitter) {
              UUID tenantId = TenantContext.current()
                  .orElseThrow(() -> new TenantContextMissingException(
                      "TenantContext empty at SseEmitter register; "
                      + "TenantFilterActivationFilter not in chain"));
              UUID emitterId = UUID.randomUUID();
              emitters.put(emitterId, new TenantBoundEmitter(tenantId, emitter));
              emitter.onCompletion(() -> emitters.remove(emitterId));
              emitter.onTimeout(()    -> emitters.remove(emitterId));
              emitter.onError(ex      -> emitters.remove(emitterId));
              return emitter;
          }

          /**
           * Broadcast filter: ONLY emitters bound to tenantId
           * receive the payload. Iterating emitters.values() and
           * calling send() without filtering is the
           * broadcast_no_tenant_filter anti-pattern — silent
           * cross-tenant message leak.
           */
          public void sendToTenant(UUID tenantId, Object payload) {
              for (TenantBoundEmitter bound : emitters.values()) {
                  if (!bound.tenantId().equals(tenantId)) {
                      continue;
                  }
                  try {
                      // MUST set: serializers / @JsonView resolvers
                      // downstream of send() may call TenantContext.current().
                      TenantContext.set(bound.tenantId());
                      bound.emitter().send(payload);
                  } catch (IOException ex) {
                      // Dead connection — silent prune; the
                      // onError callback also fires asynchronously.
                      emitters.values().remove(bound);
                  } finally {
                      // MUST clear: broker-pool thread is reused
                      // across tenants. Leaving N's context set
                      // for N+1's send() is the cross-tenant write
                      // vector — same failure_mode as
                      // #async-propagation and
                      // #scheduled-task-tenant-scope.
                      TenantContext.clear();
                  }
              }
          }

          /**
           * Value record: emitter + its bound tenantId. Storing
           * tenantId on the SseEmitter subclass (instead of in a
           * separate record) is an acceptable variant; the guard
           * tolerates either as long as broadcast filtering on
           * tenantId exists.
           */
          public record TenantBoundEmitter(UUID tenantId, SseEmitter emitter) {}
      }

  websocket_session_attribute_contract:
    description: >
      For STOMP @MessageMapping or raw WebSocketHandler flows, the
      analogue of register-time TenantContext.set is the
      HandshakeInterceptor: it runs on the upgrade HTTP request
      (TenantContext IS populated by TenantFilterActivationFilter)
      and binds tenantId into the WebSocketSession attributes map.
      Subsequent message-handler invocations read tenantId from
      WebSocketSession.getAttributes().get("tenantId") and re-set
      TenantContext per message via try/finally.
    interface_shape: |
      package com.acme.multitenancy;

      import java.util.Map;
      import java.util.UUID;
      import org.springframework.http.server.ServerHttpRequest;
      import org.springframework.http.server.ServerHttpResponse;
      import org.springframework.web.socket.WebSocketHandler;
      import org.springframework.web.socket.server.HandshakeInterceptor;

      /**
       * Generated from blueprints/multi-tenant-manifest.yaml#realtime-connection-tenant-scope.websocket_session_attribute_contract
       * with <root> = acme.
       *
       * Binds TenantContext.current() into WebSocketSession
       * attributes during the HTTP upgrade handshake — the LAST
       * point in the connection lifecycle where the request-scoped
       * TenantContext is populated.
       */
      public class TenantBindingHandshakeInterceptor implements HandshakeInterceptor {

          @Override
          public boolean beforeHandshake(ServerHttpRequest request,
                                         ServerHttpResponse response,
                                         WebSocketHandler wsHandler,
                                         Map<String, Object> attributes) {
              UUID tenantId = TenantContext.current()
                  .orElseThrow(() -> new TenantContextMissingException(
                      "TenantContext empty at WS handshake; "
                      + "TenantFilterActivationFilter not in chain"));
              attributes.put("tenantId", tenantId);
              return true;
          }

          @Override
          public void afterHandshake(ServerHttpRequest request,
                                     ServerHttpResponse response,
                                     WebSocketHandler wsHandler,
                                     Exception exception) {
              // no-op
          }
      }

  forbidden_alternatives:
    - "bare emitters.forEach(e -> e.send(payload)) inside an @EventListener — broadcast_no_tenant_filter. Tenant A's PaymentCapturedEvent reaches every connected admin; silent cross-tenant push leak. Identical failure-class to GAP-R3-3 audit-row attribution but in the push direction."
    - "tenantId resolved from a query parameter or client header at SseEmitter register time (e.g. /api/v1/events?tenant_id=X) — client_supplied_tenant. Attacker subscribes to tenant B's stream by passing tenant_id=B; the registry trusts the URL and binds the wrong tenantId. Tenant signal MUST be TenantContext.current() at HTTP-request thread time (populated by JWT-bearing TenantFilterActivationFilter)."
    - "TenantContext captured at register time but NOT re-set at send time — per_message_no_set. The send() worker thread (broker pool / @Async event listener) has empty TenantContext; downstream serializers, @JsonView resolvers, and @AuthorizedTenant-annotated getters NPE or AOP-throw TenantBoundaryViolationException; audit-event MDC has no tenant_id."
    - "InheritableThreadLocal-backed TenantContext as a workaround for the per-message problem — forbidden by #context-resolution.tenant_context_skeleton. Silent propagation across broker pool defeats the explicit-failure contract; broker threads outlive any sane request boundary."
    - "Storing the SseEmitter in a static field or per-thread map instead of a ConcurrentHashMap-backed singleton bean — registry_lifecycle_unbound. SseEmitter outlives both the HTTP request thread and any reasonable garbage-collection window; ThreadLocal-keyed registries are empty by the first send."

  failure_modes:
    broadcast_no_tenant_filter:
      description: >
        Event publisher iterates emitters.values() without a
        tenantId filter and calls send() on every connected
        emitter. Tenant A's PaymentCapturedEvent payload reaches
        tenant B's admin dashboard. Cross-tenant read leak in
        the push direction; the dual of GAP-R3-3 in the audit
        write direction.
      detection: >
        40th guard scans every TenantAwareSseEmitterRegistry-shaped
        class (any class with field type SseEmitter inside a
        ConcurrentHashMap / List / Set) for a method that calls
        .send(...) on an emitter without a preceding tenantId
        equality check (.equals / == on TenantContext.current()
        or on a tenantId field of the bound record).
    client_supplied_tenant:
      description: >
        SseEmitter register method resolves tenantId from a query
        parameter, a client-supplied header, the connection URL
        path, or the SSE topic name instead of from
        TenantContext.current(). Attacker subscribes to another
        tenant's stream simply by passing the target tenantId.
      detection: >
        40th guard scans the register / @GetMapping handler that
        constructs SseEmitter — requires the body to read
        TenantContext.current() (or .orElseThrow()) and forbids
        reading the substring @RequestParam("tenant" or @RequestHeader
        ("X-Tenant" near the SseEmitter construction.
    per_message_no_set:
      description: >
        Registry stores tenantId at register time but the
        sendToTenant / broadcast method does NOT call
        TenantContext.set(...) before the .send(...) invocation.
        Serializers and @AuthorizedTenant-annotated getters
        downstream of send() see empty TenantContext.
      detection: >
        40th guard requires that any class containing both
        SseEmitter (as field type) AND a .send(...) call also
        contains a TenantContext.set(...) call AND a
        TenantContext.clear() call in the same file, with
        count(set) == count(clear) (mirrors the R6 39th-guard
        clause-1 algorithm).

  open_questions_remaining:
    - "Broker fan-out (Redis Pub/Sub, Kafka) for horizontal SSE scale — CLOSED in R8 via #broker-fanout-tenant-scope. Anchor encodes the message-envelope + consumer-side per-message set/clear pattern; the 41st guard mechanically enforces all three clauses."
    - "gRPC server-streaming RPC tenant scope — same long-lived-connection regime but over gRPC instead of HTTP/SSE. Same canonical pattern (registry per stream, per-message set/clear) should apply; not anchored until a fork-receiver introduces gRPC. Open gap NEW for any R9+ session that adopts gRPC streaming."
    - "Kafka consumer tenant scope — long-running consumer poll loop with no per-message HTTP boundary. Adjacent regime to scheduled tasks; the per-tenant-iteration model does not directly apply since messages arrive interleaved across tenants. The R8 #broker-fanout-tenant-scope envelope-header + per-message set/clear contract is the closest analogue but consumer-group / partition-assignment interaction with tenant scoping is not yet anchored; opens R9 candidate."

  cost_estimate_eng_days: 1.0

# ─────────────────────────────────────────────────────────────────────
# broker-fanout-tenant-scope — R8 closure (GAP-NEW-2)
# ─────────────────────────────────────────────────────────────────────
broker-fanout-tenant-scope:
  description: >
    Tenant resolution policy for cross-node broker fan-out (Redis
    Pub/Sub, Kafka, RabbitMQ topic exchange) used to scale SSE /
    WebSocket realtime push horizontally beyond a single node.
    #realtime-connection-tenant-scope (R7) anchored the single-node
    registry + per-message set/clear contract; this anchor covers the
    fourth thread-flow regime: a message published on Node A reaches
    Node B via the broker, where the broker-client listener thread
    has NEVER touched any HTTP request, never ran through
    TenantFilterActivationFilter, and has empty TenantContext by
    construction. The broker hop is the canonical context-loss
    boundary — same shape as #async-propagation across @Async, except
    the boundary crosses a PROCESS not just a thread.
  introduced_at: >
    R8 — opens P2 R7 GAP-NEW-2 surfaced during compact dogfood:
    #realtime-connection-tenant-scope.open_questions_remaining[0]
    explicitly named broker fan-out as the unresolved >1-node SSE
    deployment case. fork-receivers writing a 2-node SSE deployment
    behind an LB would reach for either (a) bare
    redisTemplate.convertAndSend(channel, payload) — the consumer-side
    listener has no tenant signal, so it either (i) NPEs on
    TenantContext.current().orElseThrow() inside the local
    sendToTenant() call, (ii) silently broadcasts to every locally
    connected emitter if the listener swallows the missing context,
    or (iii) leaks the previous message's tenantId if the broker-pool
    thread is reused and the listener trusts a stale ThreadLocal.
    R8 anchors the canonical pattern: tenantId travels INSIDE the
    message envelope as a structural header; the consumer
    deserializes the envelope, set/clears TenantContext per-message,
    and dispatches to the local sendToTenant by passing the
    envelope's tenantId explicitly.
  closed_at: >
    R8 — full closure. Manifest moves from staked-anchor to
    executable contract: TenantAwareRedisPubSubBridge skeleton ships
    in the multi-tenant fixture, the (envelope-tenantId-header →
    consumer-deserializes-envelope → per-message set/clear → local
    sendToTenant call) chain is concrete, and the 41st hard guard
    (broker_fanout_tenant_scope_guard.sh) blocks any of the three
    forbidden_alternatives from sneaking in via fork-receiver code.

  canonical_pattern: envelope_header_per_message_set_clear

  envelope_header_per_message_set_clear:
    description: >
      Every cross-node broker message carries a structural envelope
      record containing { UUID tenantId, Object payload }. The
      envelope is the wire-format contract — payloads alone (raw
      domain events) are FORBIDDEN because they have no tenant
      signal across the broker hop.

      Four load-bearing properties:
        (1) Publish-side wraps the domain payload in
            TenantBrokerEnvelope(TenantContext.current().orElseThrow(),
            payload) at the call site — BEFORE handing to the broker
            template. Resolving tenantId from any other source
            (config, default tenant, system tenant) is FORBIDDEN
            (#failure_modes.publish_without_envelope_header).
        (2) Subscribe-side deserializes the envelope FIRST. The
            broker-client listener thread has empty TenantContext by
            construction (never ran through
            TenantFilterActivationFilter). Reading
            TenantContext.current() at listener entry is the
            consumer_assumes_current_context anti-pattern — it
            returns Optional.empty() and the .orElseThrow() either
            NPEs or (worse) falls back to a default tenant.
        (3) Per-message TenantContext.set / TenantContext.clear wraps
            the LOCAL sendToTenant(envelope.tenantId(),
            envelope.payload()) call in try/finally. Same algorithm
            as the R7 40th-guard clause-3 and the R6 39th-guard
            clause-1: count(set) == count(clear) > 0 in the listener
            method body.
        (4) Local dispatch passes envelope.tenantId() EXPLICITLY
            into the existing TenantAwareSseEmitterRegistry
            .sendToTenant(tenantId, payload) call — NEVER
            TenantContext.current() and NEVER a tenantId field on
            the listener bean. The envelope IS the tenant signal;
            anything else is a stale-context leak vector.

    canonical_skeleton: |
      package com.acme.multitenancy;

      import java.util.UUID;
      import org.springframework.beans.factory.annotation.Autowired;
      import org.springframework.data.redis.connection.Message;
      import org.springframework.data.redis.connection.MessageListener;
      import org.springframework.data.redis.core.RedisTemplate;
      import org.springframework.data.redis.serializer.Jackson2JsonRedisSerializer;
      import org.springframework.stereotype.Component;

      /**
       * Generated from blueprints/multi-tenant-manifest.yaml#broker-fanout-tenant-scope.envelope_header_per_message_set_clear.canonical_skeleton
       * with <root> = acme.
       *
       * Tenant-scoped Redis Pub/Sub bridge for multi-node SSE
       * fan-out. Three guard-checked properties:
       *   (1) publish() wraps the payload in a TenantBrokerEnvelope
       *       carrying TenantContext.current() as a structural
       *       header — bare convertAndSend(channel, payload) is the
       *       publish_without_envelope_header anti-pattern.
       *   (2) onMessage() reads tenantId from the deserialized
       *       envelope — NOT from TenantContext.current() (which is
       *       empty on the Lettuce / Jedis broker thread).
       *   (3) Per-message TenantContext.set / TenantContext.clear
       *       wraps the local sendToTenant dispatch in try/finally
       *       so downstream serializers see the receiving tenant's
       *       context and the broker-pool thread is released clean.
       */
      @Component
      public class TenantAwareRedisPubSubBridge implements MessageListener {

          private static final String CHANNEL = "ax.tenant.events";

          private final RedisTemplate<String, TenantBrokerEnvelope> redisTemplate;
          private final TenantAwareSseEmitterRegistry registry;
          private final Jackson2JsonRedisSerializer<TenantBrokerEnvelope> envelopeSerializer;

          @Autowired
          public TenantAwareRedisPubSubBridge(
                  RedisTemplate<String, TenantBrokerEnvelope> redisTemplate,
                  TenantAwareSseEmitterRegistry registry,
                  Jackson2JsonRedisSerializer<TenantBrokerEnvelope> envelopeSerializer) {
              this.redisTemplate = redisTemplate;
              this.registry = registry;
              this.envelopeSerializer = envelopeSerializer;
          }

          /**
           * Called from an @EventListener / service-layer publisher.
           * TenantContext is populated by the originating request
           * thread — resolving tenantId from any other source
           * (config default, system tenant) is FORBIDDEN.
           */
          public void publish(Object payload) {
              UUID tenantId = TenantContext.current()
                  .orElseThrow(() -> new TenantContextMissingException(
                      "TenantContext empty at broker publish; "
                      + "publisher MUST run inside a tenant-scoped request"));
              TenantBrokerEnvelope envelope = new TenantBrokerEnvelope(tenantId, payload);
              redisTemplate.convertAndSend(CHANNEL, envelope);
          }

          /**
           * Redis MessageListener entrypoint — runs on the Lettuce /
           * Jedis broker thread which has empty TenantContext by
           * construction (never ran through
           * TenantFilterActivationFilter).
           *
           * Tenant signal is the ENVELOPE, never TenantContext.current().
           */
          @Override
          public void onMessage(Message message, byte[] pattern) {
              TenantBrokerEnvelope envelope =
                  envelopeSerializer.deserialize(message.getBody());
              if (envelope == null || envelope.tenantId() == null) {
                  // Reject malformed messages explicitly — fall-through
                  // to bare emitters.forEach would leak across tenants.
                  throw new TenantContextMissingException(
                      "Broker message lacks tenantId envelope header");
              }
              try {
                  // MUST set: downstream serializers / @JsonView /
                  // @AuthorizedTenant getters reached during
                  // sendToTenant may call TenantContext.current().
                  TenantContext.set(envelope.tenantId());
                  // MUST pass envelope.tenantId() EXPLICITLY — passing
                  // TenantContext.current() here would be a tautology
                  // that the guard still rejects because the call must
                  // also be tenantId-equality-filtered downstream.
                  registry.sendToTenant(envelope.tenantId(), envelope.payload());
              } finally {
                  // MUST clear: broker-pool thread is reused across
                  // messages. Leaving tenant N's context set for tenant
                  // N+1's onMessage is the stale_tenant_context vector.
                  TenantContext.clear();
              }
          }

          /**
           * Wire-format envelope. tenantId is a STRUCTURAL header,
           * not a payload property — it travels alongside the
           * payload regardless of payload shape. Tolerated variants:
           *   - tenantId stored on a Spring Message HEADER (Kafka,
           *     RabbitMQ ProducerRecord/AMQP header) instead of an
           *     envelope record
           *   - envelope record where tenantId precedes payload field
           * Forbidden: payload-only messages where tenantId is buried
           * inside the domain object (parser-dependent, brittle,
           * indistinguishable from absence on a malformed payload).
           */
          public record TenantBrokerEnvelope(UUID tenantId, Object payload) {}
      }

  kafka_header_contract:
    description: >
      For Kafka-backed fan-out, the analogue of the
      TenantBrokerEnvelope record is the Kafka ProducerRecord header.
      Producer side: producerRecord.headers().add("X-Tenant-Id",
      tenantId.toString().getBytes(UTF_8)). Consumer side: read
      consumerRecord.headers().lastHeader("X-Tenant-Id") and
      .orElseThrow() if absent. Same per-message set/clear contract
      applies on the @KafkaListener method.
    interface_shape: |
      package com.acme.multitenancy;

      import java.nio.charset.StandardCharsets;
      import java.util.UUID;
      import org.apache.kafka.clients.consumer.ConsumerRecord;
      import org.apache.kafka.common.header.Header;
      import org.springframework.kafka.annotation.KafkaListener;
      import org.springframework.stereotype.Component;

      /**
       * Generated from blueprints/multi-tenant-manifest.yaml#broker-fanout-tenant-scope.kafka_header_contract
       * with <root> = acme.
       *
       * Kafka analogue of TenantAwareRedisPubSubBridge. The
       * X-Tenant-Id header is the structural tenant signal;
       * consumer MUST read it from headers and MUST per-message
       * set/clear before dispatching to the local registry.
       */
      @Component
      public class TenantAwareKafkaFanoutBridge {

          private static final String TENANT_HEADER = "X-Tenant-Id";

          private final TenantAwareSseEmitterRegistry registry;

          public TenantAwareKafkaFanoutBridge(TenantAwareSseEmitterRegistry registry) {
              this.registry = registry;
          }

          @KafkaListener(topics = "ax.tenant.events")
          public void onMessage(ConsumerRecord<String, Object> record) {
              Header tenantHeader = record.headers().lastHeader(TENANT_HEADER);
              if (tenantHeader == null || tenantHeader.value() == null) {
                  throw new TenantContextMissingException(
                      "Kafka message lacks " + TENANT_HEADER + " header");
              }
              UUID tenantId = UUID.fromString(
                  new String(tenantHeader.value(), StandardCharsets.UTF_8));
              try {
                  TenantContext.set(tenantId);
                  registry.sendToTenant(tenantId, record.value());
              } finally {
                  TenantContext.clear();
              }
          }
      }

  forbidden_alternatives:
    - "bare redisTemplate.convertAndSend(channel, payload) without envelope wrapping — publish_without_envelope_header. The consumer-side listener has no tenant signal across the broker hop; either (a) it NPEs on TenantContext.current().orElseThrow(), or (b) it silently falls back to a default tenant if defensive code masks the missing context, or (c) it leaks the previous message's stale tenantId from a reused broker-pool thread. The envelope IS the wire-format contract — there is no other tenant signal across a process boundary."
    - "consumer-side listener reads tenantId via TenantContext.current() instead of from the envelope / Kafka header — consumer_assumes_current_context. The Lettuce / Jedis / kafka-clients thread has never run through TenantFilterActivationFilter; TenantContext is empty by construction. orElseThrow() either explodes or silently masks via a defensive fallback. Tenant signal MUST be the envelope payload, never an ambient context."
    - "consumer-side listener iterates ALL locally-connected emitters and calls .send() without an envelope-tenantId filter — consumer_broadcast_no_filter. Same failure-class as #realtime-connection-tenant-scope.failure_modes.broadcast_no_tenant_filter except surfaced post-broker-hop. Tenant A's PaymentCapturedEvent reaches every connected admin on Node B; cross-tenant push leak across nodes."
    - "InheritableThreadLocal-backed TenantContext propagation across the broker client (Lettuce / Jedis) thread pool — InheritableThreadLocal_workaround. Already forbidden by #context-resolution.tenant_context_skeleton. Broker-pool threads outlive any reasonable request boundary and are reused across tenants; silent propagation defeats the explicit-failure contract."
    - "publishing the raw domain event (PaymentCapturedEvent) directly without wrapping in TenantBrokerEnvelope and relying on a tenantId field inside the domain event — payload_embedded_tenant_signal. Coupling the wire-format tenant signal to the domain event's internal shape is brittle: every new event type needs its own tenant-extraction logic, malformed payloads have no tenant signal at all, and refactoring a domain event silently breaks fan-out tenant scoping. The structural envelope decouples wire-format from domain shape."

  failure_modes:
    publish_without_envelope_header:
      description: >
        Publish-side calls
        redisTemplate.convertAndSend(channel, rawPayload) without
        wrapping in TenantBrokerEnvelope. The cross-node hop has no
        tenant signal; consumer-side either NPEs, silently
        broadcasts, or leaks a stale tenantId.
      detection: >
        41st guard scans the bridge file for any .convertAndSend(
        / .send( / .publish( call. Each call MUST be preceded by a
        TenantBrokerEnvelope constructor invocation (or equivalent
        Kafka producer record with X-Tenant-Id header) in the same
        method body. Bare convertAndSend with a non-envelope
        argument trips the clause.
    consumer_assumes_current_context:
      description: >
        @KafkaListener / Redis MessageListener method body reads
        TenantContext.current() instead of the envelope header.
        The broker thread has empty TenantContext by construction —
        orElseThrow() NPEs OR (worse) defensive code masks the
        empty Optional with a default tenant fallback.
      detection: >
        41st guard scans onMessage / @KafkaListener-annotated
        method bodies for the substring TenantContext.current()
        BEFORE a TenantContext.set(...) call appears. Tenant
        signal MUST come from the deserialized envelope, NOT
        ambient context.
    stale_tenant_context:
      description: >
        Listener calls TenantContext.set(envelope.tenantId()) but
        omits TenantContext.clear() in finally. Broker-pool thread
        is reused; the next message's listener invocation sees the
        prior tenantId in TenantContext.current() before its own
        envelope is deserialized — cross-tenant leak in the
        consumer-broadcast direction.
      detection: >
        41st guard requires count(TenantContext.set) ==
        count(TenantContext.clear) > 0 in any file with a .send(
        / .convertAndSend( / .publish( / onMessage / @KafkaListener
        signature. Same algorithm as the R7 40th-guard clause-3.
    consumer_broadcast_no_filter:
      description: >
        Consumer-side listener calls
        registry.sendToTenant(TenantContext.current(), payload) OR
        bare emitters.forEach(e -> e.send(payload)) instead of
        passing envelope.tenantId() EXPLICITLY. Local registry
        either dispatches under the WRONG tenant or broadcasts
        across all tenants on the receiving node.
      detection: >
        41st guard requires that any .sendToTenant(...) /
        .send(...) call inside an onMessage / @KafkaListener body
        passes either envelope.tenantId() (record accessor),
        envelope.getTenantId(), or a UUID parsed from a Kafka
        header — explicitly, not via TenantContext.current() and
        not via a bridge-bean field.

  open_questions_remaining:
    - "STOMP user-destination cross-node fan-out (Spring's @SendToUser) — uses the user registry / broker relay; the analogue here is binding tenantId into the StompHeaderAccessor session attributes during the CONNECT frame's interceptor, but the cross-node user-destination resolution model differs from raw pub/sub and is not yet anchored."
    - "Kafka consumer group / partition assignment with tenant scoping — should every tenant get its own topic, its own partition key derived from tenantId, or a single shared topic with header-only routing? Partition assignment interaction with consumer-group rebalancing under tenant-aware ordering guarantees is not yet anchored; opens R9 candidate alongside the existing Kafka-consumer open question."
    - "RabbitMQ topic exchange routing keys carrying tenantId in the key namespace (e.g. ax.tenant.<tenantId>.events.payment-captured) vs. header-only — routing-key-based tenant scoping is a cheap-but-leaky variant where a malformed binding silently delivers cross-tenant. The structural envelope/header pattern is the safer default; routing-key-only is forbidden for the same reason payload_embedded_tenant_signal is forbidden, but a hybrid is plausible and not yet pinned."

  cost_estimate_eng_days: 1.5

