template_id: auth-blueprint
family: scaffold
status: draft
confidence: medium
stack:
  frontend: react
  backend: spring-boot
  contract: openapi
  repo_shape: single-repo

when_to_use:
  - new project
  - auth/security baseline needed
  - React + Spring Boot single repo로 시작할 때

not_for:
  - brownfield migration
  - enterprise SSO platform replacement
  - broad identity platform

provider_policy:
  enabled_candidates:
    - email
    - google
    - naver
    - kakao
  disabled_behavior: structured_error
  schema_is_static: true

oauth_providers:
  google:
    scope: "openid email profile"
    user_info_fields: [email, name, picture]
    auto_verify_email: true  # Google emails are pre-verified
  naver:
    scope: "profile email"
    user_info_fields: [email, name, profile_image]
    user_info_path: "response"  # Naver wraps user info in "response" key
    auto_verify_email: true
  kakao:
    scope: "profile_nickname account_email"
    user_info_fields: [email, nickname, profile_image]
    user_info_path: "kakao_account"  # Kakao nests in "kakao_account"
    auto_verify_email: false  # Kakao email may not be verified

auth_state:
  access_token:
    delivery: response_body_or_memory
    storage: in_memory
  refresh_token:
    delivery: http_only_cookie
    storage: stateful
    rotation: grace_window
  me_endpoint:
    path: /auth/me
    returns:
      - user_id
      - email
      - roles
      - provider_links
      - verification_state

rbac:
  roles:
    - admin
    - manager
    - member
  role_management_out_of_scope: true

verification_policy:
  email_verification_required: true
  unverified_state_separated: true
  resend_supported: true
  expiry_notice_required: true
  idempotent_verify: true

rate_limits:
  login:
    limit: 5
    window: 15m
    key: ip_plus_identifier
  resend_verification:
    limit: 3
    window: 10m
    key: email

security_defaults:
  csrf: required
  cors: required
  hardcoded_secrets: reject
  custom_jwt_filter_default: reject
  stateless_refresh_token_default: reject

testing_baseline:
  backend_integration: required
  frontend_auth_state: required
  verify_triplet: required
  key_flow_e2e: required
  real_oauth_browser_e2e_v1: excluded

verification_checkpoints:
  - security
  - contract
  - rbac

must_not:
  - business_logic_in_controllers
  - custom_jwt_filter_as_default
  - stateless_refresh_token
  - fail_open_verify
  - provider_schema_split_by_flag

reject_if:
  - missing_csrf_cors_defaults
  - missing_rate_limits
  - missing_unverified_state_handling
  - refresh_without_server_side_state
  - contract_not_source_of_truth

source_precedence:
  1: latest_official_docs
  2: approved_github_refs
  3: practical_reference_refs

official_doc_refs:
  - spring.io/spring-security
  - spring.io/spring-boot
  - react.dev
  - swagger.io/specification

approved_github_refs:
  - spring-authorization-server/samples
  - jhipster generated output reference
  - baeldung spring security examples
  - orval

practical_refs:
  - full-stack-fastapi-template (react/client pattern only)
  - ixartz/SaaS-Boilerplate (ux/testing pattern only)

last_reviewed_at: null

# === GAP-REPORT FIX: JWT 정책 (Missing ❓ #1) ===
jwt:
  signing_algorithm: "RS256"          # 프로덕션 권장. 개발 환경에서는 HS256도 허용.
  access_token_expiry: "1h"           # 1시간
  refresh_token_expiry: "7d"          # 7일
  key_management:
    dev: "in-memory-generated"        # 개발: 앱 시작 시 RSA 키페어 자동 생성
    prod: "environment-variable"      # 프로덕션: 환경변수로 키 주입
  claims:
    sub: "userId (UUID)"
    email: "user email"
    iat: "issued at"
    exp: "expiration"

# === GAP-REPORT FIX: 세션 무효화 전략 (Missing ❓ #2) ===
session_invalidation:
  strategy: "refresh-token-revocation"  # 권장: refresh token DB 삭제로 세션 무효화
  access_token_note: "Access token은 stateless — 만료까지 유효. 짧은 expiry(1h)로 리스크 완화."
  logout_behavior:
    - "Refresh token DB에서 삭제"
    - "Refresh cookie 클리어 (Max-Age=0)"
    - "Access token은 만료까지 유효 (blocklist 선택적)"
  alternative: "token-blocklist"        # 대안: in-memory blocklist (Redis 권장)

# === GAP-REPORT FIX: CORS 정책 (Missing ❓ #5) ===
cors:
  allowed_origins:
    dev: ["http://localhost:5173", "http://localhost:3000"]
    prod: ["https://your-domain.com"]
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowed_headers: ["Authorization", "Content-Type", "X-Requested-With"]
  expose_headers: ["Set-Cookie"]
  allow_credentials: true
  max_age: 3600

# === GAP-REPORT FIX: 테스트 시딩 메커니즘 (Missing ❓ #3) ===
test_seeding:
  strategy: "direct-db-insert"
  description: >
    테스트에서 verified user를 생성하려면 UserRepository.save()로 직접 DB에 넣는다.
    verify-email 엔드포인트를 호출하지 않는다. @BeforeEach에서 emailVerified=true로 생성.
  example: |
    @BeforeEach
    void seedVerifiedUser() {
        UserEntity user = new UserEntity();
        user.setEmail("test@test.com");
        user.setHashedPassword(passwordEncoder.encode("securepassword12"));
        user.setEmailVerified(true);
        userRepository.save(user);
    }

# === GAP-REPORT FIX: 토큰 전달 방식 (Missing ❓ #4) ===
token_delivery:
  verification_token:
    dev: "console-log"                  # 개발: System.out.println("[AUTH-TOKEN] type=VERIFY email=X token=Y")
    prod: "email"                       # 프로덕션: 이메일 발송
    log_format: "[AUTH-TOKEN] type={VERIFY|RESET} email={email} token={uuid}"
  reset_token:
    dev: "console-log"
    prod: "email"
