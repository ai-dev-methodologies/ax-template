checks:
- description: Backend builds successfully
  id: build
  script: cd archive/backend-reference && ./gradlew build -q
  type: automated
- description: All ASVS spec items have @Tag tests and pass
  id: asvs-compliance
  script: cd archive/backend-reference && ./gradlew testAsvs -q
  type: automated
- description: OpenAPI contract paths match controller endpoints
  id: contract-match
  script: ./verify/check-contract.sh
  type: automated
- description: No hardcoded passwords/secrets in source code
  id: no-hardcoded-secrets
  script: ./verify/check-security.sh
  type: automated
- description: Role-based access control exists
  id: rbac-configured
  script: ./verify/check-rbac.sh
  type: automated
- description: Frontend builds successfully
  id: frontend-build
  script: cd frontend && npm run build -s
  type: automated
- description: OpenAPI schemas match TypeScript interfaces
  id: type-sync
  script: ./verify/check-types.sh
  type: automated
- description: E2E browser tests pass (Playwright — requires servers running)
  id: e2e-browser
  script: ./verify/check-e2e.sh
  type: automated
- description: 'Google OAuth 전체 플로우: 로그인→콜백→JWT발급→/auth/me 프로필'
  id: oauth-google-full-flow
  script: ./verify/check-oauth-flow.sh google
  type: automated
- description: 'Kakao OAuth 전체 플로우: 로그인→콜백→JWT발급→/auth/me 프로필'
  id: oauth-kakao-full-flow
  script: ./verify/check-oauth-flow.sh kakao
  type: automated
- description: 'Naver OAuth 전체 플로우: 로그인→콜백→JWT발급→/auth/me 프로필'
  id: oauth-naver-full-flow
  script: ./verify/check-oauth-flow.sh naver
  type: automated
- description: '이메일 전체 플로우: 가입→인증→로그인→/auth/me→로그아웃'
  id: email-full-flow
  script: ./verify/check-email-flow.sh
  type: automated
