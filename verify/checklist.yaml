checks:
- description: Backend builds successfully
  id: build
  script: cd backend && ./gradlew build -q
  type: automated
- description: All ASVS spec items have @Tag tests and pass
  id: asvs-compliance
  script: cd backend && ./gradlew testAsvs -q
  type: automated
- description: OpenAPI contract paths match controller endpoints
  id: contract-match
  script: ./verify/check-contract.sh
  type: automated
- description: No hardcoded passwords/secrets in source code
  id: no-hardcoded-secrets
  script: ./verify/check-security.sh
  type: automated
- description: Role-based access control exists
  id: rbac-configured
  script: ./verify/check-rbac.sh
  type: automated
- description: Frontend builds successfully
  id: frontend-build
  script: cd frontend && npm run build -s
  type: automated
- description: OpenAPI schemas match TypeScript interfaces
  id: type-sync
  script: ./verify/check-types.sh
  type: automated
- description: E2E browser tests pass (Playwright — requires servers running)
  id: e2e-browser
  script: ./verify/check-e2e.sh
  type: automated
