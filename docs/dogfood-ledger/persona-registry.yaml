    lens: "PII / authorization — 저장된 stored-error / payload / metadata / comment 등의 verbatim PII fan-out + IDOR / authz error message leak"
    history: []
    verdict: active
    verdict_reason: >
      Pre-R93 panel original member. 5 ledger 누적 19 findings: 11 real_bug
      closed (가장 풍부 — email-outbox-iter1 F6/F8/F9/F10/F11 stored-error +
      AUDIT raw recipient + idempotent delete + template versioning + sender
      stdout PII; iter2 1; activity-feed-iter1 1; favorites-bookmarks-iter1 1;
      approval-workflow-iter1 F4/F5/F8 payload PII + comment fan-out +
      NotApprover msg leak) + 8 scope_deferral (대부분 at-rest encryption +
      anonymous-flow + cross-tenant 트리거). 5/5 ledger에서 real_bug 산출 —
      pre-R93 panel에서 가장 productive (P11 황태완 R93 most productive와
      유사 lens 패턴 — closure-driven symmetric coverage).
    next_review_at: "다음 도메인 dogfood ledger land 시. R94+ catalog-meta wave에선 미참여 (P11 황태완이 standards lens로 유사 영역 cover)."

