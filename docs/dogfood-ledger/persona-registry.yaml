    age: 38
    seniority: Senior
    experience_years: 12
    background: "Ops / SRE — operator log aggregator + runbook + alerting wiring"
    lens: "Operational visibility — 운영자 시점에서 batch shape / DLQ age / pagination metadata / countdown UX 등 'logbook이 이해 가능한가' 검증"
    history: []
    verdict: active
    verdict_reason: >
      Pre-R93 panel original member. 5 ledger 누적 16 findings: 5 real_bug
      closed (email-outbox-iter1 F1/F2/F3 PII+structured-log+pagination,
      email-outbox-iter2 1 real_bug, favorites-bookmarks-iter1 1 real_bug) +
      11 scope_deferral (대부분 runbook / alert / observability 발화 trigger).
