  #   docs/dogfood-ledger/email-outbox-iter2.yaml      (R77 wave)
  #   docs/dogfood-ledger/activity-feed-iter1.yaml     (R79 wave)
  #   docs/dogfood-ledger/favorites-bookmarks-iter1.yaml (R78 wave)
  #   docs/dogfood-ledger/approval-workflow-iter1.yaml (R83 wave)
  # history: [] is intentional — the 5 ledgers are the single source of
  # truth for per-finding detail (DRY). The verdict_reason below carries
  # the panel-governance-relevant aggregate signals (counts + ratio per
  # ledger + lens performance pattern). When the next domain dogfood
  # lands, that wave's iter terminator should append a per-iter history
  # entry to P1/P2 following PROCEDURE B.
  - id: P1
    name: 정민영
    age: 38
    seniority: Senior
    experience_years: 12
    background: "Ops / SRE — operator log aggregator + runbook + alerting wiring"
    lens: "Operational visibility — 운영자 시점에서 batch shape / DLQ age / pagination metadata / countdown UX 등 'logbook이 이해 가능한가' 검증"
    history: []
    verdict: active
    verdict_reason: >
      Pre-R93 panel original member. 5 ledger 누적 16 findings: 5 real_bug
      closed (email-outbox-iter1 F1/F2/F3 PII+structured-log+pagination,
      email-outbox-iter2 1 real_bug, favorites-bookmarks-iter1 1 real_bug) +
      11 scope_deferral (대부분 runbook / alert / observability 발화 trigger).
      Most productive in email-outbox-iter1 (5 findings). R83 approval-workflow
      iter1에선 3 deferral 산출 — 동일 lens가 audit/SLA/SIEM 미연결 도메인
      신호 일관되게 catch. high signal_strength average.
    next_review_at: "다음 도메인 dogfood ledger land 시 (P1 lens 자연스럽게 활성). R93 panel 미참여이나 P1/P2 panel은 도메인 dogfood, P3-P12 panel은 catalog-meta dogfood로 segregation."

  - id: P2
