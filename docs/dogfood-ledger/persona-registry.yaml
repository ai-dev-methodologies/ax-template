schema_version: 1
schema_file: "specs/personas/persona-registry.schema.json"
description: >
  Canonical persona definitions + per-wave performance history for the
  ax-template dogfood protocol. Introduced in R93 after the panel
  expanded from P1/P2 (original ops+security pair) to P1..P12 (with
  Junior/Senior/특급시니어 stratification × 20s/30s/40s/50s age bands).
  Mechanical shape pinned by specs/personas/persona-registry.schema.json
  (JSON Schema draft-07). R93 iter4 F18 + F21 closures.

# ── File scope ─────────────────────────────────────────────────────────────
# This file is NOT a dogfood iter ledger — it does not match the
# *-iter*.yaml glob that dogfood_ledger_guard.sh scans, so guard-side
# schema requirements (findings[] / classification fields) do not apply.
# It IS the governance record consumed by future wave owners deciding
# which personas to seat on the next review panel.
#
# ── Field semantics ────────────────────────────────────────────────────────
#   id                 Sequential P<N> identifier. P1/P2 = original pair;
#                      P3..P12 = R93 iter1 expansion.
#   seniority          Junior | Senior | 특급시니어
#   experience_years   Integer; aligned with the wave the persona was seated.
#   lens               One-sentence summary of the persona's review focus —
#                      what kind of finding only THIS persona would surface.
#   history            Per-wave-iter list of findings produced. Empty
#                      history blocks (8 of 10 personas in R93 iter2) mean
#                      the persona reviewed and reported "no residual" —
#                      no entry suppressed, just no signal.
#     wave             Catalog R-number (R93) where the iter happened.
#     iter             1-indexed iteration within the wave.
#     finding_id       F<N> from the iter's ledger (cross-reference).
#     classification   real_bug | scope_deferral | methodology_gap
#     signal_strength  high | medium | low — reviewer's perceived value
#                      relative to other findings in that iter.
#     unique_to_persona  true if no other persona in the same iter
#                      surfaced the same observation. Used to detect
#                      lens overlap.
#     notes            Short rationale + closure mechanism reference.
#   verdict            active | under_review | retired
#   verdict_reason     Short justification.
#   next_review_at     Trigger condition or future wave at which to
#                      re-evaluate. Mirrors the scope_deferral expiry
#                      trigger pattern (R85) — verdicts decay if not
#                      explicitly re-affirmed.
#
# ── signal_strength rubric (R93 iter4 F16 closure, P4 박지영 lens) ────────
#   high     The finding pinned a contract, closed a real_bug that other
#            personas missed, or surfaced a recursive/symmetric gap (e.g.
#            P11 F11 catching inbound asymmetry of the F9 closure).
#            Typical evidence: closure_commit_sha + concrete contract /
#            spec text added to a yaml.
#   medium   The finding closed a real_bug or recorded a deferral with
#            a clear trigger, but the closure was an enrichment (doc /
#            example / cross-ref) rather than a contract pin.
#            Typical evidence: yaml note block addition; trigger
#            condition cite-able to a known future event.
#   low      The finding recorded a future-conditional that the catalog
#            cannot yet act on, or a methodology observation without a
#            blocking dependency. The lens still functioned; the finding
#            simply had no immediate purchase.
#            Typical evidence: deferral with diffuse trigger; methodology
#            without code/spec mutation.
#
# ── Update protocol ────────────────────────────────────────────────────────
#   On every iter terminator (the iter where 0 real_bug findings emerge),
#   the wave owner runs ONE of the two procedures below — adding a NEW
#   persona is structurally different from updating an EXISTING persona's
#   verdict (R93 iter4 F17 closure, P5 이상호 lens):
#
#   PROCEDURE A — adding a new persona (e.g., R94 introduces P13):
#     1. APPEND a new entry to personas[] with id (next sequential), name,
#        age, seniority, experience_years, background, lens, EMPTY history.
#     2. Set verdict: active (new personas start active by default).
#     3. Set verdict_reason: "newly seated for wave RNN — pending first
#        finding".
#     4. Set next_review_at: "R<NN+1> wave end".
#     5. Do NOT touch other personas' entries in the same commit.
#
#   PROCEDURE B — updating an existing persona after a wave terminator:
#     1. APPEND each finding produced by this persona during the wave's
#        iters to the existing history[] block (one entry per finding).
#     2. RECOMPUTE verdict based on the cumulative history pattern:
#        - active           — produced ≥1 finding in last wave OR
#                             lens still uniquely valuable
#        - under_review     — produced 0 findings in last wave AND
#                             lens-overlap-flagged in review_summary
#        - retired          — produced 0 findings across last 2 waves
#                             AND review_summary explicitly retires
#     3. UPDATE verdict_reason + next_review_at.
#     4. UPDATE the review_summary block for the wave just terminated.
#     5. Commit alongside the iter terminator ledger.
#
#   No mechanical guard enforces these procedures yet — by deliberate
#   choice per the R93 'no new catalog rules' completion directive. A
#   future R-numbered wave MAY introduce persona_registry_freshness_guard.sh
#   if the protocol is observed to silently drift.
#
# ── Maintenance ownership ─────────────────────────────────────────────────
#   Owner: the catalog maintainer landing the iter terminator commit.
#   No single-fork-receiver opinion; this file is shared infrastructure.
#   Disagreements about a verdict change MUST be recorded as a finding
#   in the next wave's iter1, not as a unilateral edit.
#
# ── B2 — 4 methodology_gap closures ───────────────────────────────────────
#   F12 (P12 한상미, iter2 — iter ledger continuity strategy):
#     RESOLUTION: separate-file-per-iter is the canonical convention.
#     Evidence: every existing ledger uses this pattern —
#     docs/dogfood-ledger/email-outbox-iter1.yaml + email-outbox-iter2.yaml
#       + activity-feed-iter1.yaml + favorites-bookmarks-iter1.yaml
#       + approval-workflow-iter1.yaml + meta-catalog-iter1.yaml
#       + r93-iter1.yaml + r93-iter2.yaml + r93-iter3.yaml + r93-iter4.yaml
#       + r93-iter5.yaml (11 files, 100% consistent).
#     The pattern preserves per-iter audit clarity + each file matches
#     dogfood_ledger_guard's *-iter*.yaml glob. Roll-up alternatives
#     (single r93.yaml with iteration_history) lose the per-iter boundary
#     and would require schema migration. Convention pinned here; no
#     new catalog rule needed — precedent is the enforcement mechanism.
#
#   F15 (P12 한상미, iter3 — methodology_gap R-anchor convention):
#     RESOLUTION: methodology_gap entries do NOT require R-number
#     anchors. They are OBSERVATIONS recorded for governance audit
#     trail, not COMMITMENTS requiring catalog-rule-level tracking.
#     The ledger entry itself IS the audit anchor. A future R-wave
#     MAY consume a methodology_gap as inspiration for a new rule
#     (e.g., R93 F12 → this very resolution), but the promotion is
#     human-judgment-driven, not automatic. silent debt risk
#     mitigated by R85→R86→R87 ladder applying ONLY to real_bug +
#     scope_deferral classifications; methodology_gap is the explicit
#     "no immediate action required" lane.
#
#   F19 (P9 윤재호, iter4 — registry placement docs/dogfood-ledger vs
#         docs/personas):
#     RESOLUTION: persona-registry.yaml STAYS at docs/dogfood-ledger/.
#     Rationale: (a) co-location with the *-iter*.yaml ledgers it
#     summarizes — single directory to read for full dogfood audit;
#     (b) dogfood_ledger_guard's glob explicitly handles the
#     non-iter pattern (skips persona-registry.yaml because filename
#     does not match *-iter*.yaml); (c) moving the file would force
#     git rename + churn every cross-reference for no semantic gain.
#     Alternative docs/personas/ remains valid for fork-receivers
#     who diverge their tree; ax-template canonical keeps unified.
#
#   F22 (P12 한상미, iter4 — meta-artifact self-recursion cap):
#     RESOLUTION: P12 herself recorded the cap inline in F22 ("R93 cap:
#     stop the recursion here — document the meta-artifact as inherently
#     self-managed by maintainer judgment, not by another tracking
#     artifact"). Cap formally pinned: persona-registry.yaml is
#     self-managed by the maintainer of the iter terminator commit.
#     No meta-meta-registry will be created. Saturation / verdict
#     drift is detected by HUMAN review at each wave terminator
#     (PROCEDURE B step 2 — "RECOMPUTE verdict based on the cumulative
#     history pattern"), not by a mechanical guard.
#
#   All 4 closures land in commit B2; finding entries in iter2/iter3/iter4
#   ledgers remain as the original audit trail; this block is the
#   resolution record consulted at future-wave start.

personas:
