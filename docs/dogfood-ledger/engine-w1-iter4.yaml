# Persona: engine (automated harness discovering enforcement gaps)
#
# Scope: cell S2.AUTHZ.FE — FE admin-action self-gating (component-granularity
# BFLA) + SSRF allowlist re-validation at server-side test-delivery (use)
# time, distinct from the registration-time gap CANARY-005 already names.
#
