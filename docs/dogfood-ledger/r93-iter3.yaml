findings:
  - persona: P7
    finding: "F13 (LOW): F11's inbound parsing contract (reject offsetless ISO 8601 with 400 INVALID_DATETIME) implicitly assumes JSON body deserialization via Jackson. The catalog's other inbound binding paths (@PathVariable LocalDate startDate, @RequestParam Instant cutoff) flow through Spring's ConversionService, NOT Jackson. The strict-offset requirement may NOT carry over to URL-bound dates unless explicitly configured. A typed-client engineer (P7 정도윤, 28, 6년차) flags this asymmetry. Expiry trigger: re-opens before any fork-receiver wires a date-typed @PathVariable or @RequestParam — at that point I18N-TIMEZONE-001 needs an additional paragraph covering the ConversionService path (org.springframework.format.datetime.standard.InstantFormatter)."
    classification: scope_deferral
    references_artifact_path: specs/i18n-policy-l0.yaml
  - persona: P10
    finding: "F14 (LOW): F11 closure makes the server STRICTER on date parsing than the prior implicit-coercion behavior. Existing fork-receivers whose clients send offsetless ISO 8601 (a common pattern in legacy Korean enterprise clients) will see 400 INVALID_DATETIME after the catalog change. A veteran (P10 신경수, 52, 22년차) wants a deprecation / migration note pinned. Expiry trigger: re-opens before any fork-receiver upgrades a deployed catalog from pre-R93 to post-R93 AND has clients in the wild sending offsetless ISO 8601 — at that point I18N-TIMEZONE-001 needs a 'Migration from implicit-UTC behavior' subsection covering: (a) detect in access log, (b) one-cycle deprecation window with warning header, (c) flip strict mode."
    classification: scope_deferral
    references_artifact_path: specs/i18n-policy-l0.yaml
