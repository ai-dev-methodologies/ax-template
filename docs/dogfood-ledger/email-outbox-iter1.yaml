    finding: "F4: DLQ entry has no lastFailureAt transition timestamp; operator infers stale-DLQ from nextAttemptAt=null + retryCount. Expiry trigger: re-opens before the fork-receiver wires DLQ-age alerting (Grafana SLO, PagerDuty rule, or Prometheus alert on age(stale_dlq_rows)) — at that point the absent timestamp blocks the alert and must be added. R84 already closed this in catalog code (EmailOutbox.lastFailureAt field), so this deferral is effectively retired but kept for ledger continuity."
    classification: scope_deferral
    references_artifact_path: backend/src/main/java/com/ax/template/authblueprint/emailoutbox/EmailOutbox.java
  - persona: P1
    finding: "F5: Frontend does not countdown next-retry seconds; pure UX polish without security/correctness implication. Expiry trigger: re-opens before any operator runbook starts depending on tick-by-tick retry visibility (e.g. live incident bridge replays); Wave D1 in docs/ralph/prd-next-session-waves.md tracks the planned closure."
