# R78 — favorites-bookmarks 2-persona dogfood iter1 (formal)
# P1: 정민영 (ops/SRE) — observability, race conditions, quota enforcement,
#                       idempotent-mutation correctness
# P2: 이주형 (security/PII) — note storage as user-owned free-text,
#                            entity-count caller scoping, response-shape
#                            information disclosure
#
# Scope: R55 + R56 were a refresh + L0 adoption, not a formal dogfood
# protocol. R78 runs the proper 2-persona review across the full surface:
#   - FavoriteService (add idempotent, remove non-idempotent at service
#     level, list, isFavorited, count, enforceQuota)
#   - FavoriteController (POST, GET, DELETE, GET check, GET count, two
#     ExceptionHandlers: quota + validation)
#   - Favorite entity (polymorphic via entity_type/entity_id pair +
#     UNIQUE(user_id, entity_type, entity_id))
#   - FavoriteDtos (AddFavoriteRequest with Bean Validation, response
#     records)
#   - L4 favorite-toggle.tsx (embeddable star button, optimistic
#     update + snapshot rollback per R46 iter2)
#   - L4 (favorites)/page.tsx (add-with-note form, list, per-row
#     Remove, L2 confirm-dialog, quota actionable banner)
iteration: 1
findings:
  - persona: P1
    finding: "F1 (LOW): FavoriteService emits no audit-log lines on add / remove / list / check / count. fork-receiver decides read-trail granularity (개인정보보호법 §29 / ISO 27001 A.12.4.1 favor logging access to user-owned data; catalog refuses to choose the default). Expiry trigger: before the fork-receiver wires the FIRST audit-log emission on any favorites endpoint, this deferral re-opens because raw `note` text MUST NOT reach the log aggregator — apply AuditPiiHelper.piiHash on userId + entity-key, never log the raw note."
    classification: scope_deferral
    references_artifact_path: backend/src/main/java/com/ax/template/authblueprint/favoritesbookmarks/FavoriteService.java
  - persona: P1
    finding: "F2 (MEDIUM): Quota TOCTOU. enforceQuota reads the count BEFORE save; two concurrent adds at the 999-row boundary can both pass the check and commit, producing 1001 rows in DB. The 1000-cap is a security control (rate-limit against malicious enumeration) so a silent breach matters. Deferred because the fix-shape (pessimistic row lock on count query / advisory lock / DB trigger / application-level user-scoped lock) is fork-receiver-owned concurrency policy."
    classification: scope_deferral
    references_artifact_path: backend/src/main/java/com/ax/template/authblueprint/favoritesbookmarks/FavoriteService.java
  - persona: P1
    finding: "F3 (MEDIUM): Same-key concurrent add returns 500 (DataIntegrityViolationException) on the loser's commit, violating R38 / FAV-IDEMPOTENT-001 (an idempotent POST must never surface a 500 to the client). Closure: FavoriteController.handleConcurrentDuplicate translates DataIntegrityViolationException → 409 + FAVORITE_CONCURRENT_DUPLICATE code + a retry hint pointing at GET /api/favorites/check/<type>/<id>. Idempotent client retry produces a clean 200 on the second call."
    classification: real_bug
    references_artifact_path: backend/src/main/java/com/ax/template/authblueprint/favoritesbookmarks/FavoriteController.java
  - persona: P2
    finding: "F4 (HIGH): The note column stores user-owned free-text VERBATIM with no PII scrubbing. Caller-scoped read (FAV-AUTHZ-002) keeps direct exposure private, but the value travels in DB backups / replicas / BI extracts, and fork-receivers later wiring audit logs (R61 / R67) or cross-user features (shared lists, collaborative bookmarks) would expose it unredacted. A user can paste 주민등록번호 / email / JWT into the note today; the catalog deliberately does NOT redact at storage because that would break the legitimate private-annotation UX. Closure: javadoc on Favorite.note + FavoriteService.add documenting the PII contract — fork-receivers MUST apply their 개인정보보호법 §24 program at every downstream surface and MUST use AuditPiiHelper.piiHash if logging."
    classification: real_bug
    references_artifact_path: backend/src/main/java/com/ax/template/authblueprint/favoritesbookmarks/Favorite.java
  - persona: P2
    finding: "F5 (LOW): GET /api/favorites/count/{entityType}/{entityId} returns the global favorite count for any (type, id) pair without caller-scoping. Authentication is still required (SecurityConfig wires /api/favorites/** as authenticated) but any signed-in user can probe counts on any entity. Global like-count is the intended UX (like Twitter / Instagram), but for fork-receivers wiring favorites to sensitive entities (private documents, PII-linked rows) it becomes an information-disclosure surface. Expiry trigger: before the fork-receiver wires the FIRST PII-linked or visibility-restricted entity (private document, internal RRN-linked row, gated content) as favoriteable, this deferral re-opens — replace global count with caller-visibility-scoped count or remove the public surface."
    classification: scope_deferral
    references_artifact_path: backend/src/main/java/com/ax/template/authblueprint/favoritesbookmarks/FavoriteController.java
  - persona: P2
    finding: "F6 (LOW): GET /api/favorites returns ALL of the caller's favorites in a single payload with no pagination. The 1000-cap keeps the response bounded (estimated < 1 MB at typical row width) and fork-receivers bumping the cap above 5k MUST add pagination + cursor support. Deferred to the cap-bump path."
    classification: scope_deferral
    references_artifact_path: backend/src/main/java/com/ax/template/authblueprint/favoritesbookmarks/FavoriteController.java
