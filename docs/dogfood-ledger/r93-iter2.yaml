findings:
  - persona: P11
    finding: "F11 (MEDIUM): iter1 F9 (P11 황태완) pinned the ISO 8601 Z form for OUTBOUND serialization of UTC Instant. Re-reviewing the closure, the SYMMETRIC inbound parsing case was unspecified — what does the server do with caller-supplied `2026-05-27T03:42:18` (no Z, no ±HH:MM)? Silent coercion to UTC corrupts caller intent (Seoul-local? New-York-local? UTC-meant-but-forgot?). RFC 3339 §5.6 mandates a time-offset on every date-time. Closure: appended a second paragraph to I18N-TIMEZONE-001.notes — the server MUST reject offsetless ISO 8601 strings with 400 INVALID_DATETIME rather than silently coerce. Jackson's Instant deserializer enforces this by default; recipes customizing the date module MUST preserve the strict-offset requirement."
    classification: real_bug
    closure_commit_sha: b8da020
    closure_verification_ref: "specs/i18n-policy-l0.yaml#I18N-TIMEZONE-001.notes now carries an inbound parsing paragraph mandating 400 INVALID_DATETIME on offsetless ISO 8601 strings + an RFC 3339 §5.6 citation."
    closure_verification_reason: doc-only
