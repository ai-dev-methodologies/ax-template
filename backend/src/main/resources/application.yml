spring:
  application:
    name: auth-blueprint-backend

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,mappings

auth:
  providers:
    email-enabled: true
    google-enabled: true
    kakao-enabled: true

  refresh:
    mode: stateful
    grace-window-seconds: 30

  account-linking:
    explicit-required: true
    auto-merge-by-email: false

  verification:
    separate-unverified-state: true

  rbac:
    roles:
      - admin
      - manager
      - member

  security:
    csrf-required: true
    cors-required: true

  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - OPTIONS
