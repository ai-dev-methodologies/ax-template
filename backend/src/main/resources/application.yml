# NOTE: server.tomcat.max-swallow-size is intentionally NOT overridden. Tomcat's bounded default
# (2 MiB) applies. An earlier fix set it to -1 (swallow UNLIMITED) so a fast-path 413 could always
# drain the unread body for a clean response — but -1 lets an attacker declare a 1 TB Content-Length,
# receive the 413, then trickle bytes forever while Tomcat drains and holds the request thread
# (unbounded thread-hold DoS). With the bounded default, a hugely-oversized rejected body gets a
# connection reset instead of a clean 413 once the unread remainder exceeds the swallow bound — that
# is the correct safe posture (no unbounded hold). Legitimate traffic (< 20 MiB) is never rejected by
# RequestBodySizeLimitFilter, so the drain path is only ever exercised by already-abusive bodies.
spring:
  application:
    name: auth-blueprint-backend

  # Jackson 3 (tools.jackson) ships StreamReadConstraints with SEVERAL knobs left UNBOUNDED by default
  # (verified against jackson-core-3.1.4: DEFAULT_MAX_TOKEN_COUNT=-1, DEFAULT_MAX_DOC_LEN=-1) plus a
  # string-length default raised from the Jackson-2-era 20M to 100M. An unbounded token count is a real
  # DoS: a sub-20MB body like {"x":[{},{},…]} deserializes into millions of maps → heap exhaustion, even
  # though every individual string/number is tiny. Pin the FULL envelope so no streaming knob is left
  # unbounded (nesting=500, number=1000, name=50000 are already bounded by Jackson defaults). Boot 4.1
  # binds each of these to StreamReadConstraints via JacksonAutoConfiguration (spring-boot-jackson
  # JacksonProperties$Factory$Constraints$Read → the auto-configured JsonMapper used by Spring MVC).
  # The standalone RequestFingerprint mapper pins the SAME bounds (property binding does not reach it).
  # Defense-in-depth: money deserializers additionally enforce a tight per-field length bound (~32 chars).
  jackson:
    factory:
      constraints:
        read:
          max-string-length: 20000000     # 20M chars (Jackson default 100M) — mirrors RequestFingerprint.MAX_STRING_LEN
          max-token-count: 1000000         # 1M tokens (Jackson default -1 = unbounded) — mirrors RequestFingerprint.MAX_TOKEN_COUNT
          max-document-length: 20000000    # 20M bytes (Jackson default -1 = unbounded) — mirrors RequestFingerprint.MAX_DOCUMENT_LEN

  datasource:
    # MODE=PostgreSQL enables the Payment blueprint's reconciliation tests to use
    # PostgreSQL-flavored JSON operators (payload->>'amount') against the H2 test DB.
    # Production deployments use Postgres directly; this template DB compatibility flag
    # is a portability convenience for the reference workload.
    # LOCK_TIMEOUT=10000 — concurrency proofs serialize many PESSIMISTIC_WRITE (FOR UPDATE) waiters on one
    # row; H2's default 1000ms can spuriously time out a deep queue on a loaded box (Postgres blocks rather
    # than times out at 1s). Hardens reserve-settle / cost-share / dispatch race tests; only more tolerant.
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=USER;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  # R16 file-storage — Spring multipart layer enforces upload size limit
  # (FILE-UPLOAD-002). Service layer re-validates via FileStorageProperties.
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 105MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-secret}
            scope: openid,email,profile
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/auth/oauth/naver/callback"
            client-name: Naver
            scope: profile,email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/auth/oauth/kakao/callback"
            client-name: Kakao
            client-authentication-method: client_secret_post
            scope: profile_nickname,account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  info:
    build:
      enabled: true

auth:
  providers:
    email-enabled: true
    google-enabled: true
    kakao-enabled: true

  refresh:
    mode: stateful
    grace-window-seconds: 30

  account-linking:
    explicit-required: true
    auto-merge-by-email: false

  verification:
    separate-unverified-state: true

  # Payment blueprint tests obtain JWTs via /api/auth/email/signup + /login.
  # Setting auto-verify=true short-circuits the email-verification step so tests
  # can obtain real tokens without injecting UserRepository.
  # Operators MUST set this to false in production deployments — the template
  # default is "true" because the reference workload is for AI agents exercising
  # the blueprint, not for shipping unverified accounts.
  signup:
    auto-verify: true
    allow-role-override: true

  rbac:
    roles:
      - admin
      - manager
      - member

  security:
    csrf-required: true
    cors-required: true

  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - OPTIONS

# Mirrors blueprints/ratelimit-manifest.yaml#policy
ratelimit:
  max-per-window: 5
  window-millis: 1000
  key-header: X-API-Key
  on-missing-key: REJECT
