# BACKLOG P2-120 — turn on ServiceLoader auto-detection of JUnit Jupiter extensions so that
# com.ax.template.authblueprint.common.AxPort becomes the single writer of the process-global
# io.restassured.RestAssured.port for every test in this tree, without editing the 161 classes
# that declare @LocalServerPort.
#
# WHY GLOBAL AUTO-DETECTION IS SAFE HERE — measured, not assumed. Auto-detection registers every
# extension any jar on the test classpath advertises, so the question is what else it would turn
# on. Of the 178 entries on `testRuntimeClasspath` (dumped from the real configuration), ZERO
# ship a META-INF/services/org.junit.jupiter.api.extension.Extension file. The same scan does
# find four other META-INF/services/org.junit.* files (TestEngine x2,
# DiscoverySelectorIdentifierParser, TestExecutionListener), so it is not a scan that would have
# missed one. Today, auto-detection turns on exactly one extension: ours.
#
# ...and bounded for tomorrow. A measurement of today's classpath does not constrain the
# dependency added next quarter, so the include filter below pins auto-detection to this
# project's own package by name. junit-platform-commons resolves such a pattern by splitting on
# ',', rewriting '.' to '[.$]' and '*' to '.+', then requiring a FULL match against the class's
# fully qualified name — so `com.ax.template.*` matches
# com.ax.template.authblueprint.common.AxPort and nothing a third party could ever ship. A new
# dependency that advertises an extension is therefore inert rather than silently active.
#
# NOT set here: parallel execution stays off. AxPort holds its record in a static field
# precisely because RestAssured.port is a process-global; enabling parallelism would let two
# tests aim the same global at different servers, which no bookkeeping can make safe.
junit.jupiter.extensions.autodetection.enabled=true
junit.jupiter.extensions.autodetection.include=com.ax.template.*
