domain: auth
backend_contract_ref: contracts/auth-openapi.yaml
routes:
  - path: /signup
    method: GET
    # Deliberately omitting backend_operation_id (null) — triggers NULL_OPERATION_ID
    backend_operation_id: null
    static_source_ref: []
    params: {}
    query: {}
    states:
      loading: loading-spinner
      error: error-banner
      empty: null
    redirects:
      on_auth_required: /login
      on_success: /dashboard
  - path: /login
    method: GET
    backend_operation_id: emailLogin
    static_source_ref: []
    params: {}
    query: {}
    states:
      loading: loading-spinner
      error: error-banner
      empty: null
    redirects:
      on_auth_required: null
      on_success: /dashboard
