curation_pipeline:
  description: "Each rule passes a 4-phase audit before shipping to rules/"
  phases:
    - id: A_reference_diversification
      requirement: "At least 2 of role={canonical-react,canonical-nextjs,primitive-semantics,rfc} cite the rule"
    - id: B_per_rule_audit
      checks: [accuracy, freshness, completeness, gap_check]
    - id: C_codex_consensus
      requirement: "Independent second opinion via codex exec; agreement or recorded disagreement"
    - id: D_continuous_refresh
      requirement: "Each rule has next_review_by date; time_decay_guard BLOCKs on stale"
  fail_open: false
